<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="theme-color" content="#0A1830">
<meta name="description" content="Assessment de learning agility: descubra como você aprende quando não existe playbook.">
<meta property="og:title" content="Como você aprende quando não existe playbook?">
<meta property="og:description" content="Assessment de learning agility de Kiko Campos. 30 situações, 10 minutos, perfil na hora.">
<meta property="og:image" content="https://kikocampos.com/og-image-v2.jpg">
<meta property="og:url" content="https://kikocampos.com/ferramentas/learning-agility.html">

<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Learning Agility · Kiko Campos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Identidade kikocampos.com: noite azul-marinho, halos laranja e azul, Fraunces com itálico em degradê, mono âmbar nos rótulos, pílulas laranja.
   Layout: uma coluna de leitura para quem responde; painel largo para o facilitador. Tema único escuro, por escolha. */
:root{
  --bg:#0A1830; --bg2:#0E2140; --panel:#12294d; --panel2:#16305a;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.20);
  --ink:#EAF1FB; --ink-soft:#AFC0DB; --ink-mute:#7D91B4;
  --orange:#FF4A12; --orange-cta:#CE420D; --amber:#F2B33D; --good:#4FD1A1; --blue:#5AA9E6;
  --display:"Fraunces", Georgia, serif;
  --body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:
  radial-gradient(1150px 640px at 82% -12%, rgba(90,169,230,.15), transparent 60%),
  radial-gradient(900px 560px at 2% -6%, rgba(255,74,18,.13), transparent 55%),
  var(--bg);
  background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100%}
.wrap{max-width:820px;margin:0 auto;padding-inline:22px;padding-block:0 96px}
.wrap.wide{max-width:1180px}
.wrap.intro{max-width:1100px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:clamp(2.4rem,6vw,3.9rem);line-height:1.03;letter-spacing:-.02em}
h2{font-size:clamp(1.7rem,3.6vw,2.4rem);line-height:1.08}
h3{font-size:1.3rem;line-height:1.2}
h1 em,h2 em{font-style:italic}
.grad{background:linear-gradient(100deg,var(--amber),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;max-width:60ch}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);font-weight:600}
.lead{color:var(--ink-soft);font-size:1.14rem;line-height:1.6;max-width:48ch}
.soft{color:var(--ink-soft)}
.mute{color:var(--ink-mute)}
.small{font-size:.88rem}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-lg{display:flex;flex-direction:column;gap:44px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(10,24,48,.66);border-bottom:1px solid var(--line);margin-bottom:52px}
.top .in{max-width:1180px;margin:0 auto;padding-inline:22px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:1.02rem;letter-spacing:-.005em;white-space:nowrap}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--orange);box-shadow:0 0 16px rgba(255,74,18,.7)}
.chip{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border:1px solid var(--line2);border-radius:100px;font-size:.8rem;color:var(--ink-soft);background:rgba(255,255,255,.03);white-space:nowrap}
.chip .lv{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good)}
@media (max-width:460px){.top .chip .tx{display:none}}

/* trilha de etapas */
.steps{display:flex;gap:10px;margin-bottom:40px;flex-wrap:wrap}
.step{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);padding:6px 12px;border:1px solid var(--line);border-radius:100px}
.step.on{color:var(--ink);border-color:var(--line2);background:rgba(255,255,255,.04)}
.step.done{color:var(--amber);border-color:rgba(242,179,61,.35)}

/* botões */
button{font:inherit;cursor:pointer;color:inherit}
.btn{padding:14px 24px;border-radius:100px;font-weight:600;font-size:.98rem;display:inline-flex;align-items:center;gap:10px;border:1px solid transparent;text-decoration:none;transition:transform .15s, box-shadow .15s, background .15s;white-space:nowrap}
.btn-p{background:var(--orange-cta);color:#fff;box-shadow:0 12px 34px -10px rgba(255,74,18,.6)}
.btn-p:hover{background:#DA4710;transform:translateY(-1px)}
.btn-g{color:var(--ink);border-color:var(--line2);background:transparent}
.btn-g:hover{background:rgba(255,255,255,.05)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.lnk{background:none;border:0;padding:6px 0;color:var(--ink-soft);font-size:.92rem;border-bottom:1px solid var(--line2);border-radius:0}
.lnk:hover{color:var(--ink);border-bottom-color:var(--orange)}
.arrow{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* painéis */
.panel{border-radius:var(--radius);padding:32px;background:linear-gradient(155deg,var(--panel2),var(--panel));border:1px solid var(--line2);box-shadow:0 30px 70px -34px rgba(0,0,0,.7);position:relative;overflow:hidden}
.panel.glow::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(242,179,61,.16),transparent 65%);pointer-events:none}
.panel.glow-o::after{content:"";position:absolute;left:-40px;bottom:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,74,18,.14),transparent 65%);pointer-events:none}
.panel>*{position:relative;z-index:1}
.panel.reco{border-color:rgba(255,74,18,.5);background:linear-gradient(120deg,rgba(255,74,18,.10),rgba(255,255,255,.02)),linear-gradient(155deg,var(--panel2),var(--panel));box-shadow:0 24px 60px -34px rgba(255,74,18,.5)}
.flat{border-radius:14px;padding:22px 24px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
@media (max-width:560px){.panel{padding:24px 20px}}

/* abertura */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:40px}}
.tags{display:flex;gap:10px;flex-wrap:wrap}
.tag{font-size:.82rem;color:var(--ink-soft);padding:7px 14px;border:1px solid var(--line);border-radius:100px}
.dimlist{display:flex;flex-direction:column}
.dimlist .it{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.dimlist .it:last-child{border-bottom:0}
.dimlist .t{font-family:var(--display);font-weight:600;font-size:1.15rem}
.dimlist .o{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);align-self:center}
.dimlist .ds{grid-column:1/-1;color:var(--ink-soft);font-size:.9rem}

/* formulário */
.form{display:flex;flex-direction:column;gap:30px}
.field{display:flex;flex-direction:column;gap:9px}
.field .q{font-weight:600;font-size:.98rem}
.field .hint{font-size:.85rem;color:var(--ink-mute);margin-top:-4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:640px){.grid2{grid-template-columns:1fr!important}}
input[type=text],input[type=email],textarea,select,input[type=number]{font:inherit;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:13px 15px;width:100%;transition:border-color .15s, background .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--amber);background:rgba(255,255,255,.06)}
textarea{resize:vertical;min-height:84px}
select option{background:var(--bg2)}
.choices{display:flex;flex-wrap:wrap;gap:9px}
.opt-chip{position:relative}
.opt-chip input{position:absolute;opacity:0;pointer-events:none}
.opt-chip span{display:inline-block;padding:9px 16px;border:1px solid var(--line2);border-radius:100px;font-size:.9rem;color:var(--ink-soft);transition:all .15s;background:rgba(255,255,255,.02)}
.opt-chip span:hover{color:var(--ink)}
.opt-chip input:checked+span{border-color:var(--orange);color:var(--ink);background:rgba(255,74,18,.12)}
.opt-chip input:focus-visible+span{outline:2px solid var(--amber);outline-offset:2px}
.consent{display:flex;gap:14px;align-items:flex-start;font-size:.9rem;color:var(--ink-soft);padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);cursor:pointer}
.consent input{margin-top:3px;width:18px;height:18px;accent-color:var(--orange);flex:none}
.count{font-family:var(--mono);font-size:.72rem;color:var(--ink-mute);text-align:right}
.err{color:var(--amber);font-size:.9rem;min-height:1.3em}

/* situações */
.prog{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.track2{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.track2 i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--amber),var(--orange));transition:width .35s ease}
.num{font-family:var(--mono);font-size:.78rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.06em}
.stem{font-family:var(--display);font-weight:500;font-size:clamp(1.65rem,4.4vw,2.4rem);line-height:1.18;letter-spacing:-.01em;min-height:2.4em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;color:var(--ink);border:1px solid var(--line2);border-radius:var(--radius);padding:24px 24px 26px;display:flex;flex-direction:column;gap:16px;min-height:160px;background:rgba(255,255,255,.03);transition:border-color .18s, background .18s, transform .18s, box-shadow .18s}
.opt:hover{border-color:rgba(242,179,61,.55);background:rgba(255,255,255,.05);transform:translateY(-2px)}
.opt .k{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);font-family:var(--mono);font-size:.78rem;font-weight:600;color:var(--ink-soft)}
.opt .t{font-size:1.06rem;line-height:1.5}
.opt.sel{border-color:var(--orange);background:linear-gradient(120deg,rgba(255,74,18,.14),rgba(255,255,255,.03));box-shadow:0 22px 50px -26px rgba(255,74,18,.6)}
.opt.sel .k{background:var(--orange);border-color:var(--orange);color:#fff}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:14px}
.kbd{font-family:var(--mono);font-size:.7rem;color:var(--ink-mute);letter-spacing:.08em}
@media (hover:none){.kbd{display:none}}
.half{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--good)}

/* relatório */
.profile{display:flex;flex-direction:column;gap:20px}
.prow{display:grid;grid-template-columns:160px 1fr 44px;gap:18px;align-items:center}
@media (max-width:540px){.prow{grid-template-columns:108px 1fr 30px;gap:12px}}
.prow .nm{font-family:var(--display);font-weight:600;font-size:1.08rem;line-height:1.15}
.prow .nm small{display:block;font-family:var(--mono);font-weight:500;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);margin-top:4px}
.bar{position:relative;height:12px;border-radius:12px;background:rgba(255,255,255,.07)}
.bar .f{position:absolute;left:0;top:0;bottom:0;border-radius:12px;background:rgba(175,192,219,.42)}
.bar .f.pk{background:linear-gradient(90deg,var(--amber),var(--orange));box-shadow:0 0 18px rgba(255,74,18,.45)}
.bar .tk{position:absolute;top:-5px;bottom:-5px;width:2px;border-radius:2px;background:var(--ink)}
.bar .md{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--line2)}
.prow .sc{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;text-align:right;color:var(--ink-soft)}
.prow.pk .sc{color:var(--amber)}
.legend{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);padding-left:178px;padding-right:62px}
@media (max-width:540px){.legend{padding-left:0;padding-right:0}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.pkname{font-family:var(--display);font-weight:600;font-size:clamp(2rem,4vw,2.6rem);line-height:1}
.ask{text-align:center;padding:64px 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.ask::after{content:"";position:absolute;left:50%;top:-60%;transform:translateX(-50%);width:760px;max-width:160%;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(255,74,18,.10),transparent 62%);pointer-events:none}
.ask .big{font-family:var(--display);font-weight:500;font-style:italic;font-size:clamp(1.7rem,3.8vw,2.6rem);line-height:1.2;letter-spacing:-.01em;max-width:24ch;margin:18px auto 0;position:relative}
.ask p{margin:16px auto 0;color:var(--ink-soft);position:relative}
.codebox{font-family:var(--mono);font-size:.78rem;word-break:break-all;line-height:1.55;padding:16px 18px;border-radius:12px;background:rgba(0,0,0,.25);border:1px dashed var(--line2);color:var(--ink-soft);user-select:all}

/* painel do facilitador */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{padding:9px 18px;border:1px solid var(--line);border-radius:100px;background:transparent;color:var(--ink-soft);font-size:.9rem;font-weight:500}
.tabs button.on{border-color:var(--orange);color:var(--ink);background:rgba(255,74,18,.12)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi .v{font-family:var(--display);font-weight:600;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink-soft);font-size:.86rem;margin-top:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:640px}
th{font-family:var(--mono);font-weight:600;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);text-align:left;padding:13px 14px;border-bottom:1px solid var(--line2);background:rgba(255,255,255,.02)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.dt,th.dt{text-align:center;width:58px;padding-inline:4px}
.d{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--ink-mute)}
.d.on{background:var(--orange);border-color:var(--orange);box-shadow:0 0 10px rgba(255,74,18,.55)}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
@media (max-width:420px){.mesas{grid-template-columns:1fr}}
.mesa{display:flex;flex-direction:column;gap:16px;min-width:0}
.who{display:flex;flex-direction:column}
.who .p{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.who .p:last-child{border-bottom:0}
.who .n{font-weight:600;font-size:.94rem}
.who .r{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);text-align:right;align-self:center}
.who .c{grid-column:1/-1;font-size:.8rem;color:var(--ink-mute)}
.cov{display:flex;gap:6px;flex-wrap:wrap}
.cov span{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;padding:4px 9px;border-radius:100px;border:1px solid var(--line);color:var(--ink-soft)}
.cov b{color:var(--ink)}
.warn{font-size:.9rem;color:var(--ink-soft);padding:14px 18px;border:1px solid rgba(242,179,61,.4);border-radius:12px;background:rgba(242,179,61,.06)}
.badge{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);border:1px solid rgba(255,74,18,.5);border-radius:100px;padding:4px 11px;white-space:nowrap}
.ownerbtn{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;padding:10px 16px;border-radius:100px;border:1px solid var(--line2);background:rgba(10,24,48,.85);backdrop-filter:blur(8px);font-size:.84rem;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--panel2);border:1px solid var(--line2);color:var(--ink);padding:11px 20px;font-size:.88rem;border-radius:100px;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;z-index:40;box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}


.codewrap summary{cursor:pointer;color:var(--ink-soft);font-size:.92rem;list-style:none;display:inline-block;border-bottom:1px solid var(--line2);padding-bottom:3px}
.codewrap summary::-webkit-details-marker{display:none}
.codewrap summary:hover{color:var(--ink);border-bottom-color:var(--orange)}
@media (max-width:560px){.steps{flex-wrap:nowrap;gap:6px;margin-bottom:26px}.step{padding:5px 10px;font-size:.62rem;letter-spacing:.1em}.step:not(.on) .lb{display:none}.prog{margin-bottom:20px}.stem{min-height:0}.opts{margin-top:22px;gap:12px}.opt{min-height:0;padding:18px 20px 20px;gap:12px}}

.deliv{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 20px;border:1px solid rgba(79,209,161,.35);border-radius:14px;background:rgba(79,209,161,.06);color:var(--ink);font-size:.95rem}
.deliv #dmsg{flex:1;min-width:220px}
.deliv .btn{padding:10px 18px;font-size:.88rem}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--good);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pairs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pairs li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.pairs li:last-child{border-bottom:0}
.pairs li .tg{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);white-space:nowrap;align-self:center}
.dev{border-left:2px solid var(--amber);padding:4px 0 4px 18px;display:flex;flex-direction:column;gap:6px}
.dev .dq{font-family:var(--display);font-weight:500;font-size:1.15rem}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:pl}
.plan li{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan .when{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);padding-top:4px}
@media (max-width:560px){.plan li{grid-template-columns:1fr;gap:6px}}
.sheet h2{font-size:24px}
.sheet .plan li{grid-template-columns:130px 1fr;padding:12px 0}
.sheet .flat{box-shadow:none}
.sheet section{gap:16px!important}
/* folha do PDF: mesma noite azul, sem efeitos que o renderizador não reproduz */
#sheetHost{position:fixed;left:-10000px;top:0}

function order(s){return DIMS.slice().sort((x,y)=>s[y]-s[x]||DIMS.indexOf(x)-DIMS.indexOf(y))}
/* código de resultado: LA1.<base64url json>.<verificador> */
function b64u(str){const bytes=new TextEncoder().encode(str);let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function ub64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function chk(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%1296;return h.toString(36).padStart(2,"0")}
function encode(r){const bits=r.a.map(x=>x==="A"?"1":"0").join("");const o={n:r.n,e:r.e,c:r.c,f:r.f,i:r.i,d:r.d,a:parseInt(bits,2).toString(36)};const body=b64u(JSON.stringify(o));return "LA1."+body+"."+chk(body)}
function decode(code){const m=code.match(/^LA1\.([A-Za-z0-9_-]+)\.([0-9a-z]{2})$/);if(!m||chk(m[1])!==m[2])return null;try{const o=JSON.parse(ub64u(m[1]));const bits=parseInt(o.a,36).toString(2).padStart(N,"0");return {n:o.n,e:o.e,c:o.c,f:o.f,i:o.i,d:o.d,a:[...bits].map(b=>b==="1"?"A":"B")}}catch(e){return null}}

const PAIRS=(()=>{const m={};ITEMS.forEach((it,i)=>{const k=[it[2],it[4]].sort().join("");(m[k]=m[k]||[]).push(i)});return m})();
function leitura(p){
  const firm=[],vari=[];
  Object.entries(PAIRS).forEach(([k,idx])=>{const w={};idx.forEach(i=>{const it=ITEMS[i];const d=p.a[i]==="A"?it[2]:it[4];w[d]=(w[d]||0)+1});const x=k[0],y=k[1],wx=w[x]||0,wy=w[y]||0;
    if(wx===3)firm.push([x,y]);else if(wy===3)firm.push([y,x]);else vari.push(wx>wy?[x,y]:[y,x])});
  const rank=d=>p.peaks.includes(d)?0:d===p.low?2:1;
  firm.sort((a,b)=>rank(a[0])-rank(b[0])||rank(b[1])-rank(a[1]));
  const dev=[];ITEMS.forEach((it,i)=>{const A=p.a[i]==="A",ch=A?it[2]:it[4],ot=A?it[4]:it[2];if(p.peaks.includes(ot)&&!p.peaks.includes(ch))dev.push({stem:it[0],txt:A?it[1]:it[3],ch,ot})});
  return {firm,vari,dev};
}

    <div class="flat stack" style="gap:10px"><div class="eyebrow" style="color:var(--blue)">Onde você variou</div>${L.vari.length?`<ul class="pairs">${L.vari.slice(0,5).map(([w,l])=>`<li><span class="pt">${DIM[w].nome} e ${DIM[l].nome}</span><span class="tg">conforme o caso</span></li>`).join("")}</ul>`:`<p class="soft">Nenhum. Em todos os confrontos, você escolheu sempre o mesmo lado.</p>`}</div>
   </div>
   <div class="stack" style="gap:12px"><div class="eyebrow">Quando você saiu do próprio padrão</div>
   ${L.dev.length?L.dev.slice(0,2).map(x=>`<div class="dev"><p class="dq">${esc(x.stem)}</p><p>Você escolheu: <em>“${esc(x.txt)}”</em></p><p class="mute small">Aqui você foi de ${DIM[x.ch].nome} em vez de ${DIM[x.ot].nome}, seu pico. Vale perguntar o que nessa situação pediu outra resposta.</p></div>`).join(""):`<p class="soft">Em nenhuma situação em que seus picos estavam em jogo você escolheu o outro lado. Essa consistência é força e, ao mesmo tempo, o lugar onde mora o ponto cego.</p>`}
   </div></section>`;
}

const P={raw:store.get("la_codes")||"",tab:"respostas",seed:1,nGroups:null,groups:null,example:false,open:null};
function parseAll(text){
  const found=text.match(/LA1\.[A-Za-z0-9_-]+\.[0-9a-z]{2}/g)||[];const bad=(text.match(/LA1\.[^\s]*/g)||[]).length-found.length;
  const map=new Map();found.forEach(c=>{const r=decode(c);if(r)map.set((r.e||r.n).toLowerCase(),r)});
  return {list:[...map.values()],bad:bad+found.filter(c=>!decode(c)).length};
}
function cohort(list){
  const ss=list.map(r=>score(r.a));const means={},sds={};
  DIMS.forEach(d=>{const v=ss.map(s=>s[d]);const m=v.reduce((a,b)=>a+b,0)/(v.length||1);means[d]=m;sds[d]=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/(v.length||1))||1});
  return {means,sds,people:list.map(r=>person(r,means,sds))};
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function cost(G,pp){
  let c=0;
  G.forEach(g=>{
    const hr=g.filter(i=>pp[i].f===0).length;c+=1000*Math.abs(hr-1);
    if(!g.some(i=>pp[i].f===1))c+=200;
    DIMS.forEach(d=>{const n=g.filter(i=>pp[i].peaks.includes(d)).length;c+=n===0?300:n===1?40:0});
    const ia=g.map(i=>pp[i].i);if(Math.min(...ia)>1)c+=60;if(Math.max(...ia)<3)c+=60;
    const em=g.map(i=>(pp[i].c||"").trim().toLowerCase()).filter(Boolean);c+=150*(em.length-new Set(em).size);
  });
  DIMS.forEach(d=>{const ms=G.map(g=>g.reduce((a,i)=>a+pp[i].s[d],0)/g.length);const m=ms.reduce((a,b)=>a+b,0)/ms.length;c+=10*Math.sqrt(ms.reduce((a,b)=>a+(b-m)**2,0)/ms.length)});
  return c;
}
function formar(pp,ng,seed){
  const r=rng(seed);const ids=pp.map((_,i)=>i);for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  const G=Array.from({length:ng},(_,k)=>ids.filter((_,i)=>i%ng===k));let best=cost(G,pp);
  for(let t=0;t<20000;t++){const a=Math.floor(r()*ng);let b=Math.floor(r()*(ng-1));if(b>=a)b++;const i=Math.floor(r()*G[a].length),j=Math.floor(r()*G[b].length);
    [G[a][i],G[b][j]]=[G[b][j],G[a][i]];const c=cost(G,pp);if(c<=best)best=c;else [G[a][i],G[b][j]]=[G[b][j],G[a][i]]}
  return {G,cost:best};
}
function papeis(g,pp){
  const role={},taken=new Set();const take=(id,r)=>{if(id==null||taken.has(id))return;role[id]=r;taken.add(id)};
  const free=()=>g.filter(i=>!taken.has(i));const best=(f,k)=>{const c=free().filter(f);if(!c.length)return null;return c.sort((x,y)=>k(y)-k(x))[0]};
  take(best(i=>pp[i].f===0,()=>0),"Especialista em Pessoas");
  take(best(i=>pp[i].f===1,i=>pp[i].z.R),"Lente financeira");
  take(best(()=>true,i=>-(pp[i].i*10+pp[i].z.X)),"Operador da IA");
  take(best(()=>true,i=>pp[i].z.R),"Sócio líder");
  take(best(()=>true,i=>pp[i].z.M),"Advogado do diabo");
  take(best(()=>true,i=>pp[i].z.P),"Guardião do humano");
  free().forEach(i=>role[i]=pp[i].peaks.includes("A")?"Leitura no debrief":"Consultor");
  return role;
}

function renderPainel(){
  const {list,bad}=parseAll(P.raw);const C=list.length?cohort(list):null;const pp=C?C.people:[];
  const nHR=pp.filter(p=>p.f===0).length;
  const ng=P.nGroups||Math.max(1,Math.min(nHR||Math.round(pp.length/8)||1,Math.max(1,Math.floor(pp.length/3))));
  $("#app").innerHTML=`${topbar(`<span class="row" style="gap:12px">${P.example?`<span class="badge">Exemplo · dados simulados</span>`:""}<button class="lnk" id="toPart">Ver como participante</button></span>`)}
  <div class="wrap wide"><div class="stack-lg fade">
    <div class="spread" style="align-items:flex-end"><div class="stack" style="gap:14px"><div class="eyebrow">Painel do facilitador · Learning agility</div>
      <h1>${pp.length?`<em class="grad">${pp.length}</em> respostas recebidas`:`Cole aqui os <em class="grad">códigos recebidos.</em>`}</h1></div>
      <nav class="tabs" role="tablist">${[["respostas","Respostas"],["mesas","Grupos"],["relatorios","Relatórios"]].map(([k,t])=>`<button role="tab" class="${P.tab===k?"on":""}" data-t="${k}">${t}</button>`).join("")}</nav></div>
    ${pp.length?`<div class="kpis"><div class="flat kpi"><div class="v">${pp.length}</div><div class="l">participantes</div></div><div class="flat kpi"><div class="v">${nHR}</div><div class="l">de RH e Pessoas</div></div><div class="flat kpi"><div class="v">${pp.filter(p=>p.f===1).length}</div><div class="l">de Finanças</div></div><div class="flat kpi"><div class="v">${pp.filter(p=>p.i===0).length}</div><div class="l">se dizem analógicos</div></div></div>`:`<p class="lead">Cada participante termina o questionário com um código que começa por LA1. Cole as mensagens inteiras: a página encontra os códigos no meio do texto.</p>`}
    <div id="pv"></div>
  </div></div>`;
  $("#toPart").onclick=()=>{S.view=S.a.every(x=>x)?"report":"intro";render()};
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{P.tab=b.dataset.t;renderPainel()});
  const pv=$("#pv");
  if(P.tab==="respostas"){
    pv.innerHTML=`<div class="stack-lg">
      <div class="flat stack" style="gap:14px"><div class="eyebrow">Link para um grupo</div><p class="soft small">Personalize o convite: o nome do grupo, o prazo e quem recebe os códigos aparecem para os participantes.</p>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr)"><input type="text" id="lg" placeholder="Nome do grupo ou evento" value="${esc(P.lg||"")}"><input type="text" id="lp" placeholder="Prazo (ex.: 14 de outubro)" value="${esc(P.lp||"")}"><input type="text" id="lq" placeholder="Quem recebe os códigos (ex.: Kiko)" value="${esc(P.lq||"")}"></div>
      <div class="codebox" id="glink"></div><div class="row"><button class="btn btn-g" id="gcopy">Copiar link</button></div></div>
      <div class="panel stack"><label class="eyebrow" for="raw">Códigos dos participantes</label><textarea id="raw" style="min-height:160px;font-family:var(--mono);font-size:.78rem" placeholder="Cole aqui as mensagens com os códigos LA1…">${esc(P.raw)}</textarea>
      <div class="spread"><span class="soft small">${pp.length} válidos${bad?` · <span style="color:var(--amber)">${bad} com problema (código cortado ou alterado)</span>`:""} · o mesmo e-mail conta uma vez</span><span class="row" style="gap:18px"><button class="lnk" id="ex">Carregar exemplo com 40 respostas simuladas</button>${P.raw?`<button class="lnk" id="clr">Limpar</button>`:""}</span></div></div>
      ${pp.length?`<div class="tbl"><table><thead><tr><th>Nome</th><th>Empresa</th><th>Função</th><th>IA</th>${DIMS.map(d=>`<th class="dt">${DIM[d].curto}</th>`).join("")}</tr></thead><tbody>
      ${pp.map(p=>`<tr><td style="font-weight:600">${esc(p.n)}</td><td class="soft">${esc(p.c)}</td><td class="soft">${FUNCS[p.f]||""}</td><td class="soft">${IAS[p.i]||""}</td>${DIMS.map(d=>`<td class="dt"><span class="d ${p.peaks.includes(d)?"on":""}" title="${DIM[d].nome}: ${p.s[d]}"></span></td>`).join("")}</tr>`).join("")}
      </tbody></table></div><p class="mute small">Ponto aceso: pico relativo à turma. Os picos se recalculam a cada novo código.</p>`:""}
    </div>`;
    const mk=()=>{P.lg=$("#lg").value.trim();P.lp=$("#lp").value.trim();P.lq=$("#lq").value.trim();const q=new URLSearchParams();if(P.lg)q.set("grupo",P.lg);if(P.lp)q.set("prazo",P.lp);if(P.lq)q.set("para",P.lq);const qs=q.toString();$("#glink").textContent=location.origin+location.pathname+(qs?"?"+qs:"")};
    ["#lg","#lp","#lq"].forEach(id=>$(id).oninput=mk);mk();$("#gcopy").onclick=()=>copyText($("#glink").textContent,$("#glink"),"Link copiado.");
    const ta=$("#raw");ta.oninput=()=>{clearTimeout(ta._t);ta._t=setTimeout(()=>{P.raw=ta.value;P.example=false;P.groups=null;store.set("la_codes",P.raw);const pos=ta.selectionStart;renderPainel();const t2=$("#raw");t2.focus();t2.setSelectionRange(pos,pos)},500)};
    $("#ex").onclick=()=>{P.raw=exemplo();P.example=true;P.groups=null;P.nGroups=null;renderPainel()};
    if($("#clr"))$("#clr").onclick=()=>{P.raw="";P.example=false;P.groups=null;store.del("la_codes");renderPainel()};
    return;
  }
  if(!pp.length){pv.innerHTML=`<div class="flat"><p class="soft">Ainda não há respostas. Cole os códigos na aba Respostas ou carregue o exemplo.</p></div>`;return}
  if(P.tab==="mesas"){
    if(!P.groups||P.groups.ng!==ng||P.groups.n!==pp.length){const f=formar(pp,ng,P.seed);P.groups={...f,ng,n:pp.length}}
    const {G}=P.groups;
    const issues=[];if(nHR<ng)issues.push(`Há ${nHR} pessoas de RH para ${ng} grupos: ${ng-nHR} grupo(s) ficam sem especialista em Pessoas.`);if(nHR>ng)issues.push(`Há ${nHR} pessoas de RH para ${ng} grupos, então algum grupo terá duas. Para ter uma por grupo, use ${nHR} grupos.`);
    pv.innerHTML=`<div class="stack-lg">
      <div class="spread"><div class="row"><label for="ng" class="soft">Número de grupos</label><input type="number" id="ng" min="1" max="${pp.length}" value="${ng}" style="width:84px;text-align:center"><span class="mute small">${(pp.length/ng).toFixed(1).replace(".",",")} pessoas por grupo</span></div>
      <div class="row"><button class="btn btn-g" id="shuffle">Outra combinação</button>${downloads?`<button class="btn btn-p" id="csv">Baixar lista dos grupos</button>`:`<button class="btn btn-p" id="copyG">Copiar lista dos grupos</button>`}</div></div>
      ${issues.map(t=>`<p class="warn">${t}</p>`).join("")}
      <div class="mesas">${G.map((g,k)=>{const role=papeis(g,pp);const rank=["Sócio líder","Especialista em Pessoas","Lente financeira","Advogado do diabo","Operador da IA","Guardião do humano","Leitura no debrief","Consultor"];
        const mem=g.slice().sort((x,y)=>rank.indexOf(role[x])-rank.indexOf(role[y]));
        return `<section class="panel ${k%2?"glow-o":"glow"} mesa"><div class="spread"><h3>Grupo ${k+1}</h3><span class="num">${g.length} pessoas</span></div>
        <div class="who">${mem.map(i=>`<div class="p"><span class="n">${esc(pp[i].n)}</span><span class="r">${role[i]}</span><span class="c">${esc(pp[i].c)} · ${pp[i].peaks.map(d=>DIM[d].nome).join(" e ")}</span></div>`).join("")}</div>
        <div class="cov">${DIMS.map(d=>`<span>${DIM[d].nome} <b>${g.filter(i=>pp[i].peaks.includes(d)).length}</b></span>`).join("")}</div></section>`}).join("")}</div>
      <p class="mute small">Na base de cada grupo, quantas pessoas têm pico em cada dimensão. Os papéis são sugestões: o grupo pode trocar.</p>
    </div>`;
    $("#ng").onchange=e=>{P.nGroups=Math.max(1,Math.min(pp.length,+e.target.value||1));P.groups=null;renderPainel()};
    $("#shuffle").onclick=()=>{P.seed++;P.groups=null;renderPainel()};
    const lines=()=>{const rows=[["Grupo","Nome","E-mail","Empresa","Função","Papel sugerido","Picos"]];G.forEach((g,k)=>{const role=papeis(g,pp);g.forEach(i=>rows.push([k+1,pp[i].n,pp[i].e,pp[i].c,FUNCS[pp[i].f],role[i],pp[i].peaks.map(d=>DIM[d].nome).join(" e ")]))});return rows};
    if($("#csv"))$("#csv").onclick=async()=>{const csv="﻿"+lines().map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n");try{await downloads.save({filename:"Grupos - Learning Agility.csv",data:csv})}catch(e){if(e.code!=="declined")toast("A lista não foi salva.")}};
    if($("#copyG"))$("#copyG").onclick=()=>{const t=lines().map(r=>r.join("\t")).join("\n");try{navigator.clipboard.writeText(t).then(()=>toast("Lista copiada."),()=>toast("Não foi possível copiar."))}catch(e){toast("Não foi possível copiar.")}};
    return;
  }
  if(P.tab==="relatorios"){
    const sel=P.open!=null&&pp[P.open]?P.open:0;const p=pp[sel];
    pv.innerHTML=`<div class="stack-lg">
      <div class="panel spread"><div class="row"><label for="who" class="eyebrow">Participante</label><select id="who" style="width:auto;min-width:220px">${pp.map((x,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(x.n)}</option>`).join("")}</select></div>
      ${downloads?`<div class="row"><button class="btn btn-g" id="one">Baixar este relatório</button><button class="btn btn-p" id="all">Baixar os ${pp.length} PDFs</button></div>`:`<span class="mute small">Os downloads aparecem quando você abre a página pelo Claude.</span>`}</div>
      <p class="mute small">Leitura relativa à turma, em PDF de 4 páginas, pronta para enviar por e-mail. Destinatário: ${esc(p.e)}.</p>
      <div class="stack-lg">${reportBody(p,{means:C.means})}<hr class="hr">${secLeitura(p)}<hr class="hr">${secPlano(p)}</div></div>`;
    $("#who").onchange=e=>{P.open=+e.target.value;renderPainel()};
    if($("#one"))$("#one").onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{await savePDF(p,C.means)}finally{b.disabled=false}};
    if($("#all"))$("#all").onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{await lib("zip");const z=new JSZip();for(let i=0;i<pp.length;i++){b.textContent=`Gerando ${i+1} de ${pp.length}…`;z.file(fname(pp[i]),await pdfBlob(pp[i],C.means))}
      b.textContent="Compactando…";const blob=await z.generateAsync({type:"blob"});await downloads.save({filename:"Relatorios Learning Agility.zip",data:blob})}
      catch(err){if(!err||err.code!=="declined")toast("Os relatórios não foram salvos.")}finally{b.disabled=false;b.textContent=`Baixar os ${pp.length} PDFs`}};
  }
}

/* ---------- início ---------- */
const localSaver={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".csv")?"text/csv;charset=utf-8":"application/octet-stream"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return {status:"saved"}}};
if(!window.claude||!window.claude.use)downloads=localSaver;
function route(){if(location.hash==="#painel")S.view="painel";render()}
route();
window.addEventListener("hashchange",route);
(async()=>{
  if(!window.claude||!claude.use)return;
  const [d,u]=await Promise.all([claude.use("downloads").catch(()=>null),claude.use("user").catch(()=>null)]);
  downloads=d||localSaver;isOwner=u?await u.isOwner():false;
  if(isOwner&&!$("#ownerBtn")){const a=document.createElement("button");a.id="ownerBtn";a.className="ownerbtn";a.textContent="Painel do facilitador";a.onclick=()=>{S.view=S.view==="painel"?(S.a.every(x=>x)?"report":"intro"):"painel";render()};document.body.appendChild(a)}
  render();
})();
</script>

</body>
</html>
