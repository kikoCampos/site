<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="description" content="Avaliação de coesão de equipe em 30 itens, com relatório individual e coletivo.">
<title>Raio-X do Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#F6F4F1;
  --ink:#111111;
  --ink-2:#3D3A37;
  --muted:#78736C;
  --line:#E3E0DB;
  --line-2:#C4BFB8;
  --chrome:#FFFFFF;
  --chrome-ink:#111111;
  --chrome-muted:#78736C;
  --accent:#E03C10;
  --accent-soft:#FDECE6;
  --accent-on:#FFFFFF;
  --forte:#0E7A4F;   --forte-soft:#E3F2EB;
  --moderado:#57534E; --moderado-soft:#EFEDEA;
  --fragil:#B0271A;  --fragil-soft:#FBE7E4;
  --neutro:#A8A29A;  --neutro-soft:#F2F0ED;
  --band-on:#FFFFFF;
  --shadow:none;
  --shadow-lift:0 1px 0 var(--line-2);
  --r:4px;
  /* a rampa é exposição, não cor: claro = raro, escuro = frequente */
  --sc1:#FCEAE2; --sc2:#F7C9B4; --sc3:#F0A183; --sc4:#E4703F; --sc5:#C7350F;
  --sct1:#111111; --sct2:#111111; --sct3:#111111; --sct4:#111111; --sct5:#FFFFFF;
  --b-confianca:#23409E; --b-confianca-ink:#23409E;
  --b-conflito:#B93317; --b-conflito-ink:#B93317;
  --b-comprometimento:#4F6B15; --b-comprometimento-ink:#4F6B15;
  --b-accountability:#5F2A7D; --b-accountability-ink:#5F2A7D;
  --b-resultados:#8A5D08; --b-resultados-ink:#8A5D08;
  --glass:rgba(255,255,255,.62);
  --glass-2:rgba(255,255,255,.80);
  --glass-brd:rgba(17,17,17,.10);
  --glass-hi:rgba(255,255,255,.85);
  --glass-ring:rgba(17,17,17,.07);
  --blur:saturate(175%) blur(18px);
  --shadow:0 1px 2px rgba(17,17,17,.04), 0 12px 34px -16px rgba(17,17,17,.20);
  --shadow-lift:0 2px 8px rgba(17,17,17,.06), 0 26px 56px -24px rgba(17,17,17,.30);
}

/* Esta ferramenta é de tema único, claro. Não segue o modo escuro do sistema. */
:root{color-scheme:light}
*{box-sizing:border-box}
/* rede de segurança: um SVG de ícone nunca deve crescer além do previsto,
   mesmo que alguma regra se perca */
svg:not(.pyr){max-width:100%}
svg.glyph,svg.chapart,svg.behavbarart{flex:none}
.rbox svg,h4 svg,h3 svg,.mxlbl svg{width:22px;height:22px}
.glyph-lg{width:30px;height:30px}
body{
  margin:0;
  background-color:var(--ground);
  background-image:
    radial-gradient(58vw 52vw at  6%  -6%, color-mix(in srgb, var(--b-confianca) 20%, transparent), transparent 70%),
    radial-gradient(52vw 48vw at 98%   4%, color-mix(in srgb, var(--b-resultados) 20%, transparent), transparent 70%),
    radial-gradient(56vw 52vw at 92%  64%, color-mix(in srgb, var(--b-accountability) 17%, transparent), transparent 70%),
    radial-gradient(50vw 46vw at  2%  86%, color-mix(in srgb, var(--b-comprometimento) 16%, transparent), transparent 70%),
    radial-gradient(44vw 40vw at 52%  40%, color-mix(in srgb, var(--b-conflito) 10%, transparent), transparent 72%);
  background-attachment:fixed;
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:17.5px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.ui{font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
h1,h2,.disp{font-family:"Archivo Black","Archivo","Helvetica Neue",Arial,sans-serif;font-weight:400;letter-spacing:-.035em;line-height:1.02}
h3,h4{letter-spacing:-.015em}
/* a serifa fica só na prosa do relatório e nas afirmações — dá peso de laudo */
.lede,.qtext,ol.disc li,.mini li,.itemhead p,.serif{font-family:"Source Serif 4","Iowan Old Style",Georgia,serif}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.015em;line-height:1.15}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
p{margin:0}
a{color:var(--accent)}

.wrap{max-width:1160px;margin:0 auto;padding:0 24px 90px}

/* ---------- top bar ---------- */
.topbar{
  background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  color:var(--chrome-ink);
  border-bottom:1px solid var(--glass-brd);
  position:sticky;top:0;z-index:30;
}
.topbar-in{
  max-width:1080px;margin:0 auto;padding:15px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mk{width:26px;height:26px;flex:none}
.brand b{font-family:"Archivo Black",sans-serif;font-weight:400;font-size:16px;letter-spacing:-.02em}
.brand span{display:block;font-size:11px;color:var(--chrome-muted);letter-spacing:.09em;text-transform:uppercase;font-family:"Archivo",sans-serif;font-weight:500}
.navbtns{display:flex;gap:6px;flex-wrap:wrap}
.topbar .btn.on{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* ---------- controls ---------- */
button{font:inherit;cursor:pointer}
.btn{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.01em;
  padding:11px 18px;border-radius:11px;border:1px solid var(--glass-brd);
  background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  color:var(--ink);box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
  transition:.15s box-shadow,.15s transform,.15s background;
}
.btn:hover{box-shadow:var(--shadow-lift), inset 0 1px 0 var(--glass-hi);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.btn.pri:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-on);filter:none}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--card-2)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

label.fl{display:block;font-family:"Archivo",sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input.tx{
  width:100%;padding:13px 16px;border-radius:11px;border:1px solid var(--glass-brd);
  background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:var(--shadow) inset;color:var(--ink);font:inherit;font-size:15px;
}
input.tx:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- cards ---------- */
.card{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-brd);border-radius:var(--r);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi)}
.card.lift{box-shadow:var(--shadow-lift), inset 0 1px 0 var(--glass-hi)}
.pad{padding:clamp(22px,3vw,34px)}
.stack{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:"Archivo",sans-serif;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--ink-2);max-width:62ch}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* ---------- home ---------- */
.herogrid{display:grid;gap:32px;grid-template-columns:1fr;align-items:center;
  padding:clamp(30px,4.4vw,58px) 0 clamp(22px,3vw,36px)}
@media(min-width:900px){.herogrid{grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);gap:clamp(36px,5vw,68px)}}
.homehead h1{font-size:clamp(30px,3.6vw,46px);margin-top:16px;max-width:21ch}
.homehead .lede{font-family:"Archivo",sans-serif;font-size:16.5px;line-height:1.6;
  margin-top:20px;max-width:48ch;color:var(--ink-2)}
.heroart{position:relative}

.entrybox{margin-top:30px;max-width:460px}
.seg{display:inline-flex;padding:4px;gap:3px;border:1px solid var(--glass-brd);border-radius:99px;
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.segb{font-family:"Archivo",sans-serif;font-weight:600;font-size:13px;padding:8px 18px;border-radius:99px;
  border:0;background:transparent;color:var(--muted);transition:.15s}
.segb:hover{color:var(--ink)}
.segb.on{background:var(--glass-2);color:var(--ink);box-shadow:var(--shadow)}
.entryfoot{font-size:13.5px;color:var(--muted);margin-top:12px}
.linkb{border:0;background:none;padding:0;font:inherit;color:var(--accent);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkb:hover{text-decoration-thickness:2px}
.entryrow{display:flex;gap:9px;flex-wrap:nowrap;margin-top:14px;max-width:430px}
.entryrow .btn{white-space:nowrap;flex:none}

.homebelow{display:grid;gap:26px;grid-template-columns:1fr;padding:clamp(34px,4.6vw,58px) 0 0}
@media(min-width:820px){.homebelow{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,4.6vw,58px);align-items:start}}
.modelnote{font-size:15.5px;color:var(--ink-2);margin-top:14px;line-height:1.55;max-width:38ch}
.modelgrid{display:grid;gap:8px;margin:0}
.modelrow{display:flex;gap:15px;align-items:center;padding:15px 16px;color:var(--muted);
  border:1px solid var(--line);border-left:5px solid var(--c);border-radius:4px;
  background:var(--card);transition:background .15s,border-color .15s}
.modelrow:hover{background:var(--card-2);border-color:var(--c)}
.modelrow .glyph{color:var(--c);width:26px;height:26px}
.modelrow b{font-family:"Archivo",sans-serif;font-size:17px;font-weight:600;color:var(--ink)}
.modelrow span{font-size:14px;margin-left:auto}
.tryrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:clamp(32px,4vw,48px);
  padding-top:22px;border-top:1px solid var(--line)}
.tryrow span{font-size:14.5px;color:var(--muted);margin-right:4px}

/* matriz de dispersão — cada coluna é uma pessoa, sem nome */
.mx{display:grid;gap:3px;min-width:420px}
.mxr{display:grid;grid-template-columns:150px repeat(var(--n),minmax(30px,1fr));gap:3px;align-items:stretch}
.mxlbl{display:flex;align-items:center;gap:8px;font-family:"Archivo",sans-serif;font-size:12.5px;font-weight:600;padding-right:8px}
.mxlbl .glyph{width:17px;height:17px;color:var(--muted)}
.mxc{display:flex;align-items:center;justify-content:center;border-radius:5px;padding:9px 2px;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.mxh{display:flex;align-items:center;justify-content:center;font-family:"Archivo",sans-serif;font-size:10.5px;
  font-weight:700;color:var(--muted);letter-spacing:.06em;padding-bottom:4px}

/* ---------- glifos ---------- */
.glyph{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.glyph .fillnode{fill:currentColor;stroke:none}
.glyph-lg{width:30px;height:30px;stroke-width:1.5}

/* ---------- questionário ---------- */
.progress{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .35s cubic-bezier(.3,.8,.3,1)}
.stickybar{position:sticky;top:62px;z-index:20;padding:14px 0 12px;margin-bottom:-4px;
  background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:12px}
.qitem{padding:22px 0 22px 18px;border-bottom:1px solid var(--glass-ring);border-left:3px solid transparent;
  transition:border-color .2s,background .2s}
.qitem:last-of-type{border-bottom:0}
.qitem.done{border-left-color:var(--accent)}
.qitem.miss{border-left-color:var(--fragil);background:linear-gradient(90deg,var(--fragil-soft),transparent 60%)}
.qitem.miss .qtext::after{content:"falta responder";display:inline-block;margin-left:10px;
  font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--fragil);vertical-align:2px}
.qtext{font-size:22px;line-height:1.4;margin-bottom:16px;max-width:58ch}
.qnum{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-right:10px}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:540px}
.scale label{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:0 4px 10px;border-radius:12px;overflow:hidden;cursor:pointer;text-align:center;min-height:66px;
  background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow);
  transition:transform .13s,box-shadow .13s,background .13s}
.scale label .swatch{width:100%;height:7px;background:var(--sw);transition:height .14s}
.scale label:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.scale input{position:absolute;opacity:0;width:0;height:0}
.scale .n{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:19px;margin-top:6px;line-height:1}
.scale .w{font-family:"Archivo",sans-serif;font-size:clamp(9px,2.3vw,10.5px);letter-spacing:.045em;
  text-transform:uppercase;color:var(--muted);line-height:1.15;padding:0 2px;
  /* sem width:100% o rótulo assume a largura do texto e o botão o corta */
  width:100%;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
/* No celular o botão tem ~50px: sobra usada para o rótulo caber sem corte. */
@media(max-width:560px){
  .wrap{padding-left:16px;padding-right:16px}
  .qitem{padding-left:12px}
  .scale{gap:5px}
  .scale label{padding-left:2px;padding-right:2px}
  .scale .w{padding:0;letter-spacing:.02em}
}
.scale label:has(input:checked){background:var(--sw);border-color:var(--sw);box-shadow:var(--shadow-lift)}
.scale label:has(input:checked) .swatch{height:0}
.scale label:has(input:checked) .n{color:var(--swt);margin-top:13px}
.scale label:has(input:checked) .w{color:var(--swt);opacity:.9}
.scale label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
/* Desktop: a afirmação à esquerda e a escala à direita, na mesma linha.
   O olho vai da frase direto para a resposta e as 30 cabem em menos rolagem. */
@media(min-width:900px){
  .qitem{display:grid;grid-template-columns:minmax(0,1fr) 540px;
         column-gap:40px;row-gap:8px;align-items:center;padding-top:26px;padding-bottom:26px}
  .qitem>.qtext{grid-column:1;grid-row:1/3;margin-bottom:0;max-width:none;align-self:center}
  .qitem>.scale{grid-column:2;grid-row:1;max-width:none}
  .qitem>.scalehint{grid-column:2;grid-row:2;max-width:none}
}
.scalehint{display:flex;justify-content:space-between;max-width:540px;margin-top:8px;
  font-family:"Archivo",sans-serif;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ---------- pirâmide ---------- */
.pyr{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.pyr.comvalores{max-width:660px}
.pyr .tier{cursor:pointer}
.pyr .tier:hover .gauge{opacity:.85}
.pyr .tier.static{cursor:default}
.pyr .gauge{transition:width .8s cubic-bezier(.2,.75,.25,1)}
.pyr text{font-family:"Archivo",sans-serif}
.pyr .pchip{fill:var(--card);stroke:var(--c);stroke-width:1.5}
.pyr .plbl{font-size:10.5px;font-weight:700;letter-spacing:.11em;fill:var(--ink)}
.pyr .plead{stroke:var(--c);stroke-width:1;opacity:.35;stroke-dasharray:2 3}
.pyr .pcap{font-family:"Archivo",sans-serif;font-size:10px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;fill:var(--muted)}
.pyr .pval{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;fill:var(--c);letter-spacing:-.02em}
.pyr .pval.dim{fill:var(--muted)}
.pyr .pbig{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;fill:var(--c);letter-spacing:-.03em}
.pyr .pband{font-family:"Archivo",sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;fill:var(--muted)}
.pyr .side{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;fill:var(--muted)}
@media (prefers-reduced-motion:reduce){.pyr .gauge{transition:none}}

.pyrlegend{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:16px;flex-wrap:wrap;
  font-family:"Archivo",sans-serif;font-size:11.5px;color:var(--muted)}
.pyrlegend b{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-2)}
.pyrlegend .sq{width:12px;height:12px;border-radius:3px;background:var(--neutro)}
.pyrlegend .sq.hollow{background:transparent;border:2px solid var(--neutro)}

.reportgrid{display:grid;gap:26px;grid-template-columns:1fr}
@media(min-width:900px){.reportgrid{grid-template-columns:1.05fr .95fr;align-items:start}}

.pill-ui{display:inline-flex;align-items:center;gap:7px;font-family:"Archivo",sans-serif;font-weight:600;
  font-size:12.5px;padding:6px 13px 6px 10px;border-radius:99px;border:1px solid transparent;
  background:var(--soft);color:var(--fg);white-space:nowrap;box-shadow:0 1px 2px rgba(15,23,32,.06)}
.pill-ui svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bandchip{display:inline-flex;align-items:center;gap:7px;font-family:"Archivo",sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:3px;background:var(--soft);color:var(--fg);border:0}
.dot{width:7px;height:7px;border-radius:99px;background:currentColor;flex:none}

/* avatares — a cor vem das pessoas */
.av{width:30px;height:30px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;
  font-family:"Archivo",sans-serif;font-weight:700;font-size:11.5px;color:#fff;letter-spacing:.02em;flex:none;
  box-shadow:0 0 0 2px var(--card)}
.av.sm{width:24px;height:24px;font-size:10px}
.avrow{display:flex;flex-wrap:wrap;gap:10px}
.avchip{display:inline-flex;align-items:center;gap:9px;padding:5px 15px 5px 5px;border-radius:99px;
  background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow);font-size:13.5px;font-weight:500;color:var(--ink-2)}
.avstack{display:flex}
.avstack .av{margin-left:-9px}
.avstack .av:first-child{margin-left:0}

/* dumbbell */
.dumb{display:flex;flex-direction:column;gap:2px}
.dumbrow{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.dumbrow:last-child{border-bottom:0}
.dumbrow .nm{font-family:"Archivo",sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.track{position:relative;height:26px}
.track .ax{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line)}
.track .gridl{position:absolute;top:6px;bottom:6px;width:1px;background:var(--line)}
.track .seg{position:absolute;top:12px;height:2px;background:var(--accent);opacity:.55}
.track .pt{position:absolute;top:6px;width:14px;height:14px;border-radius:99px;transform:translateX(-7px)}
.track .pt.team{background:var(--card);border:2.5px solid var(--muted)}
.track .pt.you{background:var(--accent);border:2.5px solid var(--card)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-family:"Archivo",sans-serif}
.legend i{display:inline-block;width:11px;height:11px;border-radius:99px;margin-right:5px;vertical-align:-1px}

/* item table */

  .itemrow{display:grid;grid-template-columns:minmax(0,1fr) 460px;
           column-gap:44px;row-gap:10px;align-items:center}

.itemhead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}

.hcol{display:flex;flex-direction:column;align-items:stretch;gap:5px}

.hl{font-family:"Archivo",sans-serif;font-size:9px;letter-spacing:.045em;text-transform:uppercase;color:var(--muted);line-height:1.15;text-align:center}

.hcol.hit .hn{color:var(--accent)}

.you-mark{font-family:"Archivo",sans-serif;font-size:11.5px;color:var(--accent);font-weight:600;margin-top:9px;display:inline-block}
.flag{font-family:"Archivo",sans-serif;font-size:11px;font-weight:600;color:var(--moderado);background:var(--moderado-soft);border:0;border-radius:99px;padding:3px 10px;margin-left:9px;white-space:nowrap;vertical-align:2px}

.behavblock{scroll-margin-top:80px;border-radius:var(--r);box-shadow:var(--shadow)}

  border:1px solid var(--glass-brd);border-bottom:0;border-radius:var(--r) var(--r) 0 0;
  color:var(--c);display:flex;align-items:center;gap:15px;padding:18px 24px}
.behavbarart{width:30px;height:30px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.behavbarart .fillnode{fill:currentColor;stroke:none}
.behavbar h3{font-size:clamp(19px,2.4vw,26px);color:var(--c)}
.behavbarband{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);background:var(--glass-2);border:1px solid var(--glass-brd);
  padding:5px 11px;border-radius:99px}

.behavhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.behavhead h3{font-size:22px}
.behavicon{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;

.tworow{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:760px){.tworow{grid-template-columns:1fr 1fr;gap:34px}}
.mini{padding:18px 20px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-brd);

.mini li{font-size:15px;line-height:1.45}
ol.disc{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px}

.pill{font-family:"Archivo",sans-serif;font-size:12.5px;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card-2);color:var(--ink-2)}

.demobar{display:flex;align-items:center;gap:12px;row-gap:6px;flex-wrap:wrap;padding:11px 16px;border-radius:21px;
  background:var(--moderado-soft);color:var(--moderado);font-family:"Archivo",sans-serif;font-weight:600;font-size:13px}

.notice{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 16px;border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-2)}

.tbl{width:100%;border-collapse:collapse;font-size:14.5px}

/* ===================== MODO APRESENTAÇÃO =====================
   Mesmo padrão do app — fundo claro, vidro e as cores dos comportamentos.
   O que muda é a escala: tipografia e números muito maiores, um fato por tela. */
.pres{
  position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  color:var(--ink);padding:clamp(20px,3.4vw,46px);
  background-color:var(--ground);
  background-image:
    radial-gradient(62vw 56vw at  4%  -8%, color-mix(in srgb, var(--b-confianca) 22%, transparent), transparent 70%),
    radial-gradient(56vw 50vw at 99%   2%, color-mix(in srgb, var(--b-resultados) 22%, transparent), transparent 70%),
    radial-gradient(58vw 54vw at 94%  70%, color-mix(in srgb, var(--b-accountability) 18%, transparent), transparent 70%),
    radial-gradient(52vw 48vw at  0%  92%, color-mix(in srgb, var(--b-comprometimento) 17%, transparent), transparent 70%);
  background-repeat:no-repeat;
  animation:presin .35s ease both;
}
@keyframes presin{from{opacity:0}to{opacity:1}}
.pres .pyr{width:auto;max-width:100%;height:min(58vh,500px);margin:0 auto}
.presbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2vw,26px);
  max-width:1100px;width:100%;margin:0 auto;overflow:auto;padding:8px 0}
.preskicker{font-family:"Archivo",sans-serif;font-weight:700;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted)}
.prestitle{font-family:"Archivo",sans-serif;font-weight:700;letter-spacing:-.028em;line-height:1.05;
  font-size:clamp(30px,5.2vw,62px);text-wrap:balance}
.pressub{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(16px,1.9vw,23px);color:var(--ink-2);
  max-width:44ch;line-height:1.45}
.presfoot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--glass-brd)}
.presdots{display:flex;gap:7px;margin-right:auto}
.presdot{width:8px;height:8px;border-radius:99px;background:var(--line-2);transition:.2s;border:0;padding:0}
.presdot.on{background:var(--accent);width:24px}
.presnav{display:flex;gap:8px}
.presbtn{font-family:"Archivo",sans-serif;font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:99px;
  border:1px solid var(--glass-brd);background:var(--glass-2);color:var(--ink);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.presbtn:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.presbtn[disabled]{opacity:.35}
.presbtn.x{border-color:transparent;color:var(--muted)}

.prow{display:flex;align-items:flex-start;gap:clamp(16px,2.2vw,28px);padding:clamp(13px,1.7vw,20px) 0;
  border-bottom:1px solid var(--glass-brd)}
.prow:last-child{border-bottom:0}
.pscore{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums;
  font-size:clamp(30px,4vw,50px);line-height:1;color:var(--c);min-width:2.6em;text-align:right;flex:none}
.prow b{display:block;font-family:"Archivo",sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--c);margin-bottom:6px}
.prow p{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(16px,2vw,25px);line-height:1.35;color:var(--ink)}
.preslegend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.presgrid{display:grid;gap:clamp(16px,2.4vw,34px);grid-template-columns:1fr;align-items:center}
@media(min-width:900px){.presgrid.two{grid-template-columns:.95fr 1.05fr}}
.presacts{counter-reset:pa;display:flex;flex-direction:column;gap:clamp(12px,1.8vw,20px)}
.presact{display:flex;gap:18px;align-items:flex-start}
.presact::before{counter-increment:pa;content:counter(pa);font-family:"IBM Plex Mono",monospace;font-weight:600;
  font-size:14px;color:var(--accent-on);background:var(--accent);border:0;border-radius:99px;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:none}
.presact p{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(15px,1.8vw,22px);line-height:1.4}
.pres .mxr{grid-template-columns:clamp(120px,16vw,190px) repeat(var(--n),minmax(28px,1fr))}
.pres .mxc{padding:clamp(9px,1.5vw,16px) 2px;font-size:clamp(12px,1.4vw,16px);border-radius:6px}
.pres .mxlbl{font-size:clamp(12px,1.4vw,16px)}
.pres .tbl td,.pres .tbl th{font-size:clamp(14px,1.7vw,20px);padding:12px 12px 12px 0}

footer.ft{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.hide{display:none !important}

/* faixa preta que sangra até a borda — dá ritmo ao documento longo */

/* divisor de seção do relatório */
.secband{display:flex;align-items:baseline;gap:18px;padding:0 0 12px;border-bottom:3px solid var(--ink);margin:44px 0 26px}
.secband .n{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.1em}
.secband h2{font-size:clamp(20px,2.6vw,28px)}
.secband span{margin-left:auto;font-size:12.5px;color:var(--muted);font-family:"Archivo",sans-serif}

/* número fantasma do capítulo, à moda de revista */
.ghostnum{font-family:"Archivo Black",sans-serif;font-size:clamp(58px,9vw,104px);line-height:.8;
  color:transparent;-webkit-text-stroke:1.5px var(--line-2);letter-spacing:-.05em;flex:none;user-select:none}

.eyebrow{position:relative}
.eyebrow.rule{padding-left:26px}
.eyebrow.rule::before{content:"";position:absolute;left:0;top:50%;width:18px;height:2px;background:var(--accent)}

/* ---------- abertura ---------- */
.intro{max-width:760px;margin:0 auto;padding-top:40px}
.introsteps{display:flex;gap:7px;margin-bottom:30px}
.introstep{height:3px;flex:1;border-radius:99px;background:var(--line);transition:.3s}
.introstep.on{background:var(--accent)}
.introstep.done{background:var(--line-2)}
.intro h1{font-size:clamp(28px,4.6vw,46px);margin-bottom:18px}
.intro .lede{font-size:17px;color:var(--ink-2);max-width:58ch}
.benefits{display:grid;gap:14px;grid-template-columns:1fr;margin-top:32px}
@media(min-width:760px){.benefits{grid-template-columns:repeat(3,1fr)}}
.benefit{padding:24px 22px;border-radius:16px;border:1px solid var(--glass-brd);
  background:color-mix(in srgb, var(--c,var(--accent)) 7%, var(--glass));
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.benefit{border-top:4px solid var(--c,var(--accent))}
.benefit .ic{width:46px;height:46px;border-radius:4px;background:transparent;color:var(--c,var(--accent));
  display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.benefit b{display:block;font-family:"Archivo",sans-serif;font-size:15.5px;margin-bottom:7px}
.benefit p{font-family:"Source Serif 4",Georgia,serif;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.rules{counter-reset:ru;display:flex;flex-direction:column;gap:18px;margin-top:30px}
.rule{display:flex;gap:16px;align-items:flex-start}
.rule::before{counter-increment:ru;content:counter(ru);font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px;
  width:28px;height:28px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);
  display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.rule p{font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.45}
.rule p b{font-family:"Archivo",sans-serif;font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.fact{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:99px;background:var(--glass-2);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-brd);box-shadow:var(--shadow);font-family:"Archivo",sans-serif;font-size:13px;font-weight:500;color:var(--ink-2)}
.fact b{font-weight:700;color:var(--ink)}
.privacy{display:flex;flex-direction:column;gap:0;margin-top:26px;border-top:1px solid var(--line)}
.privrow{display:grid;grid-template-columns:1fr;gap:4px;padding:16px 0;border-bottom:1px solid var(--line)}
@media(min-width:660px){.privrow{grid-template-columns:190px 1fr;gap:20px;align-items:baseline}}
.privrow b{font-family:"Archivo",sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.privrow p{font-family:"Source Serif 4",Georgia,serif;font-size:15.5px;line-height:1.45}
.privrow.you b{color:var(--accent)}
.intronav{display:flex;gap:12px;align-items:center;margin-top:34px;flex-wrap:wrap}
.revebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;border-radius:4px;
  background:var(--accent-soft);margin-bottom:26px;font-family:"Archivo",sans-serif;font-size:13.5px;color:var(--ink-2)}
.revebar b{font-weight:600;color:var(--ink)}
.revebar .linkb{margin-left:auto;color:var(--accent)}

/* ---------- relatório individual ---------- */
.rcapa{padding:18px 0 4px;border-bottom:4px solid var(--ink);margin-bottom:34px}
.rcapa h1{font-size:clamp(32px,4.6vw,50px);letter-spacing:-.028em;margin:10px 0 14px}
.rmeta{display:flex;flex-wrap:wrap;gap:10px 26px;padding-bottom:20px;font-size:13.5px;color:var(--muted)}
.rmeta b{color:var(--ink);font-weight:600}
.rchap{scroll-margin-top:80px;border:0;padding:0;background:transparent;border-radius:var(--r);box-shadow:var(--shadow)}
.chapcover{
  background:linear-gradient(135deg, color-mix(in srgb, var(--c) 20%, var(--glass-2)) 0%,
                                     color-mix(in srgb, var(--c) 7%, var(--glass-2)) 100%);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-brd);border-bottom:0;
  border-radius:var(--r) var(--r) 0 0;
  padding:clamp(24px,3.4vw,40px) clamp(22px,3.2vw,36px);
  display:grid;gap:20px;grid-template-columns:minmax(0,1fr);align-items:start;position:relative}
/* minmax(0,1fr) e o min-width:0 abaixo impedem que um filho largo (a faixa de
   números) estique a coluna além da tela no celular. */
.chapcover > *{min-width:0}
@media(min-width:640px){.chapcover{grid-template-columns:minmax(0,1fr) auto}}
.chapcover .kick{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
.chapcover h2{font-size:clamp(28px,4.2vw,46px);color:var(--c);margin:0}
.chapcover .sub{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(15px,1.7vw,17.5px);
  color:var(--ink-2);margin-top:12px;max-width:48ch;line-height:1.5}
.chapart{width:58px;height:58px;padding:12px;box-sizing:content-box;color:var(--c);justify-self:end;
  stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;
  background:var(--glass-2);border:1px solid var(--glass-brd);border-radius:18px;box-shadow:var(--shadow)}
.chapart .fillnode{fill:currentColor;stroke:none}
.chapnums{display:flex;gap:0;border-top:1px solid var(--glass-ring);margin-top:22px;padding-top:16px;grid-column:1/-1}
.chapnum{flex:1;min-width:0;border-right:1px solid var(--glass-ring);padding-right:18px;margin-right:18px}
.chapnum:last-child{border-right:0;margin-right:0;padding-right:0}
/* No celular as três colunas não cabem lado a lado: "sua leitura" e "o time"
   ficam na primeira linha e "distância" ocupa a segunda inteira. */
@media(max-width:560px){
  .chapnums{flex-wrap:wrap;row-gap:14px}
  .chapnum{padding-right:14px;margin-right:14px}
  .chapnum:nth-child(2){border-right:0;padding-right:0;margin-right:0}
  .chapnum:nth-child(3){flex:1 0 100%;border-top:1px solid var(--glass-ring);padding-top:14px}
  .chapnum .b{display:block;margin-left:0;margin-top:7px}
}

  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.chapnum .v{font-family:"IBM Plex Mono",monospace;font-size:clamp(28px,4vw,40px);font-weight:600;
  color:var(--c);line-height:.95;letter-spacing:-.03em}
.chapnum .b{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-left:8px}
/* Desktop: a definição do comportamento e a sua leitura dividem a largura,
   em vez de duas colunas de texto empilhadas com meia tela vazia à direita. */
@media(min-width:1000px){
  .chapbody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:44px}
  .chapbody>*{grid-column:1/-1;min-width:0}
  .chapbody>.lede{grid-column:1;grid-row:1;max-width:none;align-self:start}
  .chapbody>.rlead{grid-column:2;grid-row:1;max-width:none;align-self:start;margin-top:0}
  .chapbody:not(:has(>.rlead))>.lede{grid-column:1/-1;max-width:62ch}
}
@media print{ .chapbody{display:block} }

  border:1px solid var(--glass-brd);border-top:0;border-radius:0 0 var(--r) var(--r);
  padding:clamp(22px,3vw,34px);box-shadow:var(--shadow)}
.rlead{border-left-color:var(--c,var(--accent))}
.rbox.ex{background:color-mix(in srgb, var(--c,var(--accent)) 8%, var(--glass-2));
  border:1px solid var(--glass-brd);border-left:4px solid var(--c,var(--accent));border-radius:14px}
.rbox.ex h4{color:var(--c,var(--accent))}
.behavicon{border-color:currentColor}
.rchaphead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:18px;border-bottom:3px solid var(--ink);margin-bottom:22px}
.rchapnum{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);letter-spacing:.1em}
.rchaphead h2{font-size:clamp(24px,3vw,32px);letter-spacing:-.02em}
.rscores{margin-left:auto;display:flex;gap:22px;align-items:flex-end}
.rscore{text-align:right}
.rscore .k{font-family:"Archivo",sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rscore .v{font-family:"IBM Plex Mono",monospace;font-size:clamp(34px,5vw,52px);font-weight:600;line-height:.95;letter-spacing:-.03em}
.rlead{font-family:"Source Serif 4",Georgia,serif;font-size:20px;line-height:1.55;color:var(--ink);max-width:62ch;
  border-left:4px solid var(--accent);padding-left:20px;margin:22px 0 4px}

async function sb(path, opts){
  opts = opts||{};
  const h = {
    "apikey": CONFIG.SUPABASE_ANON_KEY,
    "Authorization": "Bearer "+CONFIG.SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  };
  Object.keys(opts.headers||{}).forEach(k=>{ h[k]=opts.headers[k]; });
  const r = await fetch(CONFIG.SUPABASE_URL.replace(/\/+$/,"")+"/rest/v1/"+path,
    { method: opts.method||"GET", headers:h, body: opts.body });
  if(!r.ok) throw new Error("Supabase "+r.status+": "+(await r.text()).slice(0,200));
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

// Reaproveita a chave anon public que a Matriz de Valores já publica no mesmo
// domínio. Assim não existe uma segunda cópia da chave para manter em dia.
async function descobrirChaveAnon(){
  if(CONFIG.SUPABASE_ANON_KEY) return CONFIG.SUPABASE_ANON_KEY;
  try{
    const r = await fetch("/ferramentas/matriz-valores.html", {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const t = await r.text();
    const m = t.match(/eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}/)
           || t.match(/sb_publishable_[A-Za-z0-9_\-]{20,}/);
    if(m){ console.info("Chave anon herdada da Matriz de Valores."); return m[0]; }
    console.warn("Não encontrei a chave anon em matriz-valores.html.");
  }catch(e){
    console.warn("Não consegui ler a chave da Matriz de Valores:", e.message);
  }
  return "";
}

async function gs(payload){
  const r = await fetch(CONFIG.SHEETS_URL, {

    headers:{"Content-Type":"text/plain;charset=utf-8"},   // evita preflight CORS

  });
  if(!r.ok) throw new Error("Sheets "+r.status);
  const j = await r.json();
  if(j && j.error) throw new Error("Sheets: "+j.error);
  return j;
}

/* Ordem randômica por respondente. O construto não é revelado durante a resposta:
   os 30 itens vêm embaralhados, sem o nome do comportamento, para evitar
   ancoragem dentro de bloco e resposta socialmente desejável. A semente é o id
   da pessoa, então a ordem não muda se ela recarregar a página no meio. */
function seededShuffle(arr, seedStr){
  let h = 2166136261>>>0;
  const s = String(seedStr||"x");
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619)>>>0; }
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    h ^= h<<13; h>>>=0; h ^= h>>>17; h ^= h<<5; h>>>=0;
    const j = h % (i+1);
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function demoRng(seed){
  let h = 2166136261>>>0;
  const t = String(seed);
  for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h,16777619)>>>0; }
  return function(){ h ^= h<<13; h>>>=0; h ^= h>>>17; h ^= h<<5; h>>>=0; return h/4294967296; };
}
function demoAnswers(seed, bias, rodada, extra){

    const ruido = (rnd()+rnd()+rnd()-1.5)*disp*1.6;
    const ex    = extra ? (extra[it.b]||0) : 0;
    a[it.id] = Math.max(1, Math.min(5, Math.round(DEMO_ALVO[it.id] + bias + ganho + ex + ruido)));
  });
  return a;
}

  const meuViés = { confianca:1.0, accountability:-0.9, conflito:0.2, comprometimento:0, resultados:-0.2 };
  const minhas = demoAnswers("dvoce", 0, 2, meuViés);
  rs.push({ code:DEMO_CODE, rodada:2, respId:ME.id, nome:(S.nome||ME.nome||"Você"),
            ts:"2026-08-20T10:00:00.000Z", a:minhas });
  S.demo = true; S.code = DEMO_CODE; S.team = time; S.respostas = rs;
  S.answers = Object.assign({}, minhas); S.nome = S.nome || ME.nome || "Você";
}

/* ============================== CÁLCULO ============================== */

function analyze(respostas, rodada){
  const rs = respostas.filter(r=>!rodada || r.rodada===rodada);
  const n = rs.length;
  const items = {};
  ITEMS.forEach(it=>{
    const vals = rs.map(r=>r.a && r.a[it.id]).filter(v=>typeof v==="number" && v>=1 && v<=5);
    const dist = [0,0,0,0,0];
    vals.forEach(v=>dist[v-1]++);
    items[it.id] = { id:it.id, b:it.b, mean:mean(vals), sd:sd(vals), dist, n:vals.length };
  });
  const behav = {};
  BK.forEach(k=>{
    const ms = BY_B[k].map(i=>items[i.id].mean).filter(v=>v!==null);
    behav[k] = { k, mean: mean(ms), band: band(mean(ms)) };
  });
  const scored = ITEMS.map(i=>items[i.id]).filter(x=>x.mean!==null);
  const asc = scored.slice().sort((a,b)=>a.mean-b.mean || a.id.localeCompare(b.id));
  return {
    n, items, behav,
    forcas: asc.slice(-3).reverse(),
    desafios: asc.slice(0,3),
    ordered: BK.map(k=>behav[k]).sort((a,b)=> (a.mean===null?9:a.mean) - (b.mean===null?9:b.mean))
  };
}

/* ============================== PIRÂMIDE ============================== */

/* A pirâmide é composta por cinco medidores. Cada nível carrega a cor do próprio
   comportamento e é preenchido da esquerda para a direita na proporção da nota:
   1 = vazio, 5 = cheio. Com opts.mine o nível se divide em duas barras —
   a de cima é você, a de baixo é o time.                                        */
let PYR_SEQ = 0;
function pyramid(analysis, opts){
  opts = opts||{};
  const bare = !!opts.bare, mine = opts.mine||null, temDados = !!analysis;
  // A pirâmide ocupa a esquerda; os números moram numa coluna à direita, onde
  // sempre cabem. Assim nenhum nível aperta e nenhum dado se perde.
  const TOP_HW=54, BOT_HW=222, Y0=26, Y1=452, CX=246, COL=500;
  const H=(Y1-Y0)/5, uid = "p"+(++PYR_SEQ);
  const hw = y => TOP_HW + (y-Y0)/(Y1-Y0)*(BOT_HW-TOP_HW);
  const frac = v => (v===null||v===undefined||isNaN(v)) ? 0 : Math.max(0,Math.min(1,(v-1)/4));
  let defs = "", parts = "";

  BK.forEach((k,i)=>{
    const b = BMAP[k], d = analysis ? analysis.behav[k] : null;
    const vT = d ? d.mean : null, vY = mine ? mine[k] : null;
    const yTop = Y0 + (4-i)*H + 3, yBot = Y0 + (5-i)*H - 3;
    const tw = hw(yTop), bwd = hw(yBot), alt = yBot-yTop, midY = (yTop+yBot)/2;
    const pts = (CX-tw)+","+yTop+" "+(CX+tw)+","+yTop+" "+(CX+bwd)+","+yBot+" "+(CX-bwd)+","+yBot;
    const cid = uid+"-"+k;
    const cor = bare ? "var(--neutro)" : "var(--b-"+k+")";
    defs += '<clipPath id="'+cid+'"><polygon points="'+pts+'"></polygon></clipPath>';

    const barra = (y,h,v) =>
      '<rect x="'+(CX-BOT_HW)+'" y="'+y+'" width="'+(2*BOT_HW)+'" height="'+h+'" fill="'+cor+'" opacity=".13"></rect>'+
      ((bare||!temDados) ? '' :
      '<rect class="gauge" x="'+(CX-bwd)+'" y="'+y+'" width="'+(2*bwd*frac(v))+'" height="'+h+'" fill="'+cor+'"></rect>');

    let corpo;
    if(!temDados){ corpo = barra(yTop, alt, null); }
    else if(mine && !bare){
      const hA = alt/2 - 1.5;
      corpo = barra(yTop, hA, vY) + barra(yTop+alt/2+1.5, hA, vT);
    } else { corpo = barra(yTop, alt, vT); }

    // plaqueta com o nome, sempre centrada e sempre menor que o topo do nível
    const nome = b.n.toUpperCase();
    const chipW = nome.length*7.0 + 26, chipH = 26;
    const chipX = CX - chipW/2, chipY = midY - chipH/2;
    let rotulos =
      '<rect class="pchip" x="'+chipX+'" y="'+chipY+'" width="'+chipW+'" height="'+chipH+'" rx="6"></rect>'+
      '<text class="plbl" x="'+CX+'" y="'+(chipY+17)+'" text-anchor="middle">'+esc(nome)+'</text>';

    // coluna de números, fora da pirâmide
    if(temDados && !bare){
      rotulos += '<line class="plead" x1="'+(CX+hw(midY)+8)+'" y1="'+midY+'" x2="'+(COL-14)+'" y2="'+midY+'"></line>';
      if(mine){
        rotulos +=
          '<text class="pcap" x="'+COL+'" y="'+(midY-6)+'">você</text>'+
          '<text class="pval" x="'+(COL+44)+'" y="'+(midY-4)+'">'+fmt(vY)+'</text>'+
          '<text class="pcap" x="'+COL+'" y="'+(midY+16)+'">time</text>'+
          '<text class="pval dim" x="'+(COL+44)+'" y="'+(midY+18)+'">'+fmt(vT)+'</text>';
      } else {
        rotulos +=
          '<text class="pbig" x="'+COL+'" y="'+(midY+4)+'">'+fmt(vT)+'</text>'+
          '<text class="pband" x="'+COL+'" y="'+(midY+20)+'">'+esc(band(vT).n)+'</text>';
      }
    }

    const aria = bare ? b.n : (mine ? b.n+": você "+fmt(vY)+", time "+fmt(vT) : b.n+", média "+fmt(vT));
    parts += '<g class="tier'+(bare?" static":"")+'" data-b="'+k+'"'+(bare?"":' role="button" tabindex="0"')+
      ' aria-label="'+esc(aria)+'" style="--c:'+cor+'">'+
      '<g clip-path="url(#'+cid+')">'+corpo+'</g>'+
      '<polygon points="'+pts+'" fill="none" stroke="'+cor+'" stroke-width="1.6"></polygon>'+
      rotulos + '</g>';
  });

  const largura = (temDados && !bare) ? 700 : 500;
  const rodape = mine ? "em cada nível, a barra de cima é você e a de baixo é o time"
                      : (bare ? "cada nível se apoia no de baixo" : "quanto mais cheio, mais o comportamento acontece");
  return '<svg class="pyr'+((temDados&&!bare)?" comvalores":"")+'" viewBox="0 0 '+largura+' 486" role="img" aria-label="Pirâmide dos cinco comportamentos">'+
    '<defs>'+defs+'</defs>'+parts+
    '<text class="side" x="'+(largura/2)+'" y="478" text-anchor="middle">'+rodape+'</text></svg>';
}

function distHTML(itemStat, myVal){
  const max = Math.max.apply(null, itemStat.dist.concat([1]));
  const cells = SCALE.map(s=>{

    const h = c ? Math.max(8, Math.round(c/max*100)) : 0;

    return `<div class="hcol ${hit?"hit":""}" style="--sw:var(--sc${s.v})">
      <div class="hplot"><div class="hbar ${c?"":"zero"}" style="height:${c?h:2}%"></div></div>
      <div class="hmeta"><span class="hn">${c}</span><span class="hl">${s.w}</span></div>
    </div>`;
  }).join("");
  return `<div class="hist" role="img" aria-label="Distribuição das respostas: ${itemStat.dist.map((c,i)=>c+" em "+SCALE[i].w).join(", ")}">${cells}</div>`;
}

    return `<div class="itemrow">

        </div>

    </section>`;

}

/* Matriz comportamento × respondente. Colunas anônimas e ordenadas da leitura
   mais severa para a mais generosa: mostra a dispersão sem identificar ninguém. */
function matrixHTML(respostas, rodada){
  const rs = respostas.filter(r=>r.rodada===rodada);
  if(rs.length < MIN_N) return "";
  const cols = rs.map(r=>{
    const m = {};
    BK.forEach(k=>{ m[k] = mean(BY_B[k].map(i=>r.a && r.a[i.id]).filter(v=>typeof v==="number")); });
    m._all = mean(BK.map(k=>m[k]).filter(v=>v!==null));
    return m;
  }).sort((a,b)=>(a._all||0)-(b._all||0));
  const letters = cols.map((_,i)=>String.fromCharCode(65+i));
  const head = `<div class="mxr" style="--n:${cols.length}"><span></span>${letters.map(l=>'<div class="mxh">'+l+'</div>').join("")}</div>`;
  const rows = BK.slice().reverse().map(k=>{
    const cells = cols.map(c=>{
      const v = c[k], i = rampIdx(v);
      return `<div class="mxc" style="background:var(--sc${i});color:var(--sct${i})" title="${esc(BMAP[k].n)}: ${fmt(v)}">${fmt(v)}</div>`;
    }).join("");
    return `<div class="mxr" style="--n:${cols.length}"><div class="mxlbl">${glyph(k)}${esc(BMAP[k].n)}</div>${cells}</div>`;
  }).join("");
  return `<section class="card pad">
    <h3 style="font-size:20px;margin:0 0 6px">O quanto vocês enxergam o mesmo time</h3>
    <p class="lede" style="font-size:17px;margin-bottom:18px">Cada coluna é uma pessoa, sem identificação, ordenadas da leitura mais severa para a mais generosa. Uma linha com tons muito diferentes mostra um nível que o time ainda vê de formas distintas — e alinhar isso costuma ser o primeiro ganho.</p>
    <div class="scroll-x"><div class="mx">${head}${rows}</div></div>
  </section>`;
}

/* A trilha é o produto final: onde o time está → o que fazer, em que ordem,
   com que ferramenta e em quanto tempo. Sessões marcadas com a origem. */
function trilhaHTML(k, rodada){
  const b = BMAP[k], t = b.trilha;
  const ses = t.sessoes.map(([num,dur,nome,desc,fonte],i)=>`
    <div class="tses">
      <div class="tsmeta"><span class="tsnum">${esc(num)}</span><span class="tsdur">${esc(dur)}</span></div>
      <div>
        <div class="tsnome">${esc(nome)}
          <span class="proc ${fonte==="livro"?"livro":""}">${fonte==="livro"?"do livro":"elaboração própria"}</span>
        </div>
        <p class="tsdesc">${esc(desc)}</p>
      </div>
    </div>`).join("");
  return `<section class="card pad" style="--c:var(--b-${k})">
    <p class="eyebrow rule">A trilha · ${esc(t.semanas)}</p>
    <h3 class="disp" style="font-size:clamp(24px,3.2vw,34px);margin:10px 0 8px;color:var(--c)">${esc(b.n)}, e só isso, até o reteste.</h3>
    <p class="lede" style="font-size:15.5px;margin-bottom:6px">${esc(b.def)}</p>
    <div class="trilha">${ses}</div>
    <div class="tsrit"><b>Ritual</b><p>${esc(t.ritual)}</p></div>
    <div class="tsrit" style="--c:var(--ink)"><b>Gate</b><p>Ao fim de ${esc(t.semanas)}, abra a rodada ${rodada+1} com as mesmas 30 afirmações. A comparação item a item mostra se o comportamento mudou — ou se mudou apenas a intenção.</p></div>
  </section>`;
}

  /* --- síntese pessoal --- */
  const meusOrd = BK.map(k=>({k, v:myBehav[k]})).filter(x=>x.v!==null).sort((a,b)=>a.v-b.v);
  const meuFraco = meusOrd[0], meuForte = meusOrd[meusOrd.length-1];
  const gapsB = teamReady ? BK.map(k=>({k, d:(myBehav[k]??0)-(A.behav[k].mean??0)}))
                              .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)) : [];
  const maiorGap = gapsB[0];

  /* --- régua você x time --- */
  const dumb = BK.slice().reverse().map(k=>{
    const you=myBehav[k], team=teamReady?A.behav[k].mean:null;

    const segL=(py!==null&&pt!==null)?Math.min(py,pt):null, segW=(py!==null&&pt!==null)?Math.abs(py-pt):null;

        </div>

    </section>`;
  }).join("");

  return `
  ${S.demo?`<div class="demobar">Exemplo simulado<span>7 pessoas fictícias, duas rodadas — nenhum dado real.</span><button class="linkb" data-act="exitdemo">Sair do exemplo</button></div>`:""}

          <h3 style="font-size:20px;margin:0 0 8px">Seu retrato em três frases</h3>
          <p class="lede" style="font-size:15.5px">
            Na sua leitura, o nível mais consolidado deste time é <b>${esc(BMAP[meuForte.k].n.toLowerCase())}</b> (${fmt(meuForte.v)}) e o com mais espaço é <b>${esc(BMAP[meuFraco.k].n.toLowerCase())}</b> (${fmt(meuFraco.v)}).
            ${teamReady&&maiorGap?`Sua maior distância em relação ao grupo está em <b>${esc(BMAP[maiorGap.k].n.toLowerCase())}</b>, onde você avalia ${fmt(Math.abs(maiorGap.d))} ${maiorGap.d>0?"acima":"abaixo"} da média.`:""}
            ${teamReady?`O melhor ponto de partida do time é <b>${esc(BMAP[A.ordered.filter(x=>x.mean!==null)[0].k].n.toLowerCase())}</b>, a base ainda em construção da pirâmide coletiva.`:""}
          </p>
        </div>
        <div class="card pad">
          <h3 style="font-size:20px;margin:0 0 16px">Você e o time, na mesma régua</h3>
          <div class="dumb">${dumb}</div>
          <div class="legend" style="margin-top:14px">
            <span><i style="background:var(--accent)"></i>você</span>
            <span><i style="background:var(--card);border:2px solid var(--muted)"></i>média do time</span>
            <span style="margin-left:auto">escala 1 → 5</span>

    ${caps}

    <div class="tworow">
      <section class="card pad">
        <h3 style="font-size:20px;margin:0 0 14px">O que você já vê acontecendo</h3>
        <div class="scroll-x"><table class="tbl"><tbody>${meusItens.slice(-3).reverse().map(linha).join("")}</tbody></table></div>
      </section>
      <section class="card pad">
        <h3 style="font-size:20px;margin:0 0 14px">Onde você vê mais espaço</h3>
        <div class="scroll-x"><table class="tbl"><tbody>${meusItens.slice(0,3).map(linha).join("")}</tbody></table></div>
      </section>

    <section class="card pad">
      <span class="eyebrow">Seu compromisso</span>

        <div class="rplanoi"><p><b>Leve uma frase para a devolutiva.</b> ${teamReady&&maiorGap?`A sua está pronta: “eu vejo ${esc(BMAP[maiorGap.k].n.toLowerCase())} de forma diferente do resto do time, e queria entender por quê.”`:`Escolha o nível em que sua leitura mais destoa e diga isso em voz alta.`}</p></div>
        <div class="rplanoi"><p><b>Faça um exercício de ${esc(BMAP[meuFraco.k].n.toLowerCase())} nesta semana.</b> ${esc(BMAP[meuFraco.k].exerc[0])}</p></div>

        <div class="rplanoi"><p><b>Releia isto no dia do reteste.</b> A rodada ${rodada+1} usa as mesmas 30 afirmações — a comparação só tem valor se você lembrar do que se propôs a mudar.</p></div>

      <span>Modelo conceitual: <em>Os 5 Desafios das Equipes</em>, Patrick Lencioni · Três forças: <em>O Novo Código da Mudança</em>. Itens de avaliação, relatório e exercícios: elaboração própria.</span>
      <span class="noprint"><button class="btn sm ghost" data-act="go-team">Ver relatório do time →</button></span>

  </div>`;
}

/* ====================== MODO APRESENTAÇÃO ======================
   Sequência para projetar na devolutiva. Cada slide entrega um fato só. */

function presSlides(){
  const rodada = S.team ? S.team.rodadaAtual : 1;
  const A = analyze(S.respostas, rodada);
  const prev = (S.team && S.team.rodadaAtual>1) ? analyze(S.respostas, rodada-1) : null;
  const ord = A.ordered.filter(x=>x.mean!==null);
  const foco = ord[0], topo = ord[ord.length-1];
  const nomeTime = (S.team && S.team.nome) ? S.team.nome : S.code;
  const slides = [];

  slides.push(()=>`
    <p class="preskicker">Raio-X do Time · rodada ${rodada} · ${A.n} respondentes</p>
    <h1 class="prestitle">${esc(nomeTime)}</h1>
    <p class="pressub">Cinco comportamentos, trinta afirmações e um retrato do que este time
    já construiu — e do que vem a seguir.</p>`);

  slides.push(()=>`
    <p class="preskicker">O retrato</p>
    <div class="presgrid two">
      <div>
        <h2 class="prestitle" style="font-size:clamp(26px,3.6vw,44px)">${esc(BMAP[topo.k].n)} já sustenta.<br>${esc(BMAP[foco.k].n)} é o próximo passo.</h2>
        <p class="pressub" style="margin-top:16px">Cada nível se apoia no de baixo. Por isso a ordem do trabalho importa tanto quanto o esforço:
        começar embaixo faz o ganho durar.</p>
        <div class="preslegend" style="justify-content:flex-start;margin-top:22px">
          ${bandPill(band(4))}${bandPill(band(3.2))}${bandPill(band(2))}
        </div>
      </div>
      <div>${pyramid(A)}</div>
    </div>`);

  slides.push(()=>`
    <p class="preskicker">O que este time já sustenta</p>
    <h2 class="prestitle" style="font-size:clamp(24px,3.2vw,40px)">Três forças para preservar</h2>
    <div>${A.forcas.map(x=>{const it=IMAP[x.id];return `
      <div class="prow" style="--c:var(--forte)">
        <span class="pscore">${fmt(x.mean)}</span>
        <div><b>${esc(BMAP[it.b].n)}</b><p>${esc(it.t)}</p></div>
      </div>`;}).join("")}</div>`);

  slides.push(()=>`
    <p class="preskicker">Onde há mais espaço para crescer</p>
    <h2 class="prestitle" style="font-size:clamp(24px,3.2vw,40px)">Três oportunidades claras</h2>
    <div>${A.desafios.map(x=>{const it=IMAP[x.id];return `
      <div class="prow" style="--c:var(--fragil)">
        <span class="pscore">${fmt(x.mean)}</span>
        <div><b>${esc(BMAP[it.b].n)}</b><p>${esc(it.t)}</p></div>
      </div>`;}).join("")}</div>`);

  const mx = matrixHTML(S.respostas, rodada);
  if(mx) slides.push(()=>`
    <p class="preskicker">Concordância interna</p>
    <h2 class="prestitle" style="font-size:clamp(24px,3.2vw,40px)">Vocês veem o mesmo time?</h2>
    <p class="pressub">Cada coluna é uma pessoa, sem nome. Linha com tons muito diferentes = um nível que o time
    ainda vê de formas distintas. Alinhar isso costuma ser o primeiro ganho.</p>
    ${mx.replace(/<section class="card pad">[\s\S]*?<div class="scroll-x">/,'<div class="scroll-x">').replace(/<\/section>$/,'')}`);

  if(prev && prev.n>=MIN_N) slides.push(()=>`
    <p class="preskicker">Evolução · rodada ${rodada-1} → ${rodada}</p>
    <h2 class="prestitle" style="font-size:clamp(24px,3.2vw,40px)">O que se moveu</h2>
    <div class="scroll-x"><table class="tbl">
      <thead><tr><th>Comportamento</th><th>Antes</th><th>Agora</th><th>Δ</th></tr></thead>
      <tbody>${BK.slice().reverse().map(k=>{
        const a=prev.behav[k].mean, b=A.behav[k].mean;
        const d=(a!==null&&b!==null)?Math.round((b-a)*10)/10:null;
        const col = d===null||d===0?"var(--muted)":(d>0?"var(--forte)":"var(--fragil)");
        const txt = (d===null||d===0)?"—":(d>0?"+":"−")+fmt(Math.abs(d));
        return `<tr><td>${esc(BMAP[k].n)}</td><td class="num">${fmt(a)}</td><td class="num">${fmt(b)}</td>
          <td class="num" style="color:${col};font-weight:700">${txt}</td></tr>`;
      }).join("")}</tbody></table></div>`);

  slides.push(()=>{
    const t = BMAP[foco.k].trilha;
    return `
    <p class="preskicker">A trilha · ${esc(t.semanas)}</p>
    <h2 class="prestitle" style="font-size:clamp(24px,3.2vw,40px)">Três sessões, um ritual, um gate.</h2>
    <div>${t.sessoes.map(([num,dur,nome,,fonte])=>`
      <div class="prow" style="--c:var(--b-${foco.k})">
        <span class="pscore" style="font-size:clamp(15px,1.8vw,22px);min-width:5.6em">${esc(dur)}</span>
        <div><b>${esc(num)}</b><p>${esc(nome)}</p></div>
      </div>`).join("")}</div>
    <p class="pressub" style="margin-top:16px"><strong>Ritual:</strong> ${esc(t.ritual)}</p>`;
  });

  slides.push(()=>`
    <p class="preskicker">A pergunta que abre a próxima conversa</p>
    <h2 class="prestitle">${esc(A.desafios[0]?IMAP[A.desafios[0].id].p:"O que este time evita conversar?")}</h2>
    <p class="pressub" style="margin-top:18px">Vale responder juntos antes de sair da sala.</p>`);

  return slides;
}

function renderPres(){
  const box = document.getElementById("pres");
  if(S.pres===null || S.pres===undefined){ box.innerHTML=""; box.className=""; document.body.style.overflow=""; return; }
  const slides = presSlides();
  const i = Math.max(0, Math.min(slides.length-1, S.pres));
  S.pres = i;
  box.className = "pres";
  document.body.style.overflow = "hidden";
  box.innerHTML =
    '<div class="presbody" key="'+i+'">'+slides[i]()+'</div>'+
    '<div class="presfoot">'+
      '<div class="presdots">'+slides.map((_,n)=>'<button class="presdot '+(n===i?"on":"")+'" data-pres="'+n+'" aria-label="Slide '+(n+1)+'"></button>').join("")+'</div>'+
      '<div class="presnav">'+
        '<button class="presbtn" data-pres="prev" '+(i===0?"disabled":"")+'>‹ Voltar</button>'+
        '<button class="presbtn" data-pres="next" '+(i===slides.length-1?"disabled":"")+'>Avançar ›</button>'+
        '<button class="presbtn x" data-pres="close">Sair (Esc)</button>'+
      '</div>'+
    '</div>';
}

/* ============================== RENDER ============================== */

function render(){
  const app = $("#app");
  let html = "";
  if(S.view==="home") html = view_home();
  else if(S.view==="name") html = view_name();
  else if(S.view==="survey") html = view_survey();
  else if(S.view==="team") html = view_team();
  else if(S.view==="me") html = view_me();
  app.innerHTML = html;
  $("#nav").innerHTML = navHTML();
  $("#brandsub").textContent = S.code ? S.code : "Exercício de aceleração";
  if(S.msg){ const m=$("#homemsg")||$("#surveymsg"); if(m){ m.innerHTML='<p class="notice warn" style="margin-top:12px">'+esc(S.msg)+'</p>'; } S.msg=""; }
  if(S.pres!==null && S.pres!==undefined) renderPres();
  window.scrollTo({top:0,behavior:"instant"});
}

/* ============================== AÇÕES ============================== */

/* quem já passou pela apresentação alguma vez entra direto na tela final */
function introInicial(){ return (LS.get("rxt_viu_intro", false) && (S.nome||ME.nome)) ? 2 : 0; }

async function enterTeam(code, createIfMissing, nomeTime){
  code = slug(code);
  if(!code){ S.msg="Informe um código de time."; render(); return false; }
  S.code = code;
  let t = await getTeam(code);
  if(!t){
    if(!createIfMissing){
      S.msg='Time "'+code+'" não encontrado. Confira o código ou crie um time novo.';
      render(); return false;
    }
    t = { code, nome: nomeTime||code, rodadaAtual:1, criadoEm:new Date().toISOString() };
    await setTeam(code, t);
  }
  S.team = t;
  LS.set("rxt_lastcode", code);
  await loadRespostas();
  const my = S.respostas.find(r=>r.respId===ME.id && r.rodada===t.rodadaAtual);
  if(my){ S.answers = Object.assign({}, my.a); S.nome = my.nome||S.nome; S.jaRespondeu = true; }
  else { S.answers = {}; S.jaRespondeu = false; }
  // quem já passou pela apresentação alguma vez cai direto na tela final
  S.introStep = introInicial();
  return true;
}

async function loadRespostas(){
  if(S.demo) return;
  S.respostas = await getRespostas(S.code);
}

async function submitSurvey(){
  const missing = ITEMS.filter(i=>!S.answers[i.id]);
  if(missing.length){ S.msg="Faltam "+missing.length+" respostas."; render(); return; }
  const doc = {
    code:S.code, rodada:S.team?S.team.rodadaAtual:1, respId:ME.id,
    nome:S.nome||"anônimo", ts:new Date().toISOString(), a:Object.assign({},S.answers)
  };
  if(S.demo){
    S.respostas = S.respostas.filter(r=>r.respId!==ME.id).concat([doc]);
  } else {
    await saveResposta(doc);
    await loadRespostas();
  }
  S.view="me"; render();
}

function csv(){
  const A = analyze(S.respostas, S.team?S.team.rodadaAtual:1);
  const lines = [["comportamento","item","media","desvio","n","nunca","raramente","as_vezes","quase_sempre","sempre"].join(";")];
  ITEMS.forEach(it=>{
    const s=A.items[it.id];
    lines.push([BMAP[it.b].n, '"'+it.t.replace(/"/g,'""')+'"', fmt2(s.mean), fmt2(s.sd), s.n].concat(s.dist).join(";"));
  });
  lines.push("");
  BK.slice().reverse().forEach(k=>lines.push([BMAP[k].n,"MÉDIA DO COMPORTAMENTO",fmt2(A.behav[k].mean),"","",""].join(";")));
  return "﻿"+lines.join("\n");
}

async function doExport(){
  const data = csv();
  const name = "raio-x-"+S.code+"-rodada"+(S.team?S.team.rodadaAtual:1)+".csv";
  try{
    const blob = new Blob([data], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 800);
  }catch(e){
    console.warn(e);
    alert("Não foi possível gerar o arquivo neste navegador.");
  }
}

/* ============================== EVENTOS ============================== */

function softScroll(el){
  if(!el || typeof el.scrollIntoView!=="function") return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  try{ el.scrollIntoView({behavior: reduce?"auto":"smooth", block:"center"}); }catch(e){ try{ el.scrollIntoView(); }catch(_){} }
}

function markMissing(){
  const falta = pageItems(S.step).filter(i=>!S.answers[i.id]);
  document.querySelectorAll(".qitem").forEach(el=>el.classList.remove("miss"));
  if(!falta.length) return false;
  falta.forEach(i=>{
    const el = document.querySelector('.qitem[data-item="'+i.id+'"]');
    if(el) el.classList.add("miss");
  });
  const m = $("#surveymsg");
  if(m) m.textContent = falta.length===1 ? "Falta 1 afirmação." : "Faltam "+falta.length+" afirmações.";
  softScroll(document.querySelector(".qitem.miss"));
  return true;
}

function nextUnansweredOnPage(afterId){
  const list = pageItems(S.step);
  const start = afterId ? list.findIndex(i=>i.id===afterId)+1 : 0;
  for(let i=start;i<list.length;i++) if(!S.answers[list[i].id]) return list[i].id;
  return null;
}

document.addEventListener("change", e=>{
  const q = e.target.getAttribute && e.target.getAttribute("data-q");
  if(q){ S.answers[q] = Number(e.target.value);
    const row = document.querySelector('.qitem[data-item="'+q+'"]');
    if(row){ row.classList.add("done"); row.classList.remove("miss"); }
    const answered = ITEMS.filter(i=>S.answers[i.id]).length;
    const bar = document.querySelector(".progress>i");
    if(bar) bar.style.width = Math.round(answered/ITEMS.length*100)+"%";
    document.querySelectorAll(".mono").forEach(el=>{
      if(/^\d+\/\d+$/.test(el.textContent.trim())) el.textContent = answered+"/"+ITEMS.length;
    });
    const m = document.getElementById("surveymsg"); if(m) m.textContent="";
    const nx = nextUnansweredOnPage(q);
    if(nx){
      const el = document.querySelector('.qitem[data-item="'+nx+'"]');
      if(el && el.getBoundingClientRect().bottom > window.innerHeight - 40) softScroll(el);
    }
  }
});

/* teclas 1–5 respondem a afirmação sob o cursor ou com foco */
document.addEventListener("keydown", e=>{
  if(S.view!=="survey") return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!/^[1-5]$/.test(e.key)) return;
  let row = document.activeElement && document.activeElement.closest && document.activeElement.closest(".qitem");
  if(!row && HOVER_ITEM) row = document.querySelector('.qitem[data-item="'+HOVER_ITEM+'"]');
  if(!row) return;
  const inp = row.querySelector('input[value="'+e.key+'"]');
  if(inp){ e.preventDefault(); inp.checked = true; inp.dispatchEvent(new Event("change",{bubbles:true})); }
});

let HOVER_ITEM = null;
document.addEventListener("mouseover", e=>{
  const row = e.target.closest && e.target.closest(".qitem");
  HOVER_ITEM = row ? row.getAttribute("data-item") : HOVER_ITEM;
});

document.addEventListener("click", e=>{
  const p = e.target.closest && e.target.closest("[data-pres]");
  if(!p) return;
  const v = p.getAttribute("data-pres");
  if(v==="close"){ S.pres=null; }
  else if(v==="next"){ S.pres++; }
  else if(v==="prev"){ S.pres--; }
  else S.pres = Number(v);
  renderPres();
  e.stopPropagation();
}, true);

document.addEventListener("keydown", e=>{
  if(S.pres===null || S.pres===undefined) return;
  if(e.key==="Escape"){ S.pres=null; renderPres(); e.preventDefault(); return; }
  if(e.key==="ArrowRight" || e.key===" " || e.key==="PageDown"){ S.pres++; renderPres(); e.preventDefault(); return; }
  if(e.key==="ArrowLeft" || e.key==="PageUp"){ S.pres--; renderPres(); e.preventDefault(); return; }
}, true);

document.addEventListener("click", async e=>{
  const tier = e.target.closest && e.target.closest(".tier");
  if(tier && (S.view==="team"||S.view==="me")){
    const el = document.getElementById("b-"+tier.getAttribute("data-b"));
    if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  }
  const go = e.target.closest && e.target.closest("[data-go]");
  if(go){
    const v = go.getAttribute("data-go");
    if(v==="home"){ S.view="home"; S.code=""; S.team=null; S.respostas=[]; S.demo=false; S.answers={}; }
    else if(v==="team" && !S.facilitador){ return; }
    else S.view=v;
    render(); return;
  }
  const b = e.target.closest && e.target.closest("[data-act]");
  if(!b) return;
  const act = b.getAttribute("data-act");

  if(act==="mode-responder" || act==="mode-time"){
    S.mode = act==="mode-responder" ? "responder" : "time";
    const cur = ($("#codein")||{}).value||"";
    S.code = slug(cur);
    render();
    const inp=$("#codein"); if(inp){ inp.value=cur; inp.focus(); }
    return;
  }
  if(act==="enter"){
    const code = ($("#codein")||{}).value||"";
    b.disabled=true; b.textContent="…";
    const ok = await enterTeam(code, false);
    if(ok){ S.view = (S.mode==="responder") ? (S.jaRespondeu ? "me" : "name") : "team"; render(); }
    return;
  }
  if(act==="demo"){
    demoLoad(); S.view="me"; render(); return;
  }
  if(act==="demoresp"){
    // mesma equipe simulada, mas você entra pela porta da frente e responde de verdade
    demoLoad();
    S.respostas = S.respostas.filter(r=>r.respId!==ME.id);
    S.answers = {}; S.step = 0; S.jaRespondeu = false; S.nome = S.nome||ME.nome||""; S.introStep = introInicial();
    S.view = "name"; render(); return;
  }
  if(act==="exitdemo"){
    S.demo=false; S.code=""; S.team=null; S.respostas=[]; S.answers={}; S.view="home"; render(); return;
  }
  if(act==="create"){
    const code = prompt("Código do novo time (sem espaços, ex.: TIME-PICPAY):", ($("#codein")||{}).value||"");
    if(!code) return;
    const nome = prompt("Nome do time (aparece no relatório):", code) || code;
    const ok = await enterTeam(code, true, nome);
    if(ok){ S.view="name"; render(); }
    return;
  }
  if(act==="intro-next"){ S.introStep=Math.min(2,(S.introStep||0)+1); render(); return; }
  if(act==="intro-prev"){ S.introStep=Math.max(0,(S.introStep||0)-1); render(); return; }
  if(act==="intro-skip"){ S.introStep=2; render(); return; }
  if(act==="intro-rever"){ S.introStep=0; render(); return; }
  if(act==="startsurvey"){
    const nm = (($("#namein")||{}).value||"").trim();
    if(nm.length<2){ const m=$("#namemsg"); if(m) m.textContent="Escreva seu nome para continuar."; return; }
    S.nome = nm; ME.nome = nm; LS.set("rxt_me", ME); LS.set("rxt_viu_intro", true);
    S.step=0; S.view="survey"; render(); return;
  }
  if(act==="next"){
    if(markMissing()) return;
    S.step++; render(); return;
  }
  if(act==="prev"){ S.step=Math.max(0,S.step-1); render(); return; }
  if(act==="submit"){
    if(markMissing()) return;
    const falta = ITEMS.filter(i=>!S.answers[i.id]).length;
    if(falta){ const m=$("#surveymsg"); if(m) m.textContent="Faltam "+falta+" itens em partes anteriores."; return; }
    b.disabled=true; b.textContent="Enviando…";
    await submitSurvey(); return;
  }
  if(act==="refresh"){ if(S.demo){ render(); return; } b.disabled=true; await loadRespostas(); render(); return; }
  if(act==="go-respond-here"){ S.view="name"; S.introStep=introInicial(); S.step=0; render(); return; }
  if(act==="go-team"){ S.view="team"; render(); return; }
  if(act==="copycode"){
    try{ await navigator.clipboard.writeText(S.code); b.textContent="Copiado ✓"; setTimeout(()=>b.textContent="Copiar código do time",1600); }catch(e){}
    return;
  }
  if(act==="present"){ S.pres=0; renderPres(); return; }
  if(act==="facil"){
    if(S.facilitador){
      if(confirm("Sair do modo facilitador?")){ S.facilitador=false; if(S.view==="team") S.view="me"; render(); }
      return;
    }
    const senha = prompt("Modo facilitador — senha:");
    if(senha===null) return;
    if(senha === CONFIG.SENHA_FACILITADOR){ S.facilitador = true; render(); }
    else alert("Senha incorreta.");
    return;
  }
  if(act==="print"){ window.print(); return; }
  if(act==="export"){ await doExport(); return; }
  if(act==="newround"){
    if(S.demo){ alert("Isto é um exemplo simulado — abra um time de verdade para criar rodadas."); return; }
    if(!confirm("Abrir a rodada "+((S.team?S.team.rodadaAtual:1)+1)+"? As respostas atuais ficam guardadas para comparação.")) return;
    S.team = Object.assign({}, S.team, {rodadaAtual:(S.team.rodadaAtual||1)+1});
    await setTeam(S.code, S.team);
    S.answers={}; await loadRespostas(); render(); return;
  }
});

document.addEventListener("keydown", e=>{
  if(e.key!=="Enter") return;
  if(e.target && e.target.id==="codein"){ const btn=document.querySelector('[data-act="enter"]'); if(btn) btn.click(); }
  if(e.target && e.target.id==="namein"){ const btn=document.querySelector('[data-act="startsurvey"]'); if(btn) btn.click(); }
  const t = e.target.closest && e.target.closest(".tier");
  if(t){ e.preventDefault(); t.click(); }
});

/* ============================== BOOT ============================== */

render();

(async function boot(){
  BACKEND = (CONFIG.BACKEND||"local").toLowerCase();
  if(BACKEND==="supabase") CONFIG.SUPABASE_ANON_KEY = await descobrirChaveAnon();
  if(BACKEND==="supabase" && !(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY)) BACKEND="local";
  if(BACKEND==="sheets" && !CONFIG.SHEETS_URL) BACKEND="local";

  if(BACKEND!=="local"){
    try{
      if(BACKEND==="supabase") await rpc("rxt_get_team", {p_code:"__ping__"});
      else await gs({action:"ping"});
      DBREADY = true;
    }catch(e){
      DBREADY = false;
      console.warn("Backend indisponível — o app segue em modo local. Detalhe:", e.message);
    }
  }

  // Sessão pela URL, como nas demais ferramentas do site:
  //   ?s=comite-exec            -> o participante entra direto
  //   ?s=comite-exec&modo=time  -> facilitador (ainda pede senha para o relatório)
  const params = new URLSearchParams(location.search);
  const qs    = slug(params.get("s") || params.get("time") || "");
  const qmodo = (params.get("modo")||"").toLowerCase();
  if(qs){
    S.sessao = qs;
    S.mode = (qmodo==="time") ? "time" : "responder";
    const ok = await enterTeam(qs, true, params.get("nome") || qs);
    if(ok){
      S.view = S.jaRespondeu ? "me" : "name";
      if(qmodo==="time" && S.facilitador) S.view = "team";
    }
    render();
    return;
  }

  const last = LS.get("rxt_lastcode","");
  if(last && S.view==="home"){
    const t = await getTeam(last);
    if(t){
      S.code=last; S.team=t; await loadRespostas();
      const my = S.respostas.find(r=>r.respId===ME.id && r.rodada===t.rodadaAtual);
      if(my){ S.answers=Object.assign({},my.a); S.nome=my.nome||S.nome; }
    }
  }
  render();
})();

setInterval(async ()=>{
  if((S.view==="team"||S.view==="me") && S.code){
    const before = S.respostas.length;
    await loadRespostas();
    if(S.respostas.length!==before) render();
  }
}, 20000);

})();
</script>
