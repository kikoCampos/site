async function openWith(pw,quiet){
  var btn=document.getElementById("b");btn.disabled=true;
  try{
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.d)));
    try{sessionStorage.setItem(K,"1");sessionStorage.setItem(K+"-k",pw);}catch(x){}
    document.open();document.write(html);document.close();
  }catch(x){btn.disabled=false;if(!quiet){document.getElementById("e").textContent=(PT?"Senha incorreta.":"Incorrect password.");document.getElementById("pw").select();}}
}
