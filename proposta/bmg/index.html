function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var btn=document.getElementById('b'),err=document.getElementById('e'),pw=document.getElementById('pw').value;
  if(!pw) return;
  btn.disabled=true; err.textContent='';
  try{
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var out=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d));
    var html=new TextDecoder().decode(out);
    document.open(); document.write(html); document.close();
  }catch(x){ err.textContent='Senha incorreta.'; btn.disabled=false; document.getElementById('pw').select(); }
});
