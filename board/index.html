", "frente": "Qual a sequência que precede a oferta de sociedade, e quando não oferecê-la?", "verso": "Cultura, informação (números abertos), variável crível e só então sociedade. Em empresas em dificuldade ou mercados que crescem pouco, fica-se na PLR: as pessoas não vão querer ser sócias disso.", "fonte": "Mateus Schaumloffel"}, {"id": "e2c17", "sessao": "e2s3", "frente": "Por que a PLR da StartSe multiplica os fatores em vez de somá-los?", "verso": "Performance × cultura × tempo de casa × relevância, notas de 1 a 5: tudo que multiplica por zero é zero. Quem entrega sem cultura perde muito; na simulação do caderno, o vendedor artista cai de 157 para 81 mil.", "fonte": "Mateus Schaumloffel"}, {"id": "e2c18", "sessao": "e2s3", "frente": "Qual o efeito colateral da fórmula multiplicativa que a simulação revelou?", "verso": "Premia tempo de casa e relevância de forma agressiva: protege a senioridade junto com a cultura e penaliza duas vezes o júnior. Para reter talento jovem, o fator tempo precisa de piso.", "fonte": "Mateus Schaumloffel"}, {"id": "e2c19", "sessao": "e2s3", "frente": "No acordo de sócios, recompra deve ser direito ou obrigação? Por quê?", "verso": "Direito, nunca obrigação: obrigação \"quebra a companhia\". Na pandemia a StartSe perdeu 100% da receita; sem obrigação de recompra, nenhum sócio saiu e a receita voltou em dois meses.", "fonte": "Mateus Schaumloffel"}, {"id": "e2c20", "sessao": "e2s3", "frente": "Onde está \"o fogo\" numa diligência, segundo Mateus?", "verso": "Na remuneração variável. Bônus pago todo ano como se fosse eventual vira salário na Justiça do Trabalho e passivo no valuation. Pejotização é dívida diferida: \"você vai pagar no final\".", "fonte": "Mateus Schaumloffel"}, {"id": "e2c21", "sessao": "e2s3", "frente": "O que levou o RH de Mateus para a mesa de decisão da XP?", "verso": "\"Só participa daquela reunião quem muda a decisão.\" Ele assumiu metas da corporação, custo de pessoal (60% do que se gasta) e aprovação de toda contratação. Nunca pediu orçamento; reduziu as próprias áreas.", "fonte": "Mateus Schaumloffel"}, {"id": "e2c22", "sessao": "e2s4", "frente": "O mercado aplica um family discount? O que Ivan diz que ele desconta?", "verso": "Desconta governança fraca, não família: controle além do voto, minoritários ignorados, família despreparada na liderança, caixa de PJ misturado com PF e dependência do fundador.", "fonte": "Ivan Murias"}, {"id": "e2c23", "sessao": "e2s4", "frente": "O que separa o cisne negro do cisne vermelho?", "verso": "O negro (Taleb) é imprevisível: falha a antecipação. O vermelho (Silvio Meira) é previsível e conhecido, mas se escolhe não tratar: falha a ação. Exemplo central: família bem-sucedida sem governança e sem sucessão.", "fonte": "Ivan Murias"}, {"id": "e2c24", "sessao": "e2s4", "frente": "Que fórum corresponde a cada um dos três círculos, e qual é o chapéu do conselheiro?", "verso": "Família: conselho de família, para união e pertencimento. Propriedade: conselho de sócios, para patrimônio, dividendos, entrada e saída. Negócio: conselho consultivo ou de administração. O lugar inicial do conselheiro é o negócio.", "fonte": "Ivan Murias"}, {"id": "e2c25", "sessao": "e2s4", "frente": "De onde vem a legitimidade do conselho numa família empresária, e o que isso muda na entrada?", "verso": "No capital aberto, da institucionalidade; na família, da confiança construída no tempo. Por isso o conselheiro começa \"por ouvir, ouvir muito\", não descarregando repertório de executivo.", "fonte": "Ivan Murias"}, {"id": "e2c26", "sessao": "e2s4", "frente": "Qual era o risco mais sério do Grupo Gentil, e onde ele estava?", "verso": "No balanço, não na família: toda a riqueza alocada num único ativo, um contrato de franquia rescindível com notificação de 90 dias. Concentração patrimonial é pauta de conselho.", "fonte": "Ivan Murias"}, {"id": "e2c27", "sessao": "e2s4", "frente": "O que travou a saída negociada entre Carlyle e família na Tok&Stok?", "verso": "O múltiplo: o mercado oferecia 10× EBITDA e o fundo queria 15×. A família recusou a proposta de saída conjunta. Para Ivan, pesou o rancor de um investidor que presumiu falta de ambição e preteriu o sucessor interno.", "fonte": "Ivan Murias"}, {"id": "e2c28", "sessao": "e2s4", "frente": "Qual régua as famílias esquecem ao preparar herdeiros?", "verso": "A comportamental, \"a barra esquecida\". Definem a técnica (formação, experiência fora) e esquecem que comportamento se forma \"por modelagem de comportamento ao longo de décadas\".", "fonte": "Ivan Murias"}, {"id": "e2c29", "sessao": "e2s5", "frente": "Como distinguir presença de integração do ESG?", "verso": "Comitê de sustentabilidade ou relatório é presença. Integração aparece no modelo de negócio: o que se ganha, o que se perde e como fazer. Se o tema só entra na pauta com o relatório anual, não está na estratégia.", "fonte": "Vanessa"}, {"id": "e2c30", "sessao": "e2s5", "frente": "Qual o critério de materialidade que Vanessa propõe ao conselheiro?", "verso": "Priorizar, não abraçar: os poucos temas em que a empresa gera impacto e em que é impactada. Biodiversidade é irrelevante num hotel urbano e \"materialidade total\" num hotel nas Cataratas do Iguaçu.", "fonte": "Vanessa"}, {"id": "e2c31", "sessao": "e2s5", "frente": "Por que uma empresa que quase não emite pode estar muito exposta ao clima?", "verso": "Porque o risco depende de onde ela está na cadeia. A armazenagem do agro perde volume com a quebra de safra. O mapa de risco precisa mostrar como um risco potencializa o outro.", "fonte": "Vanessa"}, {"id": "e2c32", "sessao": "e2s5", "frente": "Como o pilar social do ESG deve chegar ao conselho?", "verso": "Como risco: NR-01 e direitos humanos na cadeia de valor. Saúde mental deixa de ser benefício e vira passivo trabalhista, risco financeiro e item da matriz de risco.", "fonte": "Vanessa"}, {"id": "e2c33", "sessao": "e2s5", "frente": "Por que a remuneração variável é etapa obrigatória da jornada ESG, e qual o cuidado?", "verso": "Sem meta ESG no desempenho executivo, \"a gente não vai avançar\". O cuidado vem de Fábio Barbosa, citado por ela: \"A busca pelo bônus é fator de risco.\" O incentivo precisa de critério para não virar o problema.", "fonte": "Vanessa"}, {"id": "e2c34", "sessao": "e2s5", "frente": "Que tipo de decisão legal deveria passar pelo conselho, segundo Vanessa?", "verso": "A eticamente controversa: classificação fiscal agressiva, como o sorvete que vira bebida láctea, ou multa ambiental tratada como modelo de negócio. Passa pela ética antes de passar pelo jurídico.", "fonte": "Vanessa"}, {"id": "e2c35", "sessao": "e2s6", "frente": "Qual o critério de Elisa Prado para separar incidente de crise?", "verso": "Pessoas atingidas. Se uma pessoa é impactada, é crise. Incidente não atinge ninguém e fica dentro da empresa; crise sai do controle e chega aos stakeholders.", "fonte": "Elisa Prado"}, {"id": "e2c36", "sessao": "e2s6", "frente": "Qual o prazo e o formato do primeiro posicionamento numa crise?", "verso": "Uma hora. Nota oficial de um parágrafo: o que ocorreu, o que está acontecendo, o que se vai fazer. Sem dados completos, assume a responsabilidade e promete que os afetados serão os primeiros a saber.", "fonte": "Elisa Prado"}, {"id": "e2c37", "sessao": "e2s6", "frente": "Quem fala na crise, e em que caso o conselho fala?", "verso": "O CEO ou o porta-voz técnico que ele designar; em crise de pessoas, o diretor de RH. O conselho aconselha. Só em vácuo executivo fala o presidente do conselho ou o acionista de referência, depois dos colaboradores.", "fonte": "Elisa Prado"}, {"id": "e2c38", "sessao": "e2s6", "frente": "Qual foi, para Elisa, o erro central de comunicação da Americanas?", "verso": "Falta de liderança: o CEO demissionário como porta-voz e a nota dos acionistas de referência dizendo que não sabiam. O certo seria denúncia, apuração rigorosa, comitê independente e anunciar afastamento do CEO, não renúncia.", "fonte": "Elisa Prado"}, {"id": "e2c39", "sessao": "e2s6", "frente": "Por que o conselheiro costuma ser o último a saber da crise?", "verso": "Por cultura de medo: quem sabe teme ser demitido. Segurança psicológica e canal de escalada são infraestrutura, não clima. A pergunta de entrada: o que tem maior probabilidade e maior impacto?", "fonte": "Elisa Prado"}, {"id": "e2c40", "sessao": "e2s6", "frente": "Nas redes, o que pesa mais para dimensionar uma crise?", "verso": "Relevância antes de volume: quem está falando, quantas pessoas estão falando e qual a relevância delas. Ignorar as redes está entre os erros mais citados.", "fonte": "Elisa Prado"}, {"id": "e2c41", "sessao": "e2s5", "frente": "Qual o status do relatório de sustentabilidade no padrão ISSB para companhias abertas?", "verso": "A CVM 193 o previa obrigatório a partir de 2026. A CVM 244, de 29 de maio de 2026, tornou-o voluntário; a partir de 2027, quem não publicar terá de explicar ao mercado.", "fonte": "Resolução CVM 244/2026"}, {"id": "e2c42", "sessao": "e2s5", "frente": "O que a NR-01 atualizada exige, e desde quando há fiscalização?", "verso": "Inclui riscos psicossociais no gerenciamento de riscos ocupacionais, com fiscalização desde 26 de maio de 2026. A ergonomia do teletrabalho vem sobretudo da NR-17 e do art. 75-E da CLT.", "fonte": "NR-01 (Portaria MTE 1.419/2024)"}, {"id": "e2c43", "sessao": "e2s3", "frente": "Qual o limite legal de pagamentos de PLR?", "verso": "Até dois pagamentos por ano, com intervalo mínimo de um trimestre civil, não de seis meses como dito em aula.", "fonte": "Lei 10.101/2000"}, {"id": "e2c44", "sessao": "e2s2", "frente": "Todo M&A é fato relevante?", "verso": "Não. Pela Resolução CVM 44/2021, depende de materialidade, não do tipo de operação.", "fonte": "Resolução CVM 44/2021"}], "dilemas": [{"id": "e2d1", "titulo": "O bônus por esforço", "sessao": "e2s1", "contexto": "Você é conselheiro independente e integra o comitê de pessoas de uma empresa de serviços de capital fechado. O ano fechou abaixo da meta e a régua do bônus da diretoria não foi atingida. O CEO pede ao conselho um bônus discricionário: o time \"trabalhou muito\", enfrentou um mercado duro e, sem o pagamento, a empresa pode perder gente boa. Dois diretores já receberam propostas de concorrentes. O presidente do conselho tende a aprovar para que o conselho não pareça insensível.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Aprovar o bônus discricionário integral para reter o time num momento difícil.", "qualidade": "fragil", "feedback": "Carlos Júlio tratou exatamente esse pedido: \"Nós vamos tirar dinheiro do acionista para pagar os caras porque eles se esforçaram? Gente, isso é cultura.\" Aprovar ensina à organização que a meta é negociável e que esforço vale tanto quanto resultado. A retenção é um problema real, mas não se resolve pagando a diretoria inteira por um resultado que não veio."}, {"id": "b", "texto": "Negar o bônus e encerrar o tema, mantendo a régua como está.", "qualidade": "aceitavel", "feedback": "A decisão é coerente com Carlos Júlio, que aprendeu \"a remunerar resultado\". Mas ele também alertou que o conselho pode parecer insensível e que é preciso \"tomar muito cuidado com isso\". Negar sem tratar o risco de perder os dois diretores e sem deixar critério para os próximos ciclos protege a cultura e deixa a retenção sem resposta."}, {"id": "c", "texto": "Negar o bônus por esforço, tratar a retenção dos dois diretores com instrumento nominal e propor critério escrito de discricionariedade para os próximos ciclos.", "qualidade": "melhor", "feedback": "Separa as duas decisões que o pedido mistura. O bônus coletivo por esforço é decisão cultural, e a regra do caderno para o comitê de pessoas é clara: discricionariedade exige critério escrito antes, não justificativa depois. A retenção de pessoas-chave é um risco específico e merece instrumento específico. Assim o conselho preserva o sinal de que a empresa remunera resultado, como defendeu Carlos Júlio."}, {"id": "d", "texto": "Aprovar metade do bônus agora e rebaixar a meta do próximo ano para tornar o alvo alcançável.", "qualidade": "fragil", "feedback": "É a pior combinação: paga o esforço e ainda muda a régua depois do jogo. Carlos Júlio lembrou que a primeira decisão de Amorim na Telesp foi trocar o bônus para remunerar o que a estratégia exigia. Rebaixar a meta para caber no desempenho faz o bônus remunerar o hábito antigo, e a rádio peão vai entender o recado."}]}, {"id": "e2d2", "titulo": "A provisão que derruba o bônus", "sessao": "e2s2", "contexto": "Você é conselheiro de uma indústria de boa reputação. Ao ler as notas explicativas, encontra uma contingência ambiental sem provisão, embora o laudo técnico indique remediação provável. Quando pergunta, o diretor financeiro reage com irritação. Você descobre que a provisão integral derrubaria o bônus do CEO, calculado sobre o lucro. O auditor não apontou o tema. As demonstrações serão aprovadas amanhã, e o presidente do conselho, amigo do CEO, pede que você não crie tensão às vésperas do fechamento.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Exigir que conste em ata o ponto de atenção com fato, risco e recomendação de provisão, escalar ao presidente e levar ao comitê de remuneração as metas que dependem de estimativas contábeis.", "qualidade": "melhor", "feedback": "É o roteiro de Clairton Araujo: \"Tem que registrar em ata. Doa quem doer.\" No caso dele, a reação agressiva foi o sinal (\"Ah, doeu? Doeu? Magoou? Então aí tem\") e o motivo era o bônus do CEO. Ele escalou e pôs o cargo na mesa. Tratar também o incentivo fecha a causa: quando a variável depende de provisão, o conselho paga para o número ficar bonito."}, {"id": "b", "texto": "Aprovar as demonstrações e pedir ao auditor que examine o tema no próximo trimestre.", "qualidade": "fragil", "feedback": "Clairton abriu a aula com o argumento contrário: \"As auditorias não são pagas para te dar 100% de garantia nas coisas.\" O dever de ler é do conselheiro. Se a empresa entrar em dificuldade, a pergunta será a que ele citou: \"cadê o conselho que não viu?\" Adiar sem registro deixa o conselheiro sem proteção e mantém o número errado."}, {"id": "c", "texto": "Abster-se na votação, sem justificativa registrada, para não romper a relação com o presidente.", "qualidade": "fragil", "feedback": "A abstenção silenciosa não protege nem a empresa nem o conselheiro. Clairton foi explícito: vale também quando quem convidou é amigo do presidente, \"Não interessa.\" E descreveu o conselheiro que não polemiza, ganha \"umas quarentinha por mês\" e segue o baile: \"não foi para isso que eu estudei\". Sem registro, não há ponto de atenção."}, {"id": "d", "texto": "Aceitar uma provisão escalonada ao longo de alguns anos, desde que o critério e o cálculo constem em ata.", "qualidade": "aceitavel", "feedback": "Foi a saída negociada no caso de Clairton: 10% ao ano por cinco anos, com registro. É uma solução defensável quando a provisão integral é inviável no curto prazo. Mas, sozinha, não ataca a causa que ele apontou: \"O bônus do CEO é sempre em cima do resultado.\" Sem rever o incentivo, a próxima estimativa sofrerá a mesma pressão."}]}, {"id": "e2d3", "titulo": "O fundo à porta", "sessao": "e2s4", "contexto": "Você é conselheiro independente de uma rede varejista de segunda geração, com conselho consultivo há dois anos. Um fundo de private equity propõe comprar 60% da empresa, com o fundador na gestão por três anos. O plano do fundo promete acelerar a receita e reduzir o estoque pela metade. O irmão que dirige a área comercial há vinte anos, visto como sucessor natural, não aparece no plano. A irmã, sócia fora da operação, quer vender; o irmão, não. A discussão já tomou o almoço de domingo.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Recomendar a venda: o preço é bom e o fundo traz ambição e gestão profissional.", "qualidade": "fragil", "feedback": "Ivan Murias descreveu essa premissa como o erro típico do private equity em família empresária: \"partir da premissa de que faltava ambição naquela família e que eu sei o que precisa ser feito\". Cortar estoque sem entender o modelo pode quebrar a cadeia, como no exemplo da Serra Gaúcha. Na Tok&Stok, o sucessor interno foi preterido e a história terminou mal."}, {"id": "b", "texto": "Sugerir um assessor financeiro para negociar o melhor múltiplo antes de qualquer outra discussão.", "qualidade": "aceitavel", "feedback": "Preço importa, mas Ivan mostrou na Tok&Stok que o impasse não foi só de planilha: o mercado oferecia 10× EBITDA, o fundo queria 15×, e pesou o rancor. Valuation se negocia em planilha; rancor, não. Começar pelo múltiplo ignora a sucessão interna, a divergência entre os irmãos e a proteção do modelo de negócio depois da venda."}, {"id": "c", "texto": "Deixar que o fundador decida, como sempre fez, e apoiar a decisão dele.", "qualidade": "fragil", "feedback": "É a decisão fora do fórum certo, o \"se vovô Antônio fala pra não fazer, é melhor não fazer\" que Ivan usou para ilustrar a governança atravessada por hierarquia. Mantém a dependência do fundador, um dos sinais do desconto por governança fraca, e deixa os irmãos sem espaço legítimo para divergir. O conflito vai continuar no almoço de domingo."}, {"id": "d", "texto": "Separar os fóruns: preço, saída e patrimônio no conselho de sócios; no conselho do negócio, exigir que o acordo proteja o modelo, a sucessão interna e a saída de ambos, depois de ouvir cada sócio.", "qualidade": "melhor", "feedback": "Aplica os três círculos de Ivan Murias: venda de controle é tema de propriedade, e o chapéu do conselheiro é o negócio. A pergunta que ele deixou para a mesa é exatamente esta: o que no acordo protege o modelo de negócio, a sucessão interna e a saída de ambos? E começa ouvindo, porque na família a legitimidade do conselho vem da confiança."}]}, {"id": "e2d4", "titulo": "Legal, mas é ético?", "sessao": "e2s5", "contexto": "Você é conselheiro independente de uma indústria de alimentos de capital aberto. O diretor tributário apresenta uma reclassificação fiscal de um produto que reduz de forma relevante a carga de impostos. O parecer jurídico é favorável. O CFO lembra que concorrentes fazem o mesmo e que a meta de EBITDA, base do bônus da diretoria, depende dessa economia. Um colega de conselho resume que o erro é do governo, não da empresa. O tema chegou como item informativo, sem deliberação.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Aceitar como informativo: é legal, tem parecer e é decisão da diretoria.", "qualidade": "fragil", "feedback": "Vanessa discutiu o caso do sorvete que vira bebida láctea e concordou que o erro é do governo, mas manteve o ponto: \"aqui são dilemas éticos ou morais que eles passam ou deveriam passar pelo conselho\". Tratar como informativo é a cegueira ética que ela descreveu: \"a gente sempre fez dessa forma e sempre funciona\", até o mundo mudar."}, {"id": "b", "texto": "Pedir que o tema vire item de deliberação, com análise de risco reputacional e regulatório, e que o comitê de remuneração avalie se a meta do bônus está empurrando a decisão.", "qualidade": "melhor", "feedback": "Leva ao colegiado o que Vanessa disse que deveria passar por ele e o examina pelo modelo de negócio: o que se ganha, o que se perde e como. Olhar o bônus fecha o circuito com Fábio Barbosa, citado por ela: \"A busca pelo bônus é fator de risco.\" Decisão legal pode ser decisão de conselho, e passa pela ética antes do jurídico."}, {"id": "c", "texto": "Vetar a reclassificação por princípio, independentemente da análise.", "qualidade": "aceitavel", "feedback": "A direção tem apoio em Vanessa: \"A gente tem que ter coragem de conduzir o negócio da maneira correta, porque é correto.\" Mas vetar sem análise pula o que ela pediu ao conselheiro: critério de priorização e as perguntas certas dentro do colegiado. Um veto sem fundamento registrado tende a ser revertido e não muda o incentivo que produziu a proposta."}, {"id": "d", "texto": "Aprovar e reforçar a divulgação de práticas ESG no próximo relatório de sustentabilidade.", "qualidade": "fragil", "feedback": "É confundir presença com integração, o erro central que Vanessa apontou: \"O fato da ESG estar presente não significa que ela está sendo integrada de uma estratégia de negócio.\" Ela também lembrou que ESG não é \"atestado de santidade\". Um relatório mais vistoso não resolve uma decisão eticamente controversa; pode agravá-la se o tema vier a público."}]}, {"id": "e2d5", "titulo": "A primeira hora", "sessao": "e2s6", "contexto": "Você é conselheiro independente de uma rede de varejo. Às 19h, um vídeo de um gerente humilhando uma funcionária viraliza; uma influenciadora de grande alcance compartilha e surge a denúncia de que não foi a primeira vez. O CEO liga: quer esperar a apuração completa e discutir na reunião do conselho de quinta-feira. O presidente do conselho recebeu ligação de um jornalista e pensa em responder ele mesmo. A empresa não tem comitê de crise formal nem porta-vozes definidos.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Concordar com o CEO: sem dados completos, é melhor não falar até a apuração terminar.", "qualidade": "fragil", "feedback": "Elisa Prado foi direta: se não se responde em uma hora, \"você perde o bonde\", e \"se você não contar a sua história, alguém vai contar\". Há uma pessoa impactada, portanto é crise, não incidente. A falta de dados não justifica silêncio: a primeira nota assume a responsabilidade e promete que os afetados serão os primeiros a saber."}, {"id": "b", "texto": "Recomendar que o presidente do conselho dê a entrevista, para mostrar que o tema chegou ao topo.", "qualidade": "fragil", "feedback": "Elisa Prado listou esse como erro típico: o presidente do conselho falando por conta própria. \"O conselho não fala, então. Quem fala é o executivo, é o CEO que deve ser o porta-voz ou alguém que ele definir.\" O presidente só assume em vácuo de liderança executiva, e não é o caso. O conselheiro está \"na fase do aconselhamento\" e não põe a mão na crise."}, {"id": "c", "texto": "Aconselhar o CEO a publicar em uma hora nota de um parágrafo que assume a responsabilidade, informa as medidas imediatas e promete retorno, com o diretor de RH como porta-voz e os colaboradores informados antes.", "qualidade": "melhor", "feedback": "Segue o passo a passo de Elisa Prado: nota oficial de um parágrafo (o que ocorreu, o que está acontecendo, o que se vai fazer) dentro da janela de uma hora. Em crise de pessoas, o porta-voz é \"um diretor de recursos humanos\", e os colaboradores são o primeiro veículo da crise. O conselho aconselha e cobra apuração, sem falar pela empresa."}, {"id": "d", "texto": "Convocar reunião extraordinária do conselho para a manhã seguinte e aprovar a nota ali.", "qualidade": "aceitavel", "feedback": "Envolver o conselho é legítimo, mas a janela já terá passado. A pergunta que Elisa Prado deixou para a mesa é justamente quem aprova a primeira nota sem esperar a próxima reunião, e se a empresa consegue fazer isso em uma hora. Sem comitê de crise e porta-vozes definidos, esta é também a hora de registrar que esse preparo precisa existir."}]}], "exercicios": [{"id": "e2x1", "num": 1, "titulo": "Teste dos seis atributos", "base": "Carlos Júlio", "instrucao": "Antes de executar uma ação simbólica, pontue cada atributo de 0 a 2 e escreva a evidência. Abaixo de 9 em 14, ou com zero em \"autêntica\" ou em \"razão de mercado\", não execute.", "campos": [{"id": "f1", "label": "Ação simbólica que você pretende executar", "linhas": 2}, {"id": "f2", "label": "Autêntica e líder protagonista: nota de 0 a 2 e evidência (crença real e antiga? o líder está fisicamente na história, com custo pessoal?)", "linhas": 3}, {"id": "f3", "label": "Ruptura e razão de mercado: nota e evidência (que regra, privilégio ou símbolo ela quebra? qual o motivo, em uma frase com número?)", "linhas": 3}, {"id": "f4", "label": "Coração, teatral e gera histórias: nota e evidência (com que identidade conversa? quem vai recontar no café amanhã, com que frase? que história um gerente poderá criar?)", "linhas": 4}, {"id": "f5", "label": "Total em 14 e decisão: executar, ajustar ou descartar", "linhas": 2}]}, {"id": "e2x2", "num": 2, "titulo": "Mapa de traços × estratégia", "base": "Carlos Júlio", "instrucao": "Liste os comportamentos que a estratégia exige e o traço atual que os bloqueia. Para cada um, identifique a história e o símbolo que sustentam o traço e desenhe a ação do líder que gera a história oposta.", "campos": [{"id": "f1", "label": "Comportamento que a estratégia exige (ex.: experimentar)", "linhas": 2}, {"id": "f2", "label": "Traço atual que o bloqueia (ex.: erro = demissão)", "linhas": 2}, {"id": "f3", "label": "História que circula hoje e símbolo que sustenta o traço", "linhas": 3}, {"id": "f4", "label": "Ação do líder que gera a história oposta", "linhas": 3}]}, {"id": "e2x3", "num": 3, "titulo": "Inventário de privilégios", "base": "Carlos Júlio (caso Telesp)", "instrucao": "Liste privilégios e canais exclusivos da liderança, como a Golden Line da Telesp e o \"aquário de vidro\" da Bayer. Escolha um para eliminar com teatralidade e acompanhe por 60 dias se a história circulou; só então formalize em política.", "campos": [{"id": "f1", "label": "Privilégios ou canais exclusivos existentes e quem tem cada um", "linhas": 4}, {"id": "f2", "label": "O que o executivo deixa de ver por causa deles", "linhas": 3}, {"id": "f3", "label": "O privilégio que você eliminaria e como, com teatralidade", "linhas": 3}, {"id": "f4", "label": "Como saber, em 60 dias, se a história circulou", "linhas": 2}]}, {"id": "e2x4", "num": 4, "titulo": "O painel dos dez em cinco anos", "base": "Clairton Araujo", "instrucao": "Escolha uma empresa aberta, ou a líder aberta do setor de uma empresa fechada, e preencha os dez indicadores para cinco anos. O que importa é a tendência, não o número isolado.", "campos": [{"id": "f1", "label": "Empresa escolhida e por quê", "linhas": 2}, {"id": "f2", "label": "Margens bruta, EBITDA e líquida e FCO ÷ lucro líquido, do ano −4 ao ano 0", "linhas": 4}, {"id": "f3", "label": "ROIC − custo de capital, dívida líquida ÷ EBITDA, cobertura de juros e liquidez corrente, do ano −4 ao ano 0", "linhas": 4}, {"id": "f4", "label": "Prazos de estoque e de recebimento, em dias, e as tendências que chamam atenção", "linhas": 3}, {"id": "f5", "label": "Os três principais riscos desta empresa, em uma página", "linhas": 4}]}, {"id": "e2x5", "num": 5, "titulo": "Redação do registro em ata", "base": "Clairton Araujo", "instrucao": "Escreva um registro em ata a partir de uma situação real ou do caso ambiental da sessão 2.2. Um registro bom tem quatro partes: fato, ponto de atenção, recomendação e posição.", "campos": [{"id": "f1", "label": "Fato: o que foi apresentado, com número e data", "linhas": 2}, {"id": "f2", "label": "Ponto de atenção: o risco identificado, sem adjetivo", "linhas": 2}, {"id": "f3", "label": "Recomendação: o que foi sugerido, a quem e com que prazo", "linhas": 2}, {"id": "f4", "label": "Posição: voto, abstenção ou ressalva, com a justificativa", "linhas": 2}, {"id": "f5", "label": "Em que ponto você escala ao presidente do conselho, e em que ponto sai", "linhas": 3}]}, {"id": "e2x6", "num": 6, "titulo": "Simulador da PLR multiplicativa", "base": "Mateus Schaumloffel", "instrucao": "Compare a distribuição de um pool de R$ 1 milhão entre seis perfis fictícios, primeiro somando os quatro fatores e depois multiplicando-os, como na StartSe. Decida qual desenho reflete a cultura que a empresa diz ter e o que você mudaria.", "campos": [{"id": "f1", "label": "Quem ganha e quem perde ao trocar soma por produto, e por quê", "linhas": 3}, {"id": "f2", "label": "Qual desenho reflete a cultura que a empresa diz ter", "linhas": 3}, {"id": "f3", "label": "O que você mudaria na fórmula (pesos, piso para tempo de casa, critério de relevância)", "linhas": 3}]}, {"id": "e2x7", "num": 7, "titulo": "Partnership em uma página", "base": "Mateus Schaumloffel", "instrucao": "Para uma empresa real, familiar de médio porte e com EBITDA positivo, decida cada item do desenho e justifique. Depois, teste o desenho contra o caso do deck: \"coloquei uma pessoa de sócia e depois de um ano vi que ela não estava alinhada\".", "campos": [{"id": "f1", "label": "Pré-requisitos (transparência e PLR existem?) e tipo societário (Ltda ou S.A.)", "linhas": 3}, {"id": "f2", "label": "Instrumento (ação, RSU, opção ou phantom), valuation de entrada e saída e forma de pagamento", "linhas": 3}, {"id": "f3", "label": "Proteção ao erro nos primeiros anos e recompra: direito ou obrigação, preço e data de referência", "linhas": 3}, {"id": "f4", "label": "Família, morte e divórcio; quem decide, com que periodicidade e critério", "linhas": 3}, {"id": "f5", "label": "O desenho resiste ao sócio que, um ano depois, se mostrou desalinhado?", "linhas": 3}]}, {"id": "e2x8", "num": 8, "titulo": "Diligência de pessoas e remuneração em 30 minutos", "base": "Clairton Araujo e Mateus Schaumloffel", "instrucao": "Aplique a lista em um M&A ou num convite para conselho. Para cada item, peça o documento indicado, procure o sinal de alerta e registre o achado.", "campos": [{"id": "f1", "label": "Remuneração variável e bônus da diretoria: política, acordo de PLR, histórico e dependência de estimativas contábeis", "linhas": 3}, {"id": "f2", "label": "Vínculos, contingências trabalhistas e segurança do trabalho: PJ por função, provisões e acidentes", "linhas": 3}, {"id": "f3", "label": "Acordo de acionistas: saída, recompra e família", "linhas": 2}, {"id": "f4", "label": "Consequência da avaliação e, se M&A, plano de retenção de pessoas-chave", "linhas": 3}, {"id": "f5", "label": "Principais achados e o que levar à mesa", "linhas": 3}]}, {"id": "e2x9", "num": 9, "titulo": "Os três círculos de uma família empresária", "base": "Ivan Murias", "instrucao": "Para uma família que você conhece, ou de uma empresa em que quer uma cadeira, posicione cada pessoa nos círculos e no fórum em que tem voz. O que interessa são as assimetrias: quem decide fora do fórum certo, quem não tem fórum e onde mora a tensão.", "campos": [{"id": "f1", "label": "Pessoas, círculos (família, propriedade, negócio), fórum em que têm voz e tensão ou risco", "linhas": 5}, {"id": "f2", "label": "Em que esporte esta família joga (tênis, basquete, futebol ou futebol americano), e a governança acompanha?", "linhas": 2}, {"id": "f3", "label": "O lugar do fundador daqui a três anos", "linhas": 2}, {"id": "f4", "label": "O cisne vermelho desta família: o risco sabido que ninguém trata", "linhas": 2}]}, {"id": "e2x10", "num": 10, "titulo": "Materialidade relâmpago e o painel do S", "base": "Vanessa", "instrucao": "Parte A: liste os temas, classifique onde a empresa gera impacto e onde é impactada, e fique com três a cinco. Parte B: monte o painel trimestral do pilar social, com no máximo seis indicadores e o gatilho que leva cada um ao conselho.", "campos": [{"id": "f1", "label": "Parte A: temas, com grau de impacto gerado e sofrido (alto, médio, baixo)", "linhas": 4}, {"id": "f2", "label": "Parte A: os três a cinco temas materiais e a pergunta para a próxima reunião", "linhas": 3}, {"id": "f3", "label": "Parte B: até seis indicadores do S (ex.: afastamentos por saúde mental, acidentes, turnover em posições-chave, condições em terceiros, variável ligada a ESG, riscos psicossociais da NR-01), com fonte e frequência", "linhas": 4}, {"id": "f4", "label": "Parte B: o gatilho que leva cada indicador ao conselho", "linhas": 3}]}, {"id": "e2x11", "num": 11, "titulo": "A primeira hora e o meu protocolo de conselheiro", "base": "Elisa Prado", "instrucao": "Parte A: com um cenário real ou imaginado, como um vídeo viral de um funcionário, uma denúncia de assédio contra um diretor ou um recall, responda em uma hora o que a sala respondeu em vinte minutos. Parte B: escreva o protocolo pessoal que você segue como conselheiro quando a crise chega.", "campos": [{"id": "f1", "label": "Parte A: cenário. É incidente ou crise? Quantas pessoas foram atingidas?", "linhas": 2}, {"id": "f2", "label": "Parte A: quem fala (CEO, porta-voz técnico ou presidente do conselho) e a ordem dos stakeholders", "linhas": 2}, {"id": "f3", "label": "Parte A: a nota em um parágrafo (o que ocorreu, o que está acontecendo, o que faremos) e o que nunca dizer", "linhas": 4}, {"id": "f4", "label": "Parte B: o que nunca faço como conselheiro em crise e as três perguntas que levo ao conselho quando vejo o risco", "linhas": 3}, {"id": "f5", "label": "Parte B: quando aceito ser porta-voz e como registro discordância em ata", "linhas": 3}]}], "glossario": [{"termo": "Story building", "def": "Fazer coisas que gerem histórias, em vez de contar o que foi feito. O líder é protagonista, não narrador."}, {"termo": "Traço cultural", "def": "Um comportamento específico e recorrente que apoia ou sabota uma estratégia, como aversão ao erro, ownership ou hierarquia."}, {"termo": "DFC", "def": "Demonstração dos fluxos de caixa. No método indireto, parte do lucro e chega à variação do caixa."}, {"termo": "DMPL", "def": "Demonstração das mutações do patrimônio líquido. Explica o que, além do lucro, mudou o PL."}, {"termo": "EBITDA ajustado", "def": "EBITDA com exclusões definidas pela administração. Não segue padrão contábil; exige conciliação."}, {"termo": "ROIC × WACC", "def": "Retorno sobre o capital investido comparado ao custo médio ponderado de capital. ROIC menor destrói valor."}, {"termo": "Covenant", "def": "Cláusula contratual de dívida que fixa limites de indicadores; violá-la pode antecipar o vencimento."}, {"termo": "Ciclo financeiro", "def": "Prazo de estoque + prazo de recebimento − prazo de pagamento. O período que a empresa financia sozinha."}, {"termo": "Earnout", "def": "Parte do preço de uma aquisição condicionada a metas futuras."}, {"termo": "Partnership", "def": "Modelo em que executivos relevantes compram participação real e passam a ganhar e perder com o dono."}, {"termo": "Sociedade viva", "def": "Participação que circula: quem entrega compra, quem não entrega vende, inclusive o maior sócio."}, {"termo": "Cliff", "def": "Período inicial em que a participação pode ser recomprada por valor protegido, não de mercado."}, {"termo": "Vesting", "def": "Liberação progressiva de uma participação ao longo do tempo ou contra metas."}, {"termo": "RSU", "def": "Restricted stock unit: ação concedida com restrição de vesting."}, {"termo": "Stock option", "def": "Direito de comprar ação no futuro a preço fixado hoje."}, {"termo": "Phantom share", "def": "Direito contratual a pagamento em dinheiro atrelado ao valor da ação, sem participação societária."}, {"termo": "Call", "def": "Direito do controle de comprar a participação de um sócio nas condições do acordo."}, {"termo": "Relevância", "def": "Na PLR da StartSe, o peso da pessoa nas decisões: quem você leva à reunião ou à viagem."}, {"termo": "Hipersuficiente", "def": "Empregado com diploma superior e salário igual ou superior a duas vezes o teto do INSS, com maior liberdade contratual."}, {"termo": "Família empresária", "def": "A família como substantivo e a empresa como adjetivo; substitui o rótulo \"empresa familiar\"."}, {"termo": "Três círculos", "def": "Família, propriedade e negócio (Davis e Tagiuri). Cada círculo pede um fórum próprio."}, {"termo": "Conselho de família", "def": "Fórum de união e pertencimento; não decide o negócio."}, {"termo": "Conselho de sócios", "def": "Fórum de patrimônio, dividendos, entrada e saída de sócios."}, {"termo": "Protocolo de família", "def": "Consenso entre gerações sobre as regras que preservam as relações."}, {"termo": "Poor governance discount", "def": "Desconto de valuation por governança fraca, não por ser família."}, {"termo": "Cisne vermelho", "def": "Risco previsível e conhecido que se escolhe não tratar (Silvio Meira)."}, {"termo": "Materialidade", "def": "Os poucos temas em que a empresa gera impacto ou é impactada de forma relevante."}, {"termo": "Escopo 3", "def": "Emissões indiretas da cadeia de valor, fora da operação própria."}, {"termo": "Green premium", "def": "Preço adicional que clientes pagam por uma solução de menor emissão."}, {"termo": "Readiness", "def": "Preparo antecipado para a crise: matriz, comitê, porta-voz, simulado."}, {"termo": "Holding statement", "def": "Primeira nota sem dados completos: assume a responsabilidade e promete resposta."}, {"termo": "Cauda longa", "def": "A permanência de uma crise em buscadores e assistentes de IA, muito depois da janela quente."}], "normas": [{"nome": "Lei 6.404/76, art. 176, §6º", "sobre": "Dispensa a DFC para companhia fechada com PL abaixo de R$ 2 milhões. Relevante para a DFC como peça central de leitura (Clairton).", "status": ""}, {"nome": "Lei 6.404/76, art. 202", "sobre": "Dividendo mínimo obrigatório. Sustenta a pergunta da DMPL no laboratório do caso teórico.", "status": ""}, {"nome": "Lei 6.404/76, art. 158", "sobre": "Responsabilidade do administrador. Fundamenta o \"cadê o conselho que não viu?\" de Clairton.", "status": ""}, {"nome": "CPC 03 (R2) / IAS 7", "sobre": "Demonstração dos fluxos de caixa, pelos métodos direto e indireto.", "status": ""}, {"nome": "CPC 25 / IAS 37", "sobre": "Provisões, passivos e ativos contingentes. Base do passivo ambiental e trabalhista discutido por Clairton.", "status": ""}, {"nome": "CPC 15 / IFRS 3", "sobre": "Combinação de negócios, incluindo contraprestação contingente (earnout).", "status": ""}, {"nome": "Resolução CVM 44/2021", "sobre": "Fato relevante depende de materialidade, não do tipo de operação.", "status": "Corrige a afirmação de que todo M&A é fato relevante."}, {"nome": "Lei 10.101/2000, art. 3º, §2º", "sobre": "PLR: até dois pagamentos por ano, com intervalo mínimo de um trimestre civil.", "status": "Intervalo vigente desde a Lei 12.832/2013; corrige os seis meses ditos em aula."}, {"nome": "CLT, art. 444, parágrafo único", "sobre": "Empregado hipersuficiente: diploma de nível superior e salário igual ou superior a duas vezes o teto do INSS.", "status": "Corrige o critério de \"mais de 10 mil reais\" dito em aula."}, {"nome": "Lei 3.207/57, arts. 3º e 7º", "sobre": "Comissão é exigível com a venda ultimada; estorno só por insolvência. Relevante no caso da área comercial da StartSe.", "status": ""}, {"nome": "Código Civil, art. 1.052", "sobre": "Na Ltda, a responsabilidade do sócio é limitada ao capital.", "status": "A exposição prática vem da desconsideração da personalidade jurídica."}, {"nome": "Resolução CVM 193/2023", "sobre": "Adotou o padrão ISSB para o relatório de sustentabilidade, previsto como obrigatório a partir de 2026.", "status": "Alterada pela CVM 244/2026; não citada em aula."}, {"nome": "Resolução CVM 244/2026", "sobre": "Tornou voluntário o relatório de sustentabilidade no padrão ISSB.", "status": "De 29/05/2026; a partir de 2027, quem não publicar explica ao mercado. Não citada em aula."}, {"nome": "NR-01 (Portaria MTE 1.419/2024)", "sobre": "Inclui riscos psicossociais no gerenciamento de riscos ocupacionais. A única norma citada em aula no Dia 2.", "status": "Em fiscalização desde 26/05/2026."}, {"nome": "NR-17 e CLT, art. 75-E", "sobre": "Ergonomia e responsabilidade do empregador no teletrabalho.", "status": "Base da ergonomia do home office, não a NR-01."}, {"nome": "Portaria CVS 3/2026 (SP)", "sobre": "Condimentos em porção individual em restaurantes, o caso das bisnagas.", "status": "Prazo adiado para 01/02/2027; não é lei."}, {"nome": "Regulamento UE 2025/40", "sobre": "Embalagens: veta porções individuais no setor de alimentação fora do lar.", "status": "A partir de 2030."}, {"nome": "Emenda Constitucional 83/2014", "sobre": "Prorroga a Zona Franca de Manaus.", "status": "Até 2073."}], "acoes": ["Fazer o Exercício 4 com uma empresa aberta do setor em que quero uma cadeira.", "Montar um modelo próprio de mapa de risco em uma página, com os três riscos principais.", "Baixar e arquivar os modelos de acordo de acionistas e de PLR da área do aluno.", "Escrever minha tese sobre peso de cultura na remuneração variável do C-level.", "Ler O Segredo da Mudança de Cultura e mapear duas histórias minhas nos seis atributos.", "Transformar o Exercício 8 em produto: diligência de pessoas e remuneração para conselhos e fundos.", "Fazer o Exercício 9 com uma família empresária que conheço.", "Montar o painel do S com seis indicadores (Exercício 10).", "Escrever meu protocolo pessoal de comunicação como conselheiro (Exercício 11).", "Ter pronto, em três frases, como falo das crises das empresas em que trabalhei."], "checklist_crise": [{"fase": "Prevenção", "componente": "Mapeamento de riscos", "pergunta": "Existe matriz de riscos reputacionais, com os riscos altos identificados?"}, {"fase": "Prevenção", "componente": "Avaliação", "pergunta": "A matriz é simples o bastante para orientar a mitigação?"}, {"fase": "Prevenção", "componente": "Gerenciamento", "pergunta": "Cada risco alto tem mitigação, detecção e revisão com dono definido?"}, {"fase": "Preparação", "componente": "Segurança e monitoramento", "pergunta": "Há monitoramento de reclamações, redes e imprensa, com critério de relevância?"}, {"fase": "Preparação", "componente": "Comitê de crise", "pergunta": "Papéis definidos, porta-vozes por tipo de crise, simulado nos últimos 12 meses?"}, {"fase": "Resposta", "componente": "Primeira hora", "pergunta": "Quem aprova a nota de um parágrafo sem esperar reunião?"}, {"fase": "Resposta", "componente": "Sequência de stakeholders", "pergunta": "A ordem está escrita e conciliada com as regras de fato relevante?"}, {"fase": "Resposta", "componente": "Lições aprendidas", "pergunta": "A última crise gerou mudança registrada?"}]}}</script>
<script type="application/json" id="full">{"e1": [{"num": "2.1", "head": "2.1  Carlos Júlio — Transformação de carreira e o papel do conselheiro na era da IA", "blocks": [{"t": "h3", "h": "Ficha do professor"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória, conforme dita em aula<\/strong>"], "rows": [["Docência", "“Dia 8 de agosto agora eu vou fazer 46 anos de sala de aula.” Mais de 30 anos na FGV; também na USP. Curador do Board Program da StartSe."], ["Palestras", "Fazia 120 por ano, sendo ao menos 80 fora de São Paulo — duas viagens por semana durante 30 anos. Reduziu deliberadamente para 40 por ano."], ["Conselhos", "Primeiro conselho em março de 1986 — 40 anos de atuação. Presidente do Conselho da Patrus (MG). Conselheiro da Camil há 21 anos. Montou o conselho consultivo da Tecnisa para a família Nigri (IPO em 2009)."], ["Empresas familiares", "“Uma das minhas trajetórias profissionais é a mentoria de famílias empresárias.” Criou, em 2001, o primeiro curso de herdeiros para o Credit Suisse, realizado em Zurique e Zug, duas vezes por ano."], ["Autoria", "Quatro livros lançados em 16 de março (2020), entre eles um sobre gestão do tempo."], ["Rotina de estudo", "“Eu vou duas vezes por ano à China.”"]]}, {"t": "h3", "h": "A tese"}, {"t": "p", "h": "Carlos Júlio abriu o programa com uma sessão que é, na prática, três coisas ao mesmo tempo: uma narrativa pessoal de reposicionamento de carreira sênior, uma taxonomia do conselheiro brasileiro e um argumento sobre por que a IA reabriu o jogo para profissionais experientes. Os três se encaixam."}, {"t": "p", "h": "A narrativa pessoal começa com a parada abrupta da pandemia — fim dos palcos, dos aeroportos, dos aplausos:"}, {"t": "quote", "q": "E de repente, naquela experiência de uma hora para outra, para de ir para o aeroporto, para de estar nos palcos, para de receber aplausos, mas também para de montar conteúdos, slides para cá, PPTs para lá — eu comecei a gostar de mim mesmo.", "by": "CARLOS JÚLIO, NA PRIMEIRA FRASE DA GRAVAÇÃO"}, {"t": "p", "h": "Ele havia rejeitado o conceito de ócio criativo de Domenico De Masi por autoimagem: “como eu me julgava ser um homem de negócios, e negócio significa negar o ócio, sempre fui muito agitadinho”. A virada veio de fora — de uma jornalista da Globo News que lhe disse que, com todo mundo em casa, o conteúdo dele havia ficado mais relevante."}, {"t": "box", "kind": "leitura", "title": "O INSIGHT DE REPOSICIONAMENTO VEIO DE FORA", "items": [{"h": "<em>“E eu não tinha percebido isso.”<\/em>"}, {"h": "Duas câmeras, 12 aulas de três minutos gravadas em casa — “tem aula até na cozinha” — subidas à Hotmart. O livro correspondente vendeu cerca de 3 mil exemplares; o curso vendeu mais de 30 mil. E então a pergunta que organiza toda transição:"}, {"h": "<strong><em>“Mas aí vem o segundo momento: o que eu vou colocar no lugar?”<\/em><\/strong>"}]}, {"t": "p", "h": "Ele foi honesto também sobre a parte que ninguém conta — a ansiedade patrimonial da transição: “Quando a tua gerente fala assim: ‘Senhor Júlio, você vai baixar mais uma aplicação aqui? Para onde você está levando?’ Não é legal.” E sobre o ego: “Eu preciso do palco. Não tenho nenhum problema de dizer isso, porque ego e vaidade todos temos. A questão é como é que você gerencia isso.”"}, {"t": "h3", "h": "As três missões indelegáveis do conselho"}, {"t": "p", "h": "A formulação mais importante da sessão para quem vem de RH. Ele não usa a palavra “responsabilidade” — usa “é seu, não dá para passar para ninguém”."}, {"t": "cap", "h": "As três missões indelegáveis do conselho, segundo Carlos Júlio"}, {"t": "table", "head": ["<strong>Missão<\/strong>", "<strong>Formulação literal<\/strong>"], "rows": [["<strong>Perenidade<\/strong>", "<em>“Nós, conselheiros, somos os responsáveis pela perpetuidade do negócio.”<\/em>"], ["<strong>Estratégia<\/strong>", "<em>“Responsáveis pelo desenho e pela entrega da estratégia.”<\/em>"], ["<strong>Cultura<\/strong>", "<em>“E nós, conselheiros e conselheiras, somos responsáveis pela cultura da organização. Não só a cultura que nos trouxe até aqui, mas o que nós precisamos fazer é que as novas estratégias sejam entregues.”<\/em>"], ["", "<strong>A FRASE MAIS ÚTIL DO PROGRAMA<\/strong><br><strong><em>“É seu, mané. É seu, não dá para passar para ninguém.”<\/em><\/strong><br>Ele emenda com o clichê de Drucker — “a cultura come a estratégia no café da manhã” — e, dois minutos depois, faz a ressalva intelectualmente honesta: “Nunca disse isso. Mas todo mundo disse que ele disse, então eu também comprei aqui a brincadeira.”<br><strong>O ponto prático: <\/strong>se cultura é missão indelegável do conselho e não do RH, então quem sabe operar cultura tem assento a reivindicar — não um favor a pedir."]]}, {"t": "quote", "q": "O nosso mantra de conselheiro é: nose in, hands out. É ele que pilota aquele avião. O que a gente pode fazer é fazer as perguntas certas — estamos com as turbinas certas, estamos com o combustível certo — mas quem dirige o avião é a diretoria.", "by": "CARLOS JÚLIO"}, {"t": "p", "h": "Sobre capital humano, a fronteira é igualmente clara: “Nós podemos e devemos ajudá-los a encontrar os melhores talentos para compor a diretoria dele. Claro que sim, mas o comando é dele.”"}, {"t": "h3", "h": "Os três tipos de conselheiro"}, {"t": "cap", "h": "A taxonomia do conselheiro brasileiro"}, {"t": "table", "head": ["<strong>Tipo<\/strong>", "<strong>Como ele definiu<\/strong>", "<strong>O sinal de reconhecimento<\/strong>"], "rows": [["<strong>Conivente<\/strong>", "Aquele que não vota contra quem o indicou.", "“Sempre vem aquela pergunta: ‘mas você nunca vai votar contra mim, né?’ Esse é o conivente. Como é que você vai votar com o cara que te deu emprego? Então você não é independente.”"], ["<strong>Negligente<\/strong>", "A celebridade que assina e vai embora.", "“Você acha que ele vai lá no seu conselho, vai em Ponta Grossa todo mês, vai ler todos os relatórios, vai almoçar com os seus diretores, vai entender dos seus clientes? Não. Ele vai lá, assina e vem embora.”"], ["<strong>Diligente<\/strong>", "O que se prepara, lê, visita, pergunta.", "“Os diligentes são a menor fatia dessa torre.”"]]}, {"t": "p", "h": "A crítica de composição foi direta e ele mesmo se antecipou à acusação: “Os conselhos são majoritariamente homens, brancos, 60 a mais, financeiros. Não vai acontecer nada.” E logo em seguida: “Isso não é etarismo. Não vem aquele papo de colocar na avaliação ‘o Júlio fala de 60 a mais’. Não é etarismo — eu sou 60 a mais.” O problema, na leitura dele, é repertório, não idade — e valeria igual para um conselho só de engenheiros ou só de médicos."}, {"t": "h3", "h": "A tese sobre IA — por que o jogo reabriu para o profissional sênior"}, {"t": "p", "h": "Este é o argumento mais original da sessão, e o mais relevante para quem trabalha com pessoas e requalificação."}, {"t": "quote", "q": "O homem nunca foi mais rápido que a máquina. Desde que surgiu a máquina a vapor lá na Inglaterra, nós nunca fomos mais rápidos que a máquina. Mas a máquina nunca será mais rápida e eficiente que o homem com a máquina.", "by": "CARLOS JÚLIO"}, {"t": "p", "h": "E a analogia histórica que sustenta a tese de que ainda é cedo: “Quando surgiu a internet, nós só percebemos a internet 20 anos depois, quando apareceu o browser. Antes do Netscape, ninguém sabia o que era internet. IA é a mesma coisa.” Com a correção de enquadramento: “a IA não é ferramenta, como dizem — a IA é um enable, um facilitador para te ajudar a ser mais produtivo.”"}, {"t": "box", "kind": "leitura", "title": "O ARGUMENTO INTERGERACIONAL", "items": [{"h": "<em>“De uns 20 anos para cá, os 50 a mais perderam mercado. O cara ia buscar um cara de 30, nativo, na internet. Só que não existe nativo da IA — então zerou o jogo. Nivelou todo mundo.”<\/em>"}, {"h": "<em>“A IA nos nivelou. Porque na IA precisa de repertório, letramento, capacidade de perguntar, interagir. Se você não souber, você vai perguntar errado, vai ter resposta errada.”<\/em>"}, {"h": "<em>“A nossa vantagem é essa: nós sabemos perguntar. Porque nós educamos as crianças errado — nós educamos as crianças para responder. E agora estamos dizendo que elas têm que aprender a perguntar. Elas só sabem responder. Elas não sabem perguntar.”<\/em>"}, {"h": "<strong>A implicação: <\/strong>a vantagem competitiva do sênior não é a ferramenta — é o repertório acumulado aplicado à ferramenta. “A nossa formação, a nossa experiência, a nossa quilometragem, o nosso repertório, dentro da tua área, com a IA.”"}]}, {"t": "h4", "h": "As quatro competências que ele nomeou"}, {"t": "cap", "h": "As quatro competências do conselheiro na era da IA"}, {"t": "table", "head": ["<strong>Competência<\/strong>", "<strong>O que significa na prática<\/strong>"], "rows": [["Repertório", "O conhecimento de domínio que permite discordar da máquina. Ele contou o caso da filha, médica, que fechou o próprio diagnóstico conversando com a IA: “Quem não é da área médica não ia chegar nessa coisa. Ela tem repertório para conversar com a IA.”"], ["Letramento", "Saber o suficiente das matérias que você não domina para sustentar a conversa. Seletivo, não enciclopédico."], ["Capacidade de perguntar", "“Se você não fizer a pergunta certa, você não vai encontrar a resposta que você quer. Você vai encontrar outras respostas que podem estar certas, mas não é o que você quer.”"], ["Interagir", "“Não tem jeito, você só vai aprender mexendo. Se você não mexer, você não vai.”"]]}, {"t": "h4", "h": "Os dois casos de uso que ele demonstrou"}, {"t": "ul", "items": ["<strong>No conselho da Patrus, em tempo real. <\/strong>Depois de uma apresentação trimestral, pediu ao diretor comercial as três planilhas de janeiro, fevereiro e março e as processou com IA: rota estratégica, mapa de risco e, então, a pergunta final — “baseado nesses 20 clientes, quais são os clientes que eu não estou enxergando no mercado?”. Saíram 50. E com raciocínio: o maior cliente do trimestre era a Track&amp;Field; a IA apontou a principal concorrente, crescendo três vezes, nos mesmos shoppings — portanto entrega compartilhável, com custo marginal tendendo a zero.", "<strong>Na preparação para a reunião. <\/strong>“Você não leu o relatório da diretoria. Joga no GPT, compara com o mês passado, e ele vai te dizer onde você tem que olhar. Se você fizer isso antes da reunião, quando chegar, saberá o que vai perguntar. E tem mais: você percebe todos os seus colegas que não vieram preparados.”"]}, {"t": "p", "h": "Ele também mostrou a economia da coisa: montou uma jornada de mentoria para nove herdeiros — cinco sessões até o fim do ano, média de 16 slides por workshop — antes do treino, às oito da manhã. Custo declarado da assinatura: mil reais por mês."}, {"t": "h3", "h": "Decisão, risco e responsabilidade"}, {"t": "p", "h": "O bloco central da tarde foi construído sobre uma dinâmica: a cena de Limite Vertical em que o pai, pendurado, pede ao filho que corte a corda para salvar a si e à irmã. “E você é o filho que está com a faca na mão. Pergunta: quem cortaria a corda?” Trinta e sete pessoas não cortariam."}, {"t": "p", "h": "As respostas da turma renderam três leituras. A que ele destacou como a melhor foi a da fonte de informação:"}, {"t": "quote", "q": "Essa é uma boa resposta, porque ele está dizendo o seguinte: quem tem a melhor informação, em tese? O pai. E o pai está dizendo: corta, porque não vai segurar.", "by": "CARLOS JÚLIO"}, {"t": "quote", "q": "O que mitiga o erro na decisão? É o binômio dado ou informação e bom senso — e eu coloco no bom senso também o preparo. Se você tem preparo e a informação é crível, a probabilidade de se tomar uma decisão correta é grande.", "by": "CARLOS JÚLIO"}, {"t": "ul", "items": ["<strong>Contra o achismo: <\/strong>“Lembra do Enéas? ‘O que o senhor acha da inflação?’ Ele falou: ‘Eu não acho nada. Ou eu sei ou eu não sei, eu não acho.’ Essa é a pior frase que você pode usar no conselho.” E: “Me mostra de onde você tirou isso — show me the data. Não dá para ir mais naquela, o feeling.”", "<strong>Processo acima de resultado: <\/strong>a turma respondeu “resultado”; ele corrigiu — “vocês acabaram de falar que nem toda decisão dá certo. Normalmente o que vale é o processo, porque o processo é o que te dá a chance de saber onde você errou. Isso lá no Vale do Silício é chamado de fast failure learning. É o erro honesto. Errou, mas não aprendeu, perdeu duas vezes.” E, de Mandela: “nunca perca — ou ganha ou aprende.”", "<strong>O tempo como aliado: <\/strong>“O tempo te dá a chance de errar. Quando você toma uma decisão com tempo e não dá certo, você volta e refaz. Se você não tem mais tempo, ela tem que dar certo.”", "<strong>Colegiado × parecer individual: <\/strong>“O conselho de administração e o conselho consultivo são colegiado. Você pode votar contra, mas se há maioria a favor, está aprovado. O conselho fiscal é parecer individual.”"]}, {"t": "h3", "h": "Pontos de atenção"}, {"t": "box", "kind": "atencao", "title": "LIABILITY É REAL — E A MITIGAÇÃO CABE NUMA LINHA DE ATA", "items": [{"h": "<em>“Conselheiro tem liability, viu? ‘Você acha que é legal ser conselheiro?’ Claro que é. Se você souber fazer as coisas, o risco é zero. Mas tem que fazer direito.”<\/em>"}, {"h": "O caso que ele usou: uma aquisição de refinaria avaliada pela equipe técnica da própria compradora — “compraram uma sucata de 70 milhões de dólares por 700 milhões de dólares”. A pergunta que faltou foi “quem fez o valuation?”, e o padrão que ele defende é no mínimo duas ou três avaliações de organismo internacional."}, {"h": "<strong>E a saída processual quando o conselho atropela: <\/strong>“‘Não dá tempo, precisa fechar.’ ‘Tá bom, então eu quero que conste em ata que eu me abstenho, porque eu não vi a avaliação.’” Resultado, anos depois: “Você não é nem citado. Estão todos os outros; você não é nem citado.”"}]}, {"t": "ul", "items": ["<strong>D&amp;O cobre a defesa, não o erro. <\/strong>“É um seguro de defesa: ele não cobre o erro, ele cobre a defesa.”", "<strong>Derivativos e mandato (caso Sadia). <\/strong>O alerta não é sobre risco — é sobre mandato: “Quem investe na Sadia é porque acha que mortadela dá lucro, que salsicha dá dinheiro. Se ele quisesse apostar em derivativos, ele comprava Itaú.” E o sinal que estava no balanço: “Peraí, como é que nós ganhamos 3 bi com receita financeira e a operação deu 100 milhões?” Com a observação amarga: “Quando estava dando lucro, ninguém falou nada.”", "<strong>Leniência e procrastinação. <\/strong>“‘Vamos resolver isso na próxima reunião’ — não dá, ou pode não dar.”", "<strong>Empilhar mandatos. <\/strong>“Impossível você fazer um trabalho de primeiro em 10 conselhos. É possível ir a 10 reuniões de um dia no mês, porque o mês tem 30 dias. Mas o teu preparo?”", "<strong>Eternizar-se — com autocrítica. <\/strong>“Dois mais dois, quatro anos é um tempo muito bom. Você tem que refrescar o conselho.” E sobre si: “estou na Camil há 21 anos, o que não é uma boa prática. Apesar de eu ser o curador desse curso, eu também faço coisas que não são boas práticas.”", "<strong>Recusar avaliação do conselho. <\/strong>“Tem conselho que não aceita que seja feita a avaliação. Você acha uma puta arrogância.”", "<strong>Pauta travada por falta de repertório na mesa. <\/strong>“Ninguém discute transformação digital no conselho. Sabe por quê? Porque os 60 e mais não sabem o que é transformação digital. IA? Não.”"]}, {"t": "h3", "h": "O caso Camil — como se muda a composição de um conselho"}, {"t": "p", "h": "Vale registrar porque é um método, não uma opinião. Ele foi à casa do fundador, já afastado, e disse:"}, {"t": "quote", "q": "Sr. Jair, eu acho que a gente precisa fazer um refreshment no conselho. Porque nós somos uma empresa de alimento e não tem nenhuma mulher. Não pode acontecer. Se tem alguma dificuldade, começa por mim: eu ofereço a minha posição, vamos trocar preferencialmente para trazer uma mulher.", "by": "CARLOS JÚLIO, SOBRE O CONSELHO DA CAMIL"}, {"t": "p", "h": "Resultado: dois postos adicionais de independentes e as duas primeiras conselheiras. O método — oferecer a própria cadeira antes de pedir a de outro — é o que torna a proposta inatacável."}, {"t": "h3", "h": "Educação, requalificação e a lógica chinesa"}, {"t": "ul", "items": ["<strong>O contraste de sistemas: <\/strong>“Na China, desde a pré-escola, o método de ensino é o estímulo. Porque o importante é o preparo para você reaprender, para você poder se reinventar profissionalmente.”", "<strong>STEM → STEAM: <\/strong>“Lá no Vale do Silício nasceu o STEM. O chinês gostou do STEM. Ninguém escreve mais que o americano, ninguém publica mais livros e artigos que o americano, ninguém lê mais que o europeu — e ninguém acredita mais no que lê que o chinês. Ele compra os livros americanos, acredita e implanta. Só que ele implanta.” E acrescentou o A de Arts.", "<strong>A crítica ao modelo brasileiro: <\/strong>“Nas nossas profissões, você decide hoje o que você quer ser amanhã. Garoto de 18, 19 anos, tem que tomar uma decisão que vai fazer com o resto da vida. Cruel, não é?”", "<strong>E a fronteira do futuro: <\/strong>“O futuro já existe. Só que ele existe, de acordo com o seu setor, em algum lugar do mundo. Ou você vai até ele, ou ele vem até você. O problema é que quando ele chegar até você, ele chega para todo mundo.”"]}, {"t": "h3", "h": "NR-1 e saúde mental entram na pauta do conselho"}, {"t": "p", "h": "Provocado por uma participante psicóloga — “sem gente, a gente não tem emprego” —, ele respondeu com o que talvez seja a abertura mais concreta do dia para a agenda de pessoas:"}, {"t": "quote", "q": "E agora, com a NR-01, os conselhos têm que tomar muitas decisões importantes. Tem algumas multas lá que quebram a empresa. Se aquilo vingar, é complicado. Já vingou. Eu acho que não tem volta.", "by": "CARLOS JÚLIO"}, {"t": "p", "h": "Um participante observou que a multa foi apenas postergada. A resposta dele foi para o mérito: “É sobre todas as doenças mentais, porque são aquelas que às vezes demoram para diagnosticar.”"}, {"t": "box", "kind": "leitura", "title": "LEITURA DE OPORTUNIDADE", "items": [{"h": "Risco psicossocial é, ao mesmo tempo, tema de conformidade com sanção financeira material e tema que nenhum conselho tradicional sabe discutir. É a interseção exata entre a agenda de riscos que o Carlos Sá defendeu no Dia 2 e o repertório de quem vem de RH."}]}, {"t": "h3", "h": "A turma — e o que ela diz sobre o seu posicionamento"}, {"t": "p", "h": "Ele mapeou quatro perfis predominantes nas turmas do programa:"}, {"t": "ul", "items": ["C-level que enxerga no conselho o prolongamento da carreira.", "Conselheiros em exercício que nunca fizeram formação, ou que voltam para atualizá-la.", "Donos de empresa querendo entender a dinâmica do conselho — muitas vezes porque está entrando um investidor ou sócio.", "Herdeiros: “não vou trabalhar na empresa, mas tenho que cuidar desse patrimônio”."]}, {"t": "box", "kind": "leitura", "title": "UMA COLEGA DA TURMA DISSE EM VOZ ALTA O QUE TALVEZ SEJA A SUA TESE", "items": [{"h": "Uma participante com trajetória em Brahma, Ambev, Danone e Coca-Cola, hoje pensando no próximo passo de carreira, contou ter entrado num conselho pela porta do comitê de pessoas, presidido pelo próprio presidente do conselho — “dois anos intensos tratando cultura, avaliação de desempenho, cargos, comunicação”. E resumiu a expectativa dela em uma frase:"}, {"h": "<strong><em>“Minha expectativa é ser a pessoa do conselho que vai falar de pessoas, cultura, performance.”<\/em><\/strong>"}, {"h": "E o diagnóstico dela sobre o mercado familiar, que é onde estão as vagas segundo Doern:"}, {"h": "<em>“Porque se você pega uma empresa familiar, normalmente o RH dela nunca foi sequer estratégico — porque é tirador de pedidos.”<\/em>"}, {"h": "<strong>A resposta do curador foi tática: <\/strong>“Vamos começar pelo comitê. No nosso mesmo comitê, você começa a dar um peso maior.” Ou seja: a porta de entrada para a agenda de gente é o comitê, não a cadeira."}]}, {"t": "h3", "h": "Referências da sessão"}, {"t": "table", "head": ["<strong>Referência<\/strong>", "<strong>Como foi usada<\/strong>", "<strong>Observação<\/strong>"], "rows": [["<strong><em>Domenico De Masi — O Ócio Criativo<\/em><\/strong>", "O conceito que ele rejeitou por autoimagem e reencontrou na pandemia.", "Contato pessoal em 2001 e 2003"], ["<strong>Peter Drucker<\/strong>", "“A cultura come a estratégia no café da manhã.”", "Ele mesmo adverte: “Nunca disse isso. Mas todo mundo disse que ele disse.”"], ["<strong>Nelson Mandela<\/strong>", "“Nunca perca: ou ganha ou aprende.”", "Atribuição popular"], ["<strong>Aristóteles<\/strong>", "Ética aristotélica: “o que vale para mim vale para os outros. A ética é um conceito coletivo; a moral, individual.”", "A segunda citação que ele atribui a Aristóteles — mens sana in corpore sano — é de Juvenal"], ["<strong>John Davis<\/strong>", "Governança familiar; base do curso de herdeiros do Credit Suisse.", "Mesmo autor recomendado por Doern no Dia 2"], ["<strong>Fast failure learning<\/strong>", "O erro honesto que ensina; processo acima de resultado.", "Vale do Silício"], ["<strong>Horizontes H1, H2, H3<\/strong>", "Modelo de horizontes estratégicos.", "Framework McKinsey"], ["<strong>STEM → STEAM<\/strong>", "A adição de Arts pelo sistema educacional chinês.", ""], ["<strong>Lei 6.404/76, arts. 130 a 142<\/strong>", "“Estão todas as obrigações do conselheiro.”", "Complementa os arts. 138–160 do deck de Doern"], ["<strong><em>Limite Vertical<\/em><\/strong>", "O clipe usado na dinâmica “quem cortaria a corda?”.", "Filme de 2000"], ["<strong>NR-1<\/strong>", "Riscos psicossociais como nova obrigação de conselho.", "Multas materiais; prazo postergado"], ["<strong>Casos citados<\/strong>", "Pasadena/Petrobras (valuation), Sadia (derivativos), Americanas/3G, Stone (conselheiro remunerado em equity), Tecnisa, Camil, Patrus.", ""]]}, {"t": "src", "h": "Fonte: transcrição integral da sessão e verificação contra as fontes primárias."}], "notes": ["Onde eu me encaixo nos quatro perfis — e o que isso muda na minha narrativa", "Meu “o que eu vou colocar no lugar?”", "Como eu uso repertório + IA para me diferenciar numa mesa de conselho"], "meta": "15h43  ·  2h50  ·  sessão de abertura, conduzida pelo curador do programa"}, {"num": "2.2", "head": "2.2  Leonardo Coelho — Estudo de caso: a fraude na Americanas", "blocks": [{"t": "stats", "items": [{"n": "R$ 25 bi", "l": "valor contábil da fraude"}, {"n": "8", "l": "pessoas no núcleo"}, {"n": "0", "l": "denúncias no canal de ética"}, {"n": "77%", "l": "queda das ações em um dia"}]}, {"t": "h3", "h": "Ficha do entrevistado"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória, conforme dita na entrevista<\/strong>"], "rows": [["Papel na Americanas", "CEO por três anos, à frente da reestruturação. Hoje, membro do comitê financeiro da companhia. Chegou em 15 de fevereiro de 2023 — “uma quarta-feira antes da sexta-feira de carnaval”."], ["Antes", "13 anos na Siemens — entrou como estagiário, saiu como CFO da divisão de energia. Depois, na Alvarez &amp; Marsal, “a principal consultoria de reestruturação do mundo — a consultoria contratada pelo governo americano para resolver o Lehman Brothers”."], ["Sucessão", "O mandato original ia até dezembro de 2027. Trouxe o sucessor em julho de 2024 e antecipou a troca — “até para comunicar que a gente está aprendendo também nesse processo”."]]}, {"t": "h3", "h": "Por que este caso importa para um conselheiro"}, {"t": "p", "h": "A entrevista desmonta, uma a uma, as explicações confortáveis que circularam na imprensa. Ele abre justamente frustrando a expectativa da sala:"}, {"t": "quote", "q": "Você olha para aquela empresa, lê os jornais e lê os especialistas de LinkedIn, e os caras falam: “a Americanas não tinha governança”. Tem uma má notícia: a Americanas era certificada em todos esses selos, ganhou monte de prêmio, no Brasil e nos Estados Unidos.", "by": "LEONARDO COELHO"}, {"t": "box", "kind": "atencao", "title": "A CONCLUSÃO QUE UM CONSELHEIRO PRECISA LEVAR PARA CASA", "items": [{"h": "<em>“Se o que aconteceu com a Americanas acontecer com uma empresa com todo esse tipo de certificação, aquelas que não têm e que não têm uma estrutura de governança sólida sofrem muito mais.”<\/em>"}, {"h": "<em>“Governança é fundamental, mas não é 100% das vezes que a gente vai ter a governança resolvendo a vida de uma organização — e a Americanas talvez seja o principal exemplo.”<\/em>"}, {"h": "E o detalhe que fecha o argumento: todas as certificações foram retiradas no dia seguinte ao fato relevante. “Falar que a Americanas não tinha governança é uma leitura superficial do que foi a crise.”"}]}, {"t": "p", "h": "A companhia era listada no Novo Mercado, tinha conselho independente, comitê de auditoria, áreas internas de auditoria e compliance. E ainda assim:"}, {"t": "quote", "q": "Boa parte dessas áreas foi sequestrada pela alta gestão para fazer com que a fraude acontecesse e se perpetuasse. A literatura tem casos que eles chamam de Management Override of Internal Controls — a alta direção sequestrando de fato os controles internos da companhia.", "by": "LEONARDO COELHO"}, {"t": "h3", "h": "O mecanismo — e a correção da narrativa pública"}, {"t": "p", "h": "Esta é a parte técnica que vale entender, porque muda completamente o tipo de pergunta que um conselheiro deveria ter feito."}, {"t": "box", "kind": "atencao", "title": "A FRAUDE NÃO ERA DE RISCO SACADO", "items": [{"h": "<strong><em>“A fraude, como ela foi mostrada e tratada nos jornais, como a fraude do risco sacado, está errada. A fraude é uma fraude de lucratividade, primeiro. O risco sacado, vocês vão ver, ele é quase que um antídoto para essa fraude.”<\/em><\/strong>"}]}, {"t": "cap", "h": "As duas pernas da fraude"}, {"t": "table", "head": ["<strong>Perna<\/strong>", "<strong>Mecanismo<\/strong>", "<strong>Efeito<\/strong>"], "rows": [["<strong>1. VPC fictício<\/strong>", "VPC é a verba que o fornecedor concede para uma campanha específica. Eles criavam VPCs inexistentes — copiando e colando a assinatura de diretor de uma VPC legítima em outra forjada. Chamavam internamente de “VPC A” a verdadeira e “VPC B” a inventada. No digital, a receita ainda era multiplicada por 1,3 a 1,5 vez, aproveitando a ambiguidade do GMV.", "Gerava o lucro. No exemplo dele: receita 100, custo 70, despesas 50 — prejuízo de 20 vira lucro de 10 com custo “ajustado” para 40."], ["<strong>2. Risco sacado<\/strong>", "Operação de dívida bancária tratada como financiamento de fornecedor, aproveitando uma lacuna que existia até 2017. “Tem vários CPCs, mas todos eles sabiam que tinha que ser colocado, de fato, como endividamento bancário.”", "Escondia o buraco. O contas a pagar ficava neutro — “por isso que o analista da Faria Lima, o auditor, o conselho, todo mundo olhava e falava: essa empresa está ok, está gerando caixa”."]]}, {"t": "src", "h": "Fonte: entrevista com Leonardo Coelho, 3 de agosto de 2026."}, {"t": "p", "h": "A síntese dele: “a fraude tem esses dois instrumentos. Ela acontece pelo VPC, que é o que gera resultado. E ela é encoberta pelo risco sacado.”"}, {"t": "p", "h": "E o detalhe que explica por que, mesmo quando confrontados, os fraudadores só falaram de risco sacado: “Falar que o risco sacado estava contabilizado errado é verdade. Eles não falaram porque estava contabilizado errado — para esconder o VPC. Até porque aí sim era crime.”"}, {"t": "h3", "h": "Como a auditoria foi neutralizada"}, {"t": "p", "h": "Este bloco é, provavelmente, o mais acionável da entrevista."}, {"t": "ul", "items": ["<strong>Cinco ERPs sob um mesmo CNPJ, <\/strong>com contas transitórias. “Quando eu falo que ela era desenhada para fraude, do lado de TI, é extremamente preciso.”", "<strong>Recusa de auditoria por extração de dados. <\/strong>“Hoje a auditoria chega, pluga o sistema dela no seu, roda os algoritmos e já sai com o mapeamento pronto. A Americanas não deixava o auditor fazer isso. Aqui a auditoria é à moda antiga: é por teste substantivo.”", "<strong>A justificativa vendida — e comprada: <\/strong>“Está vendo a minha rentabilidade? Está vendo a da Magalu, a das Casas Bahia? A minha é muito maior. Boa parte dessa rentabilidade vem da minha capacidade de tratar as informações. Não vou deixar, por proteção do meu segredo industrial, que você se plugue aqui dentro. Se você topar fazer auditoria desse jeito, beleza. Se não, eu vou procurar um próximo outro.”", "<strong>VPC nunca foi bem auditada no setor. <\/strong>“Isso sempre foi muito mal auditado nas empresas de varejo no Brasil.” A correção que ele propõe: “o equivalente seria uma circularização tal qual se faz em banco. Teria que se fazer com fornecedor também, para ter clareza do que tem de VPC de verdade.”", "<strong>Circularização manipulada. <\/strong>Ele relata que um banco foi convencido a retirar o risco sacado das cartas de circularização enviadas à auditoria."]}, {"t": "box", "kind": "atencao", "title": "A FRASE QUE RESUME A FALHA DE CONTROLE", "items": [{"h": "<em>“Se você deixasse o auditor plugar os sistemas dele ali dentro e fazer leitura, ele ia ver isso facilmente. Mas do jeito que ela estava desenhada, isso era praticamente impossível.”<\/em>"}]}, {"t": "h3", "h": "Os oito sinais que existiam e não foram lidos"}, {"t": "p", "h": "Esta é a lista para levar a qualquer conselho. Todos os itens vêm da própria entrevista."}, {"t": "cap", "h": "Os sinais disponíveis e não lidos"}, {"t": "table", "head": ["<strong>#<\/strong>", "<strong>Sinal<\/strong>", "<strong>Por que passou<\/strong>"], "rows": [["1", "Rentabilidade muito acima dos pares do setor, sem explicação estrutural", "Foi lida como vantagem competitiva e “segredo industrial” — não como anomalia a investigar"], ["2", "Recusa da empresa em permitir auditoria por extração de dados", "Aceita como preferência metodológica, e não como bloqueio"], ["3", "Custo de dívida incompatível com o balanço — juros na casa de 200% do CDI", "Um analista levantou isso em call público: “com uma empresa com esse balanço, você deveria ter uma dívida melhor”. A resposta interna foi capitalizar os juros do risco sacado e jogá-los também no contas a pagar"], ["4", "29 aquisições em oito anos", "“A minha leitura é que boa parte dessas companhias só foi comprada para tumultuar o balanço e dificultar a análise do analista e da auditoria”"], ["5", "Números operacionais básicos divergentes entre áreas", "Logística dizia 1.734 lojas; comercial dizia 1.747. Foi o que o fez puxar o fio: “todos os controles internos geravam informações conflitantes”"], ["6", "Canal de ética com zero denúncias em mais de uma década de fraude", "“Eu vasculhei todo o canal de ética e de denúncia. Não teve uma sequer.” Silêncio absoluto é sinal, não atestado de saúde"], ["7", "Mesmo CEO por mais de 20 anos, núcleo decisório fechado", "“O principal erro, na minha visão, é ter o mesmo CEO na companhia por mais de 20 anos”"], ["8", "Estatuto redigido pelos próprios fraudadores", "Incluíram cláusula que obriga a companhia a custear a defesa deles"]]}, {"t": "h3", "h": "A pergunta que salvou o conselho"}, {"t": "p", "h": "O contraponto mais instrutivo da entrevista — e a melhor demonstração prática do que é diligência."}, {"t": "quote", "q": "Tem a Vanessa, que é de auditoria, que fez a pergunta do bilhão, literalmente. Ela perguntou por várias vezes: “vocês fazem risco sacado?” No trimestre seguinte, de novo. Aí ela começou a ver que estava alguma coisa estranha ali. “Vocês fazem risco sacado, forfeiting, vendor finance?” — ela arranjou todos os sinônimos possíveis. Isso ajudou muito a tirar o calor de cima do conselho também.", "by": "LEONARDO COELHO, SOBRE UMA CONSELHEIRA DA AMERICANAS"}, {"t": "box", "kind": "leitura", "title": "A LIÇÃO DE MÉTODO", "items": [{"h": "Fraude sofisticada sobrevive a perguntas de roteiro. Ela morre em perguntas repetidas, por escrito, feitas com todos os sinônimos que fecham a escapatória de nomenclatura. Perguntar uma vez é protocolo; perguntar todo trimestre, por e-mail, variando o termo, é diligência — e foi o que produziu o registro que protegeu o conselho depois."}]}, {"t": "h3", "h": "Cultura — o que realmente permitiu"}, {"t": "p", "h": "O ângulo mais denso da entrevista, e o que mais conversa com a agenda de quem trabalha com pessoas."}, {"t": "h4", "h": "Três culturas sob o mesmo telhado"}, {"t": "ul", "items": ["<strong>O varejo físico: <\/strong>“A gente é um varejo de 1929, resolve a vida das pessoas, está perto, com 1.700 lojas. A gente trabalha a indulgência da classe média baixa brasileira — o chocolatinho, a perfumaria, o brinquedo de 15, 20 reais.” E o veredito dele: “Beleza, tem uma identidade, sabemos quem somos.”", "<strong>O digital: <\/strong>“A gente tinha 1.200 developers dentro da Americanas fazendo software. A gente era uma software house. E a cabeça de quem estava dentro era a cabeça do Amazon brasileiro. O varejo só servia como guia para provar a nossa capacidade.” Sede na Vila Olímpia, “em contraste com a nossa sede extremamente humilde, no centro do Rio, na Gamboa”.", "<strong>A fintech: <\/strong>“Se queria criar alguma coisa similar ao que o Nubank fez, aproveitando aquele fluxo de 50 milhões de pessoas. A loja física e o varejo digital só serviam como originador de gente para essa empresa.”"]}, {"t": "p", "h": "<strong>O diagnóstico: <\/strong>“Três empresas diferentes em crise.”"}, {"t": "h4", "h": "O núcleo que não era contestado"}, {"t": "quote", "q": "A cultura ajudou a fraude a acontecer, no sentido de que você tinha um núcleo que tomava as decisões ali dentro. Esse núcleo não era contestado. Você não tinha, dentro da cultura, essa cultura de gente que vai chegar e falar: “por que a gente está fazendo isso?” Isso não tinha.", "by": "LEONARDO COELHO"}, {"t": "quote", "q": "Era muito a história do comando e controle. Eu tenho o comando, eu tenho o controle, vocês me respeitam.", "by": "LEONARDO COELHO"}, {"t": "h4", "h": "Meritocracia e incentivos — a troca mais dura da noite"}, {"t": "p", "h": "Um participante, ex-fornecedor de tecnologia do grupo controlador, provocou diretamente: descreveu uma “cultura leonina”, prazos de pagamento de 180 dias, reuniões em que ouviu “não, você que tem que me pagar — eu estou te dando a oportunidade de entrar”. E completou: “Cara, descobrimos uma fonte de dinheiro. Estamos ganhando bônus, bônus, bônus. Está todo mundo feliz. Por que eles iam questionar?”"}, {"t": "quote", "q": "Usar a meritocracia da forma como foi usada vai além do desenho da meritocracia. A resposta mais honesta que eu posso dar: teve um componente? Teve. Mas a mesma meritocracia, na Ambev, não gerou isso. Eu tenho 200 exemplos de meritocracia iguais que funcionam. O que tem que ter é constância de troca.", "by": "LEONARDO COELHO"}, {"t": "p", "h": "E o ponto que ele considera decisivo: “Tudo bem que as entregas eram fictícias, mas a percepção de quem estava de fora era ótima. Acho que esse é o grande problema.” Ou seja — o sistema de mérito não falhou por desenho, falhou porque o dado que alimentava o mérito era falso, e não havia rodízio que expusesse isso."}, {"t": "h4", "h": "A tipologia de caráter × entrega"}, {"t": "cap", "h": "A grade de caráter e entrega"}, {"t": "table", "head": ["", "<strong>Baixa entrega<\/strong>", "<strong>Alta entrega<\/strong>"], "rows": [["<strong>Bom caráter<\/strong>", "“Esse é o cara que você treina.”", "<strong>“Esses têm que manter dentro da tua organização, promover.”<\/strong>"], ["<strong>Mau caráter<\/strong>", "“Isso é fácil — você manda ele embora.”", "<strong>“E você tem o caso do CEO: o cara de mau caráter e ótimas entregas.”<\/strong>"]]}, {"t": "p", "h": "E a leitura pessoal dele sobre a motivação: “Se vocês perguntarem minha opinião, eu acho que foi a junção do caráter com a vaidade. Você tinha os dois principais ativos do mesmo grupo controlador, com performance muito diferente. Só que só oito pessoas sabiam que a performance era diferente. Não pode ficar para trás — essa é a minha leitura.”"}, {"t": "h4", "h": "O aprisionamento patrimonial"}, {"t": "box", "kind": "atencao", "title": "PROGRAMA DE AÇÕES COMO CULTO", "items": [{"h": "<em>“Esses caras aplicavam 100% do patrimônio pessoal, ou algo muito próximo disso, em ações da companhia. Porque isso aqui era quase como culto: ‘Você performou bem? Vou te dar a ação. Parabéns.’ E: ‘Se você vender suas ações, performando bem ou não, ano que vem eu estou entendendo que você não acredita na empresa. E aí eu posso tomar uma decisão diferente.’”<\/em>"}, {"h": "<strong>Para um profissional de RH, este é o item mais importante da entrevista: <\/strong>um programa de incentivo de longo prazo desenhado para tornar economicamente inviável discordar. Vale revisitar qualquer plano de ações à luz disto — a pergunta não é se o plano retém, é se ele silencia."}]}, {"t": "h4", "h": "O custo humano"}, {"t": "p", "h": "Ele deixou este ponto para o fim de propósito:"}, {"t": "quote", "q": "Impacta os trabalhadores. Eu deixei por último que talvez seja a face mais nefasta do que esses caras fizeram. A Americanas era uma empresa de gente que trabalhava lá 20, 30, 40 anos.", "by": "LEONARDO COELHO"}, {"t": "p", "h": "E contou a história de um executivo que entrou na companhia como operador de loja em 1º de novembro de 1973, saiu como VP comercial, e ligou na crise oferecendo ajuda: “Você não tem ninguém aí dentro, eu estou há 15 anos fora, mas acho que posso te ajudar. Quer?”"}, {"t": "p", "h": "O contrapeso social do varejo físico foi, segundo ele, decisivo na recuperação: empresa de primeiro emprego, 21 mil pessoas em lojas, turnover que já foi superior a 100% e hoje está em torno de 35%. “Essas pessoas ajudaram a segurar as pontas nas primeiras semanas da crise, porque eram os caras que estavam na frente do nosso cliente, levando porrada — mas ao mesmo tempo explicando que estava vida normal.”"}, {"t": "
