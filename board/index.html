, poucos em quadra"], ["<strong>3ª<\/strong>", "Futebol", "Consórcio de primos; os círculos se afastam"], ["<strong>4ª<\/strong>", "Futebol americano", "Armadura e capacete — sem protocolo, conflito"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 81:32 a 84:35."}, {"t": "p", "h": "A Votorantim serve de régua: 39 membros na quarta geração, 91 na quinta, holding com conselho que levou 16 anos para chegar à maioria independente. Ivan foi direto sobre a tentação de copiar:"}, {"t": "quote", "q": "Não tem fórmula única… você constrói a governança a partir dos problemas que você quer resolver.", "by": "IVAN MURIAS"}, {"t": "h3", "h": "O herdeiro e a régua que todo mundo esquece"}, {"t": "p", "h": "As famílias definem régua técnica — formação, experiência fora. Esquecem a comportamental, que ele chamou de “a barra esquecida”."}, {"t": "quote", "q": "Não é por imposição. É por modelagem de comportamento ao longo de décadas.", "by": "IVAN MURIAS"}, {"t": "p", "h": "É exatamente o espaço de quem trabalha com gente: critério de entrada, avaliação e plano de desenvolvimento para herdeiro com a mesma régua do executivo. E vale para o próprio conselheiro, que chega tentado a mostrar repertório:"}, {"t": "quote", "q": "Não adianta a gente sair daqui e falar, eu vou ser conselheiro de família empresária. Boa parte da reunião eu vou descarregar o meu repertório como executivo e vou ensinar… Normalmente começa por aqui, começa por ouvir, ouvir muito.", "by": "IVAN MURIAS"}, {"t": "h3", "h": "O caso Tok&amp;Stok: o rancor no freezer"}, {"t": "p", "h": "Régis e Ghislaine Dubrule abriram a Tok&amp;Stok em 1978, inspirados na IKEA. Em 31 anos, 33 lojas — varejo sem dívida, designers no time de compras, uma marca que quase todo brasileiro conhecia. A chegada da Etna levou a família a vender 60% ao Carlyle em 2012."}, {"t": "cap", "h": "A linha do tempo da Tok&amp;Stok, como contada em aula"}, {"t": "table", "head": ["<strong>Fase<\/strong>", "<strong>O que aconteceu, segundo Ivan<\/strong>"], "rows": [["<strong>Venda<\/strong>", "60% ao Carlyle, com os fundadores na gestão por pelo menos três anos"], ["<strong>Colheita do fundo<\/strong>", "Receita +28%; EBITDA de quase 15% para 9%; lucro líquido de 5% ou 6% para zero"], ["<strong>Troca de gestão<\/strong>", "O sucessor interno, com 35 anos de casa, é preterido"], ["<strong>Turnaround<\/strong>", "Com Ivan como CEO: EBITDA de 90 para 271 milhões, dívida zero, IPO protocolado em junho de 2020"], ["<strong>Impasse<\/strong>", "O mercado oferece 10× EBITDA; o Carlyle quer 15×. Proposta: o fundo sai com 30 dos 60%, a família com 20 dos 40%. A família recusa"], ["<strong>Desfecho<\/strong>", "IPO frustrado; depois, a Mobly assume o controle (2024) e o Grupo Toky pede recuperação judicial (maio de 2026)"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 98:36 a 120:50; desfecho conferido na imprensa (Anexo B)."}, {"t": "quote", "q": "Uma coisa que normalmente envolve investimentos de private equity em famílias empresárias é você partir da premissa de que faltava ambição naquela família e que eu sei o que precisa ser feito.", "by": "IVAN MURIAS"}, {"t": "quote", "q": "Vai lá na Serra Gaúcha e manda o cara reduzir o estoque pela metade. Ele quebra. Você tem 80% da produção dele.", "by": "IVAN MURIAS, SOBRE CORTAR CAPITAL DE GIRO SEM ENTENDER O MODELO"}, {"t": "quote", "q": "Porque rancor, pessoal, a gente guarda no freezer. Para a hora certa a gente usar.", "by": "IVAN MURIAS, SOBRE A RECUSA DA FAMÍLIA"}, {"t": "quote", "q": "Se você esquecer de honrar, que tem um legado que foi construído lá e que está sob bases sólidas, muito possivelmente é um preço que você vai pagar em algum momento.", "by": "IVAN MURIAS"}, {"t": "p", "h": "Ivan foi honesto sobre o limite da própria leitura — “na história não existe e se” — e deixou a intuição: com menos rancor e mais maturidade para negociar, a família teria recomprado os 60%."}, {"t": "p", "h": "Valuation se negocia em planilha. Rancor, não."}, {"t": "h3", "h": "Pontos de atenção"}, {"t": "ul", "items": ["<strong>Testar o vínculo antes de desenhar estrutura.<\/strong> O almoço de domingo diz mais que o organograma.", "<strong>Chegar ouvindo.<\/strong> O conselheiro que descarrega repertório na primeira reunião perde a confiança que ainda não ganhou.", "<strong>Saber qual chapéu se usa.<\/strong> O lugar inicial do conselheiro é o círculo do negócio.", "<strong>Concentração patrimonial é pauta de conselho.<\/strong> Um ativo único, rescindível em 90 dias, é risco de existência.", "<strong>Vender o controle não compra permanência.<\/strong> Acordo de gestão por três anos não garante nada depois deles.", "<strong>Criar o fórum de prestação de contas antes que ele nasça na mesa da tia.<\/strong>"]}, {"t": "box", "kind": "verif", "title": "VERIFICAÇÃO DE FATO", "items": [{"h": "<strong>Tok&amp;Stok.<\/strong> Foi dito que “a própria Magalu que comprou” não conseguiu transformar o ativo. Quem assumiu o controle foi a <strong>Mobly<\/strong>, em agosto de 2024. O Grupo Toky pediu recuperação judicial em maio de 2026. Não localizei confirmação da venda a um fundo mencionada em aula."}, {"h": "<strong>IRB.<\/strong> Foram <strong>sete<\/strong> conselheiros, a R$ 500 mil cada, em acordo com a CVM por não terem percebido a fraude contábil apontada em 2019 — não pelo episódio da Berkshire Hathaway."}, {"h": "<strong>Três círculos.<\/strong> Davis foi aluno e assistente de Tagiuri em Harvard, não o contrário."}, {"h": "<strong>Números de abertura.<\/strong> Os 90% das empresas, 75% da força de trabalho e 65% do PIB, atribuídos “segundo a Price”, e os 12% que chegam à quarta geração circulam sem fonte primária localizada. Os US$ 84 trilhões do UBS são estimativa global, não da Europa."}, {"h": "<strong>Miguel Krigsner<\/strong> tem 76 anos (Forbes, setembro de 2026), não “81, 82”. <strong>Marabraz:<\/strong> foi um herdeiro pedindo a interdição do pai, pedido depois retirado — não “os primos interditando os pais e os tios”."}]}, {"t": "box", "kind": "mesa", "title": "PARA LEVAR À MESA", "items": [{"n": "01", "h": "Se o negócio acabasse amanhã, o que ainda manteria esta família reunida?"}, {"n": "02", "h": "Que decisões hoje são tomadas fora do fórum certo — família, sócios ou negócio?"}, {"n": "03", "h": "Qual é o nosso cisne vermelho: o risco sabido que insistimos em não tratar?"}, {"n": "04", "h": "Existe plano de sucessão escrito para o CEO e para o fundador? Que papel o fundador terá daqui a três anos?"}, {"n": "05", "h": "Qual a concentração do patrimônio da família num único ativo, e o que acontece se ele mudar de mãos?"}, {"n": "06", "h": "Onde estamos misturando PJ e PF, e quanto isso custa em valuation?"}, {"n": "07", "h": "Que régua — técnica e comportamental — decide a entrada de um familiar na empresa?"}, {"n": "08", "h": "Se um sócio financeiro entrar, o que no acordo protege o modelo de negócio, a sucessão interna e a saída de ambos?"}]}, {"t": "h3", "h": "Referências da sessão"}, {"t": "table", "head": ["<strong>Referência<\/strong>", "<strong>Como foi usada<\/strong>", "<strong>Observação<\/strong>"], "rows": [["<strong>Tagiuri e Davis — modelo dos três círculos<\/strong>", "Base da aula", "Davis foi aluno de Tagiuri"], ["<strong>José Paschoal Rossetti — os 8 Ps da governança<\/strong>", "Modelo adotado pelo Grupo Gentil", "—"], ["<strong>Nassim Taleb — <em>A Lógica do Cisne Negro<\/em> (2007)<\/strong>", "Quando montar o conselho", "—"], ["<strong>Silvio Meira — o cisne vermelho<\/strong>", "Risco previsível e ignorado", "Texto prometido na pós-leitura"], ["<strong>Liev Tolstói — <em>Anna Kariênina<\/em><\/strong>", "“Todas as famílias felizes se parecem”", "—"], ["<strong>Rubem Alves — a “escutatória”<\/strong>", "Como começar num conselho de família", "Frase usada sem crédito em aula"], ["<strong>Casos: Gentil, Votorantim, Boticário, Magalu, Brennand, WEG, IRB, Marabraz, Tok&amp;Stok<\/strong>", "Ilustrações", "Correções no Anexo B"]]}, {"t": "src", "h": "Fonte: transcrição integral da sessão e verificação contra as fontes primárias."}], "notes": ["Uma família empresária que conheço — em que esporte ela joga hoje, e em que esporte acha que joga", "O cisne vermelho mais comum que eu vi em empresas familiares", "Como eu entraria, ouvindo, na primeira reunião de um conselho de família"], "meta": "09h05  ·  121 minutos  ·  três círculos, conselhos, valuation e o caso Tok&amp;Stok"}, {"num": "2.5", "head": "2.5  Vanessa — ESG integrado ao modelo de negócio", "blocks": [{"t": "stats", "items": [{"n": "6", "l": "crises interconectadas que não cabem em caixinhas"}, {"n": "5", "l": "etapas da jornada ESG"}, {"n": "R$ 87 bi", "l": "prejuízo das enchentes do RS, segundo o BID"}, {"n": "1 vez", "l": "por ano: a frequência de pauta que ela critica"}]}, {"t": "h3", "h": "Ficha da professora"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória, conforme dita em aula<\/strong>"], "rows": [["<strong>Nome<\/strong>", "Vanessa. O sobrenome não foi dito em aula; o perfil público indica Vanessa Cuzziol Pinsky, com pós-doutorado na FEA-USP — confirmar no material da plataforma."], ["<strong>Carreira<\/strong>", "“Eu não sou uma ativista ambiental e climática, mas sou uma profissional que trabalha mais de 20 anos com negócios e sustentabilidade.” Gerente de sustentabilidade do Citibank por quase sete anos, até 2013."], ["<strong>Hoje<\/strong>", "Agente de governança: membro externo de comitês de sustentabilidade que se reportam a comitês estatutários de estratégia ou de pessoas. Ligada ao Capitalismo Consciente."], ["<strong>No programa<\/strong>", "“Eu fiz aqui a turma número um do Board Program.”"]]}, {"t": "h3", "h": "A tese: ESG que não muda o modelo de negócio é relatório"}, {"t": "quote", "q": "Eu venho de dialogar com banqueiros, entendendo que proposta é importante, mas não é suficiente… a gente precisa trabalhar no olhar do modelo de negócio. O que eu ganho com isso, o que eu perco com a ação e como que a gente faz isso.", "by": "VANESSA"}, {"t": "quote", "q": "O fato da ESG estar presente não significa que ela está sendo integrada de uma estratégia de negócio.", "by": "VANESSA"}, {"t": "p", "h": "O tom foi o de quem conhece a mesa. ESG não é atestado de virtude. É risco e oportunidade dentro do modelo de negócio — e quem não entende isso confunde presença com integração."}, {"t": "quote", "q": "Aqui não é uma questão de atestado de santidade… Todas as organizações geram impacto.", "by": "VANESSA"}, {"t": "h3", "h": "Materialidade: priorizar, não abraçar"}, {"t": "quote", "q": "Uma agenda de negócios… na perspectiva de um conselheiro não é sobre abraçar um monte de temas, muito pelo contrário, é estabelecer critérios de priorização, fazer as perguntas certas dentro do colegiado.", "by": "VANESSA"}, {"t": "cap", "h": "O mesmo tema muda de peso conforme o negócio"}, {"t": "table", "head": ["<strong>Caso<\/strong>", "<strong>Tema material<\/strong>", "<strong>Lógica<\/strong>"], "rows": [["<strong>Hotel urbano<\/strong>", "Água, energia e resíduos; biodiversidade, não", "Ecoeficiência: “é sobre dinheiro”"], ["<strong>Hotel nas Cataratas do Iguaçu<\/strong>", "Biodiversidade — “materialidade total”", "Licença social para operar"], ["<strong>Confecção<\/strong>", "Condições de trabalho na cadeia terceirizada, salário digno", "Risco social e de direitos humanos"], ["<strong>BRF<\/strong>", "Risco sanitário potencializado pelo clima", "Riscos que se somam"], ["<strong>Coca-Cola, na avaliação da MSCI<\/strong>", "Carbono da cadeia, água, resíduo pós-consumo, saúde do trabalhador, nutrição", "O rating lê o que é estratégico para o setor"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 14:25 a 17:38 e 77:46 a 81:42."}, {"t": "quote", "q": "Talvez o driver principal é a economia e a competitividade na operação. E está tudo bem, é sobre isso, pessoal. É sobre dinheiro, sobre resiliência e como a gente organiza isso, gerando um menor impacto.", "by": "VANESSA"}, {"t": "p", "h": "Ela não usou o termo, mas o critério que repetiu — temas em que a empresa gera impacto e temas em que é impactada — é a lógica da dupla materialidade."}, {"t": "h3", "h": "Da filantropia ao risco"}, {"t": "cap", "h": "A evolução da agenda, segundo Vanessa"}, {"t": "table", "head": ["<strong>Fase<\/strong>", "<strong>Lógica<\/strong>", "<strong>Ainda vale?<\/strong>"], "rows": [["<strong>Filantropia estratégica (anos 2000)<\/strong>", "Devolver à comunidade", "Sim — as enchentes do RS mostraram por quê"], ["<strong>Responsabilidade socioambiental (a partir de 2008)<\/strong>", "Impacto ambiental como fator de competitividade", "Incorporada"], ["<strong>Tripé da sustentabilidade<\/strong>", "Econômico, ambiental e social no mesmo peso", "Perdeu força para a materialidade"], ["<strong>ESG<\/strong>", "Indicadores não financeiros como risco e oportunidade", "Sob pressão “anti-ESG”; a sigla importa pouco"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 08:01 a 14:25."}, {"t": "quote", "q": "ESG não é o novo nome da sustentabilidade… Filantropia, voluntariado corporativo… isso não é estratégia ESG.", "by": "VANESSA"}, {"t": "h3", "h": "Seis crises que não cabem em caixinhas"}, {"t": "p", "h": "Mudança climática, poluição, pobreza e desigualdade, resíduos sólidos, biodiversidade e saúde mental. A lista importa menos que a forma como os riscos se encadeiam: aquecimento, escassez hídrica, crise numa matriz elétrica majoritariamente hidrelétrica, custo operacional, inflação — e, no fim da cadeia, os mais vulneráveis."}, {"t": "quote", "q": "A gente não fala mais de caixinhas, a gente está falando de temas interconectados.", "by": "VANESSA"}, {"t": "quote", "q": "Quando o conselho de administração… estão discutindo a questão do mapa de risco estratégico da organização, é muito importante ter essa visão de como que um risco pode potencializar o outro.", "by": "VANESSA"}, {"t": "p", "h": "Os casos deixaram o ponto concreto. Uma indústria de palitos de picolé, com floresta plantada e carbono neutro, teve um trimestre ruim porque choveu demais no fim do ano. A Zona Franca de Manaus, que produz a totalidade das TVs e dos micro-ondas do país, fica sem saída quando a seca fecha as hidrovias. Uma empresa de armazenagem do agro, que quase não emite, perde volume com a quebra de safra."}, {"t": "p", "h": "O risco climático não depende do que a empresa emite. Depende de onde ela está na cadeia."}, {"t": "quote", "q": "Então a questão é que está escalando. A gente só não sabe aonde que ele se materializa.", "by": "VANESSA"}, {"t": "h3", "h": "O S do ESG é gente"}, {"t": "quote", "q": "Quando a gente fala de pilar social na agenda ESG, a gente está falando de NR01. A gente está falando de risco de direitos humanos na cadeia de valor[es].", "by": "VANESSA"}, {"t": "quote", "q": "Saúde mental é um risco na agenda ESG. Hoje a gente tem a NR01.", "by": "VANESSA"}, {"t": "p", "h": "O debate sobre a NR-01 foi o mais longo da manhã e o mais útil para mim. Um colega de gestão de pessoas descreveu diagnóstico obrigatório, fiscalização notificando antes de multar e a falta de psiquiatras no país. Um executivo contou de psicóloga no escritório e de cobertura integral de terapia no plano de saúde. Um presidente de conselho de banco trouxe o limite prático:"}, {"t": "quote", "q": "Quem me garante que no mês que vem esse cara não vendeu a cadeira, trocou a luminária… e eu vou ser multado? Eu acho que tem ajustes no NR01.", "by": "PRESIDENTE DE CONSELHO DE BANCO, COLEGA DE TURMA"}, {"t": "quote", "q": "Um tema que parece que é ligado só à área de RH… mas afeta a empresa como um todo e você pode ter riscos financeiros altos.", "by": "COLEGA DE TURMA, EXECUTIVO DE GESTÃO DE PESSOAS"}, {"t": "box", "kind": "leitura", "title": "O DIA EM QUE A PAUTA DE GENTE ENTROU PELA PORTA DO RISCO", "items": [{"h": "Até aqui, a saúde mental chegava ao conselho como benefício. Na sala de Vanessa, chegou como passivo trabalhista, risco financeiro e item de matriz. É a mudança de enquadramento que o RH espera há anos."}, {"h": "Um colega resumiu o problema em uma frase, quando ela perguntou com que frequência a pauta ESG aparece no conselho:"}, {"h": "<em>“É igual a pauta de gente, é só quando vai pagar a PLR.”<\/em>"}, {"h": "E o colega de gestão de pessoas fechou com o entregável que cabe a quem lidera escolas de liderança: “suas lideranças precisam ser trabalhadas e preparadas para lidar com a saúde mental nas suas equipes”."}, {"h": "<strong><em>Gente entra no conselho como risco ou não entra. Benefício se discute uma vez por ano.<\/em><\/strong>"}]}, {"t": "h3", "h": "Legal não é o mesmo que ético"}, {"t": "p", "h": "O caso que mais dividiu a sala foi o do “sorvete que vira bebida láctea”: uma classificação fiscal que evitou cerca de R$ 324 milhões em tributos — o caso, julgado pelo Carf em 2025, envolveu o McDonald’s, que não foi nomeado em aula. Parte da turma disse que o erro era do governo. Vanessa concordou e manteve o ponto:"}, {"t": "quote", "q": "O erro está no governo, não na empresa. Eu concordo com você… mas aqui são dilemas éticos ou morais que eles passam ou deveriam passar pelo conselho.", "by": "VANESSA"}, {"t": "p", "h": "O segundo caso foi o de uma empresa intensiva em carbono cujo modelo de negócio inclui pagar multas ambientais:"}, {"t": "quote", "q": "Vanessa, é o seguinte, o modelo de negócio da companhia, ele sempre funcionou desse jeito e a gente opera pagando multas ambientais, porque estar em compliance com a legislação ambiental em diversos municípios é algo extremamente custoso para a organização.", "by": "EXECUTIVA RELATADA POR VANESSA"}, {"t": "p", "h": "E o terceiro, o de um desastre que “já era sabido 12 anos antes dele acontecer”, numa empresa que se preparava para ser vendida e decidiu assumir o risco. O nome não foi dito em aula. O mecanismo, sim — ela chamou de cegueira ética:"}, {"t": "quote", "q": "Puxa, a gente sempre fez dessa forma e sempre funciona… mas o mundo mudou e talvez o que nos levou ao sucesso e ser competitivo nos últimos 10 anos talvez não seja da mesma forma.", "by": "VANESSA"}, {"t": "h3", "h": "O conselheiro que ela descreve"}, {"t": "quote", "q": "O presidente do conselho de administração não quer ninguém ativista, seja para que lado. Ativista de diversidade e inclusão, ativista de direitos humanos, ativista ambiental e climático. Ele não quer problema.", "by": "VANESSA"}, {"t": "quote", "q": "Sustentabilidade na pauta do conselho nunca são técnicas, eles são sobre negócios.", "by": "VANESSA"}, {"t": "quote", "q": "Os conselhos estão preparados para avaliar o desempenho da empresa nos temas ambientais e sociais? Não. Se não tiver ninguém técnico e não precisa ter, chama um especialista, chama um diretor.", "by": "VANESSA"}, {"t": "cap", "h": "A jornada ESG, do material impresso entregue em aula"}, {"t": "table", "head": ["<strong>Etapa<\/strong>", "<strong>O que acontece<\/strong>"], "rows": [["<strong>1. Diagnóstico<\/strong>", "Onde a empresa está"], ["<strong>2. Materialidade<\/strong>", "Os poucos temas que importam para este negócio"], ["<strong>3. Indicadores<\/strong>", "Metas de performance para cada tema material"], ["<strong>4. Remuneração variável<\/strong>", "Metas ESG no desempenho executivo"], ["<strong>5. Reporte<\/strong>", "Sistema de monitoramento e indicadores"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 82:38."}, {"t": "quote", "q": "ESG é um projeto, pessoal? É uma mudança estrutural. A descarbonização é um projeto? Não.", "by": "VANESSA"}, {"t": "box", "kind": "atencao", "title": "SEM INCENTIVO, A AGENDA NÃO ANDA — E COM INCENTIVO ERRADO, ELA VIRA RISCO", "items": [{"h": "<em>“Se não tiver atrelado o meta do ESG ao desempenho executivo e remuneração variável, a gente não vai avançar.”<\/em>"}, {"h": "Ela fechou com Fábio Barbosa, palestrante da primeira turma: “o conselheiro não tem o dever de maximizar resultados e sim perenizar a empresa… A busca pelo bônus é fator de risco.” E: “Sistemas de remuneração perversos podem dar errado… Ética é inegociável.”"}, {"h": "As duas frases cabem na mesma pauta do comitê de remuneração. Uma pede incentivo. A outra pede critério para o incentivo não virar o problema."}]}, {"t": "quote", "q": "Laranja podre não importa quanto que traz de resultado para a organização, precisa ser descartada.", "by": "FÁBIO BARBOSA, CITADO POR VANESSA"}, {"t": "p", "h": "E a frase que veio em seguida, na voz dela: “A gente tem que ter coragem de conduzir o negócio da maneira correta, porque é correto.” É o segundo C do meu livro, Coragem, dito com todas as letras."}, {"t": "h3", "h": "Pontos de atenção"}, {"t": "ul", "items": ["<strong>Presença não é integração.<\/strong> Ter comitê de sustentabilidade não significa ter ESG na estratégia.", "<strong>Empresa pouco emissora pode ser muito exposta.<\/strong> O mapa de risco precisa mostrar como um risco potencializa o outro.", "<strong>A cadeia terceirizada é onde mora o risco social.<\/strong> Salário digno, na definição da ONU, cobre moradia, comida e vestimenta.", "<strong>Decisão legal pode ser decisão de conselho.<\/strong> Planejamento tributário agressivo e multa como modelo de negócio passam pela ética antes de passar pelo jurídico.", "<strong>Pauta anual é sintoma.<\/strong> Se ESG só aparece “por volta de março”, com o relatório, não está na estratégia."]}, {"t": "box", "kind": "verif", "title": "VERIFICAÇÃO DE FATO", "items": [{"h": "<strong>Não dito em aula, mas muda a conversa.<\/strong> A Resolução CVM 193 previa o relatório de sustentabilidade no padrão ISSB como obrigatório para companhias abertas a partir de 2026. A <strong>Resolução CVM 244, de 29 de maio de 2026<\/strong>, tornou o relatório voluntário; a partir de 2027, quem não publicar terá de explicar ao mercado."}, {"h": "<strong>Salário mínimo de 2026:<\/strong> R$ 1.621, não R$ 1.641. <strong>Bisnagas em São Paulo:<\/strong> não é lei, é a Portaria CVS 3/2026, com prazo adiado para 1º de fevereiro de 2027. <strong>Sachês na União Europeia:<\/strong> o regulamento de embalagens proíbe porções individuais no setor de alimentação fora do lar a partir de 2030, não “esse ano”."}, {"h": "<strong>Zona Franca de Manaus:<\/strong> prorrogada até 2073 pela Emenda Constitucional 83, de 2014 — não “recentemente… por mais de 30 anos”. <strong>El Niño:<\/strong> o de 2023 e 2024, não “de 1924”."}, {"h": "<strong>NR-01 em casa:<\/strong> a ergonomia do teletrabalho vem sobretudo da NR-17 e do art. 75-E da CLT; a NR-01 atualizada inclui riscos psicossociais no gerenciamento de riscos, em fiscalização desde 26 de maio de 2026. <strong>Gripe aviária<\/strong> potencializada por calor e umidade: hipótese da professora, a validar com literatura veterinária."}]}, {"t": "box", "kind": "mesa", "title": "PARA LEVAR À MESA", "items": [{"n": "01", "h": "Quais são os três a cinco temas materiais da companhia — onde ela gera impacto e onde é impactada? Quando foi a última revisão?"}, {"n": "02", "h": "O mapa de risco estratégico mostra como riscos climáticos, sanitários, hídricos e logísticos se potencializam ao longo da cadeia?"}, {"n": "03", "h": "Qual é a nossa exposição sistêmica, a que não depende das nossas emissões?"}, {"n": "04", "h": "Como estamos frente à NR-01, e que indicadores de saúde mental, afastamento e acidente chegam ao conselho?"}, {"n": "05", "h": "Qual é a diligência de condições de trabalho na cadeia terceirizada?"}, {"n": "06", "h": "Que decisões legais, mas eticamente controversas, deveriam passar pelo conselho e hoje não passam?"}, {"n": "07", "h": "As metas ESG estão na remuneração variável dos executivos — e o desenho cria algum comportamento perverso?"}, {"n": "08", "h": "Diante da Resolução CVM 244, vamos publicar o relatório voluntariamente ou explicar ao mercado por que não?"}]}, {"t": "h3", "h": "Referências da sessão"}, {"t": "table", "head": ["<strong>Referência<\/strong>", "<strong>Como foi usada<\/strong>", "<strong>Observação<\/strong>"], "rows": [["<strong>MSCI ESG Ratings<\/strong>", "Como o mercado lê maturidade, por setor", "Ferramenta pública, filtrável por setor"], ["<strong>World Economic Forum — Global Risks Report<\/strong>", "Riscos globais majoritariamente ambientais", "—"], ["<strong>BID, Banco Mundial e Cepal — impacto das enchentes no RS<\/strong>", "R$ 87 bilhões em um único evento", "Conferido"], ["<strong>Capitalismo Consciente<\/strong>", "Propósito, stakeholders, liderança e cultura", "—"], ["<strong>Izabella Teixeira, ex-ministra do Meio Ambiente<\/strong>", "“Parar com o cinismo climático”", "—"], ["<strong>Fábio Barbosa<\/strong>", "Perenizar, não maximizar", "Palestrante da primeira turma"], ["<strong>Casos: Natura, BRF, Coca-Cola, Reiter Log, Zona Franca, Havaianas<\/strong>", "Ilustrações", "Correções no Anexo B"]]}, {"t": "src", "h": "Fonte: transcrição integral da sessão e verificação contra as fontes primárias."}], "notes": ["Os três temas materiais da empresa em que eu mais gostaria de ter uma cadeira", "Como eu levo saúde mental ao conselho como risco, e não como benefício", "O indicador de gente que eu colocaria na remuneração variável do CEO"], "meta": "11h24  ·  83 minutos  ·  “uma discussão qualificada”, nas palavras dela, e não uma palestra"}, {"num": "2.6", "head": "2.6  Elisa Prado — Gestão de crises e reputação na era digital", "blocks": [{"t": "stats", "items": [{"n": "1 hora", "l": "para o primeiro posicionamento"}, {"n": "1 parágrafo", "l": "é o tamanho da nota oficial"}, {"n": "1 semana", "l": "dura a janela quente da crise"}, {"n": "1 pessoa", "l": "impactada já faz de um incidente uma crise"}]}, {"t": "h3", "h": "Ficha da professora"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória, conforme dita em aula<\/strong>"], "rows": [["<strong>Carreira<\/strong>", "Tetra Pak e, por “mais de 10 anos”, Vivo, onde foi diretora de comunicação “cuidando exatamente daquele negócio de gestão de crise”. Participou de reuniões do conselho da Vivo."], ["<strong>Hoje<\/strong>", "Professora da ESPM em gestão de riscos e crises; consultora em cultura corporativa."], ["<strong>Autoria<\/strong>", "Livros sobre reputação e gestão de crise, entre eles <em>Gestão de Reputação<\/em> (Aberje). Sorteou um exemplar para quem mais participou."]]}, {"t": "p", "h": "O título da gravação falava em painel. Foi uma aula de uma palestrante só, com a turma intervindo o tempo todo. A sessão sobre protocolo de comunicação para conselheiros, anunciada na grade, não está nas gravações."}, {"t": "h3", "h": "A tese: não é se, é quando — e o preparo separa as empresas"}, {"t": "quote", "q": "Hoje a reputação realmente se tornou uma vantagem. Então, ter reputação… uma condição sine qua non para existir.", "by": "ELISA PRADO"}, {"t": "quote", "q": "O mais importante é a preparação. A gente chama em inglês, o readiness… as empresas não detêm mais a hegemonia discursiva.", "by": "ELISA PRADO"}, {"t": "quote", "q": "Ou vocês, como CEOs, como donos da empresa, fazem um posicionamento para colaboradores. Isso vaza. Vaza.", "by": "ELISA PRADO"}, {"t": "p", "h": "A definição de reputação que ela usou é a que eu vou repetir em sala:"}, {"t": "quote", "q": "Diz o que falam de você quando você sai da sala? Reputação. Então é percepção de alguém, é um vínculo emocional realmente de respeito, de admiração e confiança.", "by": "ELISA PRADO"}, {"t": "quote", "q": "Você não compra, você não aluga. Você constrói. Ao longo do tempo, aos pouquinhos com ações.", "by": "ELISA PRADO"}, {"t": "p", "h": "Para mostrar o ponto, ela pediu à turma a primeira palavra que vinha à cabeça com o nome de Neymar. Vieram confusão, festa, indisciplina. Ninguém disse “excelente jogador”. Reputação é isso: o desempenho não aparece quando a conduta fala mais alto."}, {"t": "h3", "h": "Crise ou incidente"}, {"t": "cap", "h": "Incidente × crise, segundo Elisa Prado"}, {"t": "table", "head": ["<strong>Critério<\/strong>", "<strong>Incidente<\/strong>", "<strong>Crise<\/strong>"], "rows": [["<strong>Pessoas atingidas<\/strong>", "Ninguém", "Uma pessoa já basta"], ["<strong>Alcance<\/strong>", "Fica dentro da empresa", "Sai do controle e chega aos stakeholders"], ["<strong>Reação típica<\/strong>", "—", "Querer “cair fora”, fechar os ouvidos, “isso não é comigo”"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 59:05 a 62:18."}, {"t": "quote", "q": "Se tem gente impactada, se tem uma pessoa impactada, é uma crise.", "by": "ELISA PRADO"}, {"t": "h3", "h": "O passo a passo — e a janela de uma hora"}, {"t": "cap", "h": "O passo a passo da gestão de crise"}, {"t": "table", "head": ["<strong>#<\/strong>", "<strong>Etapa<\/strong>", "<strong>Na fala de Elisa<\/strong>"], "rows": [["<strong>1<\/strong>", "Entender a causa raiz", "“O que causou aquilo? Causa raiz.”"], ["<strong>2<\/strong>", "Dimensionar: crise ou incidente", "Ver o tamanho do problema"], ["<strong>3<\/strong>", "Reflexos e atores", "Plano moral, econômico; quem são os atores principais"], ["<strong>4<\/strong>", "Objetivos e estratégia", "O que se quer proteger"], ["<strong>5<\/strong>", "Narrativa por stakeholder", "Investidores, colaboradores, mercado, clientes"], ["<strong>6<\/strong>", "Nota oficial", "“Apenas um parágrafo”: o que ocorreu, o que está acontecendo, o que se vai fazer"], ["<strong>7<\/strong>", "Porta-voz", "Preparado antes"], ["<strong>8<\/strong>", "Mapa de stakeholders", "Regulador, conselho, colaboradores"], ["<strong>9<\/strong>", "Comunicar", "Por último, depois de tudo definido"], ["<strong>10<\/strong>", "Lições aprendidas", "“Acaba um problema e pode voltar daqui uma semana”"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 62:48 a 70:23."}, {"t": "quote", "q": "Se você não resolve e soluciona uma crise em uma hora… você perde o bonde. De novo, se você não contar a sua história, alguém vai contar… uma vez uma verdade instalada, é muito difícil.", "by": "ELISA PRADO"}, {"t": "p", "h": "Quando ainda não há dados, a primeira nota assume a responsabilidade e promete a resposta: a empresa está apurando e, assim que tiver um parecer, os afetados “serão os primeiros a saber”. Silêncio também comunica — e a conta chega."}, {"t": "h3", "h": "O conselho não fala — até o dia em que precisa falar"}, {"t": "quote", "q": "O conselheiro… Ele não põe a mão na crise… Você está na fase do aconselhamento.", "by": "ELISA PRADO"}, {"t": "quote", "q": "O conselho não fala, então. Quem fala é o executivo, é o CEO que deve ser o porta-voz ou alguém que ele definir. Se é uma crise de… é um diretor de recursos humanos, se é uma crise industrial, é o diretor industrial.", "by": "ELISA PRADO"}, {"t": "cap", "h": "Papel do conselho × diretoria na crise"}, {"t": "table", "head": ["<strong>Situação<\/strong>", "<strong>Quem fala<\/strong>"], "rows": [["<strong>Regra geral<\/strong>", "O CEO ou o porta-voz técnico que ele designar"], ["<strong>Erro típico<\/strong>", "O presidente do conselho falando por conta própria, em outra direção"], ["<strong>Tempo normal<\/strong>", "O conselheiro aconselha, cobra a matriz de risco e acompanha a mitigação"], ["<strong>Vácuo de liderança executiva<\/strong>", "O presidente do conselho ou o acionista de referência, depois de falar com os colaboradores"], ["<strong>CEO demissionário<\/strong>", "Nunca é porta-voz"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 31:36, 69:53, 70:23, 114:06 e 120:52."}, {"t": "box", "kind": "atencao", "title": "O CONSELHEIRO É O ÚLTIMO A SABER", "items": [{"h": "<em>“O que está acontecendo, ninguém vai te contar, porque eu sou a que… é responsável. Pode ser demitida.”<\/em>"}, {"h": "É o diagnóstico de uma cultura de medo, dito por quem esteve em reunião de conselho. Segurança psicológica e canal de escalada não são tema de clima. São a infraestrutura que impede o conselho de descobrir a crise pelo jornal."}, {"h": "Por isso a pergunta de entrada que ela recomendou: “Quais são as coisas que têm maior probabilidade de acontecer e que podem gerar maior impacto na nossa ação?”"}]}, {"t": "quote", "q": "Essas crises todas que nós falamos aqui, elas já estavam mapeadas.", "by": "ELISA PRADO"}, {"t": "h3", "h": "O que não fazer"}, {"t": "cap", "h": "Os erros mais citados"}, {"t": "table", "head": ["<strong>Erro<\/strong>", "<strong>Como apareceu em aula<\/strong>"], "rows": [["<strong>Responder sem alinhamento interno<\/strong>", "A “lição número 1”"], ["<strong>Brigar com imprensa ou regulador pela mídia<\/strong>", "“Senta lá, vai lá na Anvisa, senta lá com eles, conversa.”"], ["<strong>Terceirizar a culpa<\/strong>", "O caso do cachorro numa loja do Carrefour, em 2018"], ["<strong>Confrontar o jornalista<\/strong>", "“Vou colocar o cara no pau… Que pau que é, gente?”"], ["<strong>Arrogância<\/strong>", "A empresa que se acha boa demais para errar"], ["<strong>Comunicar antes de agir<\/strong>", "A Vale depois das barragens"], ["<strong>Ignorar as redes<\/strong>", "Relevância de quem fala pesa mais que o volume"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 50:20 e 69:53 a 74:30."}, {"t": "p", "h": "Dois casos da tarde passam por empresas em que trabalhei. Sobre a Vale, a leitura dela:"}, {"t": "quote", "q": "Foi lá para baixo e ainda não saiu. E olha que tem muito trabalho sendo feito.", "by": "ELISA PRADO, SOBRE A REPUTAÇÃO DA VALE"}, {"t": "quote", "q": "Cuidado para se comunicar enquanto você está no início das suas ações. Isso gera desconfiança.", "by": "ELISA PRADO"}, {"t": "p", "h": "Um colega de turma que trabalhava no entorno da Samarco deu o depoimento mais forte da tarde: depois de uma tragédia, “você passa a não ter o direito nem de fazer o bem”. A licença social perdida não volta com campanha."}, {"t": "h3", "h": "Os casos que a sala discutiu"}, {"t": "cap", "h": "Os casos discutidos em aula"}, {"t": "table", "head": ["<strong>Caso<\/strong>", "<strong>Leitura de Elisa<\/strong>"], "rows": [["<strong>Itaú, demissão de mil pessoas por registro de jornada<\/strong>", "“Antes de demitir essas mil pessoas, você tem que estar muito bem preparado para o que virá.”"], ["<strong>Nubank e Anitta no conselho<\/strong>", "Separar quem fala de um tema de quem delibera sobre ele"], ["<strong>Havaianas e Fernanda Torres<\/strong>", "Não houve gestão de risco antes da campanha; a ação caiu e voltou em dias"], ["<strong>Ypê<\/strong>", "“Não foi uma crise técnica, foi uma crise de comunicação.”"], ["<strong>Toyota, fábrica destruída por vendaval<\/strong>", "Comitê e processo já instalados antes da crise"], ["<strong>Nestlé, recall de fórmula infantil<\/strong>", "Recolhimento imediato e instrução clara ao consumidor"]]}, {"t": "src", "h": "Fonte: transcrição da sessão; datas e números conferidos no Anexo B."}, {"t": "quote", "q": "Ela era dedicada a ESG, eu ouvia essa pessoa falar sobre isso, eu não ouvia ela deliberar sobre isso. O importante é você ter em mente qual é a função, qual é o propósito daquela pessoa.", "by": "ELISA PRADO, SOBRE UMA PARTICIPANTE DAS REUNIÕES DE CONSELHO DA VIVO"}, {"t": "p", "h": "Nas redes, o critério é relevância antes de volume:"}, {"t": "quote", "q": "Calma! Quem é que está falando? Quantas pessoas estão falando? Qual a relevância dessas pessoas?", "by": "ELISA PRADO"}, {"t": "h3", "h": "O exercício: a crise da Americanas"}, {"t": "p", "h": "Em grupos, a turma refez a comunicação dos dias seguintes ao fato relevante de janeiro de 2023. O foco não era a fraude — era quem fala, o quê e com que transparência."}, {"t": "cap", "h": "A crise da Americanas reescrita pela turma"}, {"t": "table", "head": ["<strong>Quem<\/strong>", "<strong>Proposta<\/strong>"], "rows": [["<strong>Grupo 1<\/strong>", "Executivo de carreira como porta-voz técnico; não terceirizar a um banco “que tem interesses de mercado”"], ["<strong>Grupo 2<\/strong>", "O presidente do conselho assume como porta-voz no primeiro momento"], ["<strong>Grupo 3<\/strong>", "Comitê específico e afastamento imediato da auditoria"], ["<strong>Elisa, o que deveria ter sido feito<\/strong>", "Presidente do conselho ou acionista de referência, depois dos colaboradores: denúncia, apuração rigorosa, comitê independente. Anunciar afastamento do CEO, não renúncia"], ["<strong>Elisa, o erro<\/strong>", "O CEO demissionário como porta-voz; a nota dos acionistas de referência dizendo que não sabiam"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 94:42 a 121:26."}, {"t": "quote", "q": "Resumindo: falta de liderança no momento. Total falta de liderança… Um senhor demissionário não deveria nunca ter sido o porta-voz.", "by": "ELISA PRADO"}, {"t": "p", "h": "O contraponto mais sério veio de um colega: se o CEO tivesse alinhado antes com o conselho, o conselho talvez tivesse abafado a descoberta. Elisa aceitou — “Sim, tem razão.” O dilema ficou aberto na sala e merece ficar aberto aqui."}, {"t": "p", "h": "Alinhamento sem independência vira abafamento."}, {"t": "box", "kind": "leitura", "title": "EM CRISE DE GENTE, O RH NÃO É BASTIDOR", "items": [{"h": "Elisa deu ao CHRO um papel que poucos manuais dão: em crise de pessoas, o porta-voz é “um diretor de recursos humanos”. Assédio, demissão coletiva, morte em operação — o rosto da empresa é o de quem cuida de gente."}, {"h": "E lembrou quem é o primeiro veículo de qualquer crise: os colaboradores, que “vão para as rodas… para o restaurante, para o barzinho, para a família… São promotores”."}, {"h": "<strong><em>Media training, mandato no comitê de crise e trilha de comunicação interna são entregáveis de RH. Não favores da comunicação.<\/em><\/strong>"}]}, {"t": "box", "kind": "verif", "title": "VERIFICAÇÃO DE FATO", "items": [{"h": "<strong>Emerson.<\/strong> A frase de abertura é paráfrase de um texto de 1875 (<em>Letters and Social Aims<\/em>), não de 1840. <strong>Churchill:<\/strong> a ideia de que uma boa crise é oportunidade, atribuída a ele em aula, vem de uma frase associada a Rahm Emanuel, em 2008. <strong>O ideograma chinês<\/strong> de crise como “perigo + oportunidade” é mito difundido."}, {"h": "<strong>Bradesco.<\/strong> A campanha da “segunda sem carne”, do fim de 2021, foi retirada e o presidente do banco divulgou nota. Não localizei registro da queda do diretor de marketing nem da saída da agência."}, {"h": "<strong>Ypê.<\/strong> O recolhimento voluntário foi em novembro de 2025 e a determinação da Anvisa, em maio de 2026 — não “começou em 2024”. <strong>Global Risks Report 2026:<\/strong> mais de 1.300 especialistas consultados, não 900. <strong>Nestlé:<\/strong> o recall foi em janeiro de 2026, nove meses antes da aula."}, {"h": "<strong>Carrefour.<\/strong> O caso do cão em Osasco é de novembro de 2018. A nota da empresa noticiada à época fala em colaborar com a investigação; não localizei a frase “é um terceiro” citada em aula."}, {"h": "<strong>Americanas.<\/strong> A saída do CEO e do CFO veio no fato relevante de 11 de janeiro de 2023, junto com as “inconsistências” de cerca de R$ 20 bilhões; a ação caiu cerca de 77% no dia seguinte e a recuperação judicial foi pedida em 19 de janeiro."}]}, {"t": "box", "kind": "mesa", "title": "PARA LEVAR À MESA", "items": [{"n": "01", "h": "Onde está a matriz de riscos reputacionais, quais os cinco maiores em probabilidade e impacto, e quem é dono de cada mitigação?"}, {"n": "02", "h": "Temos comitê de crise formal, porta-vozes por tipo de crise e um simulado feito nos últimos 12 meses?"}, {"n": "03", "h": "Quem aprova a primeira nota sem esperar a próxima reunião — e conseguimos fazer isso em uma hora?"}, {"n": "04", "h": "Antes da próxima campanha, discurso ou reestruturação, alguém perguntou: se der errado, como respondemos?"}, {"n": "05", "h": "Em vácuo executivo, quem fala pela companhia? Isso está escrito?"}, {"n": "06", "h": "Como a sequência de stakeholders — mercado, colaboradores, regulador, clientes — se concilia com as regras de fato relevante?"}, {"n": "07", "h": "Como o conselho recebe más notícias, e o que impede que ele seja o último a saber?"}, {"n": "08", "h": "Depois da última crise, que lições registramos e o que mudou de fato?"}]}, {"t": "h3", "h": "Referências da sessão"}, {"t": "table", "head": ["<strong>Referência<\/strong>", "<strong>Como foi usada<\/strong>", "<strong>Observação<\/strong>"], "rows": [["<strong>Elisa Prado — <em>Gestão de Reputação<\/em> (Aberje)<\/strong>", "Livro sorteado em aula", "—"], ["<strong>World Economic Forum — Global Risks Report 2026<\/strong>", "Desinformação com IA no vermelho da matriz", "1.300+ especialistas"], ["<strong>Matriz de riscos ISO e modelo de Patrícia Teixeira<\/strong>", "Prevenção, preparação e resposta", "Matriz prometida via coordenação"], ["<strong>Warren Buffett<\/strong>", "20 anos para construir, cinco minutos para destruir", "—"], ["<strong>Casos: Americanas, Vale, Samarco, Itaú, Nubank, Havaianas, Ypê, Bradesco, Toyota, Nestlé, Carrefour<\/strong>", "Ilustrações", "Correções no Anexo B"]]}, {"t": "src", "h": "Fonte: transcrição integral da sessão e verificação contra as fontes primárias."}], "notes": ["Como eu falo, em três frases, das crises das empresas em que trabalhei quando o tema surgir numa mesa", "O risco reputacional de pessoas que eu colocaria no vermelho da matriz de uma empresa que conheço", "Em que situação eu aceitaria ser porta-voz como conselheiro"], "meta": "14h11  ·  102 minutos  ·  aula expositiva com exercício em grupos sobre a crise da Americanas"}, {"num": "3.1", "head": "3.1  Os números de partida", "blocks": [{"t": "table", "head": ["<strong>Conta (R$ mil)<\/strong>", "<strong>Ano 1<\/strong>", "<strong>Ano 2<\/strong>", "<strong>Variação<\/strong>"], "rows": [["<strong>Caixa<\/strong>", "900", "1.300", "+400"], ["<strong>Recebíveis<\/strong>", "1.600", "1.850", "+250"], ["<strong>Estoques<\/strong>", "1.200", "1.300", "+100"], ["<strong>Imobilizado + intangível<\/strong>", "3.800", "4.020", "+220"], ["<strong>Passivo circulante<\/strong>", "1.900", "2.050", "+150"], ["<strong>Passivo não circulante<\/strong>", "1.600", "1.550", "−50"], ["<strong>Patrimônio líquido<\/strong>", "4.000", "4.870", "+870"], ["<strong>Receita líquida<\/strong>", "8.200", "9.430", "+15%"], ["<strong>EBITDA<\/strong>", "1.400", "1.830", "17,1% → 19,4%"], ["<strong>Depreciação e amortização<\/strong>", "400", "430", "—"], ["<strong>Lucro líquido<\/strong>", "495", "772", "6,0% → 8,2%"]]}, {"t": "src", "h": "Fonte: slides 12 a 15 do deck de Clairton Araujo."}], "notes": [], "meta": "Figura 37. O caso teórico, contas selecionadas"}, {"num": "3.2", "head": "3.2  A DFC reconstruída — método indireto, Ano 2", "blocks": [{"t": "table", "head": ["<strong>Linha<\/strong>", "<strong>R$ mil<\/strong>", "<strong>Como se chega<\/strong>"], "rows": [["<strong>Lucro líquido<\/strong>", "772", "DRE"], ["<strong>(+) Depreciação e amortização<\/strong>", "430", "DRE — não sai do caixa"], ["<strong>(−) Aumento de recebíveis<\/strong>", "−250", "Vendeu e ainda não recebeu"], ["<strong>(−) Aumento de estoques<\/strong>", "−100", "Comprou e ainda não vendeu"], ["<strong>(+) Aumento do passivo circulante<\/strong>", "150", "Hipótese: todo operacional (fornecedores, salários, tributos)"], ["<strong>Fluxo de caixa operacional<\/strong>", "<strong>1.002<\/strong>", "O lucro virou 1,30 vez em caixa"], ["<strong>(−) Investimentos<\/strong>", "−650", "Aumento do imobilizado e intangível (220) + D&amp;A (430)"], ["<strong>Fluxo de caixa livre<\/strong>", "<strong>352<\/strong>", "3,7% da receita"], ["<strong>(−) Redução do passivo não circulante<\/strong>", "−50", "Hipótese: amortização de dívida"], ["<strong>(+) Variação do PL não explicada pelo lucro<\/strong>", "98", "870 − 772: aporte? ajuste? É a pergunta da DMPL"], ["<strong>Variação do caixa<\/strong>", "<strong>400<\/strong>", "Confere com o balanço: 900 → 1.300"]]}, {"t": "src", "h": "Fonte: cálculo deste caderno sobre os números do deck. As hipóteses estão declaradas na coluna da direita."}, {"t": "box", "kind": "leitura", "title": "O QUE A DFC MOSTRA QUE OS ÍNDICES NÃO MOSTRAVAM", "items": [{"n": "01", "h": "A empresa converte lucro em caixa. Fluxo operacional de 1.002 contra lucro de 772. Pela régua de Clairton, é o melhor sinal possível."}, {"n": "02", "h": "O crescimento consome capital de giro. Recebíveis e estoques prenderam 350 dos 1.002 gerados. Com receita crescendo 15%, isso é esperado — e precisa ser acompanhado."}, {"n": "03", "h": "O patrimônio cresceu 98 mais do que o lucro, e ninguém explicou. Se houve dividendo mínimo obrigatório (25% do lucro ajustado, pela Lei 6.404), a diferença é ainda maior. É exatamente o tipo de pergunta que a DMPL e as notas explicativas existem para responder."}, {"n": "04", "h": "O slide chama de “Dívida/PL” o passivo total sobre o PL (3.500 ÷ 4.000 = 0,88). Não é dívida financeira. Se o passivo não circulante for todo dívida, a dívida líquida é de 250 e a alavancagem, de 0,14 vez o EBITDA — muito confortável."}]}], "notes": [], "meta": "Figura 38. DFC do Ano 2 reconstruída a partir do balanço e da DRE"}, {"num": "3.3", "head": "3.3  Os índices, conferidos", "blocks": [{"t": "table", "head": ["<strong>Índice<\/strong>", "<strong>Ano 1<\/strong>", "<strong>Ano 2<\/strong>", "<strong>Leitura<\/strong>"], "rows": [["<strong>Liquidez corrente<\/strong>", "1,95", "2,17", "Folga crescente; parte pode ser dinheiro parado"], ["<strong>Liquidez seca<\/strong>", "1,32", "1,54", "Confortável mesmo sem estoque"], ["<strong>Margem bruta<\/strong>", "43,9%", "45,4%", "Custo caiu de 56,1% para 54,6% da receita"], ["<strong>Margem EBITDA<\/strong>", "17,1%", "19,4%", "Alavancagem operacional: despesas cresceram menos que a receita"], ["<strong>Margem líquida<\/strong>", "6,0%", "8,2%", "O slide deixou o Ano 1 em branco; o valor é 6,0%"], ["<strong>ROE (sobre PL final)<\/strong>", "12,4%", "15,9%", "Confere com o deck"], ["<strong>Prazo de recebimento<\/strong>", "70 dias", "71 dias", "Estável — o crescimento não veio de prazo esticado"]]}, {"t": "src", "h": "Fonte: cálculo deste caderno; os índices do slide 15 conferem."}], "notes": [], "meta": "Figura 39. Índices do caso teórico, recalculados"}, {"num": "3.4", "head": "3.4  A resposta limpa: de 6% para 8,2% de margem líquida", "blocks": [{"t": "p", "h": "O que falta saber — e é a pergunta de conselheiro — é se a queda de custo é estrutural ou de mix. Número bom sem causa conhecida é sorte, não gestão."}], "notes": [], "meta": "Clairton pediu uma resposta objetiva, sem enrolação. Com os números, ela cabe em três linhas: a margem bruta subiu 1,5 ponto porque o custo caiu proporcionalmente; as despesas operacionais cresceram menos que a receita e ganharam 0,8 ponto; o resultado financeiro melhorou de −250 para −230. O lucro subiu 56% sobre uma receita 15% maior."}, {"num": "3.5", "head": "3.5  Folha de trabalho", "blocks": [], "notes": [], "meta": "As três perguntas que eu faria ao CFO sobre este caso, em ordem — e o que eu pediria para constar em ata:"}]}</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const ENC = {1:D.e1, 2:D.e2};
const FULL = JSON.parse(document.getElementById('full').textContent);
const END = {1:'2026-08-05', 2:'2026-10-07'};
const NEXT = {1:'Encontro 2', 2:'Encontro 3'};
const IV = [0,1,3,7,14,30];
const BOXN = ['Novo','1 dia','3 dias','7 dias','14 dias','30 dias'];
const QUAL = {melhor:['Melhor caminho','t-good'], aceitavel:['Aceitável','t-warn'], fragil:['Frágil','t-bad']};
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* ---------- utilidades ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const lsGet = k => { try { const v = localStorage.getItem('sala:'+k); return v ? JSON.parse(v) : null; } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem('sala:'+k, JSON.stringify(v)); } catch(e){} };
const clone = o => JSON.parse(JSON.stringify(o));
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const [y,m,d]=s.split('-').map(Number); const t=new Date(y,m-1,d+n); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
function fmt(s){ const [y,m,d]=s.split('-').map(Number); return d+' '+MESES[m-1]; }
function fmtTs(t){ const d=new Date(t); return d.getDate()+' '+MESES[d.getMonth()]+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
const sessById = {}; [1,2].forEach(e=>ENC[e].sessoes.forEach(s=>sessById[s.id]=s));
const allCards = [1,2].flatMap(e=>ENC[e].cartoes.map(c=>Object.assign({enc:e},c)));

/* ---------- estado ---------- */
const UI = Object.assign({sess:{}, enc:2, sec:'trilha', revScope:'enc', revSess:'', dil:{}, ex:{}, ref:'casos', q:''}, lsGet('ui')||{});
const P = {
  prog: lsGet('prog') || {cards:{}, trail:{}, acoes:{}, picks:{}, updatedAt:0},
  ex_e1: lsGet('ex_e1') || {answers:{}, updatedAt:0},
  ex_e2: lsGet('ex_e2') || {answers:{}, updatedAt:0}
};
['cards','trail','acoes','picks','notes'].forEach(k=>{ P.prog[k] = P.prog[k] || {}; });
let db=null, user=null, uid=null, remote=false;
let VOTES = {}, MURAL = [];
if (UI.sec==='turma') UI.sec='trilha';
const saveUI = () => lsSet('ui', {sess:UI.sess, enc:UI.enc, sec:UI.sec, revScope:UI.revScope, revSess:UI.revSess, dil:UI.dil, ex:UI.ex, ref:UI.ref});

/* gravação: local sempre; conta quando disponível, uma escrita por vez por documento */
const timers = {}, chains = {};
function persist(name, quick){
  P[name].updatedAt = Date.now();
  lsSet(name, P[name]);
  if (!remote) return;
  clearTimeout(timers[name]);
  timers[name] = setTimeout(()=>{
    const body = clone(P[name]);
    chains[name] = (chains[name]||Promise.resolve()).then(()=>db.doc('data/users/'+uid+'/'+name).set(body)).then(()=>setSync(true)).catch(e=>{
      if (e && e.code === 'invalid_argument'){ remote=false; setSync(false); }
    });
  }, quick ? 50 : 900);
}
function setSync(ok){ document.getElementById('sync').textContent = ok ? 'Progresso salvo na sua conta' : 'Progresso salvo neste navegador'; }

/* ---------- navegação ---------- */
const main = document.getElementById('main');
function go(sec, extra){ UI.sec = sec; if (extra) Object.assign(UI, extra); if (sec==='revisao') rev=null; saveUI(); render(); window.scrollTo({top:0}); }
document.querySelectorAll('[data-sec]').forEach(b=>b.addEventListener('click',()=>{ if (b.dataset.sec==='sessoes' && UI.sec==='sessoes'){ UI.sess=UI.sess||{}; UI.sess[UI.enc]=null; } go(b.dataset.sec); }));
document.querySelectorAll('[data-enc]').forEach(b=>b.addEventListener('click',()=>{ UI.enc=+b.dataset.enc; UI.revSess=''; UI.sess=UI.sess||{}; rev=null; saveUI(); render(); }));

function render(){
  document.querySelectorAll('[data-enc]').forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.enc===UI.enc)));
  document.querySelectorAll('[data-sec]').forEach(b=>{ if (b.dataset.sec===UI.sec) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  main.replaceChildren(...(VIEWS[UI.sec]||VIEWS.trilha)().flat(3).filter(Boolean));
}

/* ---------- métricas ---------- */
function stats(e){
  const cs = ENC[e].cartoes;
  const seen = cs.filter(c=>P.prog.cards[c.id]).length;
  const dom = cs.filter(c=>(P.prog.cards[c.id]||{}).b>=4).length;
  const dil = ENC[e].dilemas.filter(d=>P.prog.picks[d.id]).length;
  const ans = P['ex_e'+e].answers;
  const ex = ENC[e].exercicios.filter(x=>ans[x.id] && Object.values(ans[x.id]).some(v=>v && v.trim())).length;
  return {cs:cs.length, seen, dom, dil, dils:ENC[e].dilemas.length, ex, exs:ENC[e].exercicios.length};
}
function dueCount(cards){ const t=today(); return cards.filter(c=>{ const s=P.prog.cards[c.id]; return !s || s.due<=t; }).length; }

/* ---------- Trilha ---------- */
function vTrilha(){
  const e = UI.enc, E = ENC[e], st = stats(e), t = today();
  const steps = [
    {k:'d1', d:1, t:'Rever as ideias-força', s:'As teses do encontro e a ideia central de cada sessão, em dez minutos.', go:'sessoes', cta:'Abrir sessões'},
    {k:'d3', d:3, t:'Primeira revisão', s:'Dez cartões com a resposta escondida. Lembrar sem olhar é o que fixa.', go:'revisao', cta:'Começar revisão'},
    {k:'d7', d:7, t:'Um dilema de conselho', s:'Decida antes de ver como a turma votou e por quê.', go:'dilemas', cta:'Abrir dilemas'},
    {k:'d14', d:14, t:'Aplicação real', s:'Um exercício preenchido com uma empresa de verdade, a sua ou uma em que você quer uma cadeira.', go:'exercicios', cta:'Abrir exercícios'},
    {k:'pre', d:null, t:'Antes do '+NEXT[e], s:'Uma rodada final de revisão e as ações do encontro conferidas: o que já saiu do papel e o que você levou para o seu conselho.', go:'revisao', cta:'Rodada final'}
  ];
  const trail = h('ol',{class:'trail'}, steps.map(s=>{
    const key = 'e'+e+':'+s.k, done = !!P.prog.trail[key];
    const date = s.d ? addDays(END[e], s.d) : null;
    let status = done ? ['Feito','t-good'] : !date ? ['Em aberto','t-mute'] : date<t ? ['Atrasado','t-bad'] : date===t ? ['Hoje','t-warn'] : ['Em aberto','t-mute'];
    const cb = h('input',{type:'checkbox', id:'tr-'+key.replace(':','-'), onchange:ev=>{ P.prog.trail[key]=ev.target.checked; persist('prog'); render(); }});
    cb.checked = done;
    return h('li',{class: (!done && date===t) ? 'now' : null},
      h('div',{class:'when'}, s.d ? 'D+'+s.d : 'Pré', h('small',null, date ? fmt(date) : NEXT[e])),
      h('div',null, h('h4',null,s.t), h('p',null,s.s)),
      h('div',{class:'acts'}, h('span',{class:'tag '+status[1]}, status[0]), h('button',{class:'link', onclick:()=>go(s.go)}, s.cta), h('label',{class:'check'}, cb, 'Feito')));
  }));
  const acoes = h('ol',{class:'actions'}, E.acoes.map((a,i)=>{
    const key='e'+e+':'+i, done=!!P.prog.acoes[key];
    const cb = h('input',{type:'checkbox', id:'ac-'+e+'-'+i, onchange:ev=>{ P.prog.acoes[key]=ev.target.checked; persist('prog'); render(); }});
    cb.checked = done;
    return h('li',{class:done?'done':null}, cb, h('label',{for:'ac-'+e+'-'+i}, h('span',null,a)));
  }));
  return [
    h('p',{class:'eyebrow'}, 'Encontro '+e+' · '+E.datas),
    h('h2',{class:'sec'}, h('span',{class:'grad'}, E.titulo)),
    h('p',{class:'lede'}, 'O que este encontro deixa na mesa do conselheiro:'),
    h('ul',{class:'thesis'}, E.tese.map(x=>h('li',null,x))),
    h('div',{class:'stats'},
      h('div',{class:'stat'}, h('b',null, st.dom+'/'+st.cs), h('span',null,'cartões dominados (caixa de 14 dias ou mais)')),
      h('div',{class:'stat'}, h('b',null, String(dueCount(ENC[e].cartoes.map(c=>c))) ), h('span',null,'cartões para revisar hoje')),
      h('div',{class:'stat'}, h('b',null, st.dil+'/'+st.dils), h('span',null,'dilemas decididos')),
      h('div',{class:'stat'}, h('b',null, st.ex+'/'+st.exs), h('span',null,'exercícios iniciados'))),
    h('hr',{class:'rule'}),
    h('p',{class:'eyebrow'}, 'Trilha entre encontros'),
    h('p',{class:'lede'}, 'Cinco marcos contados a partir do último dia do encontro. O ritmo é seu: a plataforma não manda lembretes, ela mostra o que está vencendo.'),
    trail,
    h('hr',{class:'rule'}),
    h('p',{class:'eyebrow'}, 'Plano de ação do Encontro '+e),
    h('p',{class:'lede'}, 'As ações do workbook. Marque quando a ação sair do papel.'),
    acoes
  ];
}

/* ---------- Sessões ---------- */
function raw(tag, cls, html){ const el=document.createElement(tag); if (cls) el.className=cls; el.innerHTML=html; return el; }
function fullOf(e, num){ return (FULL['e'+e]||[]).find(s=>s.num===num); }
function sumOf(e, num){ return ENC[e].sessoes.find(s=>s.num===num); }
function blockEl(b){
  switch(b.t){
    case 'h3': return raw('h3','b-h3',b.h);
    case 'h4': return raw('h4','b-h4',b.h);
    case 'p': return raw('p','b-p',b.h);
    case 'punch': return raw('p','b-punch',b.h);
    case 'ul': return h('ul',{class:'b-ul'}, b.items.map(x=>raw('li',null,x)));
    case 'cap': return raw('p','b-cap',b.h);
    case 'src': return raw('p','b-src',b.h);
    case 'quote': return h('blockquote',{class:'q b-q'}, raw('p',null,'“'+b.q+'”'), raw('cite',null,b.by));
    case 'stats': return h('div',{class:'b-stats'}, b.items.map(x=>h('div',null, raw('b',null,x.n), raw('span',null,x.l))));
    case 'table': return h('div',{class:'tbl b-tbl'}, h('table',null,
        h('thead',null, h('tr',null, b.head.map(c=>raw('th',null,c)))),
        h('tbody',null, b.rows.map(r=>h('tr',null, r.map(c=>raw('td',null,c)))))));
    case 'box': {
      const lab = b.title || (b.kind==='leitura' ? 'Leitura' : '');
      return h('aside',{class:'b-box k-'+b.kind}, lab ? raw('p','b-boxt',lab) : null,
        b.items.map(x=> x.n ? h('div',{class:'b-mesa'}, h('span',{class:'n'},x.n), raw('p',null,x.h)) : raw('p',null,x.h)));
    }
  }
  return null;
}
function vSessoes(){
  const e = UI.enc, list = FULL['e'+e] || [];
  const cur = (UI.sess||{})[e];
  if (cur){
    const i = list.findIndex(s=>s.num===cur);
    if (i>=0) return vSessao(e, list, i);
  }
  const groups = [['2','Sessões do encontro'],['3', e===1 ? 'Simulação de conselho' : 'Exercício guiado']];
  return [
    h('p',{class:'eyebrow'}, 'Encontro '+e+' · conteúdo completo do workbook'),
    h('h2',{class:'sec'}, 'Sessão por sessão'),
    h('p',{class:'lede'}, 'Cada sessão traz o texto integral do workbook: a tese, as tabelas, as leituras, as verificações de fato e as perguntas para levar à mesa.'),
    groups.map(([g,label])=>{
      const ss = list.filter(s=>s.num.startsWith(g+'.'));
      if (!ss.length) return null;
      return [h('p',{class:'eyebrow',style:'margin-top:36px'}, label),
        h('ol',{class:'sidx'}, ss.map(s=>{
          const sm = sumOf(e, s.num), title = s.head.replace(/^\d\.\d+\s+/,'');
          const [who, ...rest] = title.split(' — ');
          return h('li',null, h('button',{onclick:()=>{ UI.sess=UI.sess||{}; UI.sess[e]=s.num; saveUI(); render(); window.scrollTo({top:0}); }},
            h('span',{class:'n'}, s.num),
            h('span',{class:'t'}, h('strong',null, rest.length ? who : title), rest.length ? h('em',null, rest.join(' — ').replace(/[“”]/g,'')) : null,
              sm ? h('small',null, sm.ideia) : (s.meta ? raw('small',null, s.meta) : null)),
            h('span',{class:'go'}, 'Ler')));
        }))];
    })
  ];
}
function vSessao(e, list, i){
  const s = list[i], sm = sumOf(e, s.num), title = s.head.replace(/^\d\.\d+\s+/,'');
  const [who, ...rest] = title.split(' — ');
  const back = h('button',{class:'link', onclick:()=>{ UI.sess[e]=null; saveUI(); render(); window.scrollTo({top:0}); }}, '← Todas as sessões');
  const nav = (j,label)=> list[j] ? h('button',{class:'btn quiet', onclick:()=>{ UI.sess[e]=list[j].num; saveUI(); render(); window.scrollTo({top:0}); }}, label+' '+list[j].num) : h('span');
  const notesKey = 'e'+e+':'+s.num;
  P.prog.notes = P.prog.notes || {};
  const notes = s.notes && s.notes.length ? h('section',{class:'b-notes'},
    h('h3',{class:'b-h3'}, 'Minhas anotações desta sessão'),
    h('p',{class:'b-src'}, 'Ficam guardadas só para você.'),
    s.notes.map((q,k)=>{ const id='nt-'+e+'-'+s.num.replace('.','-')+'-'+k;
      const ta = h('textarea',{id, rows:'3', oninput:ev=>{ P.prog.notes[notesKey]=P.prog.notes[notesKey]||{}; P.prog.notes[notesKey][k]=ev.target.value; persist('prog'); }});
      ta.value = ((P.prog.notes[notesKey]||{})[k])||'';
      const l=raw('label',null,q); l.setAttribute('for',id); return h('div',{class:'fld'}, l, ta); })) : null;
  const n = sm ? ENC[e].cartoes.filter(c=>c.sessao===sm.id).length : 0;
  return [
    h('div',{style:'margin-bottom:22px'}, back),
    h('p',{class:'eyebrow'}, 'Encontro '+e+' · '+s.num),
    h('h2',{class:'sec'}, rest.length ? who : title),
    rest.length ? h('p',{class:'s-sub'}, rest.join(' — ')) : null,
    s.meta ? raw('p','s-meta', s.meta) : null,
    sm ? h('section',{class:'s-sum'},
      h('p',{class:'b-boxt'}, 'Em síntese'),
      h('p',null, sm.ideia),
      h('ul',{class:'b-ul'}, sm.pontos.map(p=>h('li',null,p))),
      n ? h('button',{class:'btn primary', onclick:()=>go('revisao',{revScope:'enc', revSess:sm.id})}, 'Revisar os '+n+' cartões desta sessão') : null) : null,
    h('article',{class:'s-body'}, s.blocks.map(blockEl)),
    notes,
    h('div',{class:'s-nav'}, nav(i-1,'←'), nav(i+1,'→'))
  ];
}

/* ---------- Revisão (Leitner) ---------- */
let rev = null;
function poolCards(){
  let cs = UI.revScope==='both' ? allCards : allCards.filter(c=>c.enc===UI.enc);
  if (UI.revSess) cs = cs.filter(c=>c.sessao===UI.revSess);
  return cs;
}
function buildRev(){
  const t = today();
  const due = poolCards().filter(c=>{ const s=P.prog.cards[c.id]; return !s || s.due<=t; })
    .sort((a,b)=>{ const sa=P.prog.cards[a.id], sb=P.prog.cards[b.id]; return (sa?sa.due:'0').localeCompare(sb?sb.due:'0') || (sa?sa.b:0)-(sb?sb.b:0); });
  rev = {queue: due.slice(0,10).map(c=>c.id), idx:0, shown:false, ok:0, again:new Set()};
}
function grade(g){
  const id = rev.queue[rev.idx], s = P.prog.cards[id] || {b:0, due:today()};
  let b = s.b;
  if (g===0){ b = 1; if (!rev.again.has(id)){ rev.again.add(id); rev.queue.push(id); } }
  else if (g===1){ b = Math.max(1, b); }
  else { b = Math.min(5, b+1); rev.ok++; }
  P.prog.cards[id] = {b, due: addDays(today(), g===0 ? 1 : IV[b])};
  persist('prog');
  rev.idx++; rev.shown=false; render();
}
function vRevisao(){
  if (!rev) buildRev();
  const pool = poolCards(), t = today();
  const sessOpts = (UI.revScope==='both'?[1,2]:[UI.enc]).flatMap(e=>ENC[e].sessoes);
  const sel = h('select',{id:'rev-sess', onchange:ev=>{ UI.revSess=ev.target.value; rev=null; saveUI(); render(); }},
    h('option',{value:''},'Todas as sessões'), sessOpts.map(s=>h('option',{value:s.id}, s.num+' · '+s.palestrante)));
  sel.value = UI.revSess;
  const counts = [0,0,0,0,0,0]; pool.forEach(c=>{ const s=P.prog.cards[c.id]; counts[s?s.b:0]++; });
  const side = h('aside',{class:'side'},
    h('h4',null,'Escopo'),
    h('div',{class:'chips'},
      h('button',{class:'chip','aria-pressed':String(UI.revScope==='enc'), onclick:()=>{UI.revScope='enc'; UI.revSess=''; rev=null; saveUI(); render();}}, 'Encontro '+UI.enc),
      h('button',{class:'chip','aria-pressed':String(UI.revScope==='both'), onclick:()=>{UI.revScope='both'; UI.revSess=''; rev=null; saveUI(); render();}}, 'Os dois encontros')),
    h('div',{style:'margin-top:14px'}, h('label',{for:'rev-sess',class:'t-mute',style:'font-size:12px'},'Sessão'), sel),
    h('h4',{style:'margin-top:28px'},'Suas caixas'),
    h('div',{class:'boxes'}, counts.map((n,i)=>h('div',{class:'bx'}, h('span',null, i===0?'Novos':'Revê em '+BOXN[i]), h('div',{class:'bar'}, h('i',{style:'width:'+(pool.length? (n/pool.length*100):0)+'%'})), h('span',{class:'mono'}, n)))),
    h('p',{style:'margin-top:18px'}, 'Lembrou, o cartão sobe de caixa e volta mais tarde. Esqueceu, volta para a primeira. O intervalo cresce de 1 para 30 dias.'));
  let card;
  if (rev.idx >= rev.queue.length){
    const next = pool.map(c=>P.prog.cards[c.id]).filter(s=>s && s.due>t).map(s=>s.due).sort()[0];
    card = h('div',{class:'card'},
      h('div',{class:'cmeta'}, h('span',null, rev.queue.length ? 'Rodada concluída' : 'Nada vencendo agora')),
      h('p',{class:'front'}, rev.queue.length ? 'Você lembrou de '+rev.ok+' dos '+(rev.queue.length - rev.again.size)+' cartões desta rodada.' : 'Todos os cartões deste escopo estão em dia.'),
      h('p',{class:'t-mute'}, next ? 'O próximo cartão vence em '+fmt(next)+'.' : ''),
      h('div',{class:'row'},
        dueCount(pool) ? h('button',{class:'btn primary', onclick:()=>{ rev=null; render(); }}, 'Nova rodada') : null,
        h('button',{class:'btn quiet', onclick:()=>go('dilemas')}, 'Ir para os dilemas')));
  } else {
    const c = allCards.find(x=>x.id===rev.queue[rev.idx]), s = sessById[c.sessao];
    const st = P.prog.cards[c.id];
    card = h('div',{class:'card'},
      h('div',{class:'cmeta'}, h('span',null, 'Encontro '+c.enc+' · '+(s? s.num+' '+s.palestrante : '')), h('span',{class:'mono'}, (rev.idx+1)+' / '+rev.queue.length)),
      h('p',{class:'front'}, c.frente),
      rev.shown ? h('div',{class:'back'}, c.verso, h('span',{class:'src'}, 'Fonte: '+c.fonte + (st? ' · caixa atual: '+BOXN[st.b] : ' · cartão novo'))) : null,
      h('div',{class:'row'}, rev.shown ? [
        h('button',{class:'btn quiet', onclick:()=>grade(0)}, 'Não lembrei', h('span',{class:'kbd'},'1')),
        h('button',{class:'btn quiet', onclick:()=>grade(1)}, 'Lembrei com esforço', h('span',{class:'kbd'},'2')),
        h('button',{class:'btn primary', onclick:()=>grade(2)}, 'Lembrei', h('span',{class:'kbd'},'3'))
      ] : h('button',{class:'btn primary', id:'reveal', onclick:()=>{ rev.shown=true; render(); }}, 'Mostrar resposta', h('span',{class:'kbd'},'espaço'))));
  }
  return [
    h('p',{class:'eyebrow'}, 'Revisão espaçada'),
    h('h2',{class:'sec'}, 'Lembrar sem olhar'),
    h('p',{class:'lede'}, 'Responda de cabeça antes de abrir. A dificuldade de buscar a resposta é o que fixa o conteúdo; reler dá só a sensação de saber.'),
    h('div',{class:'rev'}, h('div',{style:'min-width:0'}, card), side)
  ];
}
document.addEventListener('keydown', ev=>{
  if (UI.sec!=='revisao' || !rev || rev.idx>=rev.queue.length) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (!rev.shown && ev.key===' '){ ev.preventDefault(); rev.shown=true; render(); }
  else if (rev.shown && ['1','2','3'].includes(ev.key)) grade(+ev.key-1);
});

/* ---------- Dilemas ---------- */
function myPick(id){ return (uid && VOTES[uid] && VOTES[uid][id]) || P.prog.picks[id]; }
async function pick(d, o){
  P.prog.picks[d.id] = o; persist('prog', true);
  if (remote){
    const mine = Object.assign({}, VOTES[uid]||{}, {[d.id]:o});
    VOTES[uid] = mine; render();
    try { await db.doc('votes/'+uid).set({picks:mine, updatedAt:Date.now()}); } catch(e){}
  } else render();
}
function vDilemas(){
  const E = ENC[UI.enc], cur = UI.dil[UI.enc] || E.dilemas[0].id, d = E.dilemas.find(x=>x.id===cur) || E.dilemas[0];
  const list = h('ul',{class:'dlist'}, E.dilemas.map(x=>{
    const s = sessById[x.sessao], p = myPick(x.id);
    return h('li',null, h('button',{'aria-current':String(x.id===d.id), onclick:()=>{ UI.dil[UI.enc]=x.id; saveUI(); render(); }},
      h('strong',null,x.titulo), h('span',null, (s? 'Base: '+s.palestrante : '')+' · '+(p ? 'decidido' : 'em aberto'))));
  }));
  const mine = myPick(d.id);
  const others = Object.entries(VOTES).map(([k,v])=>v[d.id]).filter(Boolean);
  const total = others.length;
  const opts = h('ol',{class:'opts'}, d.opcoes.map(o=>{
    const q = QUAL[o.qualidade] || ['','t-mute'];
    const n = others.filter(v=>v===o.id).length;
    return h('li',null, h('button',{class:'opt'+(mine===o.id?' mine':''), disabled:!!mine, onclick:()=>pick(d,o.id)},
      h('span',{class:'l'}, o.id.toUpperCase()),
      h('span',null, o.texto),
      mine ? h('span',{class:'verdict'}, h('span',{class:'tag '+q[1]}, q[0]), mine===o.id ? h('span',{class:'tag t-mute'},'Sua escolha') : null) : null,
      mine ? h('span',{class:'fb'}, o.feedback) : null,
      mine && total ? h('span',{class:'dist'}, h('span',{class:'bar'}, h('i',{style:'width:'+(n/total*100)+'%'})), h('small',null, Math.round(n/total*100)+'% · '+n+(n===1?' voto':' votos'))) : null));
  }));
  const s = sessById[d.sessao];
  return [
    h('p',{class:'eyebrow'}, 'Encontro '+UI.enc+' · Dilemas de conselho'),
    h('h2',{class:'sec'}, 'Decida antes de ver a turma'),
    h('p',{class:'lede'}, 'Situações de sala de conselho montadas com o que os palestrantes ensinaram. Depois da sua decisão aparecem o raciocínio de cada caminho e como a turma votou.'),
    h('div',{class:'dl'}, list,
      h('section',{style:'min-width:0'},
        h('p',{class:'eyebrow'}, s ? 'Base: '+s.num+' '+s.palestrante : ''),
        h('h3',{class:'h3'}, d.titulo),
        h('p',{class:'ctx'}, d.contexto),
        h('p',{class:'ask'}, d.pergunta),
        opts,
        mine ? h('p',{class:'t-mute',style:'font-size:13px;margin-top:16px'},
          total ? total+(total===1?' pessoa decidiu':' pessoas decidiram')+' este dilema até agora. ' : '',
          '',
          ' ', h('button',{class:'link', onclick:async()=>{ delete P.prog.picks[d.id]; persist('prog',true); if (remote && VOTES[uid]){ const m=Object.assign({},VOTES[uid]); delete m[d.id]; VOTES[uid]=m; try{ await db.doc('votes/'+uid).set({picks:m, updatedAt:Date.now()}); }catch(e){} } render(); }}, 'Refazer este dilema')) : null))
  ];
}

/* ---------- Exercícios ---------- */
function exMarkdown(e){
  const E = ENC[e], ans = P['ex_e'+e].answers;
  let md = '# Exercícios do Encontro '+e+' · '+E.titulo+'\n\n';
  E.exercicios.forEach(x=>{
    md += '## Exercício '+x.num+' · '+x.titulo+'\n\n_Base: '+x.base+'_\n\n';
    x.campos.forEach(f=>{ md += '**'+f.label+'**\n\n'+(((ans[x.id]||{})[f.id]||'').trim()||'—')+'\n\n'; });
  });
  return md;
}
function vExercicios(){
  const e = UI.enc, E = ENC[e], cur = UI.ex[e] || E.exercicios[0].id, x = E.exercicios.find(z=>z.id===cur) || E.exercicios[0];
  const doc = P['ex_e'+e], ans = doc.answers[x.id] || {};
  const saved = h('p',{class:'saved', id:'saved', 'aria-live':'polite'});
  const list = h('ul',{class:'dlist'}, E.exercicios.map(z=>{
    const a = doc.answers[z.id], started = a && Object.values(a).some(v=>v && v.trim());
    return h('li',null, h('button',{'aria-current':String(z.id===x.id), onclick:()=>{ UI.ex[e]=z.id; saveUI(); render(); }},
      h('strong',null, z.num+'. '+z.titulo), h('span',null, z.base+' · '+(started?'iniciado':'em branco'))));
  }));
  const form = h('form',{onsubmit:ev=>ev.preventDefault()}, x.campos.map(f=>{
    const ta = h('textarea',{id:'ex-'+x.id+'-'+f.id, rows:String(Math.max(2,f.linhas||3)), oninput:ev=>{
      const dd = P['ex_e'+e]; dd.answers = dd.answers || {}; dd.answers[x.id] = dd.answers[x.id] || {}; dd.answers[x.id][f.id] = ev.target.value;
      saved.textContent = 'Salvando…'; persist('ex_e'+e);
      clearTimeout(saved._t); saved._t = setTimeout(()=>{ saved.textContent = 'Salvo'; }, 1000);
    }});
    ta.value = ans[f.id] || '';
    return h('div',{class:'fld'}, h('label',{for:ta.id}, f.label), ta);
  }));
  const copyBtn = h('button',{class:'btn quiet', onclick:async()=>{
    const md = exMarkdown(e);
    try { await navigator.clipboard.writeText(md); copyBtn.textContent='Copiado'; }
    catch(err){ const t=h('textarea',{style:'position:fixed;opacity:0'}); t.value=md; document.body.append(t); t.select(); try{document.execCommand('copy'); copyBtn.textContent='Copiado';}catch(e){} t.remove(); }
    setTimeout(()=>copyBtn.textContent='Copiar minhas respostas',1600);
  }}, 'Copiar minhas respostas');
  const dlBtn = h('button',{class:'btn quiet', hidden:true, id:'dl-btn', onclick:async()=>{
    try { const dl = await claude.use('downloads'); if (dl) await dl.save({filename:'Exercicios_Encontro'+e+'.md', data:exMarkdown(e)}); } catch(err){}
  }}, 'Baixar em Markdown');
  if (window.claude && claude.use) claude.use('downloads').then(dl=>{ if (dl) dlBtn.hidden=false; }).catch(()=>{});
  return [
    h('p',{class:'eyebrow'}, 'Encontro '+e+' · '+E.exercicios.length+' exercícios'),
    h('h2',{class:'sec'}, 'Aplicar na empresa real'),
    h('p',{class:'lede'}, 'Os exercícios do workbook, com as respostas guardadas neste navegador para você voltar a elas. Nada do que você escreve sai do seu computador.'),
    h('div',{class:'ex'}, list,
      h('section',{style:'min-width:0'},
        h('p',{class:'eyebrow'}, 'Exercício '+x.num+' · Base: '+x.base),
        h('h3',{class:'h3'}, x.titulo),
        h('p',{style:'max-width:64ch;color:var(--ink-2);margin:0 0 24px'}, x.instrucao),
        form, saved,
        h('div',{class:'chips',style:'margin-top:8px'}, copyBtn, dlBtn)))
  ];
}

/* ---------- Turma ---------- */
async function renderFeed(){
  const box = document.getElementById('feed'); if (!box) return;
  const items = MURAL.slice().sort((a,b)=>b.t-a.t);
  if (!items.length){ box.replaceChildren(h('p',{class:'empty'}, remote ? 'O mural está vazio. O primeiro registro pode ser o seu: uma decisão, uma pergunta que você levou para a pauta, uma prática que mudou.' : 'O mural da turma aparece quando a página é aberta com uma conta do Claude.')); return; }
  const ids = [...new Set(items.map(i=>i.uid))];
  let ps = {}; try { if (user) ps = await user.profiles(ids); } catch(e){}
  box.replaceChildren(h('ul',{class:'feed'}, items.map(it=>{
    const p = ps[it.uid] || {};
    const name = p.isMe ? 'Você' : (p.name || 'Participante');
    return h('li',null, p.avatarUrl ? h('img',{src:p.avatarUrl, alt:''}) : h('span'),
      h('div',{style:'min-width:0'},
        h('div',{class:'who'}, h('b',null,name), ' · Encontro '+it.enc+' · '+fmtTs(it.t),
          it.uid===uid ? [' · ', h('button',{class:'link',style:'font-size:12px', onclick:()=>delPost(it.id)}, 'Apagar')] : null),
        h('p',null, it.txt)));
  })));
}
async function myMural(){ const s = await db.doc('mural/'+uid).get(); return s.exists ? clone(s.data()) : {entries:[]}; }
async function delPost(id){ try { const m = await myMural(); m.entries = (m.entries||[]).filter(x=>x.id!==id); await db.doc('mural/'+uid).set(m); } catch(e){} }
function vTurma(){
  const ta = h('textarea',{id:'mural-txt', maxlength:'700', placeholder:'Ex.: levei para a reunião de quinta a pergunta sobre o painel do S; o comitê de pessoas vai trazer afastamentos por saúde mental todo trimestre.'});
  const msg = h('span',{class:'saved'});
  const send = h('button',{class:'btn primary', disabled:!remote, onclick:async()=>{
    const txt = ta.value.trim(); if (!txt) return;
    send.disabled = true;
    try { const m = await myMural(); m.entries = (m.entries||[]).concat({id:Date.now().toString(36), t:Date.now(), enc:UI.enc, txt}).slice(-40); await db.doc('mural/'+uid).set(m); ta.value=''; msg.textContent='Publicado no mural da turma'; }
    catch(e){ msg.textContent = 'Não foi possível publicar. Sua conta precisa de acesso de contribuidor nesta página.'; }
    send.disabled = false;
  }}, 'Publicar no mural');
  const feed = h('div',{id:'feed'});
  queueMicrotask(renderFeed);
  return [
    h('p',{class:'eyebrow'}, 'Turma 15'),
    h('h2',{class:'sec'}, 'O que eu levei para o meu conselho'),
    h('p',{class:'lede'}, 'O dado que mais importa num programa de formação é o que muda na prática. Registre uma decisão, uma pergunta que entrou na pauta ou um hábito novo. Seu registro fica visível para quem tem acesso a esta página.'),
    h('div',{class:'post'}, h('label',{for:'mural-txt',class:'eyebrow',style:'margin:0'}, 'Seu registro · Encontro '+UI.enc), ta, h('div',{class:'chips',style:'align-items:center'}, send, msg)),
    feed
  ];
}

/* ---------- Referência ---------- */
function vReferencia(){
  const E = ENC[UI.enc];
  const tabs = [['casos','Casos'],['glossario','Glossário'],['normas','Normas']];
  if (E.checklist_crise) tabs.push(['crise','Checklist de crise']);
  if (!tabs.some(t=>t[0]===UI.ref)) UI.ref='casos';
  let body;
  if (UI.ref==='casos'){
    body = E.casos.length ? h('div',{class:'cases'}, E.casos.map(c=>h('article',{class:'case'}, h('h4',null,c.nome), h('p',null,c.resumo), h('p',{class:'lic'}, h('span',{class:'tag t-mute',style:'display:block;margin-bottom:4px'},'Lição para o conselho'), c.licao)))) : h('p',{class:'empty'},'Sem casos neste encontro.');
  } else if (UI.ref==='glossario'){
    const q = (UI.q||'').toLowerCase();
    const inp = h('input',{class:'search', id:'gl-q', type:'search', placeholder:'Buscar termo', value:UI.q||'', oninput:ev=>{ UI.q=ev.target.value; const l=document.getElementById('gl-list'); l.replaceChildren(...glItems(ev.target.value.toLowerCase())); }});
    const glItems = q => { const r = E.glossario.filter(g=>!q || (g.termo+' '+g.def).toLowerCase().includes(q)); return r.length ? r.map(g=>h('div',null, h('dt',null,g.termo), h('dd',null,g.def))) : [h('p',{class:'empty'},'Nenhum termo encontrado.')]; };
    body = [inp, h('dl',{class:'gl', id:'gl-list'}, glItems(q))];
  } else if (UI.ref==='normas'){
    body = h('div',{class:'tbl'}, h('table',null, h('thead',null,h('tr',null,h('th',null,'Norma'),h('th',null,'Do que trata'),h('th',null,'Observação'))),
      h('tbody',null, E.normas.map(n=>h('tr',null, h('td',null,n.nome), h('td',null,n.sobre), h('td',{class:'t-mute'}, n.status||''))))));
  } else {
    body = h('div',{class:'tbl'}, h('table',null, h('thead',null,h('tr',null,h('th',null,'Fase'),h('th',null,'Componente'),h('th',null,'Pergunta de verificação'))),
      h('tbody',null, E.checklist_crise.map(c=>h('tr',null, h('td',null,c.fase), h('td',null,c.componente), h('td',null,c.pergunta))))));
  }
  return [
    h('p',{class:'eyebrow'}, 'Encontro '+UI.enc+' · Biblioteca'),
    h('h2',{class:'sec'}, 'Referência'),
    h('p',{class:'lede'}, 'Para consultar quando o tema aparecer na pauta.'),
    h('div',{class:'subnav'}, tabs.map(t=>h('button',{'aria-pressed':String(UI.ref===t[0]), onclick:()=>{ UI.ref=t[0]; saveUI(); render(); }}, t[1]))),
    body
  ];
}

const VIEWS = {trilha:vTrilha, sessoes:vSessoes, revisao:vRevisao, dilemas:vDilemas, exercicios:vExercicios, referencia:vReferencia};
render();

/* ---------- conta e turma ---------- */
(async function connect(){
  if (!window.claude || !claude.use) return;
  try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch(e){ return; }
  if (!db || !user) return;
  try { uid = await user.id(); } catch(e){ uid = null; }
  if (!uid) return;
  remote = true;
  for (const name of ['prog','ex_e1','ex_e2']){
    try {
      const s = await db.doc('data/users/'+uid+'/'+name).get();
      const r = s.exists ? s.data() : null;
      if (r && (r.updatedAt||0) > (P[name].updatedAt||0)){ P[name] = clone(r); ['cards','trail','acoes','picks'].forEach(k=>{ if (name==='prog') P.prog[k]=P.prog[k]||{}; }); if (name!=='prog') P[name].answers = P[name].answers||{}; lsSet(name, P[name]); }
      else if ((P[name].updatedAt||0) > ((r&&r.updatedAt)||0)) persist(name, true);
    } catch(e){ if (e && e.code==='invalid_argument'){ remote=false; } }
  }
  setSync(remote);
  db.collection('votes').onSnapshot(snap=>{
    const v = {}; snap.docs.forEach(d=>{ const x=d.data(); if (x && x.picks) v[d.id]=x.picks; });
    VOTES = v;
    if (remote && uid && P.prog.picks){ const mine = VOTES[uid]||{}; const missing = Object.keys(P.prog.picks).filter(k=>!mine[k]); if (missing.length){ const m = Object.assign({}, P.prog.picks, mine); VOTES[uid]=m; db.doc('votes/'+uid).set({picks:m, updatedAt:Date.now()}).catch(()=>{}); } }
    if (UI.sec==='dilemas' || UI.sec==='trilha') render();
  }, ()=>{});
  db.collection('mural').onSnapshot(snap=>{
    const items = []; snap.docs.forEach(d=>{ const x=d.data(); (x && x.entries || []).forEach(en=>items.push(Object.assign({uid:d.id}, en))); });
    MURAL = items;
    if (UI.sec==='turma'){ renderFeed(); const b=document.querySelector('.post .btn.primary'); if (b) b.disabled=false; }
  }, ()=>{});
  const ae = document.activeElement; if (!ae || !/INPUT|TEXTAREA/.test(ae.tagName)) render();
})();
})();
</script>
