", "Primeira recuperação judicial do país sob a nova lei — conduzida, segundo relato em aula, por equipe mandatada pelo governo italiano, com participação de Raul Rosenthal."]]}, {"t": "src", "h": "Fonte: material de apoio da simulação e relato em aula."}, {"t": "box", "kind": "leitura", "title": "A LEITURA DE GOVERNANÇA", "items": [{"h": "A Parmalat é o caso em que a auditoria externa aparece dentro do perímetro do problema, não fora dele. O esquema incluía o controle da correspondência com auditores — exatamente o mecanismo que Leonardo Coelho descreveu na Americanas quando relatou que um banco foi convencido a retirar o risco sacado das cartas de circularização."}, {"h": "<strong>A pergunta de conselho que decorre disso: <\/strong>“Quem, dentro da companhia, tem acesso à correspondência trocada com a auditoria externa e com os bancos?” Se a resposta for a mesma diretoria que está sendo auditada, o controle não existe. E vale a regra que Carlos Sá deu no Dia 2: a circularização precisa chegar direto do terceiro ao órgão de fiscalização."}]}, {"t": "h4", "h": "Minha resposta de conselho — Parmalat"}, {"t": "table", "head": ["<strong>Passo<\/strong>", "<strong>O que o board precisa produzir<\/strong>", "<strong>Minha resposta<\/strong>"], "rows": [["<strong>1. Riscos<\/strong>", "Principais riscos e ameaças que a empresa pode enfrentar, com o impacto de cada um", ""], ["<strong>2. Recursos<\/strong>", "Recursos necessários para lidar com a crise — pessoas, caixa, assessoria, governança", ""], ["<strong>3. Job to be done<\/strong>", "Plano de ação para recuperar as operações", ""], ["<strong>4. Posicionamento<\/strong>", "Comunicação com funcionários, clientes, fornecedores, imprensa e autoridades", ""], ["<strong>5. Futuro alternativo<\/strong>", "Planos de curto e longo prazo para a continuidade do negócio", ""]]}], "notes": [], "meta": "Fraude documental e contábil  ·  1997–2003  ·  €4 bilhões inexistentes"}, {"num": "3.5", "head": "3.5  Os três casos lado a lado", "blocks": [{"t": "table", "head": ["", "<strong>Volkswagen<\/strong>", "<strong>Uber<\/strong>", "<strong>Parmalat<\/strong>"], "rows": [["<strong>Natureza da falha<\/strong>", "Regulatória e de produto", "Cultural e de pessoas", "Contábil e documental"], ["<strong>Duração<\/strong>", "~7 anos (2008–2015)", "~3 anos documentados (2014–2017)", "10+ anos (1997–2003)"], ["<strong>Quem sabia<\/strong>", "Engenharia e alta direção", "RH e liderança direta", "Diretoria financeira e auditoria"], ["<strong>O sinal disponível<\/strong>", "Meta declarada inatingível sendo atingida", "215 queixas registradas internamente", "Sem lucro desde 1997, com liquidez reportada"], ["<strong>Por que o conselho não viu<\/strong>", "Tema tratado como técnico, não estratégico", "Dado de RH não subia à mesa", "Confiou na certificação da auditoria"], ["<strong>Desfecho para o CEO<\/strong>", "Renúncia + acusação criminal 4 anos depois", "Renúncia forçada", "Prisão de executivos"], ["<strong>Custo declarado<\/strong>", "US$ 20 bi+ só nos EUA", "US$ 10 mi em acordos + reputação", "€4 bi inexistentes + colapso do grupo"], ["<strong>Vítima final<\/strong>", "Saúde pública", "Funcionários, sobretudo mulheres", "Acionistas e investidores"]]}, {"t": "h3", "h": "O quarto caso, que já está no seu caderno"}, {"t": "p", "h": "A Americanas, discutida no Dia 1 com quem conduziu a reestruturação, completa a série e é a única em que você tem o relato de dentro. Vale colocá-la na mesma grade — ela responde a algumas das perguntas que os outros três deixam em aberto."}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Americanas — o contraponto brasileiro<\/strong>"], "rows": [["Natureza da falha", "Contábil, com captura dos controles internos (Management Override)"], ["Duração", "2011 a 2023 — “completamente fora de controle depois de 2020”"], ["Quem sabia", "8 pessoas no núcleo, mais 30 a 35 operando"], ["O sinal disponível", "Rentabilidade fora da curva; recusa de auditoria por extração; custo de dívida a 200% do CDI; zero denúncias no canal de ética"], ["O que protegeu quem se protegeu", "A pergunta repetida por escrito, todo trimestre, com todos os sinônimos"], ["Custo", "~R$ 25 bilhões; queda de 77% das ações em um dia"]]}, {"t": "h3", "h": "Sete perguntas para levar de volta"}, {"t": "p", "h": "Destiladas dos quatro casos. Servem como roteiro fixo de qualquer conselho, independentemente do setor."}, {"t": "ul", "items": ["Existe alguma meta que o próprio regulador ou o próprio mercado considera difícil, e que nós estamos batendo com folga? Como?", "Quantas denúncias o canal de ética recebeu no último ano — e o que aconteceu com cada uma? Zero é sinal, não é saúde.", "Quem, dentro da companhia, controla a correspondência com auditores, bancos e reguladores?", "Nossa avaliação de desempenho protege alguém de consequências? Há alto desempenho tratado como imunidade?", "O que a área de gente sabe e não sobe até esta mesa? Por qual caminho subiria, se subisse?", "Se um funcionário quisesse nos alertar sobre algo grave, quantos passos ele daria antes de falar com alguém que não se reporta ao acusado?", "Qual é a informação que, se fosse verdadeira, mudaria nossa avaliação sobre esta companhia — e como saberíamos se é?"]}, {"t": "box", "kind": "leitura", "title": "COMO USAR ESTA PARTE DEPOIS DO CURSO", "items": [{"h": "As cinco entregas do board — riscos, recursos, plano, comunicação e continuidade — não são um exercício de sala. São a pauta de uma reunião extraordinária de conselho em qualquer crise real. Guarde a Figura 25 como roteiro: no dia em que você precisar dela, não haverá tempo para construí-la."}]}], "notes": ["Como o meu grupo respondeu — e o que eu faria diferente", "Onde a minha leitura divergiu da do grupo, e por quê", "O que eu aprendi sobre a minha própria forma de decidir sob pressão"], "meta": "Figura 36. Anatomia comparada das três crises"}], "e2": [{"num": "2.1", "head": "2.1  Carlos Júlio — O segredo da mudança de cultura nas empresas", "blocks": [{"t": "stats", "items": [{"n": "68", "l": "CEOs entrevistados na pesquisa do livro"}, {"n": "6", "l": "atributos de uma história que muda cultura"}, {"n": "2h17", "l": "de espera do CEO no 0800 da própria empresa"}, {"n": "15 dias", "l": "de venda suspensa até o produto funcionar"}]}, {"t": "h3", "h": "Ficha do professor"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória, conforme dita em aula e no deck<\/strong>"], "rows": [["<strong>Papel no programa<\/strong>", "Curador do Board Program. Abriu o Encontro 2 com a grade dos dois dias e chamou a própria aula de “pedágio”."], ["<strong>Conselhos<\/strong>", "“Eu estou em alguns conselhos. Já são empresas de capital aberto, grande.” Preside o conselho da Patrus, como já havia dito no Encontro 1."], ["<strong>Formação de referência<\/strong>", "“Eu tive o privilégio de conviver 11 anos com o professor [Drucker].” Teve aula com John Kotter em Harvard."], ["<strong>Autoria<\/strong>", "Coautor, com Jay B. Barney e Manoel Amorim, de <em>The Secret of Culture Change<\/em> (2023), lançado primeiro nos Estados Unidos — “depois de 14 livros”. Edição brasileira: <em>O Segredo da Mudança de Cultura<\/em> (Benvirá, 2024)."], ["<strong>Relação com o caso<\/strong>", "Amigo de Manoel Amorim “de quase 40 anos”. Foi Barney quem lembrou um artigo de Carlos Júlio publicado pelo MIT e propôs a parceria."]]}, {"t": "h3", "h": "A tese: cultura não muda por decreto. Muda por história."}, {"t": "p", "h": "A aula é a defesa de um livro, e o livro tem uma tese simples de enunciar e difícil de praticar. Quando uma estratégia necessária não cabe na cultura, a cultura vence — “se não estiver alinhado, a cultura vai vencer e você não vai conseguir implantar”. Mudar cultura por engenharia — mapear a atual, desenhar a desejada, treinar — “pode melhorar, mas não acontece”. O que muda cultura são gestos visíveis do líder que viram histórias contadas pelos outros. Só depois que as histórias pegam é que se mexe em política."}, {"t": "quote", "q": "A única maneira de a gente mudar a cultura da organização é através das histórias que a liderança conta.", "by": "MANOEL AMORIM, NA FORMULAÇÃO LEMBRADA POR CARLOS JÚLIO"}, {"t": "p", "h": "A ordem é o ponto. Ele chama de <em>story building<\/em>, não <em>storytelling<\/em>. Não é contar o que foi feito; é fazer o que vai ser contado."}, {"t": "p", "h": "Narrador não muda cultura. Protagonista muda."}, {"t": "h3", "h": "A pergunta que ele colocou na mesa: estratégia ou cultura?"}, {"t": "p", "h": "Depois de uma cena de <em>O Diabo Veste Prada<\/em> — o escritório em pânico com a chegada antecipada de Miranda Priestly —, a primeira provocação: “Vocês acham que é muito bizarro e muito incomum a empresa trabalhar para o CEO do que trabalhar para o cliente?” A sala respondeu que é comum. A segunda provocação é a que importa para conselheiro:"}, {"t": "quote", "q": "Se está com uma nova estratégia em cima da mesa, no conselho, para tomar decisão, aquela estratégia não está alinhada com a nossa cultura atual. Você mexe na cultura ou mexe na estratégia?", "by": "CARLOS JÚLIO"}, {"t": "p", "h": "A sala se dividiu. A resposta dele veio pelo caso do Grupo Algar: diante de 70 executivos que responderam “muda a cultura”, o fundador reagiu — a empresa canta o hino, hasteia a bandeira, faz oração; mudar a cultura dele? A saída de Carlos Júlio é cirúrgica e é a frase mais útil da manhã:"}, {"t": "quote", "q": "Talvez você precisa mudar parte da cultura que é contra aquela estratégia. E essa é a análise.", "by": "CARLOS JÚLIO, SOBRE O CASO ALGAR"}, {"t": "cap", "h": "A regra de decisão de Carlos Júlio: mudar a estratégia ou o traço cultural"}, {"t": "table", "head": ["<strong>Situação na mesa<\/strong>", "<strong>O que o conselho faz<\/strong>"], "rows": [["<strong>Estratégia alinhada à cultura<\/strong>", "Executa. Empresas que alinham as duas “têm muito melhores resultados” (deck)."], ["<strong>Estratégia desalinhada por um traço — aversão ao erro, falta de ownership, falta de mão na massa<\/strong>", "Muda o traço, não a estratégia. “Você vai abandonar uma estratégia campeã… porque tem uma cultura lá que não casa com aquilo?”"], ["<strong>Estratégia “muito, muito, muito adversa” à cultura<\/strong>", "Revê a estratégia."], ["<strong>Cultura extrema (o exemplo dele foi a “cultura do roubo”)<\/strong>", "Fora do modelo. Outro tipo de intervenção."]]}, {"t": "src", "h": "Fonte: transcrição da sessão e slides 6 a 9 do deck."}, {"t": "p", "h": "O exemplo de traço que sabota inovação é o par HP × Texas Instruments. Na HP, o erro gerava “uma espécie de auditoria do aprendizado”; na Texas, <em>you were fired<\/em>. Uma empresa que associa erro a demissão pode aprovar quantas estratégias de inovação quiser."}, {"t": "p", "h": "Não vai executar nenhuma."}, {"t": "box", "kind": "verif", "title": "VERIFICAÇÃO DE FATO", "items": [{"h": "O professor atribuiu o contraste HP × Texas a um trabalho de Jay Barney com Clayton Christensen. O par é conhecido por <em>Feitas para Durar<\/em> (Collins e Porras, 1994), que o próprio professor citou de passagem. Não há registro público do trabalho conjunto. Use o exemplo citando Collins e Porras."}]}, {"t": "h3", "h": "O caso Telesp: quem manda agora é o cliente"}, {"t": "p", "h": "O núcleo da aula é a história que deu origem ao livro. A Telesp era “a tele mais eficiente do Brasil, disparado” — instalava sozinha mais linhas do que as outras 26 operadoras somadas. Mas era “uma empresa de engenharia focada em atender a Anatel”. Eficiente para o regulador, distante do cliente. Manoel Amorim chega de fora, com cerca de um ano antes da concorrência. O diagnóstico dele cabe numa linha:"}, {"t": "quote", "q": "Eu preciso de um ano para preparar a empresa para, no lugar da Anatel, colocar o cliente.", "by": "MANOEL AMORIM, NAS PALAVRAS DE CARLOS JÚLIO"}, {"t": "p", "h": "O que ele fez em seguida foi uma sequência de gestos, nenhum deles um programa de cultura. Num sábado, tentou conectar o Speedy em casa: duas horas sozinho, mais duas no 0800. Na terça, levou o atendente terceirizado e um colega para a reunião de diretoria. Um diretor perguntou por que ele não tinha ligado na Golden Line — a linha exclusiva da diretoria, com engenheiro em casa em 15 minutos. Amorim não sabia que ela existia."}, {"t": "quote", "q": "Então o cliente liga no 0800 e os diretores ligam [na Golden Line]… está orientada para resolver o problema dos caras. Essa é a cultura, é hierarquia.", "by": "CARLOS JÚLIO"}, {"t": "p", "h": "A pergunta que Amorim fez a engenharia e operações é uma armadilha perfeita. E um modelo de pergunta de conselho:"}, {"t": "quote", "q": "Vocês sabiam desses problemas? Porque se o cara fala que não sabia, onde vocês estavam? Se o cara fala que sabia, por que não consertaram?", "by": "MANOEL AMORIM, NAS PALAVRAS DE CARLOS JÚLIO"}, {"t": "cap", "h": "As dez ações de Manoel Amorim na Telesp, em ordem"}, {"t": "table", "head": ["<strong>#<\/strong>", "<strong>Ação de Amorim<\/strong>", "<strong>O símbolo que caiu<\/strong>", "<strong>O que a rádio peão entendeu<\/strong>"], "rows": [["<strong>1<\/strong>", "Bônus da diretoria atrelado à venda do Speedy; meta da Anatel vira obrigação", "O regulador como cliente", "O mercado manda"], ["<strong>2<\/strong>", "Liga no 0800 como cliente comum", "A Golden Line", "O CEO vive o que o cliente vive"], ["<strong>3<\/strong>", "Leva o atendente terceirizado à reunião de diretoria", "A hierarquia das posições", "“Coloquei quem ouve o cliente”"], ["<strong>4<\/strong>", "Pergunta “vocês sabiam?”", "O silo da engenharia", "Responsabilidade"], ["<strong>5<\/strong>", "Suspende a venda até funcionar — inclusive o próprio bônus", "Volume acima de qualidade", "“Quem manda agora aqui é o cliente”"], ["<strong>6<\/strong>", "O atendente volta em 15 dias para validar as correções", "A engenharia como juiz de si mesma", "O cliente é o critério"], ["<strong>7<\/strong>", "Libera o elevador exclusivo", "O andar do “doutor”", "Acesso"], ["<strong>8<\/strong>", "Crachás só com o nome, sem título", "“Engenheiro Rodrigues”", "Igualdade"], ["<strong>9<\/strong>", "Duas a três horas por semana ouvindo clientes", "A distância do C-level", "“Se o cara pode passar duas horas ouvindo o cliente, por que que eu acho que eu não posso?”"], ["<strong>10<\/strong>", "Contrata o atendente para criar a primeira área de experiência do cliente", "A inexistência da função", "A história vira estrutura"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 18:09 a 60:30. A ordem é a do relato; algumas ações foram simultâneas — “umas 5 ou 6 atitudes simultâneas”."}, {"t": "quote", "q": "Pela primeira vez, chegou um cara e falou: esse negócio não funciona… Quem manda agora aqui é o cliente.", "by": "CARLOS JÚLIO, TRADUZINDO A REAÇÃO DO CORREDOR"}, {"t": "p", "h": "O detalhe que mais me interessa é quando a estrutura entra: no item 10. O atendente vira chefe da área de experiência do cliente depois que a história já circulou."}, {"t": "p", "h": "Primeiro o gesto. Depois a estrutura."}, {"t": "box", "kind": "verif", "title": "VERIFICAÇÃO DE FATO", "items": [{"h": "O Speedy foi apresentado como “a primeira internet [discada] do Brasil”. Era banda larga ADSL, lançada pela Telefônica em novembro de 1999. A essência do caso não muda; o detalhe técnico, sim."}]}, {"t": "h3", "h": "Da história ao método: 68 CEOs e um padrão"}, {"t": "p", "h": "Barney era cético — “no teu caso deu certo”. Os três entrevistaram 68 CEOs nos Estados Unidos, na Europa, na África e na América Latina, cinco deles no Brasil. O achado, nas palavras do professor: “não só as histórias mudam, como existe um padrão.” O deck diz 63 entrevistas; ele corrigiu em aula para 68."}, {"t": "cap", "h": "Storytelling × story building"}, {"t": "table", "head": ["", "<strong>Storytelling<\/strong>", "<strong>Story building<\/strong>"], "rows": [["<strong>Definição<\/strong>", "“Contar o que foi feito”", "“Fazer coisas que criam estórias que as pessoas vão falar a respeito”"], ["<strong>Papel do líder<\/strong>", "Narrador", "Protagonista — o líder “estrela” a história"], ["<strong>Risco<\/strong>", "Soar como manipulação: os colaboradores “podem sentir o cheiro da hipocrisia”", "Exige exposição e custo pessoal real"]]}, {"t": "src", "h": "Fonte: slides 12 e 13 do deck."}, {"t": "p", "h": "A cadeia causal do livro é curta. O líder age. A ação vira história. A história é recontada. As novas histórias substituem as velhas — e isso é a nova cultura. Política e prática vêm depois, para sustentar, não para provocar."}, {"t": "h3", "h": "Os seis atributos das histórias que mudam cultura"}, {"t": "cap", "h": "Os seis atributos, segundo Barney, Amorim e Júlio"}, {"t": "table", "head": ["<strong>#<\/strong>", "<strong>Atributo<\/strong>", "<strong>Em uma frase<\/strong>", "<strong>Exemplo dado em aula<\/strong>"], "rows": [["<strong>1<\/strong>", "Autêntica", "“Não dá para inventar.” Reflete crença real da liderança — “não é da empresa, não. Primeiro é da liderança.”", "Amorim no 0800"], ["<strong>2<\/strong>", "Líder protagonista", "O líder está dentro da história, não fora dela contando.", "Bayer: o presidente que deixa o “aquário de vidro” e almoça no refeitório"], ["<strong>3<\/strong>", "Rompe com o passado e sinaliza o futuro", "Uma ação claramente inconsistente com a cultura atual.", "O atendente na reunião de diretoria"], ["<strong>4<\/strong>", "Fala à mente e ao coração", "Sem razão de mercado, vira “viagem do ego do líder”; sem emoção, não circula.", "“Se nós não mudamos, o concorrente nos engole?”"], ["<strong>5<\/strong>", "Teatral", "Memorável. Alguém vai recontar no café amanhã.", "Amanco: a CEO fantasiada de tigre"], ["<strong>6<\/strong>", "Gera outras histórias", "Quando os outros começam a criar as próprias, “aí, realmente, você sente que colou”.", "Gerentes da Telesp passando a ouvir clientes"]]}, {"t": "src", "h": "Fonte: slides 14 a 19 do deck e transcrição, 53:21 a 70:46."}, {"t": "p", "h": "O exemplo teatral merece registro completo. A Amanco disputava tubos e conexões contra a Tigre, dona de quase todo o mercado, e toda conversa interna terminava em “ninguém pode com o Tigre”. No lançamento do plano, para 2 mil colaboradores, a CEO subiu ao palco fantasiada de tigre:"}, {"t": "quote", "q": "E ela pega assim, quem é que tem medo de tigre aqui? Ela pega, tira a cabeça do tigre e pum, e chuta para trás.", "by": "CARLOS JÚLIO, SOBRE A AMANCO"}, {"t": "box", "kind": "verif", "title": "VERIFICAÇÃO DE FATO", "items": [{"h": "Os números do caso Amanco foram contados como “de 3 para 35, 10 vezes… em 5 anos”. O registro público disponível (Meio &amp; Mensagem) dá 16% de participação em 2006 e 34% em 2015 — o dobro em nove anos. A cena do tigre não foi localizada em fonte pública: é anedota de primeira mão."}]}, {"t": "h3", "h": "Por que mudar cultura é difícil — e por que IA é cultura"}, {"t": "p", "h": "O deck lista cinco razões: a cultura é difusa, intangível, ligada a status, pode mudar rápido ou devagar e testa o compromisso da liderança. A primeira rendeu a frase mais direta da manhã — e ela vale para cultura e para IA:"}, {"t": "quote", "q": "Quem está encarregado de mudar a cultura? Ah não, RH. Será? Ah, o CEO. Será?", "by": "CARLOS JÚLIO"}, {"t": "quote", "q": "Os caras nomeiam alguém para fazer a mudança de IA. Bullshitismo. Não vai ser, cara. É transversal. Todo mundo tem que usar. Porque IA também é cultura.", "by": "CARLOS JÚLIO"}, {"t": "p", "h": "O caso que ele usou para ilustrar — um paciente que pôs exames no Grok e recebeu uma probabilidade que o médico não tinha dado — funciona como retrato de mudança de comportamento. Não como evidência clínica. A ressalva está no Anexo B."}, {"t": "p", "h": "Sobre inovação, a lógica de incubar fora da cultura-mãe: o Itaú fez o Cubo na Vila Olímpia e não dentro do banco, porque “se ele incubar lá dentro, não acontece. A cultura do banco é tão forte…”. O Bradesco fez o Habitat; a Porto Seguro, o Distrito."}, {"t": "h3", "h": "O bônus por esforço: a decisão de cultura que chega ao conselho disfarçada"}, {"t": "p", "h": "O momento mais prático da aula veio de um caso de conselho que ele viveu. Metas não batidas. O CEO pede ao conselho um bônus discricionário porque a diretoria “trabalhou muito”."}, {"t": "box", "kind": "atencao", "title": "O BÔNUS DISCRICIONÁRIO É UMA DECISÃO CULTURAL, NÃO FINANCEIRA", "items": [{"h": "<em>“Eu não aprendi a remunerar esforço. Eu aprendi a remunerar resultado.”<\/em>"}, {"h": "“Nós vamos tirar dinheiro do acionista para pagar os caras porque eles se esforçaram? Gente, isso é cultura.” E ele antecipou a reação que o conselheiro vai ouvir: “às vezes parece que, na perspectiva do conselho, o conselho é insensível. Não é insensível, você precisa tomar muito cuidado com isso.”"}, {"h": "Para o comitê de pessoas, a regra cabe numa linha: discricionariedade exige critério escrito antes, não justificativa depois."}]}, {"t": "h3", "h": "Perenizar: primeiro a história, depois a política"}, {"t": "box", "kind": "atencao", "title": "O ALERTA FOI DIRIGIDO AO RH", "items": [{"h": "<em>“Primeiro você constrói as histórias. Depois, você mexe nas políticas e práticas. Se você mexer nas políticas e depois criar a história, não tem a mesma delícia… Não inverte isso.”<\/em>"}, {"h": "É o oposto da ordem habitual de um projeto de cultura, que começa redesenhando competências, avaliação e recrutamento. Numa integração pós-aquisição, a pergunta que eu faria é outra: o que já virou história antes de virar norma?"}]}, {"t": "h3", "h": "O debate final: fazer uma limpa na liderança?"}, {"t": "p", "h": "Um aluno propôs começar pela troca do time: “vai pra rua todo mundo e contrata novas pessoas”. Carlos Júlio resistiu — “as novas pessoas virão pra mesma cultura? Talvez não” — e citou a escassez de talento em todos os níveis. Prefere uma auditoria de cultura, “o que a gente consegue migrar”, e saídas pontuais de quem claramente não vai aderir. O critério que ele usa tem três verbos:"}, {"t": "quote", "q": "Não sou leniente, mas sou o tipo da pessoa que não gosta de perder gente… Às vezes tem uma pessoa que sabe menos, pode menos, mas quer muito. Eu me dedico a ela.", "by": "CARLOS JÚLIO"}, {"t": "p", "h": "Saber, poder, querer. Quem quer muito merece investimento. Quem não quer “pede muito tempo da gente”. A gravação termina no meio do caso seguinte, de um diretor do Sebrae Minas."}, {"t": "h3", "h": "Pontos de atenção"}, {"t": "ul", "items": ["<strong>Diagnosticar o traço, não “a cultura”.<\/strong> O risco de um conselho é aprovar a estratégia sem perguntar qual traço vai sabotá-la.", "<strong>Privilégio de status é ponto cego.<\/strong> Golden Line, elevador, refeitório separado: cada um esconde do executivo o que o cliente vive. Vale perguntar quais canais exclusivos existem.", "<strong>Cultura e IA não têm dono único.<\/strong> As duas são transversais. Nomear um responsável é a forma mais elegante de não mudar nada.", "<strong>Mudança sem razão de mercado parece vaidade do CEO.<\/strong> Toda história de mudança precisa de um número.", "<strong>Trocar a liderança inteira raramente troca a cultura.<\/strong> Os novos chegam ao mesmo sistema."]}, {"t": "box", "kind": "verif", "title": "VERIFICAÇÃO DE FATO — AS TRÊS QUE MAIS IMPORTAM", "items": [{"h": "<strong>“A cultura come a estratégia no café da manhã”<\/strong> foi atribuída a Drucker no deck e na fala — com a honestidade de ele dizer que nunca a encontrou na obra. A primeira ocorrência documentada é de 2000, e a associação com Drucker surge por volta de 2011 (Quote Investigator). Cite como “atribuída a Drucker”."}, {"h": "<strong>Kotter foi apresentado ao contrário.<\/strong> No slide, Kotter rejeita a ideia de mudar normas e valores primeiro: “Uma vez acreditei neste modelo. Mas tudo que vi me diz que está errado.” Na fala, a primeira metade da citação foi lida como se fosse a posição dele. Kotter diz o oposto: a cultura muda por último."}, {"h": "<strong>A Amazon tem 16 princípios de liderança<\/strong>, não 13. E o memorando antes da reunião tem até seis páginas, lidas em silêncio no início — não “uma folhinha de Word”."}]}, {"t": "box", "kind": "mesa", "title": "PARA LEVAR À MESA", "items": [{"n": "01", "h": "Qual traço da nossa cultura atual vai sabotar esta estratégia — e qual história real que circula hoje prova que esse traço existe?"}, {"n": "02", "h": "Quais canais, espaços ou serviços exclusivos da diretoria existem hoje, e o que o executivo deixa de ver por causa deles?"}, {"n": "03", "h": "O que o bônus da diretoria remunera neste ano: o resultado da estratégia nova ou o hábito antigo?"}, {"n": "04", "h": "Esta mudança tem razão de mercado em uma frase com número?"}, {"n": "05", "h": "Qual foi o último gesto do CEO que virou história fora da sala dele?"}]}, {"t": "h3", "h": "Referências da sessão"}, {"t": "table", "head": ["<strong>Referência<\/strong>", "<strong>Como foi usada<\/strong>", "<strong>Observação<\/strong>"], "rows": [["<strong>Barney, Amorim e Júlio — <em>The Secret of Culture Change<\/em> (2023)<\/strong>", "Base da aula", "Edição brasileira: <em>O Segredo da Mudança de Cultura<\/em> (Benvirá, 2024)"], ["<strong><em>O Diabo Veste Prada<\/em> (dir. David Frankel, 2006)<\/strong>", "Cena de abertura", "A empresa que trabalha para o CEO"], ["<strong>Collins e Porras — <em>Feitas para Durar<\/em> (1994)<\/strong>", "Par HP × Texas Instruments", "Citado de passagem; ver verificação"], ["<strong>John Kotter — <em>Leading Change<\/em> (1996)<\/strong>", "Citação no slide sobre mudar cultura", "Sentido invertido na fala"], ["<strong>Peter Drucker — <em>Inovação e Espírito Empreendedor<\/em> (1985)<\/strong>", "Fonte da frase do café da manhã, segundo o professor", "Frase não encontrada na obra"], ["<strong>Casos: Telesp, Algar, Amanco, Bayer, Itaú/Cubo, Amazon<\/strong>", "Ilustrações", "Detalhes não verificáveis marcados no Anexo B"]]}, {"t": "src", "h": "Fonte: transcrição integral da sessão e verificação contra as fontes primárias."}], "notes": ["Uma história que eu vivi e que mudou cultura — e qual dos seis atributos ela tinha", "Um traço cultural que eu vi sabotar uma estratégia, e o que teria resolvido", "Como eu respondo, numa mesa, ao pedido de bônus por esforço"], "meta": "09h05  ·  75 minutos de gravação, 60 de aula  ·  abertura do Encontro 2 e primeira sessão, conduzida pelo curador"}, {"num": "2.2", "head": "2.2  Clairton Araujo — Demonstrações financeiras: análise crítica na ótica do conselho", "blocks": [{"t": "stats", "items": [{"n": "10", "l": "indicadores bastam — “10 que funcionam”"}, {"n": "5 anos", "l": "de demonstrações lidas antes da primeira reunião"}, {"n": "2,5–3x", "l": "dívida líquida/EBITDA: a zona de alerta"}, {"n": "180 dias", "l": "de estoque sem giro: o pedido para a ata"}]}, {"t": "h3", "h": "Ficha do professor"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória, conforme dita em aula e no deck<\/strong>"], "rows": [["<strong>Hoje<\/strong>", "CEO de multinacional alemã: “a gente fatura quase um bi de euros e temos 6% de EBITDA. E eu me mato, todo ano me pedem para aumentar.”"], ["<strong>Origem<\/strong>", "“Eu entrei muito garoto numa Big Four, entrei como trainee e [saí] como sócio.” Controller da Apple no início da carreira."], ["<strong>Conselhos<\/strong>", "“Sou conselheiro de uma das maiores empresas de satélite do mundo, sou conselheiro de uma multinacional americana, impressoras.”"], ["<strong>Como chegou<\/strong>", "Primeiro por convite, depois por indicação entre conselheiros, e no caso do satélite: “eles viram o meu perfil, entraram em contato pelo LinkedIn”."], ["<strong>Formação (deck)<\/strong>", "Doutorado em Sistemas de Informação (Universidade Nova de Lisboa), mestrado em Ciências Contábeis e Finanças (PUC-SP). Vice-presidente da ABRAPEM, cofundador do GADEC."], ["<strong>Autoimagem<\/strong>", "“Desde que eu aprendi contabilidade, ninguém me enrola. Ponto.” E: “Sou viking.”"]]}, {"t": "h3", "h": "A tese: a auditoria não é seguro, e ler é dever"}, {"t": "p", "h": "Clairton abriu pelo que incomoda. A Americanas não tinha um conselho de leigos: “Eram pessoas leigas no assunto? Eram bobinhos? Também não.” O Grupo Mateus. O Banco Master. Havia auditoria, controle interno, comitê. Por que ninguém viu? Regina, uma colega de turma, respondeu “todos têm a sua agenda”. A resposta dele foi mais curta: tem preço."}, {"t": "quote", "q": "As auditorias não são pagas para te dar 100% de garantia nas coisas.", "by": "CLAIRTON ARAUJO"}, {"t": "quote", "q": "Significa que a gestão da empresa tem que fazer a lição de casa bem feitinha, e significa que os conselheiros e as conselheiras precisam fazer a lição de casa também certinha.", "by": "CLAIRTON ARAUJO"}, {"t": "p", "h": "O resto da aula é a lição de casa, em três partes: a ordem de leitura, o painel mínimo e o registro em ata."}, {"t": "h3", "h": "A ordem de leitura: DFC, DRE, balanço"}, {"t": "quote", "q": "Primeira dica do nosso encontro. Olha a DFC. Depois, olha a DRE. Depois, olha o balanço.", "by": "CLAIRTON ARAUJO"}, {"t": "p", "h": "A razão é simples. A DFC é a única peça que não aceita retoque: reconcilia o lucro com o caixa, e quando há manipulação, “a DFC não fecha”. Vem com a regra que ele repetiu como mantra: “Todo lucro se transforma em caixa. O oposto não é verdadeiro.”"}, {"t": "cap", "h": "Os cinco demonstrativos e a pergunta que cada um provoca"}, {"t": "table", "head": ["<strong>Demonstrativo<\/strong>", "<strong>O que ele mostra<\/strong>", "<strong>A frase de Clairton<\/strong>", "<strong>A pergunta do conselheiro<\/strong>"], "rows": [["<strong>DFC<\/strong>", "Se o resultado vira dinheiro", "“É uma reconciliação do lucro, ou do resultado econômico, para chegar no caixa.”", "Quanto do lucro virou caixa operacional, e o que explica a diferença?"], ["<strong>DRE<\/strong>", "Receita, custo, despesa e resultado", "“O E do final é econômico.”", "Por que a margem mudou — em uma frase, sem PowerPoint?"], ["<strong>Balanço<\/strong>", "Posição patrimonial e financeira", "“Eu quero saber como é que está a saúde financeira da empresa.”", "Onde está o dinheiro — e a empresa deve a quem?"], ["<strong>DMPL<\/strong>", "O que mexeu no patrimônio dos sócios", "“O colchãozinho dos acionistas.”", "O que, além do lucro, mudou o patrimônio líquido?"], ["<strong>Notas explicativas<\/strong>", "A explicação das variações", "“Obrigatórias pela empresa, não pela auditoria.”", "O texto é igual ao do ano passado? O que mudou e por quê?"]]}, {"t": "src", "h": "Fonte: slide 5 do deck e transcrição, 18:17 a 23:51."}, {"t": "quote", "q": "E aí pega aqueles relatório anual, lindo, maravilhoso, colorido… Com foto da Amazônia… Aí fica impressionado com as imagens, mas não lê o conteúdo. Moral da história, todo ano é o mesmo texto, só muda os números.", "by": "CLAIRTON ARAUJO"}, {"t": "box", "kind": "verif", "title": "VERIFICAÇÃO DE FATO", "items": [{"h": "O caso Panamericano foi descrito como um erro de configuração — “configuraram no sistema o débito, mas não configuraram o crédito”. A fraude real, descoberta em 2010, consistia em manter no ativo carteiras de crédito já cedidas a outros bancos; o rombo chegou a R$ 4,3 bilhões. A lição pedagógica dele vale; a mecânica, não."}, {"h": "A DFC como “reconciliação do lucro” descreve o método indireto. O CPC 03 admite também o método direto."}]}, {"t": "h3", "h": "Estrutura de capital: dívida não se paga, se administra"}, {"t": "p", "h": "Uma dinâmica de flipchart dividiu a sala. Três gestores: um financia 80% da operação com terceiros, outro 50%, outro 20%. A teoria fica com o primeiro — “dívida não se paga, dívida se administra” —, desde que o custo esteja no preço e a alavancagem tenha limite. O acionista não quer o gestor do meio, “em cima do muro”, nem o que só reinveste: “eu te contratei para você encher meu bolso de dinheiro.”"}, {"t": "cap", "h": "A dinâmica das três estruturas de capital"}, {"t": "table", "head": ["<strong>Gestor<\/strong>", "<strong>Terceiros / próprio<\/strong>", "<strong>Leitura de Clairton<\/strong>"], "rows": [["<strong>A<\/strong>", "80 / 20", "Preferido pela teoria — “isso chama alavancagem” —, com limite vigiado pelo conselho."], ["<strong>B<\/strong>", "50 / 50", "“Em cima do muro.” Não corre risco e não entrega retorno."], ["<strong>C<\/strong>", "20 / 80", "Usa o dinheiro do acionista para reinvestir. Seguro e caro."]]}, {"t": "quote", "q": "Uma empresa brasileira que pega dinheiro no Brasil vai pagar 2% ao mês… Então, às vezes, os juros matam o negócio.", "by": "CLAIRTON ARAUJO, COMPARANDO COM A MATRIZ EUROPEIA, A 2% AO ANO"}, {"t": "h3", "h": "O painel mínimo: dez indicadores que funcionam"}, {"t": "quote", "q": "Do que adianta eu ter 5 mil fórmulas a não ser usar 10 que funcionam?… O arroz com feijão bem feito, ninguém recusa.", "by": "CLAIRTON ARAUJO"}, {"t": "cap", "h": "O painel mínimo do conselheiro, segundo Clairton"}, {"t": "table", "head": ["<strong>Indicador<\/strong>", "<strong>Fórmula<\/strong>", "<strong>O que revela<\/strong>", "<strong>Sinal de alerta dado em aula<\/strong>"], "rows": [["<strong>Margem bruta<\/strong>", "Lucro bruto ÷ receita líquida", "Eficiência de produzir e vender", "Cair de 30% para 20% por pressão comercial que “ninguém traz essas coisas para a mesa de conselho”"], ["<strong>Margem EBITDA<\/strong>", "EBITDA ÷ receita líquida", "Geração operacional de caixa", "Uso de EBITDA ajustado — “não entrem nessa”"], ["<strong>Margem líquida<\/strong>", "Lucro líquido ÷ receita líquida", "Rentabilidade total", "Calcular sobre a nota emitida, não sobre a receita líquida"], ["<strong>Fluxo de caixa livre<\/strong>", "FCO − investimentos", "Caixa depois de investir", "Lucro sem caixa correspondente"], ["<strong>ROIC × custo de capital<\/strong>", "NOPAT ÷ capital investido", "Se a empresa cria valor", "ROIC abaixo do custo médio ponderado de capital"], ["<strong>Dívida líquida / EBITDA<\/strong>", "(Dívida − caixa) ÷ EBITDA", "Capacidade de pagar a dívida", "Acima de 2,5 a 3 vezes; covenants sem folga"], ["<strong>Cobertura de juros<\/strong>", "EBITDA ÷ despesa financeira", "Quantas vezes o operacional paga os juros", "Valor baixo — “os juros matam o negócio”"], ["<strong>Liquidez corrente<\/strong>", "Ativo circulante ÷ passivo circulante", "Folga de curto prazo", "Abaixo de 1; e folga ociosa é dinheiro parado"], ["<strong>Prazo de estoque<\/strong>", "360 ÷ giro de estoques", "Dias para renovar o estoque", "Itens sem giro há mais de 180 dias"], ["<strong>Prazo de recebimento<\/strong>", "Clientes × 360 ÷ receita líquida", "Dias para receber", "Prazo subindo: preço caindo e prazo esticado para vender"]]}, {"t": "src", "h": "Fonte: slides 7 a 11 e 18 do deck; sinais de alerta da transcrição. Fórmulas completas no Anexo A."}, {"t": "box", "kind": "verif", "title": "VERIFICAÇÃO DE FATO", "items": [{"h": "Na fala e no slide 18, o limite de “2,5 a 3 vezes” foi atribuído a EBITDA sobre juros. A faixa vale para <strong>dívida líquida sobre EBITDA<\/strong>, onde acima de 3 é ruim. Na cobertura de juros a leitura é inversa: quanto maior, melhor. A figura acima já separa as duas métricas."}]}, {"t": "quote", "q": "Tudo bem arrumadinho, o PowerPoint, então, feito agora na IA, fica mais lindo do que tudo. Só que, às vezes, tem muita boniteza. Nós precisamos ver o quê? Essência sobre a forma.", "by": "CLAIRTON ARAUJO"}, {"t": "h3", "h": "A ata: doa quem doer"}, {"t": "p", "h": "Se ler é dever, discordar também é. O instrumento é a ata — e ele foi literal sobre o texto."}, {"t": "box", "kind": "atencao", "title": "O REGISTRO EM ATA É A PROTEÇÃO DO CONSELHEIRO", "items": [{"h": "<em>“Não concordo, não compactuo, vou deixar registrado o ponto de atenção, o ponto de alerta. Porque amanhã, depois, entra em recuperação judicial e fala, cadê o conselho que não viu?”<\/em>"}, {"h": "“Tem que registrar em ata. Doa quem doer. Vocês não estão lá para seguir os outros.” Vale também quando quem convidou é amigo do presidente: “Não interessa.”"}, {"h": "Fora do escopo do órgão? Registre com elegância: “Pode deixar registrado em nota, gentilmente, que eu… sugeri à controladoria…”"}]}, {"t": "p", "h": "O caso que ele contou mostra o mecanismo inteiro. Numa fábrica de boa reputação, ele perguntou pela contingência ambiental. A diretoria reagiu com agressividade — “Ah, doeu? Doeu? Magoou? Então aí tem” — e o motivo apareceu: a provisão derrubaria o bônus do CEO de 1 milhão para 300 mil. Ele escalou ao presidente do conselho e pôs o cargo na mesa: “Se não botar em ata, eu já me retiro.” A saída negociada foi provisionar 10% ao ano por cinco anos."}, {"t": "box", "kind": "atencao", "title": "O INCENTIVO QUE IMPEDE A PROVISÃO", "items": [{"h": "<em>“O bônus do CEO é sempre em cima do resultado.”<\/em>"}, {"h": "Quando a remuneração variável depende de estimativas contábeis discricionárias — provisões, reversões, impairment —, o conselho está pagando para o número ficar bonito. É pauta do comitê de remuneração e do comitê de auditoria ao mesmo tempo. Por isso não cabe em nenhum dos dois sozinho."}]}, {"t": "quote", "q": "Não falo nada, não polemizo, ganho umas quarentinha por mês, uma reuniãozinha por mês e segue o baile. Não, não foi para isso que eu estudei.", "by": "CLAIRTON ARAUJO"}, {"t": "h3", "h": "Os passivos que os olhos não veem"}, {"t": "quote", "q": "Cuidado para os passivos ocultos. Aquilo que os olhos estão vendo é maravilhoso. E aquilo que os olhos não estão vendo?", "by": "CLAIRTON ARAUJO"}, {"t": "ul", "items": ["<strong>Trabalhista.<\/strong> Uma empresa com 60% de PJ e o tema fora do mapa de risco: peça cálculo de risco e registre em ata.", "<strong>Ambiental.<\/strong> O caso acima.", "<strong>Segurança do trabalho.<\/strong> “Primeiro dia, eu não quero ir pro escritório. Eu quero andar na fábrica.” Um acidente por semana e nenhuma provisão.", "<strong>Estoque parado.<\/strong> A matriz dele descobriu 40 milhões de euros de máquinas paradas em estoque em 32 países.", "<strong>Consolidado que maquia.<\/strong> Uma empresa de sementes com operação negativa e lucro vindo da sublocação de armazéns: “sempre olharem a parte operacional”."]}, {"t": "p", "h": "E a regra de toda reunião, qualquer que seja o órgão: “Demonstrações financeiras, fluxo de caixa na frente, mapa de risco na frente. Para começar a conversa.” Se a empresa não tem mapa de risco, a conversa de três minutos sobre isso já é o seu valor: “keep it simple, one page”, com os três principais riscos."}, {"t": "h3", "h": "A rotina de quem entra num conselho novo"}, {"t": "cap", "h": "A rotina de entrada num conselho novo"}, {"t": "table", "head": ["<strong>Passo<\/strong>", "<strong>O que fazer<\/strong>", "<strong>Na fala de Clairton<\/strong>"], "rows": [["<strong>1<\/strong>", "Separar capital aberto de fechado", "Muda o que é público e o que precisa ser pedido"], ["<strong>2<\/strong>", "Baixar cinco anos de demonstrações no RI", "“Eu como aquilo com ketchup e com mostarda”"], ["<strong>3<\/strong>", "Resumir — inclusive com IA — e recalcular à mão", "A IA resume; a conferência é sua"], ["<strong>4<\/strong>", "Se for fechada, estudar a líder aberta do setor", "“Sobe nos ombros do gigante… nas notas explicativas… ali está o ouro”"], ["<strong>5<\/strong>", "Chegar à primeira reunião com uma proposta concreta", "Não com uma lista de dúvidas"]]}, {"t": "h3", "h": "M&amp;A: conselho se pede antes"}, {"t": "quote", "q": "O que é conselheiro, conselheira? Aconselhar… Adianta pedir conselho depois que o negócio foi feito? Não, tem que pedir conselho antes.", "by": "CLAIRTON ARAUJO"}, {"t": "p", "h": "O conselho não negocia — “está no âmbito estratégico da administração” —, mas exige motivo forte, métricas de acompanhamento e acompanhamento ao longo dos anos. E Clairton declarou o próprio viés: “Eu, particularmente, não costumo votar muito positivamente em M&amp;A.” A frase que mais me importa, para quem já conduziu integração:"}, {"t": "quote", "q": "Se isso não for envolvido também, a parte de human capital, para poder fazer essas integrações… quem fica, quem não fica, vira um inferno.", "by": "CLAIRTON ARAUJO"}, {"t": "h3", "h": "A carreira de conselheiro, pela ótica de quem já está sentado"}, {"t": "ul", "items": ["“O problema é o QI. Não é o seu notório saber, é o QI, quem vai indicar.”", "“Não se preocupe em ser conselheiro de muitas empresas. Se preocupe em ser conselheiro de boas empresas.”", "O LinkedIn dele tem três linhas — “Quer saber sobre mim? Liga para mim.” Contraste direto com o conselho de Doern no Encontro 1, de reposicionar o perfil em uma especialidade.", "Trocar de mesa no almoço: “Se não fica aquelas panelinhas… vocês não trocam o networking de ouro.”"]}, {"t": "h3", "h": "O que a turma perguntou"}, {"t": "table", "head": ["<strong>Pergunta<\/strong>", "<strong>Resposta, em síntese<\/strong>"], "rows": [["<strong>Conflito entre sócios: falar reto ou virar coach?<\/strong>", "“Eu estou aqui como conselheiro, eu não estou aqui como um mediador de conflito.” Caso Mupy: irmãos sem se falar havia 30 anos — “Vocês não estão maduros para ter conselho.”"], ["<strong>Empresa familiar comprada por fundo<\/strong>", "O fundo valoriza e vende. O earnout prende o fundador, mas “muitos acabam saindo no meio do caminho porque não aguentam. Não aguentam receber ordem”. “Quem já foi rei e rainha jamais vai perder a majestade.”"], ["<strong>Governança no interior, com dono centralizador<\/strong>", "“Dono de padaria sabe o preço de tudo, mas não sabe o custo de nada.” O caminho é contabilidade gerencial — e a mudança só sai top-down, “só que aí, às vezes, é tarde demais”."], ["<strong>Como conseguir conselhos<\/strong>", "Indicação em cadeia. O primeiro convite, entregar valor, a próxima indicação."]]}, {"t": "p", "h": "O encerramento foi moral, e merece ser lido como tal: os escândalos não vieram de falta de conhecimento."}, {"t": "quote", "q": "Todas as pessoas de notório saber. Mas o que aconteceu com a maioria delas, para esses escândalos todos? Se corromperam.", "by": "CLAIRTON ARAUJO"}, {"t": "quote", "q": "Se você quer ser um profissional de reputação, não importa o valor. Mantenham a vossa moral de pé.", "by": "CLAIRTON ARAUJO"}, {"t": "h3", "h": "Sinais de alerta consolidados"}, {"t": "cap", "h": "Os doze sinais de alerta do Dia 1"}, {"t": "table", "head": ["<strong>Sinal<\/strong>", "<strong>Onde aparece<\/strong>"], "rows": [["<strong>Lucro contábil sem geração de caixa<\/strong>", "DFC"], ["<strong>Passivo circulante crescendo mais que o ativo<\/strong>", "Balanço"], ["<strong>Margem operacional caindo sem explicação objetiva<\/strong>", "DRE"], ["<strong>Consolidado sustentado por resultado não operacional<\/strong>", "DRE e notas"], ["<strong>EBITDA ajustado e métricas fora do padrão contábil<\/strong>", "Apresentação da diretoria"], ["<strong>Notas explicativas iguais às do ano anterior<\/strong>", "Notas"], ["<strong>Estoque sem giro há mais de 180 dias<\/strong>", "Balanço e notas"], ["<strong>Prazo de recebimento subindo<\/strong>", "Balanço"], ["<strong>Dívida líquida acima de 2,5 a 3 vezes o EBITDA; covenants sem folga<\/strong>", "Notas e contratos"], ["<strong>ROIC abaixo do custo de capital<\/strong>", "Cálculo próprio"], ["<strong>Passivos fora do mapa de risco: PJ, ambiental, acidentes<\/strong>", "Mapa de risco e notas de contingências"], ["<strong>Resposta agressiva a uma pergunta simples<\/strong>", "A própria reunião"]]}, {"t": "src", "h": "Fonte: slide 18 do deck e transcrição integral."}, {"t": "box", "kind": "verif", "title": "VERIFICAÇÃO DE FATO — O QUE CORRIGIR ANTES DE REPETIR", "items": [{"h": "<strong>Grupo Mateus.<\/strong> O ajuste foi citado como “pequeno ajuste de 40 bi”. O ajuste de estoques divulgado em novembro de 2025 foi de cerca de <strong>R$ 1,1 bilhão<\/strong>; a empresa perdeu cerca de R$ 2,5 bilhões em valor de mercado. A empresa tratou o caso como erro contábil, sob revisão — não chame de fraude."}, {"h": "<strong>Petrobras.<\/strong> A declaração sobre a descoberta na Bacia de Santos que mexeu nas ações, em 2008, foi de Haroldo Lima, diretor-geral da ANP, não de diretor da Petrobras."}, {"h": "<strong>Earnout<\/strong> foi chamado de “PMT”. Earnout é pagamento condicionado a metas futuras."}, {"h": "<strong>Abílio Diniz<\/strong> foi presidente do conselho da BRF, não executivo. O argumento sobre a internacionalização se sustenta; a atribuição pessoal simplifica."}]}, {"t": "box", "kind": "mesa", "title": "PARA LEVAR À MESA", "items": [{"n": "01", "h": "Quanto do lucro deste período virou caixa operacional, e o que explica a diferença?"}, {"n": "02", "h": "Qual a dívida líquida sobre EBITDA hoje e projetada para 12 meses, e a que distância estamos de cada covenant no pior cenário?"}, {"n": "03", "h": "O EBITDA da apresentação concilia com o EBITDA contábil? Quais ajustes, e por quê?"}, {"n": "04", "h": "Quanto do resultado vem de atividade não operacional?"}, {"n": "05", "h": "Qual o estoque sem giro há mais de 180 dias, e qual a provisão?"}, {"n": "06", "h": "Quais passivos trabalhistas possíveis não estão provisionados — PJ, terceirização, horas extras?"}, {"n": "07", "h": "Quanto das metas do bônus da diretoria depende de estimativas contábeis, e quem as revisa?"}, {"n": "08", "h": "Ao auditor: houve divergência com a administração sobre provisões, estoques ou receita? Como foi resolvida?"}, {"n": "09", "h": "O que mudou nas notas explicativas em relação ao ano passado — e o que deveria ter mudado e não mudou?"}, {"n": "10", "h": "Neste M&amp;A: quais métricas de sinergia, com que base e prazo, e quem reporta ao conselho nos próximos três anos — incluindo retenção de pessoas-chave?"}]}, {"t": "h3", "h": "Referências da sessão"}, {"t": "table", "head": ["<strong>Referência<\/strong>", "<strong>Como foi usada<\/strong>", "<strong>Observação<\/strong>"], "rows": [["<strong>Americanas, Grupo Mateus, Banco Master<\/strong>", "Contexto de abertura", "Números corrigidos no Anexo B"], ["<strong>Banco Panamericano (2010)<\/strong>", "Exemplo de DFC que “não fecha”", "Mecânica descrita não confere"], ["<strong>Spencer Johnson — <em>Quem Mexeu no Meu Queijo?<\/em><\/strong>", "Analogia para a DMPL", "—"], ["<strong>Princípio da essência sobre a forma<\/strong>", "Leitura de relatórios", "—"], ["<strong>Casos “Empresa 1” e “Empresa 2” do slide 16<\/strong>", "Previstos no deck", "Não apresentados em aula"], ["<strong>CPC/IFRS<\/strong>", "—", "Nenhuma norma foi citada; as pertinentes estão na Parte V"]]}, {"t": "src", "h": "Fonte: transcrição integral da sessão e verificação contra as fontes primárias."}], "notes": ["Os três indicadores do painel que eu mais preciso treinar", "Um passivo de gente que eu já vi ficar fora do mapa de risco — e como eu o traria à mesa", "A frase que eu usaria para registrar um dissenso em ata sem romper a relação"], "meta": "11h05  ·  104 minutos  ·  73 de exposição e 28 de perguntas da turma"}, {"num": "2.3", "head": "2.3  Mateus Schaumloffel — Partnership & cultura", "blocks": [{"t": "stats", "items": [{"n": "35", "l": "sócios em 120 pessoas na StartSe"}, {"n": "até 25%", "l": "do EBITDA distribuído em PLR, por semestre"}, {"n": "2 meses", "l": "para recuperar 100% da receita na pandemia"}, {"n": "5x", "l": "EBITDA + PL: a regra interna de valuation"}]}, {"t": "h3", "h": "Ficha do professor"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória, conforme dita em aula e no deck<\/strong>"], "rows": [["<strong>Formação<\/strong>", "“Eu sou administrador, eu tenho especialização em finanças.”"], ["<strong>Walmart<\/strong>", "Oito anos — “o único [endereço] que eu fiquei só como CLT”. Saiu porque “não tinha acesso a informação e muito menos transparência”."], ["<strong>XP<\/strong>", "Entrou em 2009, “sem salário”, para tocar a operação de seguros, deficitária. Depois assumiu administrativo e gente: “60% do DR[E] da companhia”. Oito anos. Participou da estruturação da partnership."], ["<strong>StartSe<\/strong>", "Há nove anos. Sócio e conselheiro; entrou pagando “50% mais caro do que todos, internos, porque eu era de fora”. Hoje no grupo de controle, com outros dois sócios."], ["<strong>Outros conselhos (deck)<\/strong>", "Yuool Shoes, Conta Simples (consultivo), Realize Capital."], ["<strong>Como se define<\/strong>", "“Eu sou de origem administrador financista, de performance. Eu não sou RH de qualquer empresa.” Aprova 100% das contratações e lê todas as avaliações."]]}, {"t": "h3", "h": "A tese: gente muito boa não precisa de controle. Precisa de alinhamento."}, {"t": "quote", "q": "Quando a gente trabalha com gente muito boa, a gente pode ter bagunça e crescimento acelerado, porque essas pessoas não precisam de controle. Elas tomam decisões, elas têm capacidade disso, desde que elas estejam alinhadas no risco. Isso se chama meritocracia com alinhamento.", "by": "MATEUS SCHAUMLOFFEL"}, {"t": "p", "h": "Alinhado no risco, na boca dele, quer dizer uma coisa concreta: ganhar e perder no bolso, junto com o dono. No curto prazo, PLR sem teto. No longo, ação de verdade — registrada na junta comercial no dia 1, não prometida para daqui a quatro anos. A XP, segundo ele, sobreviveu a duas crises porque não tinha salário para oferecer e oferecia sociedade."}, {"t": "p", "h": "Mas a aula começa por uma advertência que vale mais que o modelo: partnership não é para todos, e não se instala por receita de livro."}, {"t": "h3", "h": "A sequência: cultura, informação, variável — e só então sociedade"}, {"t": "quote", "q": "Comecem pelo começo, crie na cultura de transparência, a partir da cultura de transparência, crie algum incentivo de curto prazo, médio prazo, para aí sim chegar no incentivo de longo prazo, que às vezes leva anos. A ação tem que ser um desejo, não tem que ser dado, porque senão não tem valor.", "by": "MATEUS SCHAUMLOFFEL"}, {"t": "cap", "h": "A escada da partnership"}, {"t": "table", "head": ["<strong>Degrau<\/strong>", "<strong>O que precisa existir<\/strong>", "<strong>Frase que sustenta<\/strong>"], "rows": [["<strong>1. Cultura<\/strong>", "Comportamento do líder como padrão", "“Cultura se define só por um objeto, espelho.”"], ["<strong>2. Informação<\/strong>", "Números abertos; conformidade fiscal e trabalhista", "“Eu não vou trabalhar, independente de quanto eu tenho de ação, num lugar que eu não saiba os números.”"], ["<strong>3. Variável<\/strong>", "PLR crível, com regra e consequência", "“Tem limite o PLR? Aqui não tem, nunca teve.”"], ["<strong>4. Sociedade<\/strong>", "Só para quem é relevante e consistente", "“Sociedade não é para todo mundo.”"]]}, {"t": "src", "h": "Fonte: transcrição, 23:13 a 23:44 (primeira gravação) e 12:19 (segunda)."}, {"t": "p", "h": "E o limite da escada: “Empresas em dificuldade, mercados que não crescem muito, eu não sei se eu iria no caminho de partnership. Porque as pessoas não vão querer ser sócias disso.” Nesses casos, fica-se na PLR."}, {"t": "h3", "h": "Alinhamento × autonomia: a matriz que explica o Walmart e a StartSe"}, {"t": "cap", "h": "Formas de gestão, segundo o deck de Mateus"}, {"t": "table", "head": ["", "<strong>Baixa autonomia<\/strong>", "<strong>Alta autonomia<\/strong>"], "rows": [["<strong>Alto alinhamento<\/strong>", "Equipe frustrada", "Inovação"], ["<strong>Baixo alinhamento<\/strong>", "Eficiência", "Caos"]]}, {"t": "src", "h": "Fonte: slide 4 do deck. Na fala, “alinhamento” significa quase sempre alinhamento de interesse econômico."}, {"t": "quote", "q": "Se eu dou autonomia, porém as pessoas não terão dor no bolso pelo erro, caos. E aí a equipe se frustra se eu tenho todo mundo alinhado e eu seguro as pessoas.", "by": "MATEUS SCHAUMLOFFEL"}, {"t": "p", "h": "Mercado de commodity, como o da Gerdau, tolera os quadrantes de baixo. Mercado de inovação, não. O critério não é preferência de estilo. É a velocidade com que o mercado muda."}, {"t": "h3", "h": "A PLR que multiplica a cultura"}, {"t": "p", "h": "O desenho da StartSe junta quatro decisões numa fórmula só:"}, {"t": "cap", "h": "O desenho da PLR da StartSe, conforme dito em aula"}, {"t": "table", "head": ["<strong>Parâmetro<\/strong>", "<strong>Regra na StartSe<\/strong>"], "rows": [["<strong>Periodicidade<\/strong>", "Semestral"], ["<strong>Pool<\/strong>", "“Até 25% do resultado que a empresa deixar”, hoje sobre o EBITDA"], ["<strong>Teto individual<\/strong>", "Nenhum — “e se depender só de nós, nunca terá”"], ["<strong>Peso da cultura<\/strong>", "“Mérito cultural e mérito performático no mesmo peso”"], ["<strong>Fórmula<\/strong>", "Performance × cultura × tempo de casa × relevância, cada um de 1 a 5 — “tudo que multiplicar por zero é zero”"], ["<strong>Avaliação de cultura<\/strong>", "360 sigiloso; comentários lidos e editados antes da devolutiva; calibração com os líderes, nome a nome"]]}, {"t": "box", "kind": "atencao", "title": "ZERAR A CULTURA NA VARIÁVEL TEM CONSEQUÊNCIA", "items": [{"h": "Um aluno contou que tirou a cultura da remuneração variável porque a avaliação 360 estava inflada — “todo mundo empurrando pra cima”. A resposta:"}, {"h": "<em>“Zerou o peso da cultura. Você vai ter uma consequência disso. Você está premiando, basicamente, as pessoas que entregam o resultado, às vezes, a qualquer custo.”<\/em>"}, {"h": "O problema real do aluno era metrificar com qualidade. Tirar o critério resolve a medição e piora o comportamento."}]}, {"t": "p", "h": "Sobre a avaliação, ele desmontou o próprio slide. O deck pede “critérios objetivos”; a fala diz o contrário. E é a fala que vale:"}, {"t": "quote", "q": "Não existe avaliação objetiva. Quem falar que o seu processo é objetivo está sendo injusto. Ou está se iludindo.", "by": "MATEUS SCHAUMLOFFEL"}, {"t": "p", "h": "A qualidade, para ele, vem de três práticas: cruzar autoavaliação com avaliação do gestor e olhar onde a distância é maior; usar IA para ler todos os comentários e encontrar áreas “generosas”, “punitivas” ou críticas em cultura; e ter consequência. “O problema é que a gente avalia, identifica as pessoas ruins e elas estão lá no próximo ciclo. Esse é o grande erro.”"}, {"t": "p", "h": "Avaliação sem consequência não é gestão de desempenho. É arquivo."}, {"t": "p", "h": "A variável “relevância” merece atenção. É o peso da pessoa — “aquela pessoa que você leva na reunião… que você leva para uma viagem, mesmo que não seja da posição direta”. Ele admite um C-level com relevância menor que um liderado: “acontece muito”."}, {"t": "h3", "h": "Seleção: a entrevista feita para você desistir"}, {"t": "ul", "items": ["<strong>Busca ativa em 100% das vagas.<\/strong> “Os melhores a gente já conhece e são pessoas que já estiveram conosco, porque eles têm cultura certificada.”", "<strong>Só dois aprovam contratação<\/strong> — os que mais reprovam. “Não tem como o RH mandar gente boa para todas as posições, não funciona.”", "<strong>Não se fala de dinheiro.<\/strong> “A pessoa vai descobrir se foi aprovada recebendo uma proposta… a minha entrevista é pra você desistir, literalmente.”", "<strong>A pergunta ao líder:<\/strong> “Essa pessoa vai ou não te substituir? Se sim, eu só preciso saber o tempo.”", "<strong>O alerta contra o próprio método:<\/strong> “A gente gosta de pessoas como nós. Isso é armadilha.”"]}, {"t": "p", "h": "Política e ideologia na contratação: a lei restringe temas, a StartSe não se posiciona, e se algo for critério de cultura, investiga-se por hábito, nunca por pergunta direta."}, {"t": "h3", "h": "Cultura é espelho — e agressão à cultura é saída imediata"}, {"t": "quote", "q": "Eu aprendi na prática que cultura se define só por um objeto, espelho. Se você quer que as pessoas se comportem de determinada maneira, primeiro você se comporta daquela maneira.", "by": "MATEUS SCHAUMLOFFEL"}, {"t": "p", "h": "A tolerância é assimétrica: “Agressão forte à cultura é rua, imediatamente. E performance a gente tem mais paciência, mas não muito. Em vendas é três meses.” O caso mais duro do dia veio daí: uma denúncia de vendas falsificadas para receber comissão, somada a um grupo paralelo de mensagens. “Em um dia eu só deixei duas pessoas da nossa área comercial, eu demiti todo mundo.” Os sócios foram vender. Vieram três reclamações trabalhistas, resolvidas em acordo."}, {"t": "quote", "q": "O que eu aprendi ao longo da minha vida é que todas essas pessoas são demitidas e ninguém quebrou por causa disso… quando tiver agressor de cultura, demite.", "by": "MATEUS SCHAUMLOFFEL"}, {"t": "h3", "h": "Os instrumentos de equity"}, {"t": "cap", "h": "Os instrumentos de remuneração de longo prazo comparados em aula"}, {"t": "table", "head": ["<strong>Instrumento<\/strong>", "<strong>Mecânica<\/strong>", "<strong>Quando a pessoa é sócia<\/strong>", "<strong>Observação de Mateus<\/strong>"], "rows": [["<strong>Partnership StartSe<\/strong>", "O sócio compra a ação, financiada em até dois anos, a preço de fórmula", "No dia 1, no contrato social", "Proteção ao erro: recompra corrigida nos dois primeiros anos"], ["<strong>Vesting por metas<\/strong>", "Participação liberada por ano, contra metas", "Ao fim do vesting", "“O ruim é esperar quatro anos para as pessoas se sentirem sócias”"], ["<strong>RSU<\/strong>", "Ação concedida com vesting; a XP usa hoje, com cinco anos", "Progressivamente", "Chamada em aula de “Reserve Stock Unit” — é Restricted"], ["<strong>Stock option<\/strong>", "Direito de comprar no futuro a preço fixado hoje", "No exercício", "Para o “sócio-acessório”"], ["<strong>Phantom share<\/strong>", "Em aula, “o contrato de gaveta”", "Nunca formalmente", "Tecnicamente é direito a pagamento em dinheiro; confirme com advogado"]]}, {"t": "src", "h": "Fonte: transcrição das duas gravações e slides 23 e 24 do deck."}, {"t": "h3", "h": "As regras da sociedade viva"}, {"t": "p", "h": "A segunda metade da aula foi quase toda em perguntas sobre o contrato. A lógica que amarra as respostas cabe numa frase dele: “A regra não é pró-sócio nunca. A sociedade está na frente dos indivíduos, sempre. Se não, não seja meu sócio.”"}, {"t": "cap", "h": "As regras de entrada, saída e governança da partnership StartSe"}, {"t": "table", "head": ["<strong>Regra<\/strong>", "<strong>Como funciona na StartSe<\/strong>"], "rows": [["<strong>Valuation<\/strong>", "Mesma fórmula na entrada e na saída: 5x EBITDA dos últimos 12 meses + patrimônio líquido. Após a venda ao Grupo Alun: 4x EBITDA − dívida líquida, depois de liquidar a regra antiga"], ["<strong>Entrada<\/strong>", "Ticket típico de R$ 50 a 100 mil; dívida de até dois anos, corrigida por CDI ou IPCA; dividendo retido para quitar"], ["<strong>Recompra<\/strong>", "Direito, nunca obrigação: “se eu nunca tiver dinheiro, eu nunca vou te recomprar”"], ["<strong>Venda a terceiros<\/strong>", "Proibida: “o sócio não pode vender para fora, só pode vender para nós”"], ["<strong>Maior sócio<\/strong>", "Também recomprável: “ninguém tem poder supremo porque aqui não é uma empresa familiar”"], ["<strong>Família<\/strong>", "Não entra. Falecimento leva à recompra. Procuração do sócio ao controle para assinar transações"], ["<strong>Comitê da partnership<\/strong>", "Duas vezes por ano, matriz cultura × performance: “a cultura faz demissão no comitê de partnership”"]]}, {"t": "src", "h": "Fonte: transcrição e slides 15 a 22 do deck. O detalhamento do deck está no Anexo A."}, {"t": "quote", "q": "A gente não pode ter a obrigação de comprar ninguém nunca, porque isso quebra a companhia. Volte na pandemia, o maior stress test que a gente já viveu.", "by": "MATEUS SCHAUMLOFFEL"}, {"t": "p", "h": "Na pandemia, a StartSe perdeu 100% da receita de uma vez. Nenhum sócio saiu, a receita voltou inteira em dois meses e ninguém foi demitido — “isso só foi possível pelos sócios, que já se sentiam sócios desde o dia 1”. Com obrigação de recompra, segundo ele, teria quebrado."}, {"t": "box", "kind": "atencao", "title": "PARA O CONSELHEIRO QUE REVISA UM ACORDO DE ACIONISTAS", "items": [{"h": "<strong>Acordo aberto demais destrói valor na venda.<\/strong> “Vai perder valor quando tu for vender tua empresa se o teu acordo de acionistas estiver muito aberto.”"}, {"h": "<strong>Mudar a regra exige quitar a anterior.<\/strong> “Nunca recomendamos mudar a regra do jogo sem antes quitar ela.”"}, {"h": "<strong>Informação privilegiada na recompra é legal e é fatal.<\/strong> Perguntado se recompraria um sócio pela fórmula sabendo de uma venda iminente: “O contrato normalmente não proíbe isso. O problema é que se faz uma vez isso, acabou, tu nunca mais vai ter sócio.” Um advogado da turma sugeriu a cláusula de “maior dos valores” por 12 meses após a saída."}, {"h": "<strong>Família é o caso-limite.<\/strong> “A partir do momento que a gente confunde família, a gente está colocando o indivíduo na frente da sociedade.” E: “Muitas vezes o lugar de um filho é no conselho.”"}]}, {"t": "h3", "h": "O RH que muda a decisão"}, {"t": "p", "h": "A pergunta foi de um participante de RH: nos conselhos se vê pouca representatividade dessa voz; quando o executivo quer evoluir a cultura, o comitê responde “eu quero assim, assim, assado”. Mateus contou como entrou na mesa da XP."}, {"t": "box", "kind": "mesa", "title": "COMO SE CONQUISTA UMA CADEIRA NA MESA", "items": [{"h": "<em>“Tu não vai participar se é só para te ouvir. Só participa daquela reunião quem muda a decisão.”<\/em>"}, {"h": "A frase é de Guilherme Benchimol, quando Mateus, principal líder de RH da XP, perguntou por que não era chamado para a reunião das terças às 7h30. O que ele fez depois:"}, {"h": "<strong>Nunca pediu orçamento.<\/strong> “Todas as minhas áreas de RH eu diminuí. Nunca aumentei.” <strong>Implantou um sistema de metas<\/strong> para toda a corporação. <strong>Assumiu o custo de pessoal<\/strong> — “dono de 60% do que se gasta”. <strong>Concentrou a aprovação de contratação.<\/strong> “Aí eu conquistei a minha vaga naquela mesa.”"}, {"h": "Um segundo aprendizado do mesmo período: “nunca fala mal de alguém para pedir ajuda. Nunca. Chama a própria pessoa e resolva.”"}, {"h": "<strong><em>A meta do RH, para ele, é uma só: quem foi contratado entrega cultura e performance. “Não é contratar rápido. Não é contratar muitas pessoas. Não é demitir pouco.”<\/em><\/strong>"}]}, {"t": "h3", "h": "O que o conselheiro procura primeiro numa diligência"}, {"t": "box", "kind": "atencao", "title": "REMUNERAÇÃO VARIÁVEL É ONDE ESTÁ O FOGO", "items": [{"h": "<em>“Isso vira passivo trabalhista quando vai calcular um valuation. Simples como isso… Como é remuneração variável? Aí que está o fogo.”<\/em>"}, {"h": "Bônus pago todo ano como se fosse eventual vira salário para a Justiça do Trabalho. Pejotização é dívida diferida: “Se você economizou ao longo da jornada, você vai pagar no final.” E sociedade usada como remuneração mais barata distorce o valuation interno: “Ninguém quer ser sócio disso.”"}]}, {"t": "p", "h": "Sobre o CEO, uma regra sem meio-termo: “Se você vai contratar um CEO e você não está disposto a entregar um pacote agressivo de ações ou de remuneração, você não está pronto para ter um CEO. Seja o CEO.” E sobre a quantidade de ações: “Nunca venda poeirinha.”"}, {"t": "h3", "h": "Pontos de atenção"}, {"t": "ul", "items": ["<strong>Partnership sem transparência perde valor.<\/strong> A ação não alinha quem não vê os números.", "<strong>Concentrar seleção e avaliação numa pessoa<\/strong> protege a cultura e cria risco de pessoa-chave e de viés de afinidade.", "<strong>Pesquisa de clima é compromisso, não diagnóstico.<\/strong> “Não pesquisa se tu não está disposto a mudar, porque você vai ser cobrado e você perde o crédito.”", "<strong>Sócio também é demitido.<\/strong> “Sócio também tem problemas. E não deve ser tratado diferente. Demita sócios.”", "<strong>Reconhecimento motiva mais que salário<\/strong> — na opinião dele, sem fonte citada: “Salário é terceiro, quarto ou quinto. E dura no máximo três meses.”"]}, {"t": "box", "kind": "verif", "title": "VERIFICAÇÃO DE FATO", "items": [{"h": "<strong>PLR.<\/strong> Foi dito que o intervalo mínimo entre pagamentos é de seis meses. Desde a Lei 12.832/2013, a Lei 10.101/2000 exige intervalo não inferior a um trimestre civil, com no máximo dois pagamentos por ano."}, {"h": "<strong>Hipersuficiente<\/strong> foi descrito como quem “ganha mais de 10 mil reais”. A CLT exige diploma de nível superior e salário igual ou superior a duas vezes o teto do INSS."}, {"h": "<strong>Venda da StartSe.<\/strong> Anunciada em setembro de 2025, ao Grupo Alun (Alura, FIAP, PM3), pela totalidade da empresa — não só pelo controle. O fundo citado como “SIC” é a SEEK, ao lado da Crescera."}, {"h": "<strong>Time teller × clock builder<\/strong>, usado no deck sem crédito, é de Jim Collins e Jerry Porras. A frase de Drucker no deck tem a mesma ressalva da sessão 2.1."}]}, {"t": "box", "kind": "mesa", "title": "PARA LEVAR À MESA", "items": [{"n": "01", "h": "Qual o peso da cultura na remuneração variável do C-level — e ele pode chegar a zerar o prêmio?"}, {"n": "02", "h": "Quantas pessoas mal avaliadas no ciclo passado continuam na empresa neste ciclo?"}, {"n": "03", "h": "Como a nossa remuneração variável é paga: PLR com acordo, ou bônus recorrente que vira salário?"}, {"n": "04", "h": "Qual a proporção de PJ em funções com características de vínculo, e qual o passivo estimado?"}, {"n": "05", "h": "O acordo de acionistas prevê recompra como direito ou como obrigação? Com que preço e em que data de referência?"}, {"n": "06", "h": "O que acontece com a participação de um executivo-sócio que morre, se divorcia ou sai brigado?"}, {"n": "07", "h": "O pacote do CEO contratado o faz ganhar e perder com o acionista?"}]}, {"t": "h3", "h": "Referências da sessão"}, {"t": "table", "head": ["<strong>Referência<\/strong>", "<strong>Como foi usada<\/strong>", "<strong>Observação<\/strong>"], "rows": [["<strong>Maria Luiza Filgueiras — <em>Na Raça<\/em> (biografia de Guilherme Benchimol)<\/strong>", "História da partnership da XP", "Recomendada sem título; ler antes de repetir detalhes pessoais"], ["<strong>Sam Walton — <em>Made in America<\/em><\/strong>", "“O livro do Walmart já é mais antigo, mas ele é muito bom”", "Título não dito; identificação provável"], ["<strong>Collins e Porras — <em>Feitas para Durar<\/em> (1994)<\/strong>", "Time teller × clock builder", "Sem crédito no deck"], ["<strong>Banco Garantia, Goldman Sachs, BTG Pactual, Pátria<\/strong>", "Origem e variações do modelo de partnership", "—"], ["<strong>Modelos de acordo de acionistas e de PLR<\/strong>", "Material de apoio na área do aluno", "Baixar e arquivar"]]}, {"t": "src", "h": "Fonte: transcrição das duas gravações e deck."}], "notes": ["O que eu já vi dar errado numa remuneração de longo prazo — e qual regra teria evitado", "Onde eu fui “dono” de uma decisão na mesa, e não só ouvido", "A minha posição sobre peso de cultura na variável de executivos, em três frases", "DIA 2  ·  7 DE OUTUBRO  ·  FAMÍLIA, IMPACTO E REPUTAÇÃO"], "meta": "14h10  ·  3h07 em duas gravações, antes e depois do intervalo  ·  a sessão com mais perguntas do dia"}, {"num": "2.4", "head": "2.4  Ivan Murias — Governança e sucessão em famílias empresárias", "blocks": [{"t": "stats", "items": [{"n": "9", "l": "conselhos em que atua, 7 deles em famílias empresárias"}, {"n": "3", "l": "fóruns: família, sócios e negócio"}, {"n": "4", "l": "gerações no protocolo do Grupo Gentil"}, {"n": "10× · 15×", "l": "o impasse de múltiplo que travou a Tok&amp;Stok"}]}, {"t": "h3", "h": "Ficha do professor"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória, conforme dita em aula<\/strong>"], "rows": [["<strong>Carreira executiva<\/strong>", "“Eu fui 21 anos varejista entre C&amp;A, [Iguatemi] e Boticário.” Abriu as primeiras lojas da C&amp;A na China, em 2006. “Fui CEO da Tok&amp;Stok… Fui CEO da Valid e da InfraCommerce.”"], ["<strong>Hoje<\/strong>", "“Eu sou um board member profissional. Então eu trabalho em nove [conselhos] de administração.” Presidente do conselho da Infracommerce e da Marisa — “duas companhias em mandatos de reestruturação profunda”."], ["<strong>Famílias empresárias<\/strong>", "“Dos nove… sete são famílias empresárias.” No conselho do Grupo Gentil, maior franqueado do Boticário, há seis anos."], ["<strong>No programa<\/strong>", "Integra o conselho da comunidade com o curador. Frequenta o Family Business Network."]]}, {"t": "p", "h": "O curador abriu o dia com dois avisos: o podcast quinzenal da comunidade, que já gravou episódios sobre comitês, conselhos e conselho de família, e o encontro do dia seguinte no Morumbi."}, {"t": "h3", "h": "A tese: família é substantivo, empresa é adjetivo"}, {"t": "p", "h": "Ivan começou desmontando o nome. Não existe empresa familiar; existe família empresária. A família é o substantivo — vínculo, honra, passado. A empresa é o adjetivo — escolha, mérito, futuro. Os dois tempos convivem em tensão permanente:"}, {"t": "quote", "q": "A família vive do, entre aspas, passado… A empresa, ela vive do futuro.", "by": "IVAN MURIAS"}, {"t": "p", "h": "O teste de entrada é uma pergunta só, e eu a levaria para qualquer primeira conversa com uma família:"}, {"t": "quote", "q": "Se o negócio acabar, o almoço de domingo continua existindo, sim ou não?", "by": "IVAN MURIAS"}, {"t": "p", "h": "O que converte a tensão em força são duas pedras angulares — a imagem foi a do aqueduto de Segóvia, em que a pedra irregular sustenta o arco. Governança e sucessão."}, {"t": "quote", "q": "Governança, apesar da gente emprestar, às vezes, o significado para a burocracia, não é burocracia, é arquitetura.", "by": "IVAN MURIAS"}, {"t": "quote", "q": "O sucessor não é aquele que recebe o negócio. Ele recebe a responsabilidade de criar os próximos ciclos desse negócio.", "by": "IVAN MURIAS"}, {"t": "p", "h": "O quarto mandamento manda honrar pai e mãe, não amar. Ivan explicou a escolha da palavra:"}, {"t": "quote", "q": "Amar pode ser, nesse contexto aqui, só um sentimento. Eu posso ter, eu posso não ter. Mas eles colocaram honrar porque é quase que um dever, é uma obrigação. Na família, a gente não é escolhido.", "by": "IVAN MURIAS"}, {"t": "p", "h": "Honra é dívida com o que veio antes. É também o que o investidor de fora costuma esquecer — e foi o que custou a Tok&amp;Stok."}, {"t": "h3", "h": "O mercado não desconta a família. Desconta a governança."}, {"t": "quote", "q": "Não é um family discount… É um poor governance discount. Não é o fato da empresa ser familiar… É o fato de ter uma governança baixa.", "by": "IVAN MURIAS"}, {"t": "cap", "h": "Os sinais do desconto por governança fraca"}, {"t": "table", "head": ["<strong>Sinal<\/strong>", "<strong>Como ele formulou<\/strong>"], "rows": [["<strong>Controle além do voto<\/strong>", "“Eu tenho 40% da minha família empresária, mas eu decido tudo.”"], ["<strong>Minoritários ignorados<\/strong>", "Capital de sócios tomado emprestado, sócios sem voz."], ["<strong>Família despreparada na liderança<\/strong>", "Herdeiros em posições de comando sem formação de sucessores."], ["<strong>Confusão patrimonial<\/strong>", "“Caixa da PJ misturada com caixa da PF, o helicóptero está na companhia, o barco está na companhia. É uma farra.”"], ["<strong>Dependência do fundador<\/strong>", "Enquanto ele está, existe. Quando ele se vai, o negócio se esvai."]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 24:31 a 26:04."}, {"t": "p", "h": "O terceiro sinal é o que me interessa. Família despreparada na liderança e sucessor não formado não são tema de sentimento. Entram no preço."}, {"t": "h3", "h": "Quando montar o conselho: o quanto antes"}, {"t": "quote", "q": "O quanto antes. Por quê? Porque normalmente vai ser mais barato… do que os erros que você vai cometer sem eles.", "by": "IVAN MURIAS"}, {"t": "p", "h": "O argumento veio em dois animais. O cisne negro de Nassim Taleb é o evento imprevisível de impacto enorme — 11 de setembro, Lehman Brothers, Covid. Ivan fechou as 66 lojas da Tok&amp;Stok na pandemia. O cisne vermelho, conceito de Silvio Meira, é o oposto: o risco previsível, conhecido, que se escolhe não tratar."}, {"t": "cap", "h": "Cisne negro × cisne vermelho"}, {"t": "table", "head": ["", "<strong>Cisne negro<\/strong>", "<strong>Cisne vermelho<\/strong>"], "rows": [["<strong>Previsibilidade<\/strong>", "Imprevisível", "Previsível e conhecido"], ["<strong>O que falha<\/strong>", "A antecipação", "A ação"], ["<strong>Exemplos em aula<\/strong>", "11 de setembro, Lehman Brothers, Covid", "Ataque hacker — “não é se, é quando” —, barragens, educação com giz e família empresária bem-sucedida sem governança e sem sucessão"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 31:24 a 36:22; Taleb (2007) e Silvio Meira, citado em aula."}, {"t": "p", "h": "O último exemplo da lista é o que pesa. Todo mundo sabe. Ninguém age."}, {"t": "quote", "q": "Montar um conselho construtivo, se preocupar com a governança, ir atrás da sucessão, é comprar esse tempo que você precisa e, às vezes, comprar repertório que você precisa.", "by": "IVAN MURIAS"}, {"t": "h3", "h": "Capital aberto × família empresária: duas governanças"}, {"t": "cap", "h": "Governança de capital aberto × governança de família empresária"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Capital aberto<\/strong>", "<strong>Família empresária<\/strong>"], "rows": [["<strong>Finalidade<\/strong>", "Valor para acionistas e stakeholders", "Valor para a família, por gerações"], ["<strong>Estrutura<\/strong>", "Conselho deliberativo obrigatório, comitês técnicos", "Conselho consultivo, formal e informal; dois ou três membros da família à mesa"], ["<strong>Decisão<\/strong>", "Análise técnica, compliance, accountability", "Técnica, mas atravessada por afeto e hierarquia — “se vovô Antônio fala pra não fazer, é melhor não fazer”"], ["<strong>Fundador<\/strong>", "Afastado da gestão ao longo do tempo", "Presente em funções simbólicas e efetivas"], ["<strong>Sucessão<\/strong>", "Planejada, por mérito", "Quando e se necessária — muitas vezes reativa"], ["<strong>Legitimidade<\/strong>", "Institucionalidade", "Confiança construída no tempo"]]}, {"t": "src", "h": "Fonte: tabela projetada em aula e transcrição, 49:13 a 57:28."}, {"t": "quote", "q": "A legitimidade do conselho de companhia de capital aberta deriva da institucionalidade. Em… famílias empresárias, é muito da confiança.", "by": "IVAN MURIAS"}, {"t": "p", "h": "Essa é a diferença que eu levo. No capital aberto, a cadeira dá autoridade. Na família, a autoridade vem antes da cadeira — e se chama confiança."}, {"t": "p", "h": "O caso Magalu mostrou o valor de uma ponte: Marcelo Silva presidiu a empresa por quatro ou cinco anos entre Luiza Helena e Fred Trajano. A lição não é sobre quem sucede. É sobre onde o fundador fica."}, {"t": "quote", "q": "Pensar no lugar que o fundador vai ter é super importante nesse processo.", "by": "IVAN MURIAS"}, {"t": "h3", "h": "Os três círculos: três fóruns, três conversas"}, {"t": "quote", "q": "Simples, eficiente, é o básico do básico que vocês precisam entender para poder entrar em uma família empresária. Dominou isso aqui bem? 90% dos problemas estão resolvidos.", "by": "IVAN MURIAS, SOBRE O MODELO DE DAVIS E TAGIURI"}, {"t": "cap", "h": "Os três círculos de Davis e Tagiuri, traduzidos em fóruns"}, {"t": "table", "head": ["<strong>Círculo<\/strong>", "<strong>Fórum<\/strong>", "<strong>Objetivo<\/strong>", "<strong>Instrumentos<\/strong>"], "rows": [["<strong>Família<\/strong>", "Conselho de família", "“Trabalhar união e pertencimento, nada mais”", "Protocolo de família, regimento"], ["<strong>Propriedade<\/strong>", "Conselho de sócios", "Diretrizes de longo prazo: patrimônio, dividendos, entrada e saída, sucessão patrimonial", "Contrato social, acordo de sócios"], ["<strong>Negócio<\/strong>", "Conselho consultivo ou de administração", "Supervisão ativa e independente da gestão: estratégia, performance, risco, governança e liderança", "Regimento do conselho, comitês"], ["<strong>Filantropia<\/strong>", "Instituto", "Devolver à origem — um quarto círculo, para fins didáticos", "Estatuto do instituto"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 57:28 a 64:08."}, {"t": "quote", "q": "Ao longo do tempo você começa a sair desse chapéu e começa a participar de reunião de família… Mas você tem que ter ciência de que o teu chapéu é esse aqui.", "by": "IVAN MURIAS, SOBRE O LUGAR DO CONSELHEIRO: O CÍRCULO DO NEGÓCIO"}, {"t": "p", "h": "No Grupo Gentil, o risco mais sério não estava em nenhuma conversa de família. Estava no balanço:"}, {"t": "quote", "q": "Toda a riqueza dessa família está alocada num único ativo… O contrato de franquia é tão simples quanto notificação de 90 dias. E aí?… uma família pode simplesmente desaparecer do ponto de vista econômico.", "by": "IVAN MURIAS"}, {"t": "p", "h": "O modelo que a família adotou para organizar tudo isso é o dos 8 Ps, do professor José Paschoal Rossetti: práticas, propriedade, princípios, propósito, papéis, pessoas e poder, que produzem o oitavo — perpetuidade."}, {"t": "quote", "q": "A perpetuidade… não é o objetivo per se, ele é uma consequência de uma boa governança, de uma boa atuação nos outros sete.", "by": "IVAN MURIAS"}, {"t": "h3", "h": "O caso Gentil: governança construída em cima de sutilezas"}, {"t": "p", "h": "O processo começou em 2014 e seguiu uma ordem que eu reconheço de qualquer trabalho sério de cultura: ouvir a história do fundador, ouvir as aspirações de cada um, nomear os valores de cada geração e só então escrever regras."}, {"t": "cap", "h": "Os valores do Grupo Gentil, atribuídos a cada geração"}, {"t": "table", "head": ["<strong>Geração<\/strong>", "<strong>Valor<\/strong>", "<strong>De onde veio<\/strong>"], "rows": [["<strong>Fundadores<\/strong>", "“Na nossa família só entra o fruto do nosso trabalho”", "Seca, escassez, fazer mais com menos"], ["<strong>Filhos<\/strong>", "Empoderar o conhecimento que transforma vidas", "Estudo, intercâmbio"], ["<strong>Netos<\/strong>", "Ter a liberdade de dizer de forma gentil", "Questionar sem chutar a porta"], ["<strong>Todas<\/strong>", "Sentir prazer em servir com atenção e gratidão", "Inscrito no regimento interno do conselho"]]}, {"t": "src", "h": "Fonte: transcrição da sessão, 70:06 a 81:32."}, {"t": "quote", "q": "Nada mais é do que um consenso de quatro gerações sobre as regras e acordos que precisam ser respeitados para preservar as relações das famílias empresárias.", "by": "IVAN MURIAS, DEFININDO PROTOCOLO DE FAMÍLIA"}, {"t": "p", "h": "O detalhe mais fino foi de linguagem. A família deixou de chamar cônjuges de “agregados”:"}, {"t": "quote", "q": "Essa família aqui decidiu chamar Mário, Vanilson e Adriana de incluídos… Se eu te chamo de incluído, eu te quero aqui.", "by": "IVAN MURIAS"}, {"t": "quote", "q": "É uma sutileza. Precisa pensar sobre isso, porque você vai construindo a governança em cima dessas sutilezas.", "by": "IVAN MURIAS"}, {"t": "p", "h": "Uma palavra mudou quem senta no conselho de família. Isso é gestão da mudança feita por vocabulário."}, {"t": "p", "h": "Do Grupo Cornélio Brennand, em Recife, veio a regra mais concreta do dia:"}, {"t": "quote", "q": "No nosso protocolo de família está escrito que para você trabalhar e vir até a fábrica, você precisa usar o carro que está definido no protocolo de família. Quer ter Porsche? Pode ter Porsche. Quer ter Ferrari? Pode ter Ferrari, mas você vai ter isso na sua vida privada.", "by": "IVAN MURIAS, RELATANDO O PROTOCOLO"}, {"t": "quote", "q": "Se você também não cria esse fórum, esse fórum vai ser criado informalmente. A pessoa vai ter a curiosidade dela, vai perguntar para a tia, para o primo.", "by": "IVAN MURIAS, SOBRE PRESTAÇÃO DE CONTAS À FAMÍLIA"}, {"t": "h3", "h": "Cada geração joga um esporte"}, {"t": "cap", "h": "A metáfora esportiva de Ivan Murias"}, {"t": "table", "head": ["<strong>Geração<\/strong>", "<strong>Esporte<\/strong>", "<strong>O que muda<\/strong>"], "rows": [["<strong>1ª<\/strong>", "Tênis", "Fundador e cônjuge decidem sozinhos"], ["<strong>2ª<\/strong>", "Basquete", "Sociedade de irmãos
