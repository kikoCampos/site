"id": "e2s3", "num": "2.3", "palestrante": "Mateus Schaumloffel", "titulo": "Partnership & cultura", "credencial": "Sócio e conselheiro da StartSe há nove anos, ex-XP, onde liderou administrativo e gente e participou da estruturação da partnership.", "ideia": "Gente muito boa não precisa de controle, precisa de alinhamento: ganhar e perder no bolso junto com o dono. Partnership não é para todos e não se instala por receita de livro; vem depois de cultura, transparência e variável crível.", "pontos": ["A escada é cultura, informação, variável e só então sociedade; em empresa em dificuldade, fica-se na PLR.", "Na StartSe, a PLR multiplica performance, cultura, tempo de casa e relevância: cultura zero zera o prêmio.", "Não existe avaliação objetiva; a qualidade vem de calibração, leitura de comentários e consequência.", "Recompra de sócio é direito, nunca obrigação: obrigação quebra a companhia numa crise.", "Numa diligência, o fogo está na remuneração variável: bônus recorrente vira salário e pejotização é dívida diferida."], "citacao": {"texto": "Zerou o peso da cultura. Você vai ter uma consequência disso. Você está premiando, basicamente, as pessoas que entregam o resultado, às vezes, a qualquer custo.", "autor": "Mateus Schaumloffel"}}, {"id": "e2s4", "num": "2.4", "palestrante": "Ivan Murias", "titulo": "Governança e sucessão em famílias empresárias", "credencial": "Board member profissional em nove conselhos, sete em famílias empresárias; presidente do conselho da Infracommerce e da Marisa; ex-CEO da Tok&Stok.", "ideia": "Não existe empresa familiar, existe família empresária: a família é o substantivo, a empresa é o adjetivo. Governança e sucessão são as pedras angulares que convertem a tensão entre passado e futuro em força, e o mercado desconta a governança fraca, não a família.", "pontos": ["O desconto é de governança, não de família: controle além do voto, confusão PJ e PF e dependência do fundador entram no preço.", "Cisne vermelho é o risco previsível que se escolhe não tratar, como a família bem-sucedida sem governança e sem sucessão.", "Os três círculos de Davis e Tagiuri pedem três fóruns: conselho de família, conselho de sócios e conselho do negócio.", "Na família, a legitimidade do conselho vem da confiança: o conselheiro começa ouvindo, não ensinando.", "Investidor que parte da premissa de que faltava ambição à família e esquece de honrar o legado paga o preço, como na Tok&Stok."], "citacao": {"texto": "Não é um family discount… É um poor governance discount. Não é o fato da empresa ser familiar… É o fato de ter uma governança baixa.", "autor": "Ivan Murias"}}, {"id": "e2s5", "num": "2.5", "palestrante": "Vanessa", "titulo": "ESG integrado ao modelo de negócio", "credencial": "Mais de 20 anos em negócios e sustentabilidade, ex-gerente de sustentabilidade do Citibank, membro externo de comitês de sustentabilidade e ex-aluna da primeira turma do Board Program.", "ideia": "ESG que não muda o modelo de negócio é relatório. Para o conselheiro, a agenda é priorizar poucos temas materiais, ler como os riscos se potencializam ao longo da cadeia e amarrar metas ESG à remuneração variável.", "pontos": ["Presença não é integração: ter comitê ou relatório não significa ESG na estratégia.", "Materialidade é priorizar onde a empresa gera impacto e onde é impactada; o mesmo tema muda de peso conforme o negócio.", "As seis crises são interconectadas: o risco climático depende de onde a empresa está na cadeia, não só do que ela emite.", "O pilar social é NR-01 e direitos humanos na cadeia: saúde mental entra no conselho como risco, não como benefício.", "Decisões legais, mas eticamente controversas, deveriam passar pelo conselho."], "citacao": {"texto": "O fato da ESG estar presente não significa que ela está sendo integrada de uma estratégia de negócio.", "autor": "Vanessa"}}, {"id": "e2s6", "num": "2.6", "palestrante": "Elisa Prado", "titulo": "Gestão de crises e reputação na era digital", "credencial": "Ex-diretora de comunicação da Vivo por mais de dez anos, professora da ESPM em gestão de riscos e crises e autora de Gestão de Reputação (Aberje).", "ideia": "Crise não é se, é quando, e o preparo separa as empresas. Reputação é o que falam de você quando você sai da sala. Na crise, a primeira hora decide a narrativa, quem fala é o executivo e o conselho aconselha, salvo vácuo de liderança.", "pontos": ["Se uma pessoa é impactada, é crise, não incidente.", "O primeiro posicionamento sai em uma hora, numa nota de um parágrafo: o que ocorreu, o que está acontecendo, o que se vai fazer.", "Fala o CEO ou o porta-voz técnico que ele designar; em crise de pessoas, o diretor de recursos humanos.", "O presidente do conselho ou o acionista de referência só fala em vácuo executivo, depois dos colaboradores; CEO demissionário nunca é porta-voz.", "As crises discutidas já estavam mapeadas: readiness é matriz de risco, comitê, porta-voz e simulado antes do fato."], "citacao": {"texto": "Se você não resolve e soluciona uma crise em uma hora… você perde o bonde. De novo, se você não contar a sua história, alguém vai contar… uma vez uma verdade instalada, é muito difícil.", "autor": "Elisa Prado"}}], "casos": [{"id": "e2k1", "nome": "Telesp", "resumo": "A tele mais eficiente do país era uma empresa de engenharia focada em atender a Anatel. Manoel Amorim teve cerca de um ano antes da concorrência para pôr o cliente no lugar do regulador. Fez isso com gestos: ligou no 0800, levou o atendente à reunião de diretoria, suspendeu a venda do Speedy até funcionar, inclusive o próprio bônus.", "licao": "A primeira decisão foi trocar o bônus da diretoria, e a estrutura (a área de experiência do cliente) veio só depois que a história circulou. Primeiro o gesto, depois a estrutura."}, {"id": "e2k2", "nome": "A provisão ambiental e o bônus do CEO", "resumo": "Numa fábrica de boa reputação, Clairton perguntou pela contingência ambiental e a diretoria reagiu com agressividade. A provisão derrubaria o bônus do CEO de 1 milhão para 300 mil. Ele escalou ao presidente do conselho e disse: \"Se não botar em ata, eu já me retiro.\" A saída negociada foi provisionar 10% ao ano por cinco anos.", "licao": "Quando a variável depende de estimativas contábeis, o conselho paga para o número ficar bonito. É pauta conjunta dos comitês de remuneração e de auditoria."}, {"id": "e2k3", "nome": "StartSe: a pandemia e a área comercial", "resumo": "Na pandemia, a StartSe perdeu 100% da receita de uma vez. Nenhum sócio saiu, ninguém foi demitido e a receita voltou em dois meses. Em outro episódio, uma denúncia de vendas falsificadas para receber comissão levou Mateus a demitir quase toda a área comercial num dia; vieram três reclamações trabalhistas, resolvidas em acordo.", "licao": "Sem obrigação de recompra, a sociedade atravessou o maior teste de estresse. E agressão à cultura pede saída imediata: \"ninguém quebrou por causa disso\"."}, {"id": "e2k4", "nome": "Grupo Gentil", "resumo": "Maior franqueado do Boticário, com quatro gerações no protocolo de família, construído desde 2014 a partir da história do fundador e dos valores de cada geração. A família passou a chamar cônjuges de \"incluídos\", não de \"agregados\". O risco mais sério estava no balanço: toda a riqueza num único ativo, um contrato de franquia rescindível com notificação de 90 dias.", "licao": "Governança se constrói sobre sutilezas e a partir dos problemas que se quer resolver. Concentração patrimonial num ativo único é risco de existência e pauta de conselho."}, {"id": "e2k5", "nome": "Tok&Stok", "resumo": "Fundada em 1978, a família vendeu 60% ao Carlyle em 2012. O fundo colheu resultado, preteriu o sucessor interno com 35 anos de casa e, depois do turnaround que levou o EBITDA de 90 para 271 milhões, travou no múltiplo: o mercado oferecia 10× EBITDA, o Carlyle queria 15×. A família recusou a proposta. O IPO não saiu; a Mobly assumiu o controle em 2024 e o Grupo Toky pediu recuperação judicial em maio de 2026.", "licao": "Valuation se negocia em planilha; rancor, não. O investidor que parte da premissa de que faltava ambição à família e esquece de honrar o legado paga o preço."}, {"id": "e2k6", "nome": "Americanas", "resumo": "No fato relevante de 11 de janeiro de 2023 vieram as inconsistências de cerca de R$ 20 bilhões e a saída do CEO e do CFO; a ação caiu cerca de 77% no dia seguinte. No exercício em grupos, Elisa Prado apontou o erro: o CEO demissionário como porta-voz e a nota dos acionistas de referência dizendo que não sabiam.", "licao": "Em vácuo executivo, fala o presidente do conselho ou o acionista de referência, depois dos colaboradores, com apuração rigorosa e comitê independente. Alinhamento sem independência vira abafamento."}], "cartoes": [{"id": "e2c01", "sessao": "e2s1", "frente": "Uma estratégia nova não cabe na cultura atual. Qual a regra de decisão de Carlos Júlio?", "verso": "Se o desalinhamento vem de um traço, como aversão ao erro ou falta de ownership, muda-se o traço, não a estratégia. Só se revê a estratégia quando ela é \"muito, muito, muito adversa\" à cultura.", "fonte": "Carlos Júlio"}, {"id": "e2c02", "sessao": "e2s1", "frente": "O que diferencia story building de storytelling?", "verso": "Storytelling é contar o que foi feito: o líder é narrador e corre o risco de soar como manipulação. Story building é fazer coisas que criam histórias: o líder é protagonista e paga custo pessoal real.", "fonte": "Carlos Júlio"}, {"id": "e2c03", "sessao": "e2s1", "frente": "Por que a ordem importa ao perenizar uma mudança de cultura?", "verso": "Primeiro se constroem as histórias, depois se mexe em políticas e práticas: \"Não inverte isso.\" Na Telesp, a área de experiência do cliente só nasceu depois que a história já circulava.", "fonte": "Carlos Júlio"}, {"id": "e2c04", "sessao": "e2s1", "frente": "Quais são os seis atributos de uma história que muda cultura?", "verso": "Autêntica; líder protagonista; rompe com o passado e sinaliza o futuro; fala à mente e ao coração; teatral; gera outras histórias. Sem razão de mercado, vira \"viagem do ego do líder\".", "fonte": "Carlos Júlio"}, {"id": "e2c05", "sessao": "e2s1", "frente": "Por que a primeira decisão de Manoel Amorim na Telesp foi mexer no bônus da diretoria?", "verso": "Porque o incentivo é a frase mais lida da cultura. Cumprir a Anatel virou obrigação; o bônus passou a depender de conquistar o mercado. A mudança começou pelo que a empresa remunera, não pelo discurso de valores.", "fonte": "Carlos Júlio"}, {"id": "e2c06", "sessao": "e2s1", "frente": "Como tratar o pedido de bônus para uma diretoria que não bateu a meta, mas \"trabalhou muito\"?", "verso": "Como decisão cultural, não financeira: \"Eu aprendi a remunerar resultado.\" A regra para o comitê de pessoas é critério escrito antes, não justificativa depois, mesmo que o conselho pareça insensível.", "fonte": "Carlos Júlio"}, {"id": "e2c07", "sessao": "e2s2", "frente": "Em que ordem Clairton lê as demonstrações, e por quê?", "verso": "DFC, depois DRE, depois balanço. A DFC reconcilia lucro e caixa e não aceita retoque: quando há manipulação, \"a DFC não fecha\". Todo lucro se transforma em caixa; o oposto não é verdadeiro.", "fonte": "Clairton Araujo"}, {"id": "e2c08", "sessao": "e2s2", "frente": "Qual a zona de alerta para dívida líquida sobre EBITDA, e que confusão evitar ao citá-la?", "verso": "Acima de 2,5 a 3 vezes, com covenants sem folga. Em aula a faixa foi atribuída a EBITDA sobre juros, mas na cobertura de juros a leitura é inversa: quanto maior, melhor.", "fonte": "Clairton Araujo"}, {"id": "e2c09", "sessao": "e2s2", "frente": "A partir de quantos dias sem giro o estoque vira pedido para a ata?", "verso": "Mais de 180 dias, com a provisão correspondente. A matriz de Clairton descobriu 40 milhões de euros em máquinas paradas em estoque em 32 países.", "fonte": "Clairton Araujo"}, {"id": "e2c10", "sessao": "e2s2", "frente": "Por que o bônus do CEO pode ser a causa de um número errado?", "verso": "\"O bônus do CEO é sempre em cima do resultado.\" Se a variável depende de provisões, reversões ou impairment, o conselho paga para o número ficar bonito. É pauta conjunta dos comitês de remuneração e auditoria.", "fonte": "Clairton Araujo"}, {"id": "e2c11", "sessao": "e2s2", "frente": "Como Clairton registra discordância, e o que fazer se o tema estiver fora do escopo do órgão?", "verso": "\"Não concordo, não compactuo, vou deixar registrado o ponto de atenção.\" Em ata, doa quem doer. Fora do escopo, registra-se com elegância a sugestão feita, por exemplo, à controladoria.", "fonte": "Clairton Araujo"}, {"id": "e2c12", "sessao": "e2s2", "frente": "Como chegar à primeira reunião de um conselho novo, segundo Clairton?", "verso": "Com cinco anos de demonstrações lidas, resumidas e recalculadas à mão; se a empresa for fechada, estudando a líder aberta do setor e suas notas explicativas. E com uma proposta concreta, não com uma lista de dúvidas.", "fonte": "Clairton Araujo"}, {"id": "e2c13", "sessao": "e2s2", "frente": "Quais passivos de gente Clairton manda procurar fora do mapa de risco?", "verso": "Trabalhista, como uma empresa com 60% de PJ sem o tema no mapa; e segurança do trabalho, como um acidente por semana sem provisão. Peça cálculo de risco e registre em ata.", "fonte": "Clairton Araujo"}, {"id": "e2c14", "sessao": "e2s2", "frente": "Qual o papel do conselho num M&A, para Clairton?", "verso": "Conselho se pede antes. O conselho não negocia, mas exige motivo forte, métricas de acompanhamento ao longo dos anos e o capital humano na integração: \"quem fica, quem não fica, vira um inferno\".", "fonte": "Clairton Araujo"}, {"id": "e2c15", "sessao": "e2s3", "frente": "O que Mateus chama de meritocracia com alinhamento?", "verso": "Gente muito boa trabalhando sem controle, desde que alinhada no risco: ganha e perde no bolso junto com o dono. No curto prazo, PLR sem teto; no longo, ação registrada na junta no dia 1.", "fonte": "Mateus Schaumloffel"}, {"id": "e2c16", "sessao": "e2s3", "frente": "Qual a sequência que precede a oferta de sociedade, e quando não oferecê-la?", "verso": "Cultura, informação (números abertos), variável crível e só então sociedade. Em empresas em dificuldade ou mercados que crescem pouco, fica-se na PLR: as pessoas não vão querer ser sócias disso.", "fonte": "Mateus Schaumloffel"}, {"id": "e2c17", "sessao": "e2s3", "frente": "Por que a PLR da StartSe multiplica os fatores em vez de somá-los?", "verso": "Performance × cultura × tempo de casa × relevância, notas de 1 a 5: tudo que multiplica por zero é zero. Quem entrega sem cultura perde muito; na simulação do caderno, o vendedor artista cai de 157 para 81 mil.", "fonte": "Mateus Schaumloffel"}, {"id": "e2c18", "sessao": "e2s3", "frente": "Qual o efeito colateral da fórmula multiplicativa que a simulação revelou?", "verso": "Premia tempo de casa e relevância de forma agressiva: protege a senioridade junto com a cultura e penaliza duas vezes o júnior. Para reter talento jovem, o fator tempo precisa de piso.", "fonte": "Mateus Schaumloffel"}, {"id": "e2c19", "sessao": "e2s3", "frente": "No acordo de sócios, recompra deve ser direito ou obrigação? Por quê?", "verso": "Direito, nunca obrigação: obrigação \"quebra a companhia\". Na pandemia a StartSe perdeu 100% da receita; sem obrigação de recompra, nenhum sócio saiu e a receita voltou em dois meses.", "fonte": "Mateus Schaumloffel"}, {"id": "e2c20", "sessao": "e2s3", "frente": "Onde está \"o fogo\" numa diligência, segundo Mateus?", "verso": "Na remuneração variável. Bônus pago todo ano como se fosse eventual vira salário na Justiça do Trabalho e passivo no valuation. Pejotização é dívida diferida: \"você vai pagar no final\".", "fonte": "Mateus Schaumloffel"}, {"id": "e2c21", "sessao": "e2s3", "frente": "O que levou o RH de Mateus para a mesa de decisão da XP?", "verso": "\"Só participa daquela reunião quem muda a decisão.\" Ele assumiu metas da corporação, custo de pessoal (60% do que se gasta) e aprovação de toda contratação. Nunca pediu orçamento; reduziu as próprias áreas.", "fonte": "Mateus Schaumloffel"}, {"id": "e2c22", "sessao": "e2s4", "frente": "O mercado aplica um family discount? O que Ivan diz que ele desconta?", "verso": "Desconta governança fraca, não família: controle além do voto, minoritários ignorados, família despreparada na liderança, caixa de PJ misturado com PF e dependência do fundador.", "fonte": "Ivan Murias"}, {"id": "e2c23", "sessao": "e2s4", "frente": "O que separa o cisne negro do cisne vermelho?", "verso": "O negro (Taleb) é imprevisível: falha a antecipação. O vermelho (Silvio Meira) é previsível e conhecido, mas se escolhe não tratar: falha a ação. Exemplo central: família bem-sucedida sem governança e sem sucessão.", "fonte": "Ivan Murias"}, {"id": "e2c24", "sessao": "e2s4", "frente": "Que fórum corresponde a cada um dos três círculos, e qual é o chapéu do conselheiro?", "verso": "Família: conselho de família, para união e pertencimento. Propriedade: conselho de sócios, para patrimônio, dividendos, entrada e saída. Negócio: conselho consultivo ou de administração. O lugar inicial do conselheiro é o negócio.", "fonte": "Ivan Murias"}, {"id": "e2c25", "sessao": "e2s4", "frente": "De onde vem a legitimidade do conselho numa família empresária, e o que isso muda na entrada?", "verso": "No capital aberto, da institucionalidade; na família, da confiança construída no tempo. Por isso o conselheiro começa \"por ouvir, ouvir muito\", não descarregando repertório de executivo.", "fonte": "Ivan Murias"}, {"id": "e2c26", "sessao": "e2s4", "frente": "Qual era o risco mais sério do Grupo Gentil, e onde ele estava?", "verso": "No balanço, não na família: toda a riqueza alocada num único ativo, um contrato de franquia rescindível com notificação de 90 dias. Concentração patrimonial é pauta de conselho.", "fonte": "Ivan Murias"}, {"id": "e2c27", "sessao": "e2s4", "frente": "O que travou a saída negociada entre Carlyle e família na Tok&Stok?", "verso": "O múltiplo: o mercado oferecia 10× EBITDA e o fundo queria 15×. A família recusou a proposta de saída conjunta. Para Ivan, pesou o rancor de um investidor que presumiu falta de ambição e preteriu o sucessor interno.", "fonte": "Ivan Murias"}, {"id": "e2c28", "sessao": "e2s4", "frente": "Qual régua as famílias esquecem ao preparar herdeiros?", "verso": "A comportamental, \"a barra esquecida\". Definem a técnica (formação, experiência fora) e esquecem que comportamento se forma \"por modelagem de comportamento ao longo de décadas\".", "fonte": "Ivan Murias"}, {"id": "e2c29", "sessao": "e2s5", "frente": "Como distinguir presença de integração do ESG?", "verso": "Comitê de sustentabilidade ou relatório é presença. Integração aparece no modelo de negócio: o que se ganha, o que se perde e como fazer. Se o tema só entra na pauta com o relatório anual, não está na estratégia.", "fonte": "Vanessa"}, {"id": "e2c30", "sessao": "e2s5", "frente": "Qual o critério de materialidade que Vanessa propõe ao conselheiro?", "verso": "Priorizar, não abraçar: os poucos temas em que a empresa gera impacto e em que é impactada. Biodiversidade é irrelevante num hotel urbano e \"materialidade total\" num hotel nas Cataratas do Iguaçu.", "fonte": "Vanessa"}, {"id": "e2c31", "sessao": "e2s5", "frente": "Por que uma empresa que quase não emite pode estar muito exposta ao clima?", "verso": "Porque o risco depende de onde ela está na cadeia. A armazenagem do agro perde volume com a quebra de safra. O mapa de risco precisa mostrar como um risco potencializa o outro.", "fonte": "Vanessa"}, {"id": "e2c32", "sessao": "e2s5", "frente": "Como o pilar social do ESG deve chegar ao conselho?", "verso": "Como risco: NR-01 e direitos humanos na cadeia de valor. Saúde mental deixa de ser benefício e vira passivo trabalhista, risco financeiro e item da matriz de risco.", "fonte": "Vanessa"}, {"id": "e2c33", "sessao": "e2s5", "frente": "Por que a remuneração variável é etapa obrigatória da jornada ESG, e qual o cuidado?", "verso": "Sem meta ESG no desempenho executivo, \"a gente não vai avançar\". O cuidado vem de Fábio Barbosa, citado por ela: \"A busca pelo bônus é fator de risco.\" O incentivo precisa de critério para não virar o problema.", "fonte": "Vanessa"}, {"id": "e2c34", "sessao": "e2s5", "frente": "Que tipo de decisão legal deveria passar pelo conselho, segundo Vanessa?", "verso": "A eticamente controversa: classificação fiscal agressiva, como o sorvete que vira bebida láctea, ou multa ambiental tratada como modelo de negócio. Passa pela ética antes de passar pelo jurídico.", "fonte": "Vanessa"}, {"id": "e2c35", "sessao": "e2s6", "frente": "Qual o critério de Elisa Prado para separar incidente de crise?", "verso": "Pessoas atingidas. Se uma pessoa é impactada, é crise. Incidente não atinge ninguém e fica dentro da empresa; crise sai do controle e chega aos stakeholders.", "fonte": "Elisa Prado"}, {"id": "e2c36", "sessao": "e2s6", "frente": "Qual o prazo e o formato do primeiro posicionamento numa crise?", "verso": "Uma hora. Nota oficial de um parágrafo: o que ocorreu, o que está acontecendo, o que se vai fazer. Sem dados completos, assume a responsabilidade e promete que os afetados serão os primeiros a saber.", "fonte": "Elisa Prado"}, {"id": "e2c37", "sessao": "e2s6", "frente": "Quem fala na crise, e em que caso o conselho fala?", "verso": "O CEO ou o porta-voz técnico que ele designar; em crise de pessoas, o diretor de RH. O conselho aconselha. Só em vácuo executivo fala o presidente do conselho ou o acionista de referência, depois dos colaboradores.", "fonte": "Elisa Prado"}, {"id": "e2c38", "sessao": "e2s6", "frente": "Qual foi, para Elisa, o erro central de comunicação da Americanas?", "verso": "Falta de liderança: o CEO demissionário como porta-voz e a nota dos acionistas de referência dizendo que não sabiam. O certo seria denúncia, apuração rigorosa, comitê independente e anunciar afastamento do CEO, não renúncia.", "fonte": "Elisa Prado"}, {"id": "e2c39", "sessao": "e2s6", "frente": "Por que o conselheiro costuma ser o último a saber da crise?", "verso": "Por cultura de medo: quem sabe teme ser demitido. Segurança psicológica e canal de escalada são infraestrutura, não clima. A pergunta de entrada: o que tem maior probabilidade e maior impacto?", "fonte": "Elisa Prado"}, {"id": "e2c40", "sessao": "e2s6", "frente": "Nas redes, o que pesa mais para dimensionar uma crise?", "verso": "Relevância antes de volume: quem está falando, quantas pessoas estão falando e qual a relevância delas. Ignorar as redes está entre os erros mais citados.", "fonte": "Elisa Prado"}, {"id": "e2c41", "sessao": "e2s5", "frente": "Qual o status do relatório de sustentabilidade no padrão ISSB para companhias abertas?", "verso": "A CVM 193 o previa obrigatório a partir de 2026. A CVM 244, de 29 de maio de 2026, tornou-o voluntário; a partir de 2027, quem não publicar terá de explicar ao mercado.", "fonte": "Resolução CVM 244/2026"}, {"id": "e2c42", "sessao": "e2s5", "frente": "O que a NR-01 atualizada exige, e desde quando há fiscalização?", "verso": "Inclui riscos psicossociais no gerenciamento de riscos ocupacionais, com fiscalização desde 26 de maio de 2026. A ergonomia do teletrabalho vem sobretudo da NR-17 e do art. 75-E da CLT.", "fonte": "NR-01 (Portaria MTE 1.419/2024)"}, {"id": "e2c43", "sessao": "e2s3", "frente": "Qual o limite legal de pagamentos de PLR?", "verso": "Até dois pagamentos por ano, com intervalo mínimo de um trimestre civil, não de seis meses como dito em aula.", "fonte": "Lei 10.101/2000"}, {"id": "e2c44", "sessao": "e2s2", "frente": "Todo M&A é fato relevante?", "verso": "Não. Pela Resolução CVM 44/2021, depende de materialidade, não do tipo de operação.", "fonte": "Resolução CVM 44/2021"}], "dilemas": [{"id": "e2d1", "titulo": "O bônus por esforço", "sessao": "e2s1", "contexto": "Você é conselheiro independente e integra o comitê de pessoas de uma empresa de serviços de capital fechado. O ano fechou abaixo da meta e a régua do bônus da diretoria não foi atingida. O CEO pede ao conselho um bônus discricionário: o time \"trabalhou muito\", enfrentou um mercado duro e, sem o pagamento, a empresa pode perder gente boa. Dois diretores já receberam propostas de concorrentes. O presidente do conselho tende a aprovar para que o conselho não pareça insensível.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Aprovar o bônus discricionário integral para reter o time num momento difícil.", "qualidade": "fragil", "feedback": "Carlos Júlio tratou exatamente esse pedido: \"Nós vamos tirar dinheiro do acionista para pagar os caras porque eles se esforçaram? Gente, isso é cultura.\" Aprovar ensina à organização que a meta é negociável e que esforço vale tanto quanto resultado. A retenção é um problema real, mas não se resolve pagando a diretoria inteira por um resultado que não veio."}, {"id": "b", "texto": "Negar o bônus e encerrar o tema, mantendo a régua como está.", "qualidade": "aceitavel", "feedback": "A decisão é coerente com Carlos Júlio, que aprendeu \"a remunerar resultado\". Mas ele também alertou que o conselho pode parecer insensível e que é preciso \"tomar muito cuidado com isso\". Negar sem tratar o risco de perder os dois diretores e sem deixar critério para os próximos ciclos protege a cultura e deixa a retenção sem resposta."}, {"id": "c", "texto": "Negar o bônus por esforço, tratar a retenção dos dois diretores com instrumento nominal e propor critério escrito de discricionariedade para os próximos ciclos.", "qualidade": "melhor", "feedback": "Separa as duas decisões que o pedido mistura. O bônus coletivo por esforço é decisão cultural, e a regra do caderno para o comitê de pessoas é clara: discricionariedade exige critério escrito antes, não justificativa depois. A retenção de pessoas-chave é um risco específico e merece instrumento específico. Assim o conselho preserva o sinal de que a empresa remunera resultado, como defendeu Carlos Júlio."}, {"id": "d", "texto": "Aprovar metade do bônus agora e rebaixar a meta do próximo ano para tornar o alvo alcançável.", "qualidade": "fragil", "feedback": "É a pior combinação: paga o esforço e ainda muda a régua depois do jogo. Carlos Júlio lembrou que a primeira decisão de Amorim na Telesp foi trocar o bônus para remunerar o que a estratégia exigia. Rebaixar a meta para caber no desempenho faz o bônus remunerar o hábito antigo, e a rádio peão vai entender o recado."}]}, {"id": "e2d2", "titulo": "A provisão que derruba o bônus", "sessao": "e2s2", "contexto": "Você é conselheiro de uma indústria de boa reputação. Ao ler as notas explicativas, encontra uma contingência ambiental sem provisão, embora o laudo técnico indique remediação provável. Quando pergunta, o diretor financeiro reage com irritação. Você descobre que a provisão integral derrubaria o bônus do CEO, calculado sobre o lucro. O auditor não apontou o tema. As demonstrações serão aprovadas amanhã, e o presidente do conselho, amigo do CEO, pede que você não crie tensão às vésperas do fechamento.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Exigir que conste em ata o ponto de atenção com fato, risco e recomendação de provisão, escalar ao presidente e levar ao comitê de remuneração as metas que dependem de estimativas contábeis.", "qualidade": "melhor", "feedback": "É o roteiro de Clairton Araujo: \"Tem que registrar em ata. Doa quem doer.\" No caso dele, a reação agressiva foi o sinal (\"Ah, doeu? Doeu? Magoou? Então aí tem\") e o motivo era o bônus do CEO. Ele escalou e pôs o cargo na mesa. Tratar também o incentivo fecha a causa: quando a variável depende de provisão, o conselho paga para o número ficar bonito."}, {"id": "b", "texto": "Aprovar as demonstrações e pedir ao auditor que examine o tema no próximo trimestre.", "qualidade": "fragil", "feedback": "Clairton abriu a aula com o argumento contrário: \"As auditorias não são pagas para te dar 100% de garantia nas coisas.\" O dever de ler é do conselheiro. Se a empresa entrar em dificuldade, a pergunta será a que ele citou: \"cadê o conselho que não viu?\" Adiar sem registro deixa o conselheiro sem proteção e mantém o número errado."}, {"id": "c", "texto": "Abster-se na votação, sem justificativa registrada, para não romper a relação com o presidente.", "qualidade": "fragil", "feedback": "A abstenção silenciosa não protege nem a empresa nem o conselheiro. Clairton foi explícito: vale também quando quem convidou é amigo do presidente, \"Não interessa.\" E descreveu o conselheiro que não polemiza, ganha \"umas quarentinha por mês\" e segue o baile: \"não foi para isso que eu estudei\". Sem registro, não há ponto de atenção."}, {"id": "d", "texto": "Aceitar uma provisão escalonada ao longo de alguns anos, desde que o critério e o cálculo constem em ata.", "qualidade": "aceitavel", "feedback": "Foi a saída negociada no caso de Clairton: 10% ao ano por cinco anos, com registro. É uma solução defensável quando a provisão integral é inviável no curto prazo. Mas, sozinha, não ataca a causa que ele apontou: \"O bônus do CEO é sempre em cima do resultado.\" Sem rever o incentivo, a próxima estimativa sofrerá a mesma pressão."}]}, {"id": "e2d3", "titulo": "O fundo à porta", "sessao": "e2s4", "contexto": "Você é conselheiro independente de uma rede varejista de segunda geração, com conselho consultivo há dois anos. Um fundo de private equity propõe comprar 60% da empresa, com o fundador na gestão por três anos. O plano do fundo promete acelerar a receita e reduzir o estoque pela metade. O irmão que dirige a área comercial há vinte anos, visto como sucessor natural, não aparece no plano. A irmã, sócia fora da operação, quer vender; o irmão, não. A discussão já tomou o almoço de domingo.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Recomendar a venda: o preço é bom e o fundo traz ambição e gestão profissional.", "qualidade": "fragil", "feedback": "Ivan Murias descreveu essa premissa como o erro típico do private equity em família empresária: \"partir da premissa de que faltava ambição naquela família e que eu sei o que precisa ser feito\". Cortar estoque sem entender o modelo pode quebrar a cadeia, como no exemplo da Serra Gaúcha. Na Tok&Stok, o sucessor interno foi preterido e a história terminou mal."}, {"id": "b", "texto": "Sugerir um assessor financeiro para negociar o melhor múltiplo antes de qualquer outra discussão.", "qualidade": "aceitavel", "feedback": "Preço importa, mas Ivan mostrou na Tok&Stok que o impasse não foi só de planilha: o mercado oferecia 10× EBITDA, o fundo queria 15×, e pesou o rancor. Valuation se negocia em planilha; rancor, não. Começar pelo múltiplo ignora a sucessão interna, a divergência entre os irmãos e a proteção do modelo de negócio depois da venda."}, {"id": "c", "texto": "Deixar que o fundador decida, como sempre fez, e apoiar a decisão dele.", "qualidade": "fragil", "feedback": "É a decisão fora do fórum certo, o \"se vovô Antônio fala pra não fazer, é melhor não fazer\" que Ivan usou para ilustrar a governança atravessada por hierarquia. Mantém a dependência do fundador, um dos sinais do desconto por governança fraca, e deixa os irmãos sem espaço legítimo para divergir. O conflito vai continuar no almoço de domingo."}, {"id": "d", "texto": "Separar os fóruns: preço, saída e patrimônio no conselho de sócios; no conselho do negócio, exigir que o acordo proteja o modelo, a sucessão interna e a saída de ambos, depois de ouvir cada sócio.", "qualidade": "melhor", "feedback": "Aplica os três círculos de Ivan Murias: venda de controle é tema de propriedade, e o chapéu do conselheiro é o negócio. A pergunta que ele deixou para a mesa é exatamente esta: o que no acordo protege o modelo de negócio, a sucessão interna e a saída de ambos? E começa ouvindo, porque na família a legitimidade do conselho vem da confiança."}]}, {"id": "e2d4", "titulo": "Legal, mas é ético?", "sessao": "e2s5", "contexto": "Você é conselheiro independente de uma indústria de alimentos de capital aberto. O diretor tributário apresenta uma reclassificação fiscal de um produto que reduz de forma relevante a carga de impostos. O parecer jurídico é favorável. O CFO lembra que concorrentes fazem o mesmo e que a meta de EBITDA, base do bônus da diretoria, depende dessa economia. Um colega de conselho resume que o erro é do governo, não da empresa. O tema chegou como item informativo, sem deliberação.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Aceitar como informativo: é legal, tem parecer e é decisão da diretoria.", "qualidade": "fragil", "feedback": "Vanessa discutiu o caso do sorvete que vira bebida láctea e concordou que o erro é do governo, mas manteve o ponto: \"aqui são dilemas éticos ou morais que eles passam ou deveriam passar pelo conselho\". Tratar como informativo é a cegueira ética que ela descreveu: \"a gente sempre fez dessa forma e sempre funciona\", até o mundo mudar."}, {"id": "b", "texto": "Pedir que o tema vire item de deliberação, com análise de risco reputacional e regulatório, e que o comitê de remuneração avalie se a meta do bônus está empurrando a decisão.", "qualidade": "melhor", "feedback": "Leva ao colegiado o que Vanessa disse que deveria passar por ele e o examina pelo modelo de negócio: o que se ganha, o que se perde e como. Olhar o bônus fecha o circuito com Fábio Barbosa, citado por ela: \"A busca pelo bônus é fator de risco.\" Decisão legal pode ser decisão de conselho, e passa pela ética antes do jurídico."}, {"id": "c", "texto": "Vetar a reclassificação por princípio, independentemente da análise.", "qualidade": "aceitavel", "feedback": "A direção tem apoio em Vanessa: \"A gente tem que ter coragem de conduzir o negócio da maneira correta, porque é correto.\" Mas vetar sem análise pula o que ela pediu ao conselheiro: critério de priorização e as perguntas certas dentro do colegiado. Um veto sem fundamento registrado tende a ser revertido e não muda o incentivo que produziu a proposta."}, {"id": "d", "texto": "Aprovar e reforçar a divulgação de práticas ESG no próximo relatório de sustentabilidade.", "qualidade": "fragil", "feedback": "É confundir presença com integração, o erro central que Vanessa apontou: \"O fato da ESG estar presente não significa que ela está sendo integrada de uma estratégia de negócio.\" Ela também lembrou que ESG não é \"atestado de santidade\". Um relatório mais vistoso não resolve uma decisão eticamente controversa; pode agravá-la se o tema vier a público."}]}, {"id": "e2d5", "titulo": "A primeira hora", "sessao": "e2s6", "contexto": "Você é conselheiro independente de uma rede de varejo. Às 19h, um vídeo de um gerente humilhando uma funcionária viraliza; uma influenciadora de grande alcance compartilha e surge a denúncia de que não foi a primeira vez. O CEO liga: quer esperar a apuração completa e discutir na reunião do conselho de quinta-feira. O presidente do conselho recebeu ligação de um jornalista e pensa em responder ele mesmo. A empresa não tem comitê de crise formal nem porta-vozes definidos.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Concordar com o CEO: sem dados completos, é melhor não falar até a apuração terminar.", "qualidade": "fragil", "feedback": "Elisa Prado foi direta: se não se responde em uma hora, \"você perde o bonde\", e \"se você não contar a sua história, alguém vai contar\". Há uma pessoa impactada, portanto é crise, não incidente. A falta de dados não justifica silêncio: a primeira nota assume a responsabilidade e promete que os afetados serão os primeiros a saber."}, {"id": "b", "texto": "Recomendar que o presidente do conselho dê a entrevista, para mostrar que o tema chegou ao topo.", "qualidade": "fragil", "feedback": "Elisa Prado listou esse como erro típico: o presidente do conselho falando por conta própria. \"O conselho não fala, então. Quem fala é o executivo, é o CEO que deve ser o porta-voz ou alguém que ele definir.\" O presidente só assume em vácuo de liderança executiva, e não é o caso. O conselheiro está \"na fase do aconselhamento\" e não põe a mão na crise."}, {"id": "c", "texto": "Aconselhar o CEO a publicar em uma hora nota de um parágrafo que assume a responsabilidade, informa as medidas imediatas e promete retorno, com o diretor de RH como porta-voz e os colaboradores informados antes.", "qualidade": "melhor", "feedback": "Segue o passo a passo de Elisa Prado: nota oficial de um parágrafo (o que ocorreu, o que está acontecendo, o que se vai fazer) dentro da janela de uma hora. Em crise de pessoas, o porta-voz é \"um diretor de recursos humanos\", e os colaboradores são o primeiro veículo da crise. O conselho aconselha e cobra apuração, sem falar pela empresa."}, {"id": "d", "texto": "Convocar reunião extraordinária do conselho para a manhã seguinte e aprovar a nota ali.", "qualidade": "aceitavel", "feedback": "Envolver o conselho é legítimo, mas a janela já terá passado. A pergunta que Elisa Prado deixou para a mesa é justamente quem aprova a primeira nota sem esperar a próxima reunião, e se a empresa consegue fazer isso em uma hora. Sem comitê de crise e porta-vozes definidos, esta é também a hora de registrar que esse preparo precisa existir."}]}], "exercicios": [{"id": "e2x1", "num": 1, "titulo": "Teste dos seis atributos", "base": "Carlos Júlio", "instrucao": "Antes de executar uma ação simbólica, pontue cada atributo de 0 a 2 e escreva a evidência. Abaixo de 9 em 14, ou com zero em \"autêntica\" ou em \"razão de mercado\", não execute.", "campos": [{"id": "f1", "label": "Ação simbólica que você pretende executar", "linhas": 2}, {"id": "f2", "label": "Autêntica e líder protagonista: nota de 0 a 2 e evidência (crença real e antiga? o líder está fisicamente na história, com custo pessoal?)", "linhas": 3}, {"id": "f3", "label": "Ruptura e razão de mercado: nota e evidência (que regra, privilégio ou símbolo ela quebra? qual o motivo, em uma frase com número?)", "linhas": 3}, {"id": "f4", "label": "Coração, teatral e gera histórias: nota e evidência (com que identidade conversa? quem vai recontar no café amanhã, com que frase? que história um gerente poderá criar?)", "linhas": 4}, {"id": "f5", "label": "Total em 14 e decisão: executar, ajustar ou descartar", "linhas": 2}]}, {"id": "e2x2", "num": 2, "titulo": "Mapa de traços × estratégia", "base": "Carlos Júlio", "instrucao": "Liste os comportamentos que a estratégia exige e o traço atual que os bloqueia. Para cada um, identifique a história e o símbolo que sustentam o traço e desenhe a ação do líder que gera a história oposta.", "campos": [{"id": "f1", "label": "Comportamento que a estratégia exige (ex.: experimentar)", "linhas": 2}, {"id": "f2", "label": "Traço atual que o bloqueia (ex.: erro = demissão)", "linhas": 2}, {"id": "f3", "label": "História que circula hoje e símbolo que sustenta o traço", "linhas": 3}, {"id": "f4", "label": "Ação do líder que gera a história oposta", "linhas": 3}]}, {"id": "e2x3", "num": 3, "titulo": "Inventário de privilégios", "base": "Carlos Júlio (caso Telesp)", "instrucao": "Liste privilégios e canais exclusivos da liderança, como a Golden Line da Telesp e o \"aquário de vidro\" da Bayer. Escolha um para eliminar com teatralidade e acompanhe por 60 dias se a história circulou; só então formalize em política.", "campos": [{"id": "f1", "label": "Privilégios ou canais exclusivos existentes e quem tem cada um", "linhas": 4}, {"id": "f2", "label": "O que o executivo deixa de ver por causa deles", "linhas": 3}, {"id": "f3", "label": "O privilégio que você eliminaria e como, com teatralidade", "linhas": 3}, {"id": "f4", "label": "Como saber, em 60 dias, se a história circulou", "linhas": 2}]}, {"id": "e2x4", "num": 4, "titulo": "O painel dos dez em cinco anos", "base": "Clairton Araujo", "instrucao": "Escolha uma empresa aberta, ou a líder aberta do setor de uma empresa fechada, e preencha os dez indicadores para cinco anos. O que importa é a tendência, não o número isolado.", "campos": [{"id": "f1", "label": "Empresa escolhida e por quê", "linhas": 2}, {"id": "f2", "label": "Margens bruta, EBITDA e líquida e FCO ÷ lucro líquido, do ano −4 ao ano 0", "linhas": 4}, {"id": "f3", "label": "ROIC − custo de capital, dívida líquida ÷ EBITDA, cobertura de juros e liquidez corrente, do ano −4 ao ano 0", "linhas": 4}, {"id": "f4", "label": "Prazos de estoque e de recebimento, em dias, e as tendências que chamam atenção", "linhas": 3}, {"id": "f5", "label": "Os três principais riscos desta empresa, em uma página", "linhas": 4}]}, {"id": "e2x5", "num": 5, "titulo": "Redação do registro em ata", "base": "Clairton Araujo", "instrucao": "Escreva um registro em ata a partir de uma situação real ou do caso ambiental da sessão 2.2. Um registro bom tem quatro partes: fato, ponto de atenção, recomendação e posição.", "campos": [{"id": "f1", "label": "Fato: o que foi apresentado, com número e data", "linhas": 2}, {"id": "f2", "label": "Ponto de atenção: o risco identificado, sem adjetivo", "linhas": 2}, {"id": "f3", "label": "Recomendação: o que foi sugerido, a quem e com que prazo", "linhas": 2}, {"id": "f4", "label": "Posição: voto, abstenção ou ressalva, com a justificativa", "linhas": 2}, {"id": "f5", "label": "Em que ponto você escala ao presidente do conselho, e em que ponto sai", "linhas": 3}]}, {"id": "e2x6", "num": 6, "titulo": "Simulador da PLR multiplicativa", "base": "Mateus Schaumloffel", "instrucao": "Compare a distribuição de um pool de R$ 1 milhão entre seis perfis fictícios, primeiro somando os quatro fatores e depois multiplicando-os, como na StartSe. Decida qual desenho reflete a cultura que a empresa diz ter e o que você mudaria.", "campos": [{"id": "f1", "label": "Quem ganha e quem perde ao trocar soma por produto, e por quê", "linhas": 3}, {"id": "f2", "label": "Qual desenho reflete a cultura que a empresa diz ter", "linhas": 3}, {"id": "f3", "label": "O que você mudaria na fórmula (pesos, piso para tempo de casa, critério de relevância)", "linhas": 3}]}, {"id": "e2x7", "num": 7, "titulo": "Partnership em uma página", "base": "Mateus Schaumloffel", "instrucao": "Para uma empresa real, familiar de médio porte e com EBITDA positivo, decida cada item do desenho e justifique. Depois, teste o desenho contra o caso do deck: \"coloquei uma pessoa de sócia e depois de um ano vi que ela não estava alinhada\".", "campos": [{"id": "f1", "label": "Pré-requisitos (transparência e PLR existem?) e tipo societário (Ltda ou S.A.)", "linhas": 3}, {"id": "f2", "label": "Instrumento (ação, RSU, opção ou phantom), valuation de entrada e saída e forma de pagamento", "linhas": 3}, {"id": "f3", "label": "Proteção ao erro nos primeiros anos e recompra: direito ou obrigação, preço e data de referência", "linhas": 3}, {"id": "f4", "label": "Família, morte e divórcio; quem decide, com que periodicidade e critério", "linhas": 3}, {"id": "f5", "label": "O desenho resiste ao sócio que, um ano depois, se mostrou desalinhado?", "linhas": 3}]}, {"id": "e2x8", "num": 8, "titulo": "Diligência de pessoas e remuneração em 30 minutos", "base": "Clairton Araujo e Mateus Schaumloffel", "instrucao": "Aplique a lista em um M&A ou num convite para conselho. Para cada item, peça o documento indicado, procure o sinal de alerta e registre o achado.", "campos": [{"id": "f1", "label": "Remuneração variável e bônus da diretoria: política, acordo de PLR, histórico e dependência de estimativas contábeis", "linhas": 3}, {"id": "f2", "label": "Vínculos, contingências trabalhistas e segurança do trabalho: PJ por função, provisões e acidentes", "linhas": 3}, {"id": "f3", "label": "Acordo de acionistas: saída, recompra e família", "linhas": 2}, {"id": "f4", "label": "Consequência da avaliação e, se M&A, plano de retenção de pessoas-chave", "linhas": 3}, {"id": "f5", "label": "Principais achados e o que levar à mesa", "linhas": 3}]}, {"id": "e2x9", "num": 9, "titulo": "Os três círculos de uma família empresária", "base": "Ivan Murias", "instrucao": "Para uma família que você conhece, ou de uma empresa em que quer uma cadeira, posicione cada pessoa nos círculos e no fórum em que tem voz. O que interessa são as assimetrias: quem decide fora do fórum certo, quem não tem fórum e onde mora a tensão.", "campos": [{"id": "f1", "label": "Pessoas, círculos (família, propriedade, negócio), fórum em que têm voz e tensão ou risco", "linhas": 5}, {"id": "f2", "label": "Em que esporte esta família joga (tênis, basquete, futebol ou futebol americano), e a governança acompanha?", "linhas": 2}, {"id": "f3", "label": "O lugar do fundador daqui a três anos", "linhas": 2}, {"id": "f4", "label": "O cisne vermelho desta família: o risco sabido que ninguém trata", "linhas": 2}]}, {"id": "e2x10", "num": 10, "titulo": "Materialidade relâmpago e o painel do S", "base": "Vanessa", "instrucao": "Parte A: liste os temas, classifique onde a empresa gera impacto e onde é impactada, e fique com três a cinco. Parte B: monte o painel trimestral do pilar social, com no máximo seis indicadores e o gatilho que leva cada um ao conselho.", "campos": [{"id": "f1", "label": "Parte A: temas, com grau de impacto gerado e sofrido (alto, médio, baixo)", "linhas": 4}, {"id": "f2", "label": "Parte A: os três a cinco temas materiais e a pergunta para a próxima reunião", "linhas": 3}, {"id": "f3", "label": "Parte B: até seis indicadores do S (ex.: afastamentos por saúde mental, acidentes, turnover em posições-chave, condições em terceiros, variável ligada a ESG, riscos psicossociais da NR-01), com fonte e frequência", "linhas": 4}, {"id": "f4", "label": "Parte B: o gatilho que leva cada indicador ao conselho", "linhas": 3}]}, {"id": "e2x11", "num": 11, "titulo": "A primeira hora e o meu protocolo de conselheiro", "base": "Elisa Prado", "instrucao": "Parte A: com um cenário real ou imaginado, como um vídeo viral de um funcionário, uma denúncia de assédio contra um diretor ou um recall, responda em uma hora o que a sala respondeu em vinte minutos. Parte B: escreva o protocolo pessoal que você segue como conselheiro quando a crise chega.", "campos": [{"id": "f1", "label": "Parte A: cenário. É incidente ou crise? Quantas pessoas foram atingidas?", "linhas": 2}, {"id": "f2", "label": "Parte A: quem fala (CEO, porta-voz técnico ou presidente do conselho) e a ordem dos stakeholders", "linhas": 2}, {"id": "f3", "label": "Parte A: a nota em um parágrafo (o que ocorreu, o que está acontecendo, o que faremos) e o que nunca dizer", "linhas": 4}, {"id": "f4", "label": "Parte B: o que nunca faço como conselheiro em crise e as três perguntas que levo ao conselho quando vejo o risco", "linhas": 3}, {"id": "f5", "label": "Parte B: quando aceito ser porta-voz e como registro discordância em ata", "linhas": 3}]}], "glossario": [{"termo": "Story building", "def": "Fazer coisas que gerem histórias, em vez de contar o que foi feito. O líder é protagonista, não narrador."}, {"termo": "Traço cultural", "def": "Um comportamento específico e recorrente que apoia ou sabota uma estratégia, como aversão ao erro, ownership ou hierarquia."}, {"termo": "DFC", "def": "Demonstração dos fluxos de caixa. No método indireto, parte do lucro e chega à variação do caixa."}, {"termo": "DMPL", "def": "Demonstração das mutações do patrimônio líquido. Explica o que, além do lucro, mudou o PL."}, {"termo": "EBITDA ajustado", "def": "EBITDA com exclusões definidas pela administração. Não segue padrão contábil; exige conciliação."}, {"termo": "ROIC × WACC", "def": "Retorno sobre o capital investido comparado ao custo médio ponderado de capital. ROIC menor destrói valor."}, {"termo": "Covenant", "def": "Cláusula contratual de dívida que fixa limites de indicadores; violá-la pode antecipar o vencimento."}, {"termo": "Ciclo financeiro", "def": "Prazo de estoque + prazo de recebimento − prazo de pagamento. O período que a empresa financia sozinha."}, {"termo": "Earnout", "def": "Parte do preço de uma aquisição condicionada a metas futuras."}, {"termo": "Partnership", "def": "Modelo em que executivos relevantes compram participação real e passam a ganhar e perder com o dono."}, {"termo": "Sociedade viva", "def": "Participação que circula: quem entrega compra, quem não entrega vende, inclusive o maior sócio."}, {"termo": "Cliff", "def": "Período inicial em que a participação pode ser recomprada por valor protegido, não de mercado."}, {"termo": "Vesting", "def": "Liberação progressiva de uma participação ao longo do tempo ou contra metas."}, {"termo": "RSU", "def": "Restricted stock unit: ação concedida com restrição de vesting."}, {"termo": "Stock option", "def": "Direito de comprar ação no futuro a preço fixado hoje."}, {"termo": "Phantom share", "def": "Direito contratual a pagamento em dinheiro atrelado ao valor da ação, sem participação societária."}, {"termo": "Call", "def": "Direito do controle de comprar a participação de um sócio nas condições do acordo."}, {"termo": "Relevância", "def": "Na PLR da StartSe, o peso da pessoa nas decisões: quem você leva à reunião ou à viagem."}, {"termo": "Hipersuficiente", "def": "Empregado com diploma superior e salário igual ou superior a duas vezes o teto do INSS, com maior liberdade contratual."}, {"termo": "Família empresária", "def": "A família como substantivo e a empresa como adjetivo; substitui o rótulo \"empresa familiar\"."}, {"termo": "Três círculos", "def": "Família, propriedade e negócio (Davis e Tagiuri). Cada círculo pede um fórum próprio."}, {"termo": "Conselho de família", "def": "Fórum de união e pertencimento; não decide o negócio."}, {"termo": "Conselho de sócios", "def": "Fórum de patrimônio, dividendos, entrada e saída de sócios."}, {"termo": "Protocolo de família", "def": "Consenso entre gerações sobre as regras que preservam as relações."}, {"termo": "Poor governance discount", "def": "Desconto de valuation por governança fraca, não por ser família."}, {"termo": "Cisne vermelho", "def": "Risco previsível e conhecido que se escolhe não tratar (Silvio Meira)."}, {"termo": "Materialidade", "def": "Os poucos temas em que a empresa gera impacto ou é impactada de forma relevante."}, {"termo": "Escopo 3", "def": "Emissões indiretas da cadeia de valor, fora da operação própria."}, {"termo": "Green premium", "def": "Preço adicional que clientes pagam por uma solução de menor emissão."}, {"termo": "Readiness", "def": "Preparo antecipado para a crise: matriz, comitê, porta-voz, simulado."}, {"termo": "Holding statement", "def": "Primeira nota sem dados completos: assume a responsabilidade e promete resposta."}, {"termo": "Cauda longa", "def": "A permanência de uma crise em buscadores e assistentes de IA, muito depois da janela quente."}], "normas": [{"nome": "Lei 6.404/76, art. 176, §6º", "sobre": "Dispensa a DFC para companhia fechada com PL abaixo de R$ 2 milhões. Relevante para a DFC como peça central de leitura (Clairton).", "status": ""}, {"nome": "Lei 6.404/76, art. 202", "sobre": "Dividendo mínimo obrigatório. Sustenta a pergunta da DMPL no laboratório do caso teórico.", "status": ""}, {"nome": "Lei 6.404/76, art. 158", "sobre": "Responsabilidade do administrador. Fundamenta o \"cadê o conselho que não viu?\" de Clairton.", "status": ""}, {"nome": "CPC 03 (R2) / IAS 7", "sobre": "Demonstração dos fluxos de caixa, pelos métodos direto e indireto.", "status": ""}, {"nome": "CPC 25 / IAS 37", "sobre": "Provisões, passivos e ativos contingentes. Base do passivo ambiental e trabalhista discutido por Clairton.", "status": ""}, {"nome": "CPC 15 / IFRS 3", "sobre": "Combinação de negócios, incluindo contraprestação contingente (earnout).", "status": ""}, {"nome": "Resolução CVM 44/2021", "sobre": "Fato relevante depende de materialidade, não do tipo de operação.", "status": "Corrige a afirmação de que todo M&A é fato relevante."}, {"nome": "Lei 10.101/2000, art. 3º, §2º", "sobre": "PLR: até dois pagamentos por ano, com intervalo mínimo de um trimestre civil.", "status": "Intervalo vigente desde a Lei 12.832/2013; corrige os seis meses ditos em aula."}, {"nome": "CLT, art. 444, parágrafo único", "sobre": "Empregado hipersuficiente: diploma de nível superior e salário igual ou superior a duas vezes o teto do INSS.", "status": "Corrige o critério de \"mais de 10 mil reais\" dito em aula."}, {"nome": "Lei 3.207/57, arts. 3º e 7º", "sobre": "Comissão é exigível com a venda ultimada; estorno só por insolvência. Relevante no caso da área comercial da StartSe.", "status": ""}, {"nome": "Código Civil, art. 1.052", "sobre": "Na Ltda, a responsabilidade do sócio é limitada ao capital.", "status": "A exposição prática vem da desconsideração da personalidade jurídica."}, {"nome": "Resolução CVM 193/2023", "sobre": "Adotou o padrão ISSB para o relatório de sustentabilidade, previsto como obrigatório a partir de 2026.", "status": "Alterada pela CVM 244/2026; não citada em aula."}, {"nome": "Resolução CVM 244/2026", "sobre": "Tornou voluntário o relatório de sustentabilidade no padrão ISSB.", "status": "De 29/05/2026; a partir de 2027, quem não publicar explica ao mercado. Não citada em aula."}, {"nome": "NR-01 (Portaria MTE 1.419/2024)", "sobre": "Inclui riscos psicossociais no gerenciamento de riscos ocupacionais. A única norma citada em aula no Dia 2.", "status": "Em fiscalização desde 26/05/2026."}, {"nome": "NR-17 e CLT, art. 75-E", "sobre": "Ergonomia e responsabilidade do empregador no teletrabalho.", "status": "Base da ergonomia do home office, não a NR-01."}, {"nome": "Portaria CVS 3/2026 (SP)", "sobre": "Condimentos em porção individual em restaurantes, o caso das bisnagas.", "status": "Prazo adiado para 01/02/2027; não é lei."}, {"nome": "Regulamento UE 2025/40", "sobre": "Embalagens: veta porções individuais no setor de alimentação fora do lar.", "status": "A partir de 2030."}, {"nome": "Emenda Constitucional 83/2014", "sobre": "Prorroga a Zona Franca de Manaus.", "status": "Até 2073."}], "acoes": ["Fazer o Exercício 4 com uma empresa aberta do setor em que quero uma cadeira.", "Montar um modelo próprio de mapa de risco em uma página, com os três riscos principais.", "Baixar e arquivar os modelos de acordo de acionistas e de PLR da área do aluno.", "Escrever minha tese sobre peso de cultura na remuneração variável do C-level.", "Ler O Segredo da Mudança de Cultura e mapear duas histórias minhas nos seis atributos.", "Transformar o Exercício 8 em produto: diligência de pessoas e remuneração para conselhos e fundos.", "Fazer o Exercício 9 com uma família empresária que conheço.", "Montar o painel do S com seis indicadores (Exercício 10).", "Escrever meu protocolo pessoal de comunicação como conselheiro (Exercício 11).", "Ter pronto, em três frases, como falo das crises das empresas em que trabalhei."], "checklist_crise": [{"fase": "Prevenção", "componente": "Mapeamento de riscos", "pergunta": "Existe matriz de riscos reputacionais, com os riscos altos identificados?"}, {"fase": "Prevenção", "componente": "Avaliação", "pergunta": "A matriz é simples o bastante para orientar a mitigação?"}, {"fase": "Prevenção", "componente": "Gerenciamento", "pergunta": "Cada risco alto tem mitigação, detecção e revisão com dono definido?"}, {"fase": "Preparação", "componente": "Segurança e monitoramento", "pergunta": "Há monitoramento de reclamações, redes e imprensa, com critério de relevância?"}, {"fase": "Preparação", "componente": "Comitê de crise", "pergunta": "Papéis definidos, porta-vozes por tipo de crise, simulado nos últimos 12 meses?"}, {"fase": "Resposta", "componente": "Primeira hora", "pergunta": "Quem aprova a nota de um parágrafo sem esperar reunião?"}, {"fase": "Resposta", "componente": "Sequência de stakeholders", "pergunta": "A ordem está escrita e conciliada com as regras de fato relevante?"}, {"fase": "Resposta", "componente": "Lições aprendidas", "pergunta": "A última crise gerou mudança registrada?"}]}}</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const ENC = {1:D.e1, 2:D.e2};
const END = {1:'2026-08-05', 2:'2026-10-07'};
const NEXT = {1:'Encontro 2', 2:'Encontro 3'};
const IV = [0,1,3,7,14,30];
const BOXN = ['Novo','1 dia','3 dias','7 dias','14 dias','30 dias'];
const QUAL = {melhor:['Melhor caminho','t-good'], aceitavel:['Aceitável','t-warn'], fragil:['Frágil','t-bad']};
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* ---------- utilidades ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const lsGet = k => { try { const v = localStorage.getItem('sala:'+k); return v ? JSON.parse(v) : null; } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem('sala:'+k, JSON.stringify(v)); } catch(e){} };
const clone = o => JSON.parse(JSON.stringify(o));
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const [y,m,d]=s.split('-').map(Number); const t=new Date(y,m-1,d+n); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
function fmt(s){ const [y,m,d]=s.split('-').map(Number); return d+' '+MESES[m-1]; }
function fmtTs(t){ const d=new Date(t); return d.getDate()+' '+MESES[d.getMonth()]+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
const sessById = {}; [1,2].forEach(e=>ENC[e].sessoes.forEach(s=>sessById[s.id]=s));
const allCards = [1,2].flatMap(e=>ENC[e].cartoes.map(c=>Object.assign({enc:e},c)));

/* ---------- estado ---------- */
const UI = Object.assign({enc:2, sec:'trilha', revScope:'enc', revSess:'', dil:{}, ex:{}, ref:'casos', q:''}, lsGet('ui')||{});
const P = {
  prog: lsGet('prog') || {cards:{}, trail:{}, acoes:{}, picks:{}, updatedAt:0},
  ex_e1: lsGet('ex_e1') || {answers:{}, updatedAt:0},
  ex_e2: lsGet('ex_e2') || {answers:{}, updatedAt:0}
};
['cards','trail','acoes','picks'].forEach(k=>{ P.prog[k] = P.prog[k] || {}; });
let db=null, user=null, uid=null, remote=false;
let VOTES = {}, MURAL = [];
if (UI.sec==='turma') UI.sec='trilha';
const saveUI = () => lsSet('ui', {enc:UI.enc, sec:UI.sec, revScope:UI.revScope, revSess:UI.revSess, dil:UI.dil, ex:UI.ex, ref:UI.ref});

/* gravação: local sempre; conta quando disponível, uma escrita por vez por documento */
const timers = {}, chains = {};
function persist(name, quick){
  P[name].updatedAt = Date.now();
  lsSet(name, P[name]);
  if (!remote) return;
  clearTimeout(timers[name]);
  timers[name] = setTimeout(()=>{
    const body = clone(P[name]);
    chains[name] = (chains[name]||Promise.resolve()).then(()=>db.doc('data/users/'+uid+'/'+name).set(body)).then(()=>setSync(true)).catch(e=>{
      if (e && e.code === 'invalid_argument'){ remote=false; setSync(false); }
    });
  }, quick ? 50 : 900);
}
function setSync(ok){ document.getElementById('sync').textContent = ok ? 'Progresso salvo na sua conta' : 'Progresso salvo neste navegador'; }

/* ---------- navegação ---------- */
const main = document.getElementById('main');
function go(sec, extra){ UI.sec = sec; if (extra) Object.assign(UI, extra); if (sec==='revisao') rev=null; saveUI(); render(); window.scrollTo({top:0}); }
document.querySelectorAll('[data-sec]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.sec)));
document.querySelectorAll('[data-enc]').forEach(b=>b.addEventListener('click',()=>{ UI.enc=+b.dataset.enc; UI.revSess=''; rev=null; saveUI(); render(); }));

function render(){
  document.querySelectorAll('[data-enc]').forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.enc===UI.enc)));
  document.querySelectorAll('[data-sec]').forEach(b=>{ if (b.dataset.sec===UI.sec) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  main.replaceChildren(...(VIEWS[UI.sec]||VIEWS.trilha)().flat(3).filter(Boolean));
}

/* ---------- métricas ---------- */
function stats(e){
  const cs = ENC[e].cartoes;
  const seen = cs.filter(c=>P.prog.cards[c.id]).length;
  const dom = cs.filter(c=>(P.prog.cards[c.id]||{}).b>=4).length;
  const dil = ENC[e].dilemas.filter(d=>P.prog.picks[d.id]).length;
  const ans = P['ex_e'+e].answers;
  const ex = ENC[e].exercicios.filter(x=>ans[x.id] && Object.values(ans[x.id]).some(v=>v && v.trim())).length;
  return {cs:cs.length, seen, dom, dil, dils:ENC[e].dilemas.length, ex, exs:ENC[e].exercicios.length};
}
function dueCount(cards){ const t=today(); return cards.filter(c=>{ const s=P.prog.cards[c.id]; return !s || s.due<=t; }).length; }

/* ---------- Trilha ---------- */
function vTrilha(){
  const e = UI.enc, E = ENC[e], st = stats(e), t = today();
  const steps = [
    {k:'d1', d:1, t:'Rever as ideias-força', s:'As teses do encontro e a ideia central de cada sessão, em dez minutos.', go:'sessoes', cta:'Abrir sessões'},
    {k:'d3', d:3, t:'Primeira revisão', s:'Dez cartões com a resposta escondida. Lembrar sem olhar é o que fixa.', go:'revisao', cta:'Começar revisão'},
    {k:'d7', d:7, t:'Um dilema de conselho', s:'Decida antes de ver como a turma votou e por quê.', go:'dilemas', cta:'Abrir dilemas'},
    {k:'d14', d:14, t:'Aplicação real', s:'Um exercício preenchido com uma empresa de verdade, a sua ou uma em que você quer uma cadeira.', go:'exercicios', cta:'Abrir exercícios'},
    {k:'pre', d:null, t:'Antes do '+NEXT[e], s:'Uma rodada final de revisão e as ações do encontro conferidas: o que já saiu do papel e o que você levou para o seu conselho.', go:'revisao', cta:'Rodada final'}
  ];
  const trail = h('ol',{class:'trail'}, steps.map(s=>{
    const key = 'e'+e+':'+s.k, done = !!P.prog.trail[key];
    const date = s.d ? addDays(END[e], s.d) : null;
    let status = done ? ['Feito','t-good'] : !date ? ['Em aberto','t-mute'] : date<t ? ['Atrasado','t-bad'] : date===t ? ['Hoje','t-warn'] : ['Em aberto','t-mute'];
    const cb = h('input',{type:'checkbox', id:'tr-'+key.replace(':','-'), onchange:ev=>{ P.prog.trail[key]=ev.target.checked; persist('prog'); render(); }});
    cb.checked = done;
    return h('li',{class: (!done && date===t) ? 'now' : null},
      h('div',{class:'when'}, s.d ? 'D+'+s.d : 'Pré', h('small',null, date ? fmt(date) : NEXT[e])),
      h('div',null, h('h4',null,s.t), h('p',null,s.s)),
      h('div',{class:'acts'}, h('span',{class:'tag '+status[1]}, status[0]), h('button',{class:'link', onclick:()=>go(s.go)}, s.cta), h('label',{class:'check'}, cb, 'Feito')));
  }));
  const acoes = h('ol',{class:'actions'}, E.acoes.map((a,i)=>{
    const key='e'+e+':'+i, done=!!P.prog.acoes[key];
    const cb = h('input',{type:'checkbox', id:'ac-'+e+'-'+i, onchange:ev=>{ P.prog.acoes[key]=ev.target.checked; persist('prog'); render(); }});
    cb.checked = done;
    return h('li',{class:done?'done':null}, cb, h('label',{for:'ac-'+e+'-'+i}, h('span',null,a)));
  }));
  return [
    h('p',{class:'eyebrow'}, 'Encontro '+e+' · '+E.datas),
    h('h2',{class:'sec'}, h('span',{class:'grad'}, E.titulo)),
    h('p',{class:'lede'}, 'O que este encontro deixa na mesa do conselheiro:'),
    h('ul',{class:'thesis'}, E.tese.map(x=>h('li',null,x))),
    h('div',{class:'stats'},
      h('div',{class:'stat'}, h('b',null, st.dom+'/'+st.cs), h('span',null,'cartões dominados (caixa de 14 dias ou mais)')),
      h('div',{class:'stat'}, h('b',null, String(dueCount(ENC[e].cartoes.map(c=>c))) ), h('span',null,'cartões para revisar hoje')),
      h('div',{class:'stat'}, h('b',null, st.dil+'/'+st.dils), h('span',null,'dilemas decididos')),
      h('div',{class:'stat'}, h('b',null, st.ex+'/'+st.exs), h('span',null,'exercícios iniciados'))),
    h('hr',{class:'rule'}),
    h('p',{class:'eyebrow'}, 'Trilha entre encontros'),
    h('p',{class:'lede'}, 'Cinco marcos contados a partir do último dia do encontro. O ritmo é seu: a plataforma não manda lembretes, ela mostra o que está vencendo.'),
    trail,
    h('hr',{class:'rule'}),
    h('p',{class:'eyebrow'}, 'Plano de ação do Encontro '+e),
    h('p',{class:'lede'}, 'As ações do workbook. Marque quando a ação sair do papel.'),
    acoes
  ];
}

/* ---------- Sessões ---------- */
function vSessoes(){
  const E = ENC[UI.enc];
  return [
    h('p',{class:'eyebrow'}, 'Encontro '+UI.enc+' · '+E.sessoes.length+' sessões'),
    h('h2',{class:'sec'}, 'Sessão por sessão'),
    h('p',{class:'lede'}, 'A ideia central, os pontos que mudam decisão e a frase que vale guardar. Cada sessão leva aos seus cartões de revisão.'),
    E.sessoes.map(s=>{
      const n = E.cartoes.filter(c=>c.sessao===s.id).length;
      return h('article',{class:'sess', id:s.id},
        h('div',{class:'num'}, s.num),
        h('div',{style:'min-width:0'},
          h('h3',null, s.palestrante),
          h('p',{class:'tt'}, s.titulo),
          h('p',{class:'cred'}, s.credencial),
          h('p',{class:'idea'}, s.ideia),
          h('ul',null, s.pontos.map(p=>h('li',null,p))),
          s.citacao && s.citacao.texto ? h('blockquote',{class:'q'}, h('p',null,'“'+s.citacao.texto+'”'), h('cite',null, s.citacao.autor)) : null,
          n ? h('button',{class:'btn quiet', onclick:()=>go('revisao',{revScope:'enc', revSess:s.id})}, 'Revisar os '+n+' cartões desta sessão') : null));
    })
  ];
}

/* ---------- Revisão (Leitner) ---------- */
let rev = null;
function poolCards(){
  let cs = UI.revScope==='both' ? allCards : allCards.filter(c=>c.enc===UI.enc);
  if (UI.revSess) cs = cs.filter(c=>c.sessao===UI.revSess);
  return cs;
}
function buildRev(){
  const t = today();
  const due = poolCards().filter(c=>{ const s=P.prog.cards[c.id]; return !s || s.due<=t; })
    .sort((a,b)=>{ const sa=P.prog.cards[a.id], sb=P.prog.cards[b.id]; return (sa?sa.due:'0').localeCompare(sb?sb.due:'0') || (sa?sa.b:0)-(sb?sb.b:0); });
  rev = {queue: due.slice(0,10).map(c=>c.id), idx:0, shown:false, ok:0, again:new Set()};
}
function grade(g){
  const id = rev.queue[rev.idx], s = P.prog.cards[id] || {b:0, due:today()};
  let b = s.b;
  if (g===0){ b = 1; if (!rev.again.has(id)){ rev.again.add(id); rev.queue.push(id); } }
  else if (g===1){ b = Math.max(1, b); }
  else { b = Math.min(5, b+1); rev.ok++; }
  P.prog.cards[id] = {b, due: addDays(today(), g===0 ? 1 : IV[b])};
  persist('prog');
  rev.idx++; rev.shown=false; render();
}
function vRevisao(){
  if (!rev) buildRev();
  const pool = poolCards(), t = today();
  const sessOpts = (UI.revScope==='both'?[1,2]:[UI.enc]).flatMap(e=>ENC[e].sessoes);
  const sel = h('select',{id:'rev-sess', onchange:ev=>{ UI.revSess=ev.target.value; rev=null; saveUI(); render(); }},
    h('option',{value:''},'Todas as sessões'), sessOpts.map(s=>h('option',{value:s.id}, s.num+' · '+s.palestrante)));
  sel.value = UI.revSess;
  const counts = [0,0,0,0,0,0]; pool.forEach(c=>{ const s=P.prog.cards[c.id]; counts[s?s.b:0]++; });
  const side = h('aside',{class:'side'},
    h('h4',null,'Escopo'),
    h('div',{class:'chips'},
      h('button',{class:'chip','aria-pressed':String(UI.revScope==='enc'), onclick:()=>{UI.revScope='enc'; UI.revSess=''; rev=null; saveUI(); render();}}, 'Encontro '+UI.enc),
      h('button',{class:'chip','aria-pressed':String(UI.revScope==='both'), onclick:()=>{UI.revScope='both'; UI.revSess=''; rev=null; saveUI(); render();}}, 'Os dois encontros')),
    h('div',{style:'margin-top:14px'}, h('label',{for:'rev-sess',class:'t-mute',style:'font-size:12px'},'Sessão'), sel),
    h('h4',{style:'margin-top:28px'},'Suas caixas'),
    h('div',{class:'boxes'}, counts.map((n,i)=>h('div',{class:'bx'}, h('span',null, i===0?'Novos':'Revê em '+BOXN[i]), h('div',{class:'bar'}, h('i',{style:'width:'+(pool.length? (n/pool.length*100):0)+'%'})), h('span',{class:'mono'}, n)))),
    h('p',{style:'margin-top:18px'}, 'Lembrou, o cartão sobe de caixa e volta mais tarde. Esqueceu, volta para a primeira. O intervalo cresce de 1 para 30 dias.'));
  let card;
  if (rev.idx >= rev.queue.length){
    const next = pool.map(c=>P.prog.cards[c.id]).filter(s=>s && s.due>t).map(s=>s.due).sort()[0];
    card = h('div',{class:'card'},
      h('div',{class:'cmeta'}, h('span',null, rev.queue.length ? 'Rodada concluída' : 'Nada vencendo agora')),
      h('p',{class:'front'}, rev.queue.length ? 'Você lembrou de '+rev.ok+' dos '+(rev.queue.length - rev.again.size)+' cartões desta rodada.' : 'Todos os cartões deste escopo estão em dia.'),
      h('p',{class:'t-mute'}, next ? 'O próximo cartão vence em '+fmt(next)+'.' : ''),
      h('div',{class:'row'},
        dueCount(pool) ? h('button',{class:'btn primary', onclick:()=>{ rev=null; render(); }}, 'Nova rodada') : null,
        h('button',{class:'btn quiet', onclick:()=>go('dilemas')}, 'Ir para os dilemas')));
  } else {
    const c = allCards.find(x=>x.id===rev.queue[rev.idx]), s = sessById[c.sessao];
    const st = P.prog.cards[c.id];
    card = h('div',{class:'card'},
      h('div',{class:'cmeta'}, h('span',null, 'Encontro '+c.enc+' · '+(s? s.num+' '+s.palestrante : '')), h('span',{class:'mono'}, (rev.idx+1)+' / '+rev.queue.length)),
      h('p',{class:'front'}, c.frente),
      rev.shown ? h('div',{class:'back'}, c.verso, h('span',{class:'src'}, 'Fonte: '+c.fonte + (st? ' · caixa atual: '+BOXN[st.b] : ' · cartão novo'))) : null,
      h('div',{class:'row'}, rev.shown ? [
        h('button',{class:'btn quiet', onclick:()=>grade(0)}, 'Não lembrei', h('span',{class:'kbd'},'1')),
        h('button',{class:'btn quiet', onclick:()=>grade(1)}, 'Lembrei com esforço', h('span',{class:'kbd'},'2')),
        h('button',{class:'btn primary', onclick:()=>grade(2)}, 'Lembrei', h('span',{class:'kbd'},'3'))
      ] : h('button',{class:'btn primary', id:'reveal', onclick:()=>{ rev.shown=true; render(); }}, 'Mostrar resposta', h('span',{class:'kbd'},'espaço'))));
  }
  return [
    h('p',{class:'eyebrow'}, 'Revisão espaçada'),
    h('h2',{class:'sec'}, 'Lembrar sem olhar'),
    h('p',{class:'lede'}, 'Responda de cabeça antes de abrir. A dificuldade de buscar a resposta é o que fixa o conteúdo; reler dá só a sensação de saber.'),
    h('div',{class:'rev'}, h('div',{style:'min-width:0'}, card), side)
  ];
}
document.addEventListener('keydown', ev=>{
  if (UI.sec!=='revisao' || !rev || rev.idx>=rev.queue.length) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (!rev.shown && ev.key===' '){ ev.preventDefault(); rev.shown=true; render(); }
  else if (rev.shown && ['1','2','3'].includes(ev.key)) grade(+ev.key-1);
});

/* ---------- Dilemas ---------- */
function myPick(id){ return (uid && VOTES[uid] && VOTES[uid][id]) || P.prog.picks[id]; }
async function pick(d, o){
  P.prog.picks[d.id] = o; persist('prog', true);
  if (remote){
    const mine = Object.assign({}, VOTES[uid]||{}, {[d.id]:o});
    VOTES[uid] = mine; render();
    try { await db.doc('votes/'+uid).set({picks:mine, updatedAt:Date.now()}); } catch(e){}
  } else render();
}
function vDilemas(){
  const E = ENC[UI.enc], cur = UI.dil[UI.enc] || E.dilemas[0].id, d = E.dilemas.find(x=>x.id===cur) || E.dilemas[0];
  const list = h('ul',{class:'dlist'}, E.dilemas.map(x=>{
    const s = sessById[x.sessao], p = myPick(x.id);
    return h('li',null, h('button',{'aria-current':String(x.id===d.id), onclick:()=>{ UI.dil[UI.enc]=x.id; saveUI(); render(); }},
      h('strong',null,x.titulo), h('span',null, (s? 'Base: '+s.palestrante : '')+' · '+(p ? 'decidido' : 'em aberto'))));
  }));
  const mine = myPick(d.id);
  const others = Object.entries(VOTES).map(([k,v])=>v[d.id]).filter(Boolean);
  const total = others.length;
  const opts = h('ol',{class:'opts'}, d.opcoes.map(o=>{
    const q = QUAL[o.qualidade] || ['','t-mute'];
    const n = others.filter(v=>v===o.id).length;
    return h('li',null, h('button',{class:'opt'+(mine===o.id?' mine':''), disabled:!!mine, onclick:()=>pick(d,o.id)},
      h('span',{class:'l'}, o.id.toUpperCase()),
      h('span',null, o.texto),
      mine ? h('span',{class:'verdict'}, h('span',{class:'tag '+q[1]}, q[0]), mine===o.id ? h('span',{class:'tag t-mute'},'Sua escolha') : null) : null,
      mine ? h('span',{class:'fb'}, o.feedback) : null,
      mine && total ? h('span',{class:'dist'}, h('span',{class:'bar'}, h('i',{style:'width:'+(n/total*100)+'%'})), h('small',null, Math.round(n/total*100)+'% · '+n+(n===1?' voto':' votos'))) : null));
  }));
  const s = sessById[d.sessao];
  return [
    h('p',{class:'eyebrow'}, 'Encontro '+UI.enc+' · Dilemas de conselho'),
    h('h2',{class:'sec'}, 'Decida antes de ver a turma'),
    h('p',{class:'lede'}, 'Situações de sala de conselho montadas com o que os palestrantes ensinaram. Depois da sua decisão aparecem o raciocínio de cada caminho e como a turma votou.'),
    h('div',{class:'dl'}, list,
      h('section',{style:'min-width:0'},
        h('p',{class:'eyebrow'}, s ? 'Base: '+s.num+' '+s.palestrante : ''),
        h('h3',{class:'h3'}, d.titulo),
        h('p',{class:'ctx'}, d.contexto),
        h('p',{class:'ask'}, d.pergunta),
        opts,
        mine ? h('p',{class:'t-mute',style:'font-size:13px;margin-top:16px'},
          total ? total+(total===1?' pessoa decidiu':' pessoas decidiram')+' este dilema até agora. ' : '',
          '',
          ' ', h('button',{class:'link', onclick:async()=>{ delete P.prog.picks[d.id]; persist('prog',true); if (remote && VOTES[uid]){ const m=Object.assign({},VOTES[uid]); delete m[d.id]; VOTES[uid]=m; try{ await db.doc('votes/'+uid).set({picks:m, updatedAt:Date.now()}); }catch(e){} } render(); }}, 'Refazer este dilema')) : null))
  ];
}

/* ---------- Exercícios ---------- */
function exMarkdown(e){
  const E = ENC[e], ans = P['ex_e'+e].answers;
  let md = '# Exercícios do Encontro '+e+' · '+E.titulo+'\n\n';
  E.exercicios.forEach(x=>{
    md += '## Exercício '+x.num+' · '+x.titulo+'\n\n_Base: '+x.base+'_\n\n';
    x.campos.forEach(f=>{ md += '**'+f.label+'**\n\n'+(((ans[x.id]||{})[f.id]||'').trim()||'—')+'\n\n'; });
  });
  return md;
}
function vExercicios(){
  const e = UI.enc, E = ENC[e], cur = UI.ex[e] || E.exercicios[0].id, x = E.exercicios.find(z=>z.id===cur) || E.exercicios[0];
  const doc = P['ex_e'+e], ans = doc.answers[x.id] || {};
  const saved = h('p',{class:'saved', id:'saved', 'aria-live':'polite'});
  const list = h('ul',{class:'dlist'}, E.exercicios.map(z=>{
    const a = doc.answers[z.id], started = a && Object.values(a).some(v=>v && v.trim());
    return h('li',null, h('button',{'aria-current':String(z.id===x.id), onclick:()=>{ UI.ex[e]=z.id; saveUI(); render(); }},
      h('strong',null, z.num+'. '+z.titulo), h('span',null, z.base+' · '+(started?'iniciado':'em branco'))));
  }));
  const form = h('form',{onsubmit:ev=>ev.preventDefault()}, x.campos.map(f=>{
    const ta = h('textarea',{id:'ex-'+x.id+'-'+f.id, rows:String(Math.max(2,f.linhas||3)), oninput:ev=>{
      const dd = P['ex_e'+e]; dd.answers = dd.answers || {}; dd.answers[x.id] = dd.answers[x.id] || {}; dd.answers[x.id][f.id] = ev.target.value;
      saved.textContent = 'Salvando…'; persist('ex_e'+e);
      clearTimeout(saved._t); saved._t = setTimeout(()=>{ saved.textContent = 'Salvo'; }, 1000);
    }});
    ta.value = ans[f.id] || '';
    return h('div',{class:'fld'}, h('label',{for:ta.id}, f.label), ta);
  }));
  const copyBtn = h('button',{class:'btn quiet', onclick:async()=>{
    const md = exMarkdown(e);
    try { await navigator.clipboard.writeText(md); copyBtn.textContent='Copiado'; }
    catch(err){ const t=h('textarea',{style:'position:fixed;opacity:0'}); t.value=md; document.body.append(t); t.select(); try{document.execCommand('copy'); copyBtn.textContent='Copiado';}catch(e){} t.remove(); }
    setTimeout(()=>copyBtn.textContent='Copiar minhas respostas',1600);
  }}, 'Copiar minhas respostas');
  const dlBtn = h('button',{class:'btn quiet', hidden:true, id:'dl-btn', onclick:async()=>{
    try { const dl = await claude.use('downloads'); if (dl) await dl.save({filename:'Exercicios_Encontro'+e+'.md', data:exMarkdown(e)}); } catch(err){}
  }}, 'Baixar em Markdown');
  if (window.claude && claude.use) claude.use('downloads').then(dl=>{ if (dl) dlBtn.hidden=false; }).catch(()=>{});
  return [
    h('p',{class:'eyebrow'}, 'Encontro '+e+' · '+E.exercicios.length+' exercícios'),
    h('h2',{class:'sec'}, 'Aplicar na empresa real'),
    h('p',{class:'lede'}, 'Os exercícios do workbook, com as respostas guardadas neste navegador para você voltar a elas. Nada do que você escreve sai do seu computador.'),
    h('div',{class:'ex'}, list,
      h('section',{style:'min-width:0'},
        h('p',{class:'eyebrow'}, 'Exercício '+x.num+' · Base: '+x.base),
        h('h3',{class:'h3'}, x.titulo),
        h('p',{style:'max-width:64ch;color:var(--ink-2);margin:0 0 24px'}, x.instrucao),
        form, saved,
        h('div',{class:'chips',style:'margin-top:8px'}, copyBtn, dlBtn)))
  ];
}

/* ---------- Turma ---------- */
async function renderFeed(){
  const box = document.getElementById('feed'); if (!box) return;
  const items = MURAL.slice().sort((a,b)=>b.t-a.t);
  if (!items.length){ box.replaceChildren(h('p',{class:'empty'}, remote ? 'O mural está vazio. O primeiro registro pode ser o seu: uma decisão, uma pergunta que você levou para a pauta, uma prática que mudou.' : 'O mural da turma aparece quando a página é aberta com uma conta do Claude.')); return; }
  const ids = [...new Set(items.map(i=>i.uid))];
  let ps = {}; try { if (user) ps = await user.profiles(ids); } catch(e){}
  box.replaceChildren(h('ul',{class:'feed'}, items.map(it=>{
    const p = ps[it.uid] || {};
    const name = p.isMe ? 'Você' : (p.name || 'Participante');
    return h('li',null, p.avatarUrl ? h('img',{src:p.avatarUrl, alt:''}) : h('span'),
      h('div',{style:'min-width:0'},
        h('div',{class:'who'}, h('b',null,name), ' · Encontro '+it.enc+' · '+fmtTs(it.t),
          it.uid===uid ? [' · ', h('button',{class:'link',style:'font-size:12px', onclick:()=>delPost(it.id)}, 'Apagar')] : null),
        h('p',null, it.txt)));
  })));
}
async function myMural(){ const s = await db.doc('mural/'+uid).get(); return s.exists ? clone(s.data()) : {entries:[]}; }
async function delPost(id){ try { const m = await myMural(); m.entries = (m.entries||[]).filter(x=>x.id!==id); await db.doc('mural/'+uid).set(m); } catch(e){} }
function vTurma(){
  const ta = h('textarea',{id:'mural-txt', maxlength:'700', placeholder:'Ex.: levei para a reunião de quinta a pergunta sobre o painel do S; o comitê de pessoas vai trazer afastamentos por saúde mental todo trimestre.'});
  const msg = h('span',{class:'saved'});
  const send = h('button',{class:'btn primary', disabled:!remote, onclick:async()=>{
    const txt = ta.value.trim(); if (!txt) return;
    send.disabled = true;
    try { const m = await myMural(); m.entries = (m.entries||[]).concat({id:Date.now().toString(36), t:Date.now(), enc:UI.enc, txt}).slice(-40); await db.doc('mural/'+uid).set(m); ta.value=''; msg.textContent='Publicado no mural da turma'; }
    catch(e){ msg.textContent = 'Não foi possível publicar. Sua conta precisa de acesso de contribuidor nesta página.'; }
    send.disabled = false;
  }}, 'Publicar no mural');
  const feed = h('div',{id:'feed'});
  queueMicrotask(renderFeed);
  return [
    h('p',{class:'eyebrow'}, 'Turma 15'),
    h('h2',{class:'sec'}, 'O que eu levei para o meu conselho'),
    h('p',{class:'lede'}, 'O dado que mais importa num programa de formação é o que muda na prática. Registre uma decisão, uma pergunta que entrou na pauta ou um hábito novo. Seu registro fica visível para quem tem acesso a esta página.'),
    h('div',{class:'post'}, h('label',{for:'mural-txt',class:'eyebrow',style:'margin:0'}, 'Seu registro · Encontro '+UI.enc), ta, h('div',{class:'chips',style:'align-items:center'}, send, msg)),
