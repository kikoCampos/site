<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sala do Conselheiro · Kiko Campos</title>
<meta name="description" content="Plataforma de aprendizagem do Workbook do Conselheiro, Board Program StartSe, Turma 15.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: identidade de kikocampos.com — azul-noite com halos laranja e azul, Fraunces + Inter + Plex Mono, painéis arredondados, botões em pílula. Tema único escuro, por escolha. */
:root{
  --bg:#0A1830; --bg2:#0E2140; --panel:#12294d; --panel2:#16305a;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.20);
  --ink:#EAF1FB; --ink-2:#AFC0DB; --ink-3:#7D91B4;
  --orange:#FF4A12; --orange-cta:#CE420D; --amber:#F2B33D; --good:#4FD1A1; --blue:#5AA9E6; --bad:#FF7F66;
  --display:"Fraunces", Georgia, serif;
  --body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  --radius:18px; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(1150px 640px at 82% -12%, rgba(90,169,230,.15), transparent 60%),radial-gradient(900px 560px at 2% -6%, rgba(255,74,18,.13), transparent 55%),var(--bg);background-attachment:fixed;background-color:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased;min-height:100%}
.wrap{max-width:1120px;margin:0 auto;padding-inline:22px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:var(--ink)}
.grad{background:linear-gradient(100deg,var(--amber),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(10,24,48,.78);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-block:16px 6px}
.wordmark{display:flex;align-items:center;gap:11px;font-weight:700;font-size:1.02rem;color:var(--ink);text-decoration:none}
.wordmark .dot{width:11px;height:11px;border-radius:50%;background:var(--orange);box-shadow:0 0 16px rgba(255,74,18,.7)}
.wordmark .sep{color:var(--ink-3);font-weight:400}
.wordmark .prod{font:600 1.02rem/1 var(--display);letter-spacing:-.005em}
.brand .meta{font:600 10.5px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 0}
.encs{display:flex;gap:4px;border:1px solid var(--line2);border-radius:100px;padding:4px;background:rgba(255,255,255,.03)}
.encs button{border:0;background:none;padding:6px 15px;border-radius:100px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2)}
.encs button[aria-pressed="true"]{background:var(--orange-cta);color:#fff;box-shadow:0 8px 22px -10px rgba(255,74,18,.7)}
.navbox{overflow-x:auto;scrollbar-width:none}
.navbox::-webkit-scrollbar{display:none}
nav.secs{display:flex;gap:26px;min-width:max-content}
nav.secs button{border:0;background:none;padding:10px 0 12px;cursor:pointer;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.secs button:hover{color:var(--ink)}
nav.secs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--orange);font-weight:600}

main{padding-block:44px 72px;min-height:60vh}
.eyebrow{font:600 11px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin:0 0 12px}
h2.sec{font:600 clamp(2rem,3.4vw,2.9rem)/1.06 var(--display);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
.lede{color:var(--ink-2);font-size:1.05rem;max-width:56ch;margin:0 0 30px}
.rule{border:0;border-top:1px solid var(--line);margin:52px 0}
.btn{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);background:transparent;border-radius:100px;padding:10px 20px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.btn:hover{border-color:rgba(255,255,255,.4)}
.btn.primary{background:var(--orange-cta);border-color:var(--orange-cta);color:#fff;box-shadow:0 12px 30px -12px rgba(255,74,18,.65)}
.btn.quiet{color:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:default}
.link{border:0;background:none;padding:0 0 2px;color:var(--ink);cursor:pointer;font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--orange)}
.tag{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.t-good{color:var(--good)} .t-warn{color:var(--amber)} .t-bad{color:var(--bad)} .t-mute{color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line2);background:rgba(255,255,255,.03);border-radius:100px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:rgba(255,74,18,.6);color:var(--ink);background:rgba(255,74,18,.10)}
.panel{border-radius:var(--radius);background:linear-gradient(155deg,var(--panel2),var(--panel));border:1px solid var(--line2);box-shadow:0 30px 70px -34px rgba(0,0,0,.7);position:relative;overflow:hidden}

/* trilha */
.thesis{margin:0;padding:0;list-style:none;display:grid;gap:18px}
.thesis li{font:italic 500 clamp(1.5rem,2.8vw,2.2rem)/1.2 var(--display);letter-spacing:-.01em;max-width:28ch;text-wrap:balance}
.thesis li+li{padding-top:18px;border-top:1px solid var(--line)}
.stats{display:grid;grid-template-columns:1.35fr repeat(3,minmax(0,1fr));gap:16px;margin:40px 0 0}
.stat{border-radius:14px;padding:20px 22px;background:rgba(255,255,255,.03);border:1px solid var(--line);position:relative}
.stat:first-child{border-radius:var(--radius);background:linear-gradient(155deg,var(--panel2),var(--panel));border-color:var(--line2);padding:24px 26px}
.stat:first-child::after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(242,179,61,.2),transparent 65%);pointer-events:none}
.stat b{display:block;font:600 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.stat:first-child b{font-size:clamp(2.6rem,4.4vw,3.4rem);color:var(--amber)}
.stat span{display:block;font-size:.86rem;color:var(--ink-2);margin-top:8px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:first-child{grid-column:1/-1}}
.trail{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.trail li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:6px 24px;align-items:center;padding:22px 26px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.trail li.now{border-color:rgba(255,74,18,.5);background:linear-gradient(120deg,rgba(255,74,18,.10),rgba(255,255,255,.02));box-shadow:0 24px 60px -34px rgba(255,74,18,.5)}
.trail .when{font:600 1.5rem/1 var(--display);color:var(--ink-3)}
.trail .when small{display:block;font:500 10.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.trail h4{margin:0;font:600 1.2rem/1.25 var(--display)}
.trail p{margin:4px 0 0;color:var(--ink-2);font-size:.94rem}
.trail .acts{display:flex;gap:16px;align-items:center;justify-self:end;flex-wrap:wrap}
@media (max-width:700px){.trail li{grid-template-columns:minmax(0,1fr);padding:18px 20px}.trail .acts{justify-self:start}}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--orange);margin:0}
.actions{list-style:none;margin:0;padding:0}
.actions li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.actions li label{cursor:pointer}
.actions input{width:16px;height:16px;accent-color:var(--orange);margin-top:4px}
.actions li.done span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line2)}

/* sessões */
.sess{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 30px;padding:34px 0;border-top:1px solid var(--line)}
.sess .num{font:600 1.9rem/1 var(--display);color:var(--ink-3)}
.sess h3{margin:0;font:600 clamp(1.6rem,2.6vw,2rem)/1.1 var(--display);letter-spacing:-.01em}
.sess .tt{font:italic 400 1.15rem/1.35 var(--display);color:var(--ink-2);margin:6px 0 8px}
.sess .cred{font:500 11px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 16px;max-width:80ch}
.sess .idea{max-width:64ch;margin:0 0 12px;font-size:1.02rem}
.sess ul{margin:0 0 18px;padding-left:18px;max-width:64ch;color:var(--ink-2)}
.sess ul li{margin:5px 0}
.sess ul li::marker{color:var(--orange)}
blockquote.q{margin:22px 0;max-width:56ch}
blockquote.q p{font:italic 500 clamp(1.3rem,2.2vw,1.65rem)/1.3 var(--display);margin:0;text-indent:-.4em}
blockquote.q cite{display:block;font:600 10.5px/1.4 var(--mono);font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-top:10px}
@media (max-width:640px){.sess{grid-template-columns:minmax(0,1fr)}}

/* revisão */
.rev{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:40px;align-items:start}
@media (max-width:860px){.rev{grid-template-columns:minmax(0,1fr)}}
.card{border-radius:24px;background:linear-gradient(140deg,#132a4f,#0b1d38);border:1px solid var(--line2);box-shadow:0 40px 100px -44px rgba(0,0,0,.8);padding:38px 38px 28px;min-height:320px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;right:-70px;bottom:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,74,18,.14),transparent 65%);pointer-events:none}
.card>*{position:relative;z-index:1}
.card .cmeta{display:flex;justify-content:space-between;gap:12px;font:500 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:24px}
.card .front{font:600 clamp(1.5rem,2.6vw,2rem)/1.2 var(--display);letter-spacing:-.01em;margin:0 0 20px;text-wrap:balance}
.card .back{border-top:1px solid var(--line2);padding-top:18px;margin-top:4px;font-size:1.05rem;max-width:60ch}
.card .back .src{display:block;margin-top:12px;font:500 11px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.card .row{margin-top:auto;padding-top:24px;display:flex;flex-wrap:wrap;gap:10px}
.kbd{font:500 10px var(--mono);opacity:.7;margin-left:2px;border:1px solid currentColor;border-radius:4px;padding:1px 5px}
.boxes{display:grid;gap:10px}
.boxes .bx{display:grid;grid-template-columns:110px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.bar{height:6px;background:rgba(255,255,255,.07);position:relative;border-radius:6px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--amber),var(--orange));border-radius:6px}
.side{border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.025);padding:22px}
.side h4{font:600 10.5px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:0 0 12px}
.side p{font-size:13px;color:var(--ink-2)}
.side select{width:100%;padding:9px 12px;border:1px solid var(--line2);background:var(--bg2);border-radius:10px;margin-top:6px}

/* dilemas e exercícios */
.dl,.ex{display:grid;grid-template-columns:280px minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:860px){.dl,.ex{grid-template-columns:minmax(0,1fr);gap:22px}}
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dlist button{width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);padding:14px 16px;cursor:pointer;display:grid;gap:4px}
.dlist button:hover{border-color:var(--line2)}
.dlist button[aria-current="true"]{border-color:rgba(255,74,18,.55);background:linear-gradient(120deg,rgba(255,74,18,.12),rgba(255,255,255,.02))}
.dlist strong{font:600 1.05rem/1.25 var(--display)}
.dlist span{font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ctx{font:400 1.2rem/1.55 var(--display);max-width:60ch;margin:0 0 20px}
.ask{font:600 11px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:0 0 14px}
.opts{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.opt{width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:16px 18px;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;border-radius:16px}
.opt:hover:not(:disabled){border-color:var(--line2);background:rgba(255,255,255,.05)}
.opt:disabled{cursor:default}
.opt .l{font:600 1.15rem/1.3 var(--display);color:var(--ink-3)}
.opt.mine{border-color:rgba(255,74,18,.6);background:linear-gradient(120deg,rgba(255,74,18,.10),rgba(255,255,255,.02))}
.opt .fb{grid-column:2;font-size:.93rem;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.opt .verdict{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px}
.dist{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px 12px;align-items:center;grid-column:2}
.dist .bar{height:5px}
.dist small{font:500 11px var(--mono);color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.fld{display:grid;gap:8px;margin:0 0 22px}
.fld label{font-size:.95rem;font-weight:500;max-width:70ch}
.fld textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);padding:12px 14px;resize:vertical;line-height:1.55;font-size:15px}
.fld textarea:focus{outline:none;border-color:rgba(242,179,61,.6)}
.saved{font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);min-height:1.2em}
.h3{font:600 clamp(1.6rem,2.6vw,2rem)/1.12 var(--display);letter-spacing:-.01em;margin:0 0 14px}

/* turma */
.post{display:grid;gap:12px;max-width:720px;margin-bottom:30px;padding:24px;border-radius:var(--radius);background:linear-gradient(155deg,var(--panel2),var(--panel));border:1px solid var(--line2)}
.post textarea{width:100%;border:1px solid var(--line);background:rgba(10,24,48,.5);padding:12px 14px;border-radius:12px;min-height:100px;line-height:1.55}
.feed{list-style:none;margin:0;padding:0;max-width:760px;display:grid;gap:12px}
.feed li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.feed img{width:34px;height:34px;border-radius:50%}
.feed .who{font-size:13px;color:var(--ink-2)} .feed .who b{color:var(--ink);font-weight:600}
.feed p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}

/* referência */
.gl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
@media (max-width:720px){.gl{grid-template-columns:minmax(0,1fr)}}
.gl div{padding:14px 0;border-bottom:1px solid var(--line)}
.gl dt{font:600 1.08rem/1.3 var(--display)} .gl dd{margin:4px 0 0;font-size:.93rem;color:var(--ink-2)}
.search{width:100%;max-width:440px;border:1px solid var(--line2);border-radius:100px;background:rgba(255,255,255,.03);padding:10px 18px;margin:0 0 22px;font-size:15px}
.tbl{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{text-align:left;font:600 10.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber);padding:14px 16px;border-bottom:1px solid var(--line2);background:rgba(255,255,255,.03)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
td:first-child{font-weight:600;color:var(--ink);min-width:160px}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.cases{grid-template-columns:minmax(0,1fr)}}
.case{border-radius:var(--radius);padding:30px;background:linear-gradient(155deg,var(--panel2),var(--panel));border:1px solid var(--line2);position:relative;overflow:hidden;display:grid;gap:12px;align-content:start}
.case::after{content:"";position:absolute;left:-40px;bottom:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,74,18,.14),transparent 65%);pointer-events:none}
.case>*{position:relative}
.case h4{margin:0;font:600 1.45rem/1.15 var(--display)}
.case p{margin:0;color:var(--ink-2);font-size:.95rem}
.case .lic{color:var(--ink)}
.subnav{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 28px}
.subnav button{border:1px solid var(--line2);background:rgba(255,255,255,.03);border-radius:100px;padding:7px 16px;cursor:pointer;color:var(--ink-2);font-size:13.5px}
.subnav button[aria-pressed="true"]{border-color:rgba(255,74,18,.6);color:var(--ink);background:rgba(255,74,18,.10)}

footer{border-top:1px solid var(--line);padding-block:20px 30px;font:500 11px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
.empty{color:var(--ink-3);font-size:14px;padding:18px 0}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .3s ease both}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1 class="wordmark" style="margin:0"><a href="/" style="color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:11px"><span class="dot"></span>kiko campos</a><span class="sep">/</span><span class="prod">Sala do Conselheiro</span></h1>
        <p class="meta">Workbook do Conselheiro · Board Program StartSe · Turma 15</p>
      </div>
      <div class="encs" role="group" aria-label="Encontro">
        <button id="enc1" data-enc="1">Encontro 1</button>
        <button id="enc2" data-enc="2">Encontro 2</button>
      </div>
    </div>
    <div class="navbox"><nav class="secs" aria-label="Seções">
      <button data-sec="trilha">Trilha</button>
      <button data-sec="sessoes">Sessões</button>
      <button data-sec="revisao">Revisão</button>
      <button data-sec="dilemas">Dilemas</button>
      <button data-sec="exercicios">Exercícios</button>
            <button data-sec="referencia">Referência</button>
    </nav></div>
  </div>
</header>

<script type="application/json" id="data">{"e1": {"encontro": 1, "titulo": "Licença para operar", "datas": "3, 4 e 5 de agosto de 2026", "tese": ["Governança não é estrutura: é comportamento sob risco pessoal. Os professores não estavam vendendo a função, estavam descrevendo o preço dela.", "O desenho dos três dias é uma escada: do porquê pessoal ao dever legal, e do dever legal ao mecanismo de controle.", "O caso Americanas, colocado na abertura, prova o ponto: a companhia tinha todos os selos de governança e ainda assim viveu uma fraude de R$ 25 bilhões."], "sessoes": [{"id": "e1s1", "num": "2.1", "palestrante": "Carlos Júlio", "titulo": "Transformação de carreira e o papel do conselheiro na era da IA", "credencial": "Curador do Board Program; 46 anos de sala de aula, primeiro conselho em 1986, conselheiro da Camil há 21 anos e presidente do Conselho da Patrus.", "ideia": "O conselho tem três missões que não se delegam: perenidade, estratégia e cultura. A IA nivelou o jogo, porque não existe nativo da IA, e a vantagem do sênior passa a ser repertório e capacidade de perguntar. O conselheiro tem liability real, e a mitigação cabe numa linha de ata.", "pontos": ["Cultura é missão indelegável do conselho, não do RH: \"é seu, não dá para passar para ninguém\".", "Há três tipos de conselheiro: o conivente, que não vota contra quem o indicou; o negligente, que assina e vai embora; e o diligente, a menor fatia.", "Quatro competências na era da IA: repertório, letramento, capacidade de perguntar e interagir.", "Decisão boa nasce de informação crível somada a bom senso e preparo; o processo vale mais que o resultado.", "Sem valuation independente, registre abstenção em ata com o motivo. D&O cobre a defesa, não o erro."], "citacao": {"texto": "É seu, mané. É seu, não dá para passar para ninguém.", "autor": "Carlos Júlio"}}, {"id": "e1s2", "num": "2.2", "palestrante": "Leonardo Coelho", "titulo": "Estudo de caso: a fraude na Americanas", "credencial": "CEO da Americanas por três anos, à frente da reestruturação; antes, 13 anos na Siemens e passagem pela Alvarez & Marsal.", "ideia": "A Americanas era certificada em todos os selos de governança e ainda assim sofreu uma fraude de cerca de R$ 25 bilhões. A alta gestão capturou os controles internos. A fraude era de lucratividade, gerada por VPC fictício e encoberta pelo risco sacado, e a cultura de comando e controle sem contestação permitiu que durasse uma década.", "pontos": ["Certificação não é proteção: o caso é de Management Override of Internal Controls.", "A auditoria foi neutralizada pela recusa de extração de dados, vendida como proteção de \"segredo industrial\".", "Oito sinais estavam disponíveis, entre eles rentabilidade fora da curva, dívida a 200% do CDI e zero denúncias no canal de ética.", "A conselheira que perguntou todo trimestre, por escrito e com todos os sinônimos, produziu o registro que protegeu o conselho.", "O plano de ações funcionava como culto: tornava economicamente inviável discordar."], "citacao": {"texto": "Falar que a Americanas não tinha governança é uma leitura superficial do que foi a crise.", "autor": "Leonardo Coelho"}}, {"id": "e1s3", "num": "2.3", "palestrante": "Raul Rosenthal", "titulo": "Para que servem os conselhos?", "credencial": "Ph.D. pela University of Birmingham; ex-presidente no Grupo Bozano, Simonsen, TVA/DirecTV e American Express na América Latina; conselheiro do Banco Sofisa e da Oncoclínicas, entre outros.", "ideia": "Uma aula de transição de carreira disfarçada de aula de conselho. Depois do pico da inteligência fluida, por volta dos 43 a 45 anos, o valor migra para a inteligência cristalizada, e o conselho é a arena natural dela. Mas o assento traz dever fiduciário de estatutário, com responsabilidade que na prática não prescreve.", "pontos": ["A transição se apoia em três pilares: emocional, profissional e financeiro. Primeiro se sai emocionalmente, depois fisicamente.", "Teoria do trapézio: sem soltar o trapézio atual, o trapezista retorna.", "Due diligence antes do sim: se a empresa não dá informação, não é empresa para trabalhar.", "Não saia de reunião sem aprovar a ata; conselho consultivo não é escudo, as atas \"pegam tudo\".", "Cibersegurança e ESG têm materialidade setorial: crítico num banco, marginal numa fábrica de bicicleta."], "citacao": {"texto": "É melhor ficar amarelo hoje do que vermelho amanhã.", "autor": "Raul Rosenthal"}}, {"id": "e1s4", "num": "2.4", "palestrante": "Richard Doern", "titulo": "Quais as principais regulamentações dos Conselhos?", "credencial": "21 anos em conselhos de 25 empresas, tendo presidido 10; precursor do interim CEO em turnaround; conselheiro certificado Plus pelo IBGC.", "ideia": "O mercado real de conselho no Brasil é o capital fechado familiar, não as cerca de 280 companhias negociadas em bolsa. O ambiente regulatório tem três camadas: hard law, autorregulação e soft law. No conselho de administração, o conselheiro responde como um diretor estatutário, e o único amigo que ele tem é a ata.", "pontos": ["Cerca de 30 mil empresas fechadas acima de R$ 100 milhões, com média de 1,5 independente, contra uns 560 assentos no capital aberto.", "Conselho consultivo aconselha e não delibera; ata que registra deliberação o transforma em conselho de administração travestido.", "A lealdade é ao negócio, não ao acionista que indicou o conselheiro.", "\"Não sabia\" não é defesa: registre o desconforto e peça apoio técnico antes de decidir.", "O caminho mais próximo para um conselho é o LinkedIn, com uma especialidade só."], "citacao": {"texto": "O único amigo que você tem é a ata. Único. E aí é bom que você tenha ela guardada em casa.", "autor": "Richard Doern"}}, {"id": "e1s5", "num": "2.5", "palestrante": "Carlos Sá", "titulo": "Como funcionam os conselhos fiscais e comitês de auditoria", "credencial": "Ex-sócio-diretor da KPMG; coordenou os comitês de auditoria das Lojas Marisa e da M. Dias Branco; hoje conselheiro fiscal na CEMIG.", "ideia": "Estrutura sem caráter é decorativa: empresas com comitê de auditoria também estão fadadas a fraudes, porque o problema está nas pessoas. Comitê de auditoria e conselho fiscal são órgãos distintos, e o mapa de risco estratégico precisa ser revisto todo mês, com base no COSO ERM.", "pontos": ["O diretor de RH deveria estar no nível estratégico; sem isso, a empresa vive trocando e contratando.", "Comitê de auditoria reporta ao CA; conselho fiscal reporta à assembleia e fiscaliza inclusive o CA.", "Regra dos 10: de mais de 100 riscos chega-se aos 10 maiores, que entregam 90% do plano estratégico.", "O conselheiro fiscal pode questionar a estratégia, mas mostra incoerências em vez de dizer \"concordo ou discordo\".", "Não abra mão da independência, mesmo que custe assentos: ele perdeu três."], "citacao": {"texto": "Não abram mão de jeito nenhum do CPF de vocês. Em nenhum momento.", "autor": "Carlos Sá"}}, {"id": "e1s6", "num": "2.6", "palestrante": "Carlos Júlio", "titulo": "Repertório filosófico e comportamental do conselheiro", "credencial": "Curador do Board Program da StartSe, no fechamento do Dia 2; a identificação do falante na gravação é inferencial.", "ideia": "Repertório não é erudição: é a autoridade que permite tirar o conselho da pauta operacional e levá-lo para novos produtos e mercados. Filosofia, psicologia e comportamento humano entram no programa por utilidade, inclusive para ler consumo e disrupção.", "pontos": ["Filtro de decisão em três perguntas: posso, devo, quero, com ordem que muda conforme o momento de vida.", "Disrupção vem de fora do negócio e raramente aparece no mapa de risco, como mostram os agonistas de GLP-1.", "O teste do \"nosso maior patrimônio são as pessoas\": o RH está na reunião de diretoria, tem voz e tem o mesmo múltiplo de bônus?", "Escassez e desempenho se pagam no salário-base; o múltiplo de bônus deve ser igual entre funções.", "O conselheiro de administração pode se apoiar no conselho fiscal em vez de descer ao razão."], "citacao": {"texto": "As pessoas fazem o que a gente faz, elas não fazem o que a gente diz. E o conselho tem que ser dirigente nesse olhar.", "autor": "Carlos Júlio"}}, {"id": "e1s7", "num": "2.7", "palestrante": "César Souza", "titulo": "Quais os riscos de um membro de Conselho? Como mitigá-los?", "credencial": "Fundador da Empreenda; primeiro conselho em 1988; 17 conselhos montados desde 2015 e 34 processos sucessórios; conselheiro da EcoRodovias e da Solví.", "ideia": "O conselheiro também escolhe o conselho. Além do risco da empresa, há sete riscos pessoais, três deles ausentes dos manuais de governança. O mais importante é o desencaixe, competência boa no contexto errado, avaliado pela matriz de nove variáveis do Grau de Encaixe.", "pontos": ["Riscômetro do conselheiro: fiduciário, legal/criminal, reputacional, desempenho, atitudinal, relacionamento e desencaixe.", "Diligente, negligente ou conivente: é preciso provar que foi diligente, senão se passa a ser conivente.", "Sucessão é problema do sucedido; o pedido de \"brinquedinho\" é pedido de projeto de vida.", "O papel do conselheiro é levantar alternativas e opinar; quem decide é o dono.", "Estratégia não é projeção estatística do passado: pense de fora para dentro e procure a terceira margem do rio."], "citacao": {"texto": "Você tem que provar que você foi diligente, porque senão você passa a ser conivente.", "autor": "César Souza"}}, {"id": "e1s8", "num": "2.8", "palestrante": "André Freire", "titulo": "Para cada conselho, um conselheiro", "credencial": "Sócio-diretor da EXEC, firma de executive search que impacta cerca de 100 conselhos por ano; foi CEO de multinacional aos 34 anos.", "ideia": "A única sessão dada por quem monta a cadeira. O grande mercado é empresa familiar e conselho consultivo, e 85% das vagas circulam em comunidades, não com headhunters. O filtro número um é ter experiência prévia em conselho, e o conselheiro precisa se declarar e se vender.", "pontos": ["Quem trabalha em cliente da firma de busca fica bloqueado até declarar interesse em conselho, por escrito.", "A cadeira é desenhada como quebra-cabeça: competência funcional, inclusive de pessoas, e experiência no desafio futuro da empresa.", "Quatro filtros eliminam: falta de experiência em conselho, reputação, contaminação por associação e não ter mudado o chip.", "82% dos conselheiros se sentem despreparados para IA; as cinco perguntas sobre IA servem de pauta e de arma de entrevista.", "Negocie o escopo na entrada e precifique cada extra; consultoria remunerada torna o conselheiro externo, não independente."], "citacao": {"texto": "Conselho, você tem que se vender se você quer conselho.", "autor": "André Freire"}}], "casos": [{"id": "e1k1", "nome": "Volkswagen — Dieselgate", "resumo": "Software defeat device detectava testes de laboratório e reduzia emissões de NOx; em uso real, os carros emitiam até 40 vezes o limite legal. Cerca de 11 milhões de veículos, sete anos de prática sistemática e mais de US$ 20 bilhões em acordos só nos EUA. Winterkorn renunciou e foi acusado de fraude em 2019.", "licao": "O dever de informar sobrevive ao dever de agir: Winterkorn foi acusado por ter sabido e não informado. Uma meta declarada inatingível e atingida mesmo assim é anomalia e pergunta de conselho, não de engenharia."}, {"id": "e1k2", "nome": "Uber — o controverso CEO", "resumo": "Após o relato de Susan Fowler, investigação independente analisou 215 queixas de assédio em três anos. O RH havia protegido um assediador de alto desempenho. Kalanick foi forçado a renunciar, 20 pessoas foram demitidas e houve US$ 10 milhões em acordos sigilosos.", "licao": "Desempenho excepcional tratado como imunidade é regra não escrita que o conselho precisa detectar. Nenhuma das 215 queixas chegou à mesa: o dado do canal de ética e da área de gente tem de subir ao conselho."}, {"id": "e1k3", "nome": "Parmalat — o escândalo contábil", "resumo": "Empresa familiar sem lucro desde 1997 reportava liquidez com documentos bancários falsificados, inclusive quase €4 bilhões numa conta do Bank of America atribuída à Bonlat. Rede de empresas de fachada escondia prejuízos havia mais de uma década; cerca de 20 pessoas, incluindo auditores, foram investigadas.", "licao": "A auditoria externa pode estar dentro do perímetro do problema. Pergunte quem controla a correspondência com auditores e bancos: se for a diretoria auditada, o controle não existe."}], "cartoes": [{"id": "e1c01", "sessao": "e1s1", "frente": "Quais são as três missões indelegáveis do conselho, segundo Carlos Júlio?", "verso": "Perenidade do negócio, desenho e entrega da estratégia, e cultura da organização. Cultura não se repassa ao RH: \"é seu, não dá para passar para ninguém\".", "fonte": "Carlos Júlio"}, {"id": "e1c02", "sessao": "e1s1", "frente": "O que distingue o conselheiro conivente, o negligente e o diligente?", "verso": "Conivente não vota contra quem o indicou. Negligente é a celebridade que assina e vai embora. Diligente se prepara, lê, visita e pergunta, e é \"a menor fatia dessa torre\".", "fonte": "Carlos Júlio"}, {"id": "e1c03", "sessao": "e1s1", "frente": "Por que a IA reabriu o jogo para o profissional sênior?", "verso": "Não existe nativo da IA. Ela exige repertório, letramento, capacidade de perguntar e interação. A vantagem do sênior é saber perguntar e aplicar a quilometragem acumulada à ferramenta.", "fonte": "Carlos Júlio"}, {"id": "e1c04", "sessao": "e1s1", "frente": "O conselho quer aprovar uma aquisição sem avaliação independente. Qual é a saída processual?", "verso": "Pedir que conste em ata a abstenção, com o motivo: não viu a avaliação. O padrão defendido são duas ou três avaliações de organismo internacional. Anos depois, quem se absteve \"não é nem citado\".", "fonte": "Carlos Júlio"}, {"id": "e1c05", "sessao": "e1s1", "frente": "O que o seguro D&O cobre e o que não cobre?", "verso": "Cobre a defesa, não o erro. Não substitui diligência nem registro em ata.", "fonte": "Carlos Júlio"}, {"id": "e1c06", "sessao": "e1s2", "frente": "Qual perna da fraude da Americanas gerava lucro e qual a escondia?", "verso": "VPC fictício gerava o resultado, com receita digital inflada 1,3 a 1,5 vez via GMV. O risco sacado, tratado como dívida com fornecedor e não bancária, encobria o buraco.", "fonte": "Leonardo Coelho"}, {"id": "e1c07", "sessao": "e1s2", "frente": "Qual bloqueio de auditoria foi decisivo na Americanas?", "verso": "A recusa em permitir auditoria por extração de dados, justificada como proteção de \"segredo industrial\". A auditoria ficou restrita a teste substantivo por amostragem, e a fraude ficou praticamente invisível.", "fonte": "Leonardo Coelho"}, {"id": "e1c08", "sessao": "e1s2", "frente": "Zero denúncias no canal de ética durante anos: como o conselho deve ler esse dado?", "verso": "Como sinal, não como atestado de saúde. Na Americanas o canal não recebeu uma denúncia sequer durante toda a fraude. Silêncio absoluto pede investigação do próprio canal.", "fonte": "Leonardo Coelho"}, {"id": "e1c09", "sessao": "e1s2", "frente": "O que fez a conselheira que protegeu o conselho da Americanas?", "verso": "Perguntou repetidas vezes, trimestre após trimestre, se a empresa fazia risco sacado, usando todos os sinônimos: forfeiting, vendor finance. A pergunta repetida e registrada fechou a escapatória de nomenclatura.", "fonte": "Leonardo Coelho"}, {"id": "e1c10", "sessao": "e1s2", "frente": "Que pergunta fazer sobre qualquer plano de ações de longo prazo, à luz da Americanas?", "verso": "Não se ele retém, mas se ele silencia. Executivos tinham quase todo o patrimônio em ações, e vender era lido como falta de crença na empresa. Discordar ficou economicamente inviável.", "fonte": "Leonardo Coelho"}, {"id": "e1c11", "sessao": "e1s3", "frente": "Quais são os três pilares da transição de carreira e em que ordem se sai?", "verso": "Emocional, profissional e financeiro. Primeiro se sai emocionalmente, depois fisicamente. Sem base financeira, a coragem vira imprudência. A janela de crise dura em média cinco anos.", "fonte": "Raul Rosenthal"}, {"id": "e1c12", "sessao": "e1s3", "frente": "Por que o conselho é a arena natural do profissional maduro?", "verso": "A inteligência fluida atinge o pico por volta dos 43 a 45 anos. Depois, o valor migra para a cristalizada, o estoque de conhecimento acumulado. Conselho é lugar de julgamento, não de resolver problema.", "fonte": "Raul Rosenthal"}, {"id": "e1c13", "sessao": "e1s3", "frente": "Qual é a regra de Rosenthal para encerrar toda reunião de conselho?", "verso": "Reservar meia hora no fim, projetar a ata na tela e aprová-la antes de todos saírem. É a hora de documentar desconforto. Fora da ata, \"é papo de bêbado\".", "fonte": "Raul Rosenthal"}, {"id": "e1c14", "sessao": "e1s3", "frente": "A empresa que o convidou recusa documentos na due diligence. Como interpretar?", "verso": "A recusa é o próprio achado. Se a empresa não está disposta a dar informação, não é o tipo de empresa para trabalhar. Melhor ficar amarelo hoje do que vermelho amanhã.", "fonte": "Raul Rosenthal"}, {"id": "e1c15", "sessao": "e1s4", "frente": "Onde estão, de fato, as vagas de conselho no Brasil?", "verso": "No capital fechado familiar: cerca de 30 mil empresas acima de R$ 100 milhões, com média de 1,5 independente. O capital aberto tem cerca de 280 companhias negociadas e uns 560 assentos.", "fonte": "Richard Doern"}, {"id": "e1c16", "sessao": "e1s4", "frente": "Quais são as três camadas do ambiente regulatório?", "verso": "Hard law, obrigatória (Código Civil, Lei das S.A., CVM, SOX). Autorregulação, voluntária com vínculo contratual (Novo Mercado, ABRASCA, Resolução CVM 175). Soft law, voluntária (Código do IBGC, princípios da OCDE).", "fonte": "Richard Doern"}, {"id": "e1c17", "sessao": "e1s4", "frente": "Por que a ata de um conselho consultivo não pode registrar que \"o conselho deliberou\"?", "verso": "Consultivo aconselha, não delibera. Ata com deliberação faz dele um conselho de administração travestido de consultivo, e o conselheiro passa a responder como tal. \"O juiz não quer nem saber.\"", "fonte": "Richard Doern"}, {"id": "e1c18", "sessao": "e1s4", "frente": "\"Não sabia\" é defesa para o conselheiro? O que fazer?", "verso": "Não é. O caminho é registrar o desconforto e pedir apoio técnico antes da decisão: diretor jurídico ou escritório externo. As decisões serão julgadas anos depois.", "fonte": "Richard Doern"}, {"id": "e1c19", "sessao": "e1s5", "frente": "Por que ter comitê de auditoria não basta para evitar fraude contábil?", "verso": "Porque o problema está nas pessoas. Empresas com conselho e comitê de auditoria também estão fortemente fadadas a fraudes. Governança só funciona com as pessoas certas e bem preparadas.", "fonte": "Carlos Sá"}, {"id": "e1c20", "sessao": "e1s5", "frente": "Comitê de auditoria e conselho fiscal: quem indica e a quem reportam?", "verso": "Comitê de auditoria: indicado pelos conselheiros, reporta ao CA, assessora e não delibera. Conselho fiscal: indicado por acionistas, reporta à assembleia e fiscaliza a administração, inclusive o próprio CA.", "fonte": "Carlos Sá"}, {"id": "e1c21", "sessao": "e1s5", "frente": "Com que frequência o comitê de auditoria deve rever o mapa de risco estratégico?", "verso": "Todo mês, escalonando os pontos críticos ao conselho. Olhar o mapa uma vez por ano é \"Totalmente absurdo\".", "fonte": "Carlos Sá"}, {"id": "e1c22", "sessao": "e1s5", "frente": "O que é a regra dos 10 no método de risco?", "verso": "Entrevistas com executivos geram mais de 100 riscos. Reduz-se a 40 ou 50, depois aos 10 maiores riscos estratégicos. Tratá-los entrega 90% do plano estratégico.", "fonte": "Carlos Sá / COSO ERM"}, {"id": "e1c23", "sessao": "e1s5", "frente": "Como o conselheiro fiscal deve questionar a estratégia?", "verso": "Tem o direito, porque fiscaliza a administração. Mas mostra em vez de afirmar: aponta incoerências, como captar dinheiro caro para crescer num negócio com margem EBITDA abaixo do custo de juros.", "fonte": "Carlos Sá"}, {"id": "e1c24", "sessao": "e1s6", "frente": "Para que serve repertório numa mesa de conselho?", "verso": "Para cortar a pauta operacional sem parecer arrogante: devolver o tema ao diretor e levar a mesa para novos produtos e mercados. Quem não tem outro assunto não tira a mesa do assunto errado.", "fonte": "Carlos Júlio"}, {"id": "e1c25", "sessao": "e1s6", "frente": "Quais perguntas testam se \"nosso maior patrimônio são as pessoas\" é credo ou teoria?", "verso": "Há reunião semanal de diretoria e quem participa? O diretor de RH está nela? Tem lugar de fala e traz propostas? Qual é a escala de bônus por função?", "fonte": "Carlos Júlio"}, {"id": "e1c26", "sessao": "e1s6", "frente": "Qual princípio de desenho de bônus foi defendido no fechamento do Dia 2?", "verso": "Escassez, desempenho e tempo de casa se pagam no salário-base. O múltiplo de bônus deve ser igual entre funções, porque sinaliza importância relativa. RH com múltiplo menor que marketing é declaração de prioridade.", "fonte": "Carlos Júlio"}, {"id": "e1c27", "sessao": "e1s7", "frente": "Quais são os sete riscos pessoais do Riscômetro do conselheiro?", "verso": "Fiduciário, legal/criminal, reputacional, desempenho, atitudinal, relacionamento e desencaixe. Os três últimos não aparecem em manuais de governança e dependem de leitura de pessoas e cultura.", "fonte": "César Souza"}, {"id": "e1c28", "sessao": "e1s7", "frente": "O que é desencaixe e por que é o risco mais importante?", "verso": "Competência boa no contexto errado: o jogador bom no time que fracassa na seleção. O risco é bilateral: o convidado se queima e a empresa não colhe resultado.", "fonte": "César Souza"}, {"id": "e1c29", "sessao": "e1s7", "frente": "Quais variáveis compõem o Grau de Encaixe?", "verso": "Tipo de negócio, cultura, momento da empresa, resultado desejado, perfil dos acionistas, chairperson, CEO e primeiro nível, o próprio conselheiro e as circunstâncias. Roda-se antes de aceitar ou de convidar.", "fonte": "César Souza"}, {"id": "e1c30", "sessao": "e1s7", "frente": "Por que a sucessão é um problema do sucedido?", "verso": "Todos cuidam do sucessor e esquecem o fundador que sai. Sem projeto de vida, ele pede um \"brinquedinho\". No caso da aula, a solução foi uma holding com o fundador na presidência.", "fonte": "César Souza"}, {"id": "e1c31", "sessao": "e1s7", "frente": "Centralização de decisões é sempre traço de cultura?", "verso": "Não. Em circunstância difícil, a cultura tende a centralizar; quando tudo vai bem, solta. Diagnosticar resposta à circunstância como traço de cultura leva a intervenção errada.", "fonte": "César Souza"}, {"id": "e1c32", "sessao": "e1s8", "frente": "Que fatia das vagas de conselho passa por headhunters?", "verso": "Apenas 15%. Os outros 85% circulam em comunidades e networks. Na manhã da aula, cinco vagas de conselho foram postadas na comunidade do YPO.", "fonte": "André Freire"}, {"id": "e1c33", "sessao": "e1s8", "frente": "Por que um executivo de empresa grande pode estar invisível para vagas de conselho?", "verso": "Se o empregador é cliente da firma de busca, o nome fica bloqueado. Existe uma lista paralela para conselho, mas só entra nela quem declara interesse explicitamente.", "fonte": "André Freire"}, {"id": "e1c34", "sessao": "e1s8", "frente": "Qual é o filtro de eliminação número um, acima do currículo executivo?", "verso": "Não ter experiência prévia em conselho. O cliente teme quem nunca sentou na cadeira. Por isso a porta de entrada são comitês, conselhos consultivos e ONGs.", "fonte": "André Freire"}, {"id": "e1c35", "sessao": "e1s8", "frente": "Prestar consultoria remunerada à empresa compromete a independência?", "verso": "Sim. O conselheiro passa a ser externo, não independente. Mentoria é menos grave. Freire encerrou uma conta de recrutamento para poder assumir uma cadeira.", "fonte": "André Freire"}, {"id": "e1c36", "sessao": "e1s8", "frente": "O que diz a pesquisa EXEC sobre IA e quais são as maiores lacunas técnicas dos conselhos?", "verso": "82% dos conselheiros se sentem despreparados para IA. Lacunas declaradas: jurídico (54%), tecnologia e digital (37%) e riscos (18%).", "fonte": "André Freire"}, {"id": "e1c37", "sessao": "e1s4", "frente": "Que dispositivo da Lei das S.A. transforma a ata em defesa?", "verso": "O art. 159: podem ser isentados de responsabilidade os que tiverem voto contrário registrado. Discordância que não está na ata não protege.", "fonte": "Lei 6.404/76, art. 159"}, {"id": "e1c38", "sessao": "e1s4", "frente": "O que a ICVM 586 exige sobre a avaliação do conselho?", "verso": "Avaliação anual e formal, sob responsabilidade do presidente do conselho, adaptada à organização, com possível apoio de especialistas externos e plano de ação para os pontos de melhoria.", "fonte": "ICVM 586"}, {"id": "e1c39", "sessao": "e1s5", "frente": "Qual é a base legal do conselho fiscal e quando ele é obrigatório?", "verso": "Art. 161 da Lei 6.404/76. Obrigatório nas sociedades de economia mista; nas demais, previsto em estatuto e instalado a pedido de acionistas.", "fonte": "Lei 6.404/76, art. 161"}, {"id": "e1c40", "sessao": "e1s1", "frente": "Por que a NR-1 entra na pauta do conselho?", "verso": "Trata de riscos psicossociais, tema que conselhos tradicionais não sabem discutir, e traz multas de porte material: \"Tem algumas multas lá que quebram a empresa.\" O prazo foi postergado.", "fonte": "NR-1"}], "dilemas": [{"id": "e1d1", "titulo": "A aquisição sem laudo", "sessao": "e1s1", "contexto": "Você é conselheiro independente de uma S.A. fechada de logística. A diretoria leva ao conselho a compra de um concorrente regional e pede aprovação na mesma reunião: o vendedor diz ter outra proposta e quer resposta até sexta. O valuation foi feito pela equipe técnica da própria compradora e o preço embute um prêmio relevante. O presidente do conselho quer votar hoje, e quatro colegas já sinalizam voto favorável. Você não viu nenhuma avaliação independente.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Aprova a operação, confiando na equipe técnica, e pede que o laudo independente seja trazido na próxima reunião.", "qualidade": "fragil", "feedback": "É a leniência que Carlos Júlio condenou: empurrar para a próxima reunião \"não dá, ou pode não dar\". Depois de aprovada, o laudo não muda nada. O caso da refinaria comprada por dez vezes o valor mostra o custo de não perguntar quem fez o valuation. Seu voto favorável fica em ata sem ressalva."}, {"id": "b", "texto": "Vota contra e pede que a justificativa conste em ata.", "qualidade": "aceitavel", "feedback": "Protege você: o art. 159 isenta quem tem voto contrário registrado, e Doern lembra que o único amigo do conselheiro é a ata. Mas você não chegou a dar ao conselho um caminho para decidir melhor. Votar contra sem ter tentado condicionar a decisão a um laudo independente é defesa pessoal, não contribuição ao colegiado."}, {"id": "c", "texto": "Propõe condicionar a aprovação a uma avaliação independente e, se a maioria insistir em votar hoje, registra em ata a abstenção com o motivo.", "qualidade": "melhor", "feedback": "É o método literal de Carlos Júlio: perguntar quem fez o valuation, exigir duas ou três avaliações independentes e, se o conselho atropelar, pedir que conste em ata \"que eu me abstenho, porque eu não vi a avaliação\". Você tenta melhorar a decisão do colegiado e, se não conseguir, deixa o rastro de diligência. Anos depois, \"você não é nem citado\"."}, {"id": "d", "texto": "Aprova com a maioria, já que o colegiado decide e o seguro D&O cobre eventual problema.", "qualidade": "fragil", "feedback": "Duas premissas erradas. O colegiado decide, mas a responsabilidade é individual, e o juiz começa intimando todos os CPFs, como alertou Carlos Sá. E o D&O, nas palavras de Carlos Júlio, \"não cobre o erro, ele cobre a defesa\". Acompanhar a maioria sem ter visto o laudo é a conduta do conivente."}]}, {"id": "e1d2", "titulo": "O canal silencioso", "sessao": "e1s2", "contexto": "Você é conselheiro independente de uma varejista listada no Novo Mercado. A margem está bem acima dos pares, e a diretoria atribui a diferença à sua inteligência de dados. O CEO está no cargo há 18 anos. Pelo terceiro ano, o relatório de compliance mostra zero denúncias no canal de ética, apresentado como prova de cultura saudável. Num café, o sócio da auditoria externa comenta que a empresa só permite testes por amostragem. Os colegas elogiam o resultado e querem seguir a pauta.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Pede por escrito, para constar em ata, a explicação estrutural da margem, acesso da auditoria por extração de dados e análise do canal de ética, e repete o pedido a cada trimestre.", "qualidade": "melhor", "feedback": "Você está diante de quatro dos oito sinais que Leonardo Coelho listou: rentabilidade sem explicação estrutural, recusa de extração de dados, zero denúncias e CEO há mais de 20 anos no caso Americanas. O método que protegeu aquele conselho foi a pergunta repetida, por escrito, todo trimestre. É isso que separa protocolo de diligência."}, {"id": "b", "texto": "Propõe ao comitê de auditoria contratar uma avaliação independente do canal de ética.", "qualidade": "aceitavel", "feedback": "É um passo correto: Leonardo Coelho e a Parte III mostram que zero denúncias é sinal, não saúde. Mas trata um sintoma isolado. Deixa de lado a recusa de auditoria por extração, que ele chamou de bloqueio decisivo, e a margem fora da curva, lida na Americanas como \"segredo industrial\" quando deveria ser anomalia a investigar."}, {"id": "c", "texto": "Leva a preocupação ao CEO numa conversa reservada, para não criar mal-estar no conselho.", "qualidade": "fragil", "feedback": "Na Americanas, o núcleo decisório não era contestado e a área de controle foi sequestrada pela alta gestão. Levar a dúvida a quem controla a informação, fora da ata, não produz registro nem proteção. Rosenthal é direto: desconforto que não está na ata \"é papo de bêbado\"."}, {"id": "d", "texto": "Sugere divulgar o zero de denúncias como indicador de cultura no relatório anual.", "qualidade": "fragil", "feedback": "Transforma um sinal de alerta em propaganda. Leonardo Coelho vasculhou o canal da Americanas e não encontrou uma denúncia sequer em uma década de fraude. A Parte III registra o outro extremo: a Uber tinha 215 queixas que nunca chegaram ao conselho. Os dois são o mesmo defeito: ninguém sabia ler o dado do canal."}]}, {"id": "e1d3", "titulo": "O sucessor sem ambição", "sessao": "e1s7", "contexto": "Você é conselheiro há seis meses de um grupo industrial familiar com cerca de R$ 2 bilhões de faturamento. O fundador tem 82 anos; o filho, de 51, preside a empresa. O lucro líquido caiu de 12% para 9,5%. Nas fábricas, os gerentes dizem que o pai almoça com eles todo mês e o filho não aparece desde o Natal. Num almoço, o fundador pede sua opinião franca sobre tirar o filho e conta que quer montar uma imobiliária com os terrenos da família.", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Recomenda ao fundador substituir o filho por um CEO de mercado o quanto antes.", "qualidade": "fragil", "feedback": "César Souza é claro: o papel do conselheiro não é decidir, é levantar alternativas; quem decide é o dono. E \"Tão importante quanto a solução é a forma\". André Freire lembra que um CEO de mercado em empresa familiar tem 50% de chance de dar certo. A turma ainda apontou que seis meses é pouco para opinião tão forte."}, {"id": "b", "texto": "Traz dados de gestão comparáveis, conversa com o filho sobre o projeto de vida dele e oferece alternativas para ele escolher, enquanto desenha com o fundador um projeto próprio para ele.", "qualidade": "melhor", "feedback": "Reúne o que César Souza e a turma construíram: dados em vez de impressões, perguntar ao sucessor o que ele quer e deixá-lo escolher entre continuar, posição intermediária ou ir para o conselho. E trata o sucedido: o \"brinquedinho\" é pedido de projeto de vida. Respeita as duas paralelas, sem destruir a família nem o negócio."}, {"id": "c", "texto": "Propõe trazer o filho para o conselho, criar um conselho de família e contratar um diretor executivo de mercado.", "qualidade": "aceitavel", "feedback": "É próxima da arquitetura que um participante desenhou e César Souza elogiou como solução honrosa para pai, filho e negócio. Mas chega pronta, sem perguntar ao filho o que ele quer e sem dar projeto ao fundador. César Souza também faria uma etapa intermediária, uma holding por dois anos, antes de levar o filho ao conselho."}, {"id": "d", "texto": "Diz ao fundador que questões de família não cabem ao conselho e volta à pauta de resultados.", "qualidade": "fragil", "feedback": "César Souza perguntou se cabe ao conselho esse nível de intervenção e respondeu: depende, mas, quando está tão evidente, \"nenhum conselheiro deve se omitir\". O desempenho em queda também é risco pessoal seu no Riscômetro. E sucessão, para ele, é o maior calcanhar de aquiles das médias empresas familiares."}]}, {"id": "e1d4", "titulo": "O convite com extras", "sessao": "e1s8", "contexto": "Você é diretor de RH de uma multinacional e recebe convite para o conselho de administração de uma S.A. fechada de alimentos, familiar. O honorário é de R$ 20 mil por reunião. Na conversa, o controlador pede também que você mentore a filha, participe da reunião operacional semanal e conduza, como consultor remunerado à parte, a reestruturação do RH. Ele conta que não há regimento do conselho nem acordo de acionistas, \"porque ninguém nunca precisou\".", "pergunta": "O que você faz?", "opcoes": [{"id": "a", "texto": "Aceita o pacote completo: a remuneração compensa e você domina o tema da consultoria.", "qualidade": "fragil", "feedback": "André Freire é taxativo: o conselheiro \"não pode ser consultor da empresa, receber uma remuneração e ser conselheiro\"; vira externo, não independente. O pedido extra é a armadilha de escopo que ele descreveu com o mesmo valor de R$ 20 mil. E a ausência de regimento e acordo é achado de due diligence ignorado."}, {"id": "b", "texto": "Aceita a cadeira, recusa a consultoria e negocia mentoria e reunião operacional como extras precificados.", "qualidade": "aceitavel", "feedback": "Resolve dois pontos de André Freire: preserva a independência e precifica cada extra fora do honorário-base. Mas pula a due diligence. Para Rosenthal e Doern, a falta de regimento e de acordo de acionistas é informação, e no conselho de administração você responde com bens próprios. Aceitar antes de examinar documentos é risco evitável."}, {"id": "c", "texto": "Sugere começar por um conselho consultivo enquanto a empresa formaliza estatuto, acordo e regimento.", "qualidade": "aceitavel", "feedback": "Doern lembra que muitas empresas começam pelo consultivo como test drive, e a exposição patrimonial é menor. Mas não é o que o controlador pediu, e o consultivo só protege se a ata não registrar deliberação. A proposta ainda deixa em aberto a consultoria e o escopo, que André Freire manda resolver na entrada."}, {"id": "d", "texto": "Condiciona o sim a uma due diligence completa, recusa a consultoria, contrata o escopo por escrito com extras precificados e ouve ex-conselheiros e ex-funcionários.", "qualidade": "melhor", "feedback": "Combina o checklist de Doern e Rosenthal com os cuidados de André Freire: alinhar propósitos, fazer due diligence, inclusive informal (\"O melhor são os ex\"), e escutar bem o mandato. Recusar a consultoria preserva a independência. E, como faz Carlos Sá em empresa familiar, a primeira entrega pode ser \"um banho de governança\" nos donos."}]}], "exercicios": [{"id": "e1x1", "num": 1, "titulo": "Autodiagnóstico dos três pilares da transição", "base": "Raul Rosenthal", "instrucao": "A transição só se sustenta sobre os três pilares ao mesmo tempo, e a janela de crise dura em média cinco anos. Dê a si mesmo uma nota de 1 a 5 em cada pilar e escreva a evidência concreta. Nota sem evidência é autoengano.", "campos": [{"id": "f1", "label": "Emocional: nota (1 a 5) e evidência concreta. A decisão mental precede a física.", "linhas": 3}, {"id": "f2", "label": "Profissional: nota (1 a 5) e evidência do repertório, da certificação e da reputação que sustentam o próximo papel.", "linhas": 3}, {"id": "f3", "label": "Financeiro: nota (1 a 5) e evidência da base que impede a coragem de virar imprudência.", "linhas": 3}, {"id": "f4", "label": "Qual pilar é o meu ponto frágil hoje, e o que muda isso nos próximos 90 dias?", "linhas": 3}, {"id": "f5", "label": "Estou trocando a causa da mudança?", "linhas": 2}]}, {"id": "e1x2", "num": 2, "titulo": "Teoria do trapézio: o que solto, o que agarro", "base": "Raul Rosenthal", "instrucao": "Se o trapezista não soltar o trapézio atual, ele retorna. Nomeie o que você segura, o que quer agarrar e o que impede a soltura. Depois faça o inventário entre inteligência fluida e cristalizada.", "campos": [{"id": "f1", "label": "O trapézio que estou segurando", "linhas": 2}, {"id": "f2", "label": "O trapézio que quero agarrar", "linhas": 2}, {"id": "f3", "label": "O que me impede de soltar", "linhas": 3}, {"id": "f4", "label": "O que ainda faço por inteligência fluida (e talvez já não devesse) e o que só eu consigo fazer por inteligência cristalizada", "linhas": 4}, {"id": "f5", "label": "Onde ainda estou \"brigando se o tomate é uma fruta\" em vez de impedir que o coloquem na salada?", "linhas": 2}]}, {"id": "e1x3", "num": 3, "titulo": "Checklist de due diligence antes de aceitar um convite", "base": "Richard Doern e Raul Rosenthal", "instrucao": "Refaça esta lista para cada convite e registre o que recebeu e o que encontrou. Recusa em fornecer informação não é atraso burocrático: é o achado.", "campos": [{"id": "f1", "label": "Documentos societários recebidos: estatuto ou contrato social, acordo de acionistas, regimentos do conselho e dos comitês, manual de alçadas, atas das últimas 6 a 8 reuniões", "linhas": 4}, {"id": "f2", "label": "Políticas do Novo Mercado (quando aplicável): quais estão aprovadas pelo CA, divulgadas e atualizadas? Qual falta?", "linhas": 4}, {"id": "f3", "label": "Situação e histórico: balanços dos últimos 3 exercícios, plano estratégico e última revisão, mapa de riscos, passivos (\"puxar a capivara\"), processos na CVM, MP, CGU ou reguladores, seguro D&O, debênture emitida", "linhas": 5}, {"id": "f4", "label": "Quem já está no conselho? Eu faria parte de um conselho com essas pessoas?", "linhas": 2}, {"id": "f5", "label": "Que informação foi recusada ou adiada, e o que isso me diz?", "linhas": 2}]}, {"id": "e1x4", "num": 4, "titulo": "Radar de exposição patrimonial", "base": "Os cinco professores", "instrucao": "Antes de aceitar, responda quanto do seu patrimônio está no jogo e por quantos anos. Compare a natureza do assento (administração ou consultivo) e defina, por escrito, seus limites pessoais.", "campos": [{"id": "f1", "label": "O assento é de conselho de administração ou consultivo? Onde estou em bens próprios, dever fiduciário, exposição a CVM, MP, CGU e trabalhista, e horizonte do risco?", "linhas": 4}, {"id": "f2", "label": "Meu teto pessoal de conselhos simultâneos (o consenso da sala foi 3 a 4, conforme o porte)", "linhas": 1}, {"id": "f3", "label": "Setores ou perfis de empresa que eu decido, desde já, não aceitar", "linhas": 2}, {"id": "f4", "label": "O que preciso ter contratado ou negociado antes de assinar qualquer termo de posse", "linhas": 3}]}, {"id": "e1x5", "num": 5, "titulo": "Reposicionamento no LinkedIn", "base": "Richard Doern", "instrucao": "Headhunters usam robôs que varrem a plataforma, e um perfil que diz tudo não diz nada. Escolha uma especialidade, escolha o jogo (conselho, consultoria, advisor ou executivo) e não empilhe títulos.", "campos": [{"id": "f1", "label": "Especialidade única escolhida", "linhas": 1}, {"id": "f2", "label": "Headline, em uma linha, sem empilhamento", "linhas": 1}, {"id": "f3", "label": "Sobre, em três frases: o que eu resolvo, para quem, com que prova", "linhas": 3}, {"id": "f4", "label": "Palavras-chave que quero que o robô encontre", "linhas": 2}, {"id": "f5", "label": "O que vou remover do perfil atual", "linhas": 2}]}, {"id": "e1x6", "num": 6, "titulo": "Os 10 riscos estratégicos", "base": "Carlos Sá e COSO ERM", "instrucao": "Aplique a uma organização em que você atua ou pretende atuar. Parta de todos os riscos levantados, reduza a 40 ou 50 e depois aos 10 maiores. Risco é tudo aquilo que pode impedir de atingir determinado objetivo.", "campos": [{"id": "f1", "label": "Organização analisada e seus objetivos estratégicos", "linhas": 2}, {"id": "f2", "label": "Os 10 maiores riscos: para cada um, objetivo ameaçado, probabilidade, impacto, mitigação e dono", "linhas": 10}, {"id": "f3", "label": "Que oportunidade de negócio este exercício revelou?", "linhas": 2}, {"id": "f4", "label": "Data da próxima revisão mensal", "linhas": 1}]}, {"id": "e1x7", "num": 7, "titulo": "Protocolo pessoal de reunião de conselho", "base": "Os cinco professores", "instrucao": "A instrução mais repetida do encontro, transformada em rotina. Para cada momento da reunião, marque o que já pratica e o que vai passar a praticar, com data de início.", "campos": [{"id": "f1", "label": "Antes: material recebido com antecedência, leitura integral, material rodado com IA para saber onde olhar, perguntas por escrito, pedido de apoio técnico preparado para o item desconfortável", "linhas": 4}, {"id": "f2", "label": "Durante: contexto de decisões polêmicas em ata, voto contrário justificado (art. 159), parecer jurídico ou externo antes de votar, abstenção registrada quando falta valuation independente, no conselho fiscal mostrar em vez de afirmar", "linhas": 4}, {"id": "f3", "label": "Ao encerrar: ata projetada e aprovada antes de todos saírem, cópia pessoal guardada fora dos sistemas da empresa, responsável pelo secretariado e pelo arquivo confirmado", "linhas": 3}]}, {"id": "e1x8", "num": 8, "titulo": "O teste Americanas: leitura de sinais", "base": "Leonardo Coelho", "instrucao": "Aplique os oito sinais a uma organização que você conhece e responda com honestidade, inclusive onde a resposta é \"não sei\", a mais perigosa. Depois formule a sua pergunta do bilhão e teste o plano de incentivo.", "campos": [{"id": "f1", "label": "Os oito sinais: rentabilidade versus pares, auditoria por extração de dados, custo da dívida versus balanço, rajada de aquisições, números operacionais entre áreas, denúncias no canal de ética, tempo do CEO e contestação do núcleo, autoria do estatuto. Situação e risco de cada um", "linhas": 8}, {"id": "f2", "label": "A pergunta que vou repetir todo trimestre, por escrito", "linhas": 2}, {"id": "f3", "label": "Os sinônimos que fecham a escapatória de nomenclatura", "linhas": 2}, {"id": "f4", "label": "No plano de incentivo que conheço melhor: ele premia a discordância bem fundamentada ou a pune?", "linhas": 3}]}, {"id": "e1x9", "num": 9, "titulo": "Riscômetro do conselheiro", "base": "César Souza", "instrucao": "Para um assento que você tem ou está avaliando, dê nota de 1 a 5 a cada um dos sete riscos pessoais e registre evidência e mitigação. Fiduciário e legal se resolvem com processo; reputacional e desempenho, com decisão; atitudinal, relacionamento e desencaixe, com honestidade sobre você mesmo.", "campos": [{"id": "f1", "label": "Fiduciário e legal/criminal: meu patrimônio está exposto? Existe rastro documentado da minha diligência? Notas, evidência e mitigação", "linhas": 3}, {"id": "f2", "label": "Reputacional e desempenho: meu nome sobreviveria se a empresa fosse ao Jornal Nacional amanhã? Ela sobe, está estável ou desce a ladeira? Notas e evidência", "linhas": 3}, {"id": "f3", "label": "Atitudinal, relacionamento e desencaixe: minha postura agrega ou me isola? Tenho um par para me articular? Sou bom nisto ou em algo parecido? Notas e evidência", "linhas": 3}, {"id": "f4", "label": "Qual destes sete riscos eu nunca tinha considerado, e o que faço a respeito nos próximos 30 dias?", "linhas": 2}]}, {"id": "e1x10", "num": 10, "titulo": "Grau de encaixe", "base": "César Souza", "instrucao": "Rode a matriz antes de aceitar um convite ou de convidar alguém. Para cada uma das nove variáveis, compare o que a empresa é ou oferece com o que você é ou prefere. Desencaixe não é incompetência: é competência no contexto errado.", "campos": [{"id": "f1", "label": "As nove variáveis (tipo de negócio, cultura, momento, resultado desejado, acionistas, chairperson, CEO e primeiro nível, eu conselheiro, circunstâncias): empresa, eu, encaixa?", "linhas": 9}, {"id": "f2", "label": "Em que momento de empresa eu me dou bem: startup, perenidade ou turnaround? Com que evidência?", "linhas": 2}, {"id": "f3", "label": "Que tipos de negócio eu recuso por valor, e não por competência?", "linhas": 2}, {"id": "f4", "label": "Se eu recusar este convite, qual é o motivo que eu diria em voz alta, e qual é o verdadeiro?", "linhas": 2}]}], "glossario": [{"termo": "Hard law", "def": "Legislação de adesão obrigatória: Código Civil, Lei das S.A., normas da CVM, Sarbanes-Oxley."}, {"termo": "Autorregulação", "def": "Adesão voluntária, mas com vínculo contratual: Novo Mercado da B3, Código ABRASCA, Resolução CVM 175."}, {"termo": "Soft law", "def": "Recomendação de adesão voluntária: Código do IBGC, princípios da OCDE."}, {"termo": "Pratique ou explique", "def": "Regime em que a companhia aberta segue as 56 recomendações do Código Brasileiro ou explica publicamente por que não as segue."}, {"termo": "Turnaround point", "def": "O ponto além do qual a recuperação da empresa deixa de ser viável. Doern: 9 em cada 10 empresas o procuravam já depois dele."}, {"termo": "Overboarding", "def": "Acúmulo excessivo de assentos por um mesmo conselheiro. A B3 propôs limite de 4; a proposta foi rejeitada."}, {"termo": "Nose in, hands out", "def": "Mantra do conselheiro: perguntar e supervisionar sem operar. \"Quem dirige o avião é a diretoria.\""}, {"termo": "Conselho consultivo", "def": "Órgão que aconselha e não delibera. Não gera responsabilidade patrimonial, desde que a ata não registre deliberação."}, {"termo": "Conselho deliberativo", "def": "Órgão que toma decisões, figura típica de clubes e associações, distinta do conselho de administração."}, {"termo": "Sounding board", "def": "Uso informal do conselho consultivo como caixa de ressonância do controlador."}, {"termo": "Dever fiduciário", "def": "Obrigação de agir com diligência e lealdade em favor da companhia, não de quem indicou o conselheiro."}, {"termo": "ERM", "def": "Enterprise Risk Management. Metodologia de identificar, analisar e responder a riscos dentro de um apetite definido."}, {"termo": "COSO", "def": "Committee of Sponsoring Organizations of the Treadway Commission. Autor dos frameworks de controle interno e de ERM."}, {"termo": "Controle preventivo × detectivo", "def": "Preventivo e sistêmico impede o erro e não engessa; detectivo descobre depois e custa caro."}, {"termo": "Management Override of Internal Controls", "def": "A alta direção contorna ou captura os próprios controles internos. Enquadramento técnico do caso Americanas."}, {"termo": "VPC", "def": "Verba de propaganda cooperada. Desconto do fornecedor para uma campanha específica; historicamente mal auditada no varejo."}, {"termo": "Risco sacado / forfeiting / vendor finance", "def": "Três nomes para a mesma operação de dívida. Os sinônimos que uma conselheira usou para fechar a escapatória de nomenclatura."}, {"termo": "Circularização", "def": "Confirmação de saldos junto a terceiros. Usual com bancos; a proposta é estendê-la a fornecedores."}, {"termo": "COAUD", "def": "Comitê de auditoria. A B3 propôs torná-lo estatutário; a proposta foi rejeitada."}, {"termo": "D&O", "def": "Seguro de responsabilidade civil de administradores. \"É um seguro de defesa: não cobre o erro, cobre a defesa.\""}, {"termo": "Split payment", "def": "Mecanismo da reforma tributária que retém parte do pagamento na origem, com impacto direto no fluxo de caixa a partir de janeiro de 2027."}, {"termo": "Formulário de Referência", "def": "Documento público anual das companhias abertas (Resolução CVM 80), de 400 a 800 páginas."}, {"termo": "Inteligência fluida", "def": "Habilidade de racionalizar, flexibilizar soluções e resolver problemas. Pico por volta dos 45 anos."}, {"termo": "Inteligência cristalizada", "def": "Habilidade de usar o estoque de conhecimento absorvido no passado. É a moeda do conselheiro."}, {"termo": "Teoria do trapézio", "def": "Metáfora de Rosenthal para a transição: é preciso soltar um trapézio para agarrar o próximo, com treino e planejamento."}, {"termo": "Fast failure learning", "def": "O erro honesto e barato que produz aprendizado. \"Errou, mas não aprendeu, perdeu duas vezes.\""}, {"termo": "Diligente / negligente / conivente", "def": "Tríade que César Souza atribui a Sandra Guerra. Diligente participa e registra discordância; negligente vê passar; conivente cala. As três definem exposição pessoal."}, {"termo": "Riscômetro", "def": "Instrumento autoral de César Souza: um termômetro de riscos em duas versões, da empresa (dez dimensões) e do conselheiro (sete)."}, {"termo": "Grau de encaixe", "def": "Matriz de nove variáveis para avaliar se um conselheiro serve a um conselho: negócio, cultura, momento, resultado desejado, acionistas, chairperson, CEO e time, o próprio conselheiro e circunstâncias."}, {"termo": "Desencaixe", "def": "Competência boa no contexto errado. \"Tem um cara que é muito bom no time, chega na seleção, é desgraça.\""}, {"termo": "Terceira margem do rio", "def": "A alternativa que ninguém está considerando. Framework de inovação de César Souza: biogás num negócio de aterro, serviços numa siderúrgica."}, {"termo": "Prazo de validade da empresa", "def": "Quanto tempo os clientes atuais ainda vão consumir o produto atual. Pergunta que se responde de fora para dentro, não de dentro para fora."}, {"termo": "Projeto de vida do sucedido", "def": "O que se oferece ao fundador que sai, para que a sucessão se sustente. Sem ele, o fundador dirá que \"está faltando um brinquedinho\"."}, {"termo": "Ambição saudável", "def": "O sinal que distingue sucessor de herdeiro: querer assumir e estar se preparando para isso."}, {"termo": "Setênio", "def": "Ciclo de sete anos na leitura antroposófica da biografia. Doze setênios cobrem a vida."}, {"termo": "Posso, devo, quero", "def": "Filtro de decisão em três perguntas, com ordem variável conforme o momento de vida."}, {"termo": "Independente × externo", "def": "Externo é quem vem de fora; independente é quem pode discordar sem custo. Quem presta consultoria remunerada à empresa é externo, não independente."}, {"termo": "Lista bloqueada × lista de conselho", "def": "Nas firmas de executive search, quem trabalha em cliente fica bloqueado para vagas executivas, mas entra numa lista paralela para conselho se declarar interesse."}, {"termo": "Conselho de fachada", "def": "\"Ter conselho para fingir que tem governança.\" Dura cerca de dois anos, o suficiente para constar no site."}, {"termo": "Chief AI Officer", "def": "Cadeira executiva nova, de reporte direto ao CEO, dedicada a inteligência artificial."}, {"termo": "CXX-as-a-service", "def": "A antiga consultoria vendida como fração de cadeira executiva. Um dos quatro caminhos para os 55+."}, {"termo": "Exercício do obituário", "def": "Escrever o próprio obituário como se fosse o melhor amigo, para descobrir a vida ideal. Trazido por um participante como o que destravou a sucessão no grupo dele."}], "normas": [{"nome": "Lei 6.404/1976 (Lei das S.A.), arts. 138 a 160", "sobre": "Regime do conselho de administração e dos administradores da S.A.; base também para limitadas com regência supletiva e para companhias abertas.", "status": ""}, {"nome": "Regulamento do Novo Mercado (arts. 14 a 21) e Regulamento de Emissores da B3 (arts. 44 a 45)", "sobre": "Regras aplicáveis à S.A. de capital aberto listada.", "status": ""}, {"nome": "Resolução CVM 80", "sobre": "Formulário de Referência das companhias abertas.", "status": ""}, {"nome": "Resolução CVM 44", "sobre": "Fato Relevante.", "status": ""}, {"nome": "Código Civil (Lei 10.406/2002): limitadas", "sobre": "Arts. 1.011 a 1.021 e 1.060 a 1.065, combinados com os arts. 138 a 160 da Lei das S.A. quando há regência supletiva.", "status": ""}, {"nome": "Código Civil: associações e fundações", "sobre": "Associações nos arts. 53 a 61; fundações nos arts. 62 a 69.", "status": ""}, {"nome": "Lei 5.764/1971 e Código Civil: cooperativas", "sobre": "Política Nacional do Cooperativismo (arts. 47 a 55) e Código Civil (arts. 1.093 a 1.096).", "status": ""}, {"nome": "Lei Complementar 130/2009 e Resolução CMN 5.051/2022", "sobre": "Normas adicionais para cooperativas de crédito (LC 130, art. 5º e parágrafos; Resolução CMN, arts. 13 a 17).", "status": ""}, {"nome": "Lei 13.303/2016 (Lei das Estatais)", "sobre": "Base do pente-fino obrigatório em conselheiros de empresas estatais.", "status": ""}, {"nome": "Sarbanes-Oxley (2002)", "sobre": "Para companhias listadas nos EUA. Origem do comitê de auditoria com 3 membros independentes, ao menos 1 especialista.", "status": ""}, {"nome": "Lei das S.A., art. 138", "sobre": "Conselho obrigatório nas companhias abertas e facultativo nas fechadas; mínimo de 3 membros eleitos pela assembleia.", "status": "Recomendação de melhor prática: 5 a 11 membros"}, {"nome": "Lei das S.A., art. 139", "sobre": "Mandato máximo de 3 anos, permitida a reeleição.", "status": "Prática de mercado: 2 anos em 92% das abertas"}, {"nome": "Lei das S.A., art. 140", "sobre": "O estatuto fixa as regras de substituição de conselheiros.", "status": ""}, {"nome": "Lei das S.A., art. 141", "sobre": "Regras para eleição de conselheiros por acionistas minoritários ou preferencialistas.", "status": ""}, {"nome": "Lei das S.A., art. 142", "sobre": "Compete ao conselho eleger e destituir diretores, fiscalizar a gestão, aprovar planos e políticas e orientar a diretoria.", "status": ""}, {"nome": "Lei das S.A., art. 143", "sobre": "O conselho se reúne conforme o estatuto e lavra atas; o presidente tem voto de qualidade.", "status": ""}, {"nome": "Lei das S.A., art. 147", "sobre": "Requisitos: não estar inelegível nem condenado por crimes contra a administração pública, falência e outros.", "status": ""}, {"nome": "Lei das S.A., art. 148", "sobre": "Os diretores respondem solidariamente pelos atos da administração, conforme suas atribuições.", "status": ""}, {"nome": "Lei das S.A., arts. 151 e 152", "sobre": "Responsabilidade e remuneração dos administradores.", "status": ""}, {"nome": "Lei das S.A., arts. 153 a 157", "sobre": "Deveres: agir com diligência e lealdade, evitar conflitos de interesse, informar vantagens recebidas.", "status": ""}, {"nome": "Lei das S.A., art. 158", "sobre": "Responsabilização por prejuízos causados à companhia.", "status": ""}, {"nome": "Lei das S.A., art. 159", "sobre": "Podem ser isentados os que tiverem voto contrário registrado. É o dispositivo que transforma a ata em defesa.", "status": ""}, {"nome": "Lei das S.A., art. 160", "sobre": "Os administradores podem apresentar relatório à assembleia e emitir pareceres.", "status": ""}, {"nome": "Lei das S.A., art. 161", "sobre": "Base legal do conselho fiscal. Obrigatório nas sociedades de economia mista; nas demais, previsto em estatuto e instalado a pedido de acionistas.", "status": ""}, {"nome": "Lei das S.A., arts. 130 a 142", "sobre": "Recorte indicado por Carlos Júlio: \"estão todas as obrigações do conselheiro\".", "status": ""}, {"nome": "Código Civil, art. 1.016", "sobre": "O administrador deve agir com diligência e lealdade, sob pena de responder por prejuízos.", "status": ""}, {"nome": "Código Civil, art. 1.019", "sobre": "O administrador responde pessoalmente por atos que infringirem a lei ou o contrato, com culpa ou dolo.", "status": ""}, {"nome": "Código Civil, art. 1.020", "sobre": "Sócios que não administram podem fiscalizar a gestão e examinar livros e documentos.", "status": ""}, {"nome": "Código Civil, art. 1.061", "sobre": "A dissolução total exige deliberação de sócios com pelo menos 3/4 do capital, salvo cláusula diversa.", "status": ""}, {"nome": "ICVM 586", "sobre": "Avaliação do conselho anual e formal, sob responsabilidade do presidente, adaptada à organização, com possível apoio externo e plano de ação para os pontos de melhoria.", "status": ""}, {"nome": "NR-1", "sobre": "Riscos psicossociais. Sinalizada por Carlos Júlio como nova obrigação de conselho, com multas de porte material.", "status": "Prazo postergado"}], "acoes": ["Reposicionar o LinkedIn em uma única especialidade, sem empilhamento de títulos e com foto atual.", "Transformar o checklist de due diligence do Exercício 3 em documento próprio, pronto para cada convite.", "Ler John Davis antes de qualquer entrevista com empresa familiar.", "Baixar o Global Risks Report (WEF), o Top Risks (Eurasia) e os 12 princípios do COSO de março de 2026.", "Definir e escrever a posição pessoal sobre teto de conselhos simultâneos e exposição patrimonial."]}, "e2": {"encontro": 2, "titulo": "Repertório para competir", "datas": "6 e 7 de outubro de 2026", "tese": ["O incentivo é a frase mais lida da cultura. Cultura não é o que a empresa declara. É o que ela remunera.", "O risco que derruba já estava na mesa. Risco conhecido e não tratado não é azar. É escolha."], "sessoes": [{"id": "e2s1", "num": "2.1", "palestrante": "Carlos Júlio", "titulo": "O segredo da mudança de cultura nas empresas", "credencial": "Curador do Board Program, preside o conselho da Patrus e é coautor, com Jay B. Barney e Manoel Amorim, de O Segredo da Mudança de Cultura (Benvirá, 2024).", "ideia": "Quando uma estratégia necessária não cabe na cultura, a cultura vence. Cultura não muda por decreto nem por engenharia de consultoria: muda por gestos visíveis do líder que viram histórias contadas pelos outros. Só depois que as histórias pegam é que se mexe em política.", "pontos": ["Diante de estratégia desalinhada, mude o traço cultural que a sabota, não a estratégia; só a reveja se for muito adversa à cultura.", "Story building é fazer o que vai ser contado: o líder é protagonista, não narrador.", "Uma história que muda cultura é autêntica, tem o líder como protagonista, rompe com o passado, fala à mente e ao coração, é teatral e gera outras histórias.", "Primeiro a história, depois as políticas e práticas: no caso Telesp, a estrutura veio só no décimo gesto.", "Bônus discricionário por esforço é decisão cultural, não financeira; discricionariedade exige critério escrito antes."], "citacao": {"texto": "Talvez você precisa mudar parte da cultura que é contra aquela estratégia. E essa é a análise.", "autor": "Carlos Júlio"}}, {"id": "e2s2", "num": "2.2", "palestrante": "Clairton Araujo", "titulo": "Demonstrações financeiras: análise crítica na ótica do conselho", "credencial": "CEO de multinacional alemã, ex-sócio de Big Four, conselheiro de uma das maiores empresas de satélite do mundo e de uma multinacional americana de impressoras.", "ideia": "A auditoria não é seguro: ler as demonstrações é dever do conselheiro. A lição de casa tem três partes: a ordem de leitura, um painel mínimo de dez indicadores e o registro em ata do que não se aceita.", "pontos": ["Leia primeiro a DFC, depois a DRE, depois o balanço: a DFC reconcilia lucro e caixa e, quando há manipulação, não fecha.", "Dez indicadores bastam; dívida líquida acima de 2,5 a 3 vezes o EBITDA e estoque sem giro há mais de 180 dias são sinais de alerta.", "O bônus do CEO calculado sobre o resultado pode ser o motivo de uma provisão não feita.", "Discordância vai para a ata, doa quem doer: é a proteção do conselheiro.", "Em M&A, conselho se pede antes, com motivo forte, métricas de acompanhamento e plano de capital humano."], "citacao": {"texto": "As auditorias não são pagas para te dar 100% de garantia nas coisas.", "autor": "Clairton Araujo"}}, {
