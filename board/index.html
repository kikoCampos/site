oço no Paris 6. “Não é uma pedra no meio do caminho, é um garfo no meio do caminho.” Um detalhe de comportamento à mesa que abriu a leitura."], ["O que a operação disse", "O gerente de fábrica: “o velho sempre vem aqui, pelo menos uma vez por mês, almoça com a gente.” Sobre o filho: “a última vez que ele esteve aqui foi no Natal.” E o próprio sucessor não se ofereceu para acompanhá-lo na visita — “não seria uma coisa natural?”"], ["Os números", "Lucro líquido de 12% caiu para 9,5%, com forecast de 9%. Honorário do conselho: R$ 40 mil por mês. Seis meses de mandato."], ["O “brinquedinho”", "A esposa do fundador o cutuca no almoço: “Doutor César, eu preciso de um brinquedinho.” Eram 35 terrenos comprados por cerca de R$ 200 milhões; laudo independente apontou R$ 1,085 bilhão. O fundador queria montar uma imobiliária."]]}, {"t": "h3", "h": "Frases que ficam"}, {"t": "table", "head": ["<strong>Tema<\/strong>", "<strong>Fala literal<\/strong>"], "rows": [["A escolha é mútua", "<strong><em>“O senhor primeiro tem que me escolher, tem que me conhecer. E eu também tenho que escolher participar do conselho. Eu não sou só escolhido — o conselheiro também tem que escolher. Essa é a primeira mensagem que eu quero dar para vocês. Não se trata apenas de ser convidado e aceitar, ficar feliz por ser convidado.”<\/em><\/strong>"], ["O encaixe", "<em>“Minha personalidade, minha experiência, minhas competências coincidem com a sua necessidade — e se tem um fit, se tem um encaixe.”<\/em>"], ["Contra a redoma", "<strong><em>“O papel do conselheiro não é ficar na redoma de vidro na sala com ar-condicionado. O conselheiro tem que botar os olhos na operação. Tem muita gente que acha que conselheiro é ir uma vez por mês, receber relatórios antes, ler o material, ir para lá, discutir naquele dia, fazer uma pergunta inteligente. É muito mais do que isso.”<\/em><\/strong>"], ["A analogia médica", "<em>“Se eu fosse médico, eu não conseguiria ficar só no clínico geral. Eu gosto de entrar na UTI, gosto de entrar na sala de cirurgia.”<\/em>"], ["A terceira margem", "<strong><em>“Mas o rio só tem duas margens. Pobre de quem pensa assim, que o mundo não é bidimensional. Quem ganha o jogo é quem acredita que um rio tem três margens, no mínimo. E a terceira margem do rio é aquela que ninguém está pensando.”<\/em><\/strong>"], ["A gaiola invisível", "<em>“Fica preso, às vezes, numa gaiola invisível, num aquário invisível, de um modo de pensar. De vez em quando tem que vir alguém de fora e soltar aquilo.”<\/em>"], ["Meritocracia", "<em>“E para mim a palavra mágica é meritocracia. Eu resumo tudo numa palavra chamada meritocracia.”<\/em>"], ["Herdeiro × sucessor", "<em>“Conheço casos de pessoas internas que não estão preparadas, mas têm ambição saudável, no bom sentido: estão se preparando, estão querendo assumir uma posição de comando. E eu não senti no seu filho essa ambição saudável.”<\/em>"], ["Missão declarada", "<em>“A minha missão é ajudar meus clientes a chegarem no amanhã.” E: “transformar potencial em impacto.”<\/em>"], ["O limite da mudança", "<strong><em>“Quando você não quer, você não consegue mudar ninguém. A única forma que eu consigo mudar é a forma que eu olho para você. Eu não consigo mudar você. Às vezes a gente tem arrogância de achar que vai conseguir mudar alguém. Ninguém consegue.”<\/em><\/strong>"], ["As duas paralelas", "<em>“Eu não posso definir uma coisa que faça a empresa ir bem e destruir a família. Também não posso fazer uma coisa que a família vá bem, fique em paz, e destruir o negócio.”<\/em>"], ["O sucedido", "<strong><em>“O maior problema na sucessão que eu vejo é que o pessoal só quer cuidar do sucessor e não cuida do sucedido.”<\/em><\/strong>"], ["O brinquedinho decodificado", "<em>“Se você não der um projeto de vida ao sucedido, ele vai virar e vai dizer: está faltando um brinquedinho. Quando ele me falou do brinquedinho, ele estava pedindo um projeto para ele.”<\/em>"], ["O calcanhar de aquiles", "<em>“Sucessão não é só um problema com o sucessor. A sucessão é um problema com o sucedido, e é por isso que esse é o maior calcanhar de aquiles das médias empresas familiares brasileiras. Poucas empresas conseguem sobreviver ao desaparecimento do seu fundador. Eu quero ir na contramão disso.”<\/em>"], ["As três palavras", "<strong><em>“Você tem que provar que você foi diligente, porque senão você passa a ser conivente. Então essas três palavrinhas — diligente, negligente ou conivente — para mim é um divisor de águas muito grande.”<\/em><\/strong>"], ["O papel do conselheiro", "<em>“O papel do conselheiro não é decidir. O papel do conselheiro é levantar alternativas, é opinar. Quem decide é o dono. Decisão sempre cabe aos acionistas. E tem gente que se arvora, fica numa arrogância.”<\/em>"], ["Contra o fetiche do problema", "<em>“Se apaixone pela solução, não pelo problema. A gente fica mergulhado no problema — tem gente que adora ficar com problemas. Saiam dessa, isso não vai levar ninguém para nada.”<\/em>"], ["Prazo de validade", "<strong><em>“Qual é o prazo de validade da sua empresa? O que você faz hoje vai levar quanto tempo para ter clientes ainda? Porque eu conheço empresas que não têm futuro. Eu tenho que dizer isso aos caras na lata: cara, você não leva mais dois anos, você não vai chegar em 2030, vai morrer a sua empresa.”<\/em><\/strong>"], ["De fora para dentro", "<em>“Eu não começo a pensar por dentro, eu começo a pensar por fora. Quem são os seus clientes? Quanto tempo os seus clientes vão consumir o seu produto?”<\/em>"], ["Sobre o morno", "<em>“Eu adoro o momento da subida, ou o momento da descida que tem que voltar a subir. Agora, ficou um negócio ali morno… Eu gosto quando está frio ou quando está fervendo. Morno, não gosto. Questão de personalidade.”<\/em>"], ["O bom no time, ruim na seleção", "<em>“É muito comum um cara dar certo num negócio e no outro não dar. É como no jogo de futebol: tem um cara que é muito bom no time, chega na seleção, é desgraça. Não consegue jogar na seleção.”<\/em>"], ["O fechamento", "<strong><em>“Em tempos de incerteza, a cultura das empresas se revela e a alma das pessoas se desnuda. Eu conheço as pessoas na hora do sufoco. Quando tudo está bem, as pessoas são de uma forma. Quando as coisas se complicam, aí você vai ver quem é quem.”<\/em><\/strong>"], ["E o corolário", "<em>“Como você se comporta nesse momento é que é a sua verdadeira essência. Não é aquela que você finge ser quando tudo está bem. A hora do sufoco é que a gente se conhece — então aproveita para se conhecer.”<\/em>"]]}, {"t": "h3", "h": "O Riscômetro — o instrumento central da aula"}, {"t": "p", "h": "Conceito declaradamente autoral: “eu criei esse riscômetro, essa expressão, um instrumentozinho que é como se você tivesse um termômetro”. Há dois: o da empresa e o do conselheiro. O segundo é o que muda a sua vida."}, {"t": "h4", "h": "Riscômetro da empresa"}, {"t": "cap", "h": "Riscômetro da empresa"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Como apareceu em aula<\/strong>"], "rows": [["Estratégico", "A ausência de estratégia, ou a estratégia que virou extrapolação do passado."], ["Ético", "Suborno, desvio, o “dinheiro que apareceu na cueca”."], ["Eco-financeiro", "Margem, alavancagem, juros — a Selic no topo como variável estrutural."], ["Cibernético", "Um cliente dele pagou R$ 12 milhões de resgate em ransomware. “Eu estava nesse conselho.” A resposta: reunião de emergência, pagar e depois investigar, e blindagem forte depois."], ["Político", "Eleição, polarização, incerteza jurídica."], ["Comercial", "Precificação errada, concorrente novo, cliente que muda de hábito."], ["Societário", "Acordo de acionistas, conflito familiar, sucessão."], ["Ambiental", "“Se isso vaza e vai para o lençol freático, é crime inafiançável.” Daí a pergunta: “como é que eu vou blindar meu aterro?”"], ["Trabalhista", "Acidente, passivo, condições de operação."], ["Reputacional", "Uma empresa dele foi ao Jornal Nacional na semana anterior, por um acidente fatal. “Saindo do Jornal Nacional, cara, não é simples. No outro dia só faltou chover lá na empresa.”"]]}, {"t": "src", "h": "Fonte: framework autoral de César Souza, conforme apresentado em aula."}, {"t": "h4", "h": "Riscômetro do conselheiro — os sete riscos pessoais"}, {"t": "p", "h": "Aqui está a contribuição mais original do encontro. Os cinco professores anteriores trataram do risco da empresa e, no máximo, do risco patrimonial do conselheiro. César Souza abre o risco do conselheiro em sete dimensões — e três delas não aparecem em nenhum manual de governança."}, {"t": "cap", "h": "Riscômetro do conselheiro — os sete riscos pessoais"}, {"t": "table", "head": ["<strong>Risco<\/strong>", "<strong>O que é<\/strong>", "<strong>Como ele tratou em aula<\/strong>"], "rows": [["<strong>Fiduciário<\/strong>", "Patrimônio pessoal exposto.", "“Seu apartamento, seu terreno, sua conta bancária, sua família está em risco. Especialmente se é empresa de capital aberto, especialmente se trabalha com governos.”"], ["<strong>Legal / criminal<\/strong>", "Corresponsabilidade penal sem ato próprio.", "“Um suborno de alguém — você não participou, mas como membro do conselho você tem que provar que foi diligente, porque senão você passa a ser conivente.”"], ["<strong>Reputacional<\/strong>", "O nome que levou décadas para construir.", "“Não quero ter nenhuma empresa que minha reputação, que eu levei muito tempo suando e trabalhando, seja afetada.”"], ["<strong>Desempenho<\/strong>", "Ficar num conselho de empresa em queda.", "“É um risco para o conselheiro trabalhar numa empresa que baixou a ladeira.” E ele se coloca dentro do risco: “é o meu caso aqui, nesse caso que eu falei — está descendo a ladeira. Não posso correr esse risco, vou ter que fazer alguma coisa.”"], ["<strong>Atitudinal<\/strong>", "Postura e comportamento do próprio conselheiro.", "<strong>Apenas nomeado em aula, sem desenvolvimento. <\/strong>A leitura disponível é o próprio caso do garfo torto — atitude como sinal —, mas ele não fez essa ligação em voz alta."], ["<strong>Relacionamento<\/strong>", "A química com acionistas, chairperson e pares.", "<strong>Nomeado sem desenvolvimento, <\/strong>mas materializado no caso: “presidente do conselho, aqui é onde eu vejo o problema. Isso eu tenho que resolver com o cara.” E: “sozinho ninguém faz verão.”"], ["<strong>Desencaixe<\/strong>", "Competência boa no contexto errado.", "<strong>O que ele elege como o mais importante. <\/strong>“O desencaixe que eu quero colocar está aqui — coisa mais importante que eu quero falar para vocês.” Operacionalizado pela matriz do Grau de Encaixe."]]}, {"t": "src", "h": "Fonte: framework autoral de César Souza. As lacunas de desenvolvimento estão sinalizadas como tais."}, {"t": "h3", "h": "O Grau de Encaixe — a matriz de decisão antes do sim"}, {"t": "p", "h": "Nove variáveis para avaliar antes de aceitar um convite — ou antes de convidar alguém. É o instrumento mais imediatamente aplicável do encontro inteiro."}, {"t": "cap", "h": "As nove variáveis do Grau de Encaixe"}, {"t": "table", "head": ["<strong>Variável<\/strong>", "<strong>A pergunta<\/strong>", "<strong>Como ele se posiciona<\/strong>"], "rows": [["<strong>1. Tipo de negócio<\/strong>", "É um negócio em que eu me dou bem?", "“Um cara foi bom conselheiro numa indústria, brilhou. Aí um cara do agro convida ele. Será que ele vai dar certo no agro? Porque o mundo é completamente diferente.” E o filtro de valores: “já fui convidado para uma grande empresa que fabrica cigarro. Não quero. Para uma que fabrica armas. Não quero.” E o autoconhecimento técnico: “empresa de tecnologia não é meu ramo, eu sou analógico. Topei pelo desafio de aprender.”"], ["<strong>2. Cultura da empresa<\/strong>", "A cultura combina com o que eu acredito?", "“É uma cultura muito centralizada? Eu sou um cara que acredito muito em autonomia — não vai dar certo. Ou ao contrário. Então eu tenho que entender a cultura para saber se eu vou me ajustar ou não.”"], ["<strong>3. Momento da empresa<\/strong>", "Startup, perenidade ou turnaround?", "“Tem gente que se dá bem quando a empresa está normal, tem que segurar as pontas. E tem gente que se dá muito bem no turnaround.” O dele: “eu me dou bem no turnaround e na subida. Quando o negócio está organizadinho, eu não gosto. Não adianta me convidar. Vai ser um negócio meio funcionário público.”"], ["<strong>4. Tipo de resultado desejado<\/strong>", "Crescer faturamento ou manter rentabilidade?", "“Se é backlog, faturamento, fatia de mercado, é uma coisa. Se é manter a rentabilidade, é outra.”"], ["<strong>5. Perfil dos acionistas<\/strong>", "Eu me dou bem com essas pessoas?", "No caso: “o senhor que me convidou, acionista, me dei muito bem com ele. Com a esposa dele também.”"], ["<strong>6. Chairperson<\/strong>", "E com quem preside o conselho?", "“Presidente do conselho, aqui é onde eu vejo o problema.” E a advertência estrutural: “é muito difícil um cara de fora ser o presidente do conselho. No conselho de família, é um jogo.”"], ["<strong>7. CEO e primeiro nível<\/strong>", "Quem é o time com quem vou lidar?", "Avaliado no mesmo bloco dos acionistas e do chairperson."], ["<strong>8. Eu, conselheiro<\/strong>", "O que eu quero disso?", "“Cada um de nós tem que se autoavaliar. O que é que eu quero disso?”"], ["<strong>9. Circunstâncias<\/strong>", "O momento do país e do setor.", "“Tem gente que se dá bem no momento de crise, tem quem se dá bem no momento de euforia. Momento do Brasil: a circunstância é difícil, rentabilidade pequena, controle de custo. Não é momento de gastar para aumentar o faturamento.”"]]}, {"t": "src", "h": "Fonte: framework autoral de César Souza."}, {"t": "box", "kind": "leitura", "title": "A INTERAÇÃO QUE VALE ISOLAR — CULTURA × CIRCUNSTÂNCIA", "items": [{"h": "<em>“Quando a circunstância está difícil, a cultura tende a se centralizar mais nas decisões. Quando as coisas estão bem, eu solto mais. Tenho que entender esse mapa para saber se eu aceito o convite como conselheiro ou não.”<\/em>"}, {"h": "<strong>Para quem trabalha com cultura, isso é uma tese testável e útil: <\/strong>centralização não é necessariamente traço de cultura — pode ser resposta a circunstância. Diagnosticar uma como se fosse a outra leva a intervenção errada."}]}, {"t": "box", "kind": "atencao", "title": "A DEFINIÇÃO DE “DESENCAIXADO”", "items": [{"h": "<strong>Desencaixe não é incompetência — é competência no contexto errado. <\/strong>“É muito comum um cara dar certo no negócio e no outro não dar. É como no jogo de futebol: tem um cara que é muito bom no time, chega na seleção, é desgraça.” O risco é bilateral: o convidado se queima e a empresa não colhe."}]}, {"t": "h3", "h": "As quatro camadas de incerteza"}, {"t": "p", "h": "Ele abre o bloco com uma imagem — um conselho envolto em névoa — e uma provocação: “só tem um cara que parece que conhece as coisas… deve ser o consultor do grupo, e não o executivo, porque quem acha que sabe das coisas é quem é consultor.”"}, {"t": "cap", "h": "As quatro camadas de incerteza"}, {"t": "table", "head": ["<strong>Camada<\/strong>", "<strong>O que ele disse<\/strong>"], "rows": [["<strong>Internacional<\/strong>", "Duas guerras, quase três simultâneas, batendo em matéria-prima. “Eu tenho um cliente que a tonelada de enxofre custava 700 dólares; hoje está custando 9 mil dólares. E você não consegue repassar isso para os seus clientes.” Preço do diesel tirando o sono de várias empresas."], ["<strong>Tendências<\/strong>", "“A inteligência artificial está tirando o sono de muita gente, está gastando dinheiro e não está tendo retorno.” Mais tendência demográfica e mudança de hábitos. O exemplo longo é o ensino superior privado: captação de calouros em colapso. Ele sentou com vinte alunos para entender: “Qual é o seu sonho? Ah, eu quero ser influencer, quero ser rapper, quero ser gamer, quero ser developer. Por que eu vou passar quatro anos dentro da faculdade? Eu vou perder quatro anos da minha vida?”"], ["<strong>Brasil<\/strong>", "“Toda essa confusão que nós estamos vivendo, incerteza jurídica, política, quem vai ganhar a eleição, essa polarização que não vai ser fácil.”"], ["<strong>Empresa<\/strong>", "“Apenas 9% das empresas conseguem executar suas estratégias — matéria de capa da revista Fortune. Mas vai buscar o porquê. E isso me perturba muito.” Somado a dificuldade de formar líderes e sucessores, clientes insatisfeitos e investidores desconfiados."]]}, {"t": "box", "kind": "atencao", "title": "O DIAGNÓSTICO SOBRE O ESTADO DOS CONSELHOS", "items": [{"h": "<em>“A maioria dos conselhos que eu conheço: as pessoas estão cansadas, saturadas, desiludidas, chateadas. Só se conversa a coisa. Problemas.”<\/em>"}]}, {"t": "h3", "h": "Pensamento estratégico e a terceira margem do rio"}, {"t": "p", "h": "Três perguntas: onde estamos, onde queremos e podemos chegar, e qual é a ponte que precisamos construir. Com uma regra de contorno:"}, {"t": "quote", "q": "Estratégia não é projeção estatística do passado.", "by": "CÉSAR SOUZA"}, {"t": "p", "h": "E o primeiro papel do conselho, na formulação dele: “Existe uma estratégia? Sim. Então meu papel como conselheiro é ajudar essa estratégia a ser executada ou ajustada. Existe uma estratégia? Não. Meu papel é ajudar que a empresa construa uma estratégia.”"}, {"t": "h4", "h": "A terceira margem aplicada"}, {"t": "ul", "items": ["<strong>Gerdau: <\/strong>meta de que 20% do faturamento venha da venda de serviços — numa siderúrgica. Empresa de quarta geração, mais de cem anos.", "<strong>Solví: <\/strong>42 aterros no Brasil; uma filial responde por 72% do lixo do Rio Grande do Sul; o aterro de Caieiras recebe 11 mil toneladas por dia. A terceira margem foi o biogás — o resíduo virou energia.", "<strong>A empresa de papel-moeda: <\/strong>o caso-símbolo do prazo de validade vencendo — uma indústria cujo produto está sendo desmontado pelo PIX."]}, {"t": "p", "h": "E a advertência que decorre disso: “não adianta ficar tirando um cara, demitindo, fazendo outro, muda aqui, muda ali, porque seu negócio vai desaparecer.” Mexer em gente quando o problema é o produto é diagnóstico errado — e é um erro que cai no colo do RH."}, {"t": "h3", "h": "Sucessão — o núcleo da sessão"}, {"t": "box", "kind": "leitura", "title": "AS CINCO TESES SOBRE SUCESSÃO", "items": [{"n": "01", "h": "A sucessão é um problema do sucedido, não do sucessor. “O pessoal só quer cuidar do sucessor e não cuida do sucedido.” É, para ele, o maior calcanhar de aquiles das médias empresas familiares brasileiras."}, {"n": "02", "h": "O pedido de “brinquedinho” é um pedido de projeto de vida. A solução que ele desenhou: uma holding, com o fundador na presidência — “quem é presidente da holding não entra no açougue. Está no outro nível. E vai poder cuidar melhor da família.”"}, {"n": "03", "h": "Herdeiro não é sucessor, e o sinal é ambição saudável. “Conheço casos de pessoas internas que não estão preparadas, mas têm ambição saudável — estão se preparando, querendo assumir. E eu não senti no seu filho essa ambição saudável.”"}, {"n": "04", "h": "Duas paralelas que não podem se cruzar: não se conserta o negócio destruindo a família, nem se pacifica a família destruindo o negócio. “Eu tenho que encontrar convergência.”"}, {"n": "05", "h": "A forma importa tanto quanto a solução. “Tão importante quanto a solução é a forma. Eu não vou atropelar de cima para baixo. Não vai ser o pai que vai dizer: cai fora, que o conselheiro disse que você não presta.”"}]}, {"t": "h4", "h": "As perguntas de desenvolvimento que ele usa"}, {"t": "p", "h": "Transferíveis diretamente para uma conversa de carreira ou de sucessão. Ele as aplicou ao próprio sucessor do caso."}, {"t": "ul", "items": ["<em>“Qual é o seu grande goal? Daqui a cinco anos, como é que você quer ser reconhecido? Qual é a sua marca? Qual é a sua assinatura?”<\/em>", "<em>“Está na hora de saber qual é o projeto de vida dele. O projeto de vida dele é ser executivo de uma empresa?”<\/em>", "<strong>E as três alternativas que decidiu oferecer, em vez de decidir por ele: <\/strong>“Você prefere continuar como está e lutar, você prefere ter uma posição intermediária aqui no conselho, ou você prefere ir direto para o conselho? Ele que vai decidir. O que ele decidir vai ter muito mais chance de dar certo do que se eu induzir. Porque o grande dilema desse cara é que ele não decide.”", "<strong>E a postura final: <\/strong>“A escolha que for dele será a minha. Eu vou apoiar a escolha dele — nosso papel é apoiar a escolha dele. Não é simples. É fácil de falar, mas não é simples.”"]}, {"t": "h4", "h": "O limite da mudança — o trecho mais duro do encontro"}, {"t": "quote", "q": "Eu estou com a mão calejada de ver muito executivo, de fazer coach. Ali eu não vejo a matéria-prima. E quando você não quer, você não consegue mudar ninguém.", "by": "CÉSAR SOUZA"}, {"t": "quote", "q": "O papel de um psicólogo, de um terapeuta, é ajudar a pessoa a se encontrar, tomar consciência, apoiar nas decisões que toma. Mas ninguém pode fazer com que o outro mude. Posso criar condições para que a pessoa aprenda e tome a decisão de mudar. Eu não vejo uma pérola ali dentro de uma ostra.", "by": "CÉSAR SOUZA"}, {"t": "box", "kind": "leitura", "title": "VALE DISCORDAR COM MÉTODO", "items": [{"h": "É a afirmação mais contestável da sessão e a que mais interessa ao seu campo. Ele funde três coisas distintas: falta de desejo, falta de preparo e falta de potencial. As duas primeiras são endereçáveis; a terceira é a que ele afirma ter diagnosticado em seis meses de mandato — e um aluno o confrontou exatamente nesse ponto: “esses seis meses é muito pouco tempo, na minha opinião, para já chegar a uma opinião tão forte.”"}, {"h": "Ele incorporou os dados e manteve o julgamento. Guarde a divergência: é o tipo de questão em que quem vem de desenvolvimento de pessoas tem repertório que a mesa não tem."}]}, {"t": "h3", "h": "O debate da turma — e o que ele ensina sobre conselho"}, {"t": "p", "h": "O bloco de mais de trinta minutos em que a turma respondeu à pergunta dele é, na prática, uma demonstração de conselho funcionando: nove leituras diferentes do mesmo fato, nenhuma delas errada."}, {"t": "cap", "h": "Nove leituras do mesmo caso"}, {"t": "table", "head": ["<strong>A leitura<\/strong>", "<strong>O argumento<\/strong>", "<strong>O que ele respondeu<\/strong>"], "rows": [["O problema é o seu momento, não o dele", "Um participante do setor imobiliário: “o quanto essa remuneração é importante para você, o quanto você quer entrar de desgaste, o quanto você tem demandas para conselho. Tem muito mais a ver com o que você quer para a sua vida do que com o que ele quer para a empresa dele.”", "Ele adotou explicitamente: “me reafirmou isso aqui”. Virou o item “eu, conselheiro” da matriz de encaixe."], ["Cabe ao conselho formar o executivo?", "Uma participante: “o quanto cabe no papel do conselheiro gerenciar essa situação para que o filho se torne capaz de executar a sucessão?”", "“Cabe ao conselho esse nível de intervencionismo? Depende. Não existe o conselho ideal. Mas está tão evidente que eu também não posso me omitir — e acho que nenhum conselheiro deve se omitir.”"], ["Lealdade à empresa, não ao sócio", "“Trazer informações que façam virar algumas chaves, não decidir por ele, não induzir, mas permanecer dentro da lealdade como conselheiro.”", "Endossado — reaparece em “o papel do conselheiro não é decidir, é levantar alternativas”."], ["Traga dados, não impressões", "“Quais são os dados da gestão dele? Talvez KPIs em relação ao filho como CEO versus o mercado, versus comparáveis. Seis meses é muito pouco para uma opinião tão forte.”", "Incorporou os dados, manteve o julgamento."], ["Alguém perguntou ao filho o que ELE quer?", "“Em algum momento perguntou o que ele quer, o que ele acha disso, se ele realmente quer seguir isso?”", "“Um caminho importante” — e virou a espinha do plano final: descobrir o projeto de vida do sucessor."], ["O problema é o pai", "“O fato de ele estar com 51 anos falando sobre sucessão agora fala muito sobre o pai. Ele não preparou esse rapaz.” E a proposta: transformá-lo em “rainha da Inglaterra”, com um primeiro-ministro tocando o negócio.", "Endossou o diagnóstico — “todo fundador faz microgerenciamento” — e rejeitou o rótulo: “não é a rainha da Inglaterra, porque isso é meio pejorativo”."], ["O caso idêntico já vivido", "Um participante do RS: “vivemos situação idêntica. Ele deixou de CEO e criamos um cargo de diretor executivo, buscamos no mercado. Ele surfa a onda de ser dono. Hoje participa de eventos, de feiras internacionais. Ficou muito tranquilo.”", "“Você promoveu o cara a rainha da Inglaterra. Perfeito, boa alternativa.”"], ["A arquitetura completa", "Um participante desenhou a solução inteira: trazer o filho para o conselho, dar-lhe formação de acionista, criar um conselho de família e colocá-lo à frente dele com a missão de formar as próximas gerações. “Você deu uma solução honrosa para o pai, para o filho e para o negócio.”", "“Ótima colocação. O único ajuste que eu faria é criar uma etapa intermediária — uma holding, dois anos, e depois ele ir para o conselho.”"]]}, {"t": "h4", "h": "A voz do sucessor — o depoimento que calou a sala"}, {"t": "p", "h": "Um participante de segunda geração pediu a palavra para falar “de quem está do outro lado da mesa”. Foi ex-atleta de jiu-jítsu, disputou um mundial, tinha o sonho de viver do esporte."}, {"t": "quote", "q": "Minha mãe me mostrou o que seria a perspectiva de ser professor de jiu-jítsu, porque a vida de atleta é muito curta. Um atleta de alto rendimento não cultiva saúde. Ela conseguiu me mostrar o que seria o meu futuro — não como carteira, mas como perspectiva de vida, qual ambiente eu estaria inserido. Não é muito uma questão de salário, é uma questão de perspectiva.", "by": "UM PARTICIPANTE, SEGUNDA GERAÇÃO"}, {"t": "quote", "q": "Nós tivemos várias consultorias no nosso grupo; nenhuma tinha dado certo. De alguns anos para cá, foi uma mudança pessoal, minha e dos meus irmãos. E eu tive um exercício que mexeu muito comigo: o exercício do obituário. Imagine que você morreu e agora você é o seu melhor amigo — e como seu melhor amigo, você vai escrever o seu obituário. Qual seria a vida ideal que você escreveria?", "by": "O MESMO PARTICIPANTE"}, {"t": "quote", "q": "Meu pai foi o grande visionário. Se ele não fosse centralizador, não teria chegado onde chegou. Se eu questionar a pessoa dele, eu crio uma ruptura. E não pode haver ruptura — tem que haver uma linearidade, uma transição mais orgânica.", "by": "O MESMO PARTICIPANTE"}, {"t": "box", "kind": "leitura", "title": "POR QUE ESTE DEPOIMENTO IMPORTA MAIS QUE A AULA", "items": [{"h": "Ele explica o mecanismo que nenhuma consultoria conseguiu ativar: a mudança veio de dentro, por um exercício de projeto de vida, e não de um diagnóstico externo. É a evidência empírica da tese de César Souza — “ninguém pode fazer com que o outro mude; posso criar condições” — dita por quem mudou. A resposta dele: “espero que vocês tenham entendido a profundidade do que ele colocou ali. Onde é que eu quero estar? E que legado eu quero deixar? Qual é a minha marca?”"}]}, {"t": "h4", "h": "Ego e humildade do interventor"}, {"t": "p", "h": "Uma participante trouxe o contraponto mais necessário do dia, e ele o endossou sem reservas:"}, {"t": "quote", "q": "Muitas vezes a gente vem cheio de bagagem, a mochila cheia, como histórico de executivo — e a gente acha que tem todas as soluções. E às vezes a família não está preparada para todas aquelas soluções. Então, entender o nosso momento, mas também entender o que aquela família pode naquele momento. E orquestrar isso menos com o nosso ego.", "by": "UMA PARTICIPANTE DA TURMA"}, {"t": "quote", "q": "Ninguém quer entrar num negócio para ver o negócio falir, mas uma família falida não tem negócio nenhum também. Ter um pouco de humildade e entender que aquela família chegou naquele lugar também, que tem conhecimento ali.", "by": "A MESMA PARTICIPANTE"}, {"t": "p", "h": "Resposta dele: “nosso papel é ajudar em outro patamar, tanto o negócio quanto a família. Criar isso não é simples — é fácil de dizer, mas para fazer…”"}, {"t": "h3", "h": "Como mitigar — o consolidado"}, {"t": "cap", "h": "Mitigações praticadas, por tipo de risco"}, {"t": "table", "head": ["<strong>Risco<\/strong>", "<strong>Mitigação que ele pratica<\/strong>"], "rows": [["Fiduciário e criminal", "Registrar discordância em ata. Produzir rastro de diligência — “você tem que provar que foi diligente”. Exclusão setorial preventiva: “eu não trabalho com empresa cujo cliente é governo”; recusou cigarro e armas. E tratar a recusa do convite como instrumento legítimo: “já declinei de vários convites”."], ["Estratégico e desempenho", "Verificar se existe estratégia e acompanhar previsto versus realizado. Due diligence presencial antes de aceitar — um dia na sede mais visita às unidades. Presença contínua na operação: “eu adoro botar bota, capacete e luva”. Começar pelos clientes, corpo a corpo. E cobrar em reunião: “quando foi a última vez que a gente foi lá conversar com os clientes?”"], ["Cibernético", "Blindagem e firewall depois do incidente; protocolo de crise com reunião de emergência."], ["Ambiental e trabalhista", "“Como é que eu vou blindar meu aterro?” Sobre o acidente fatal: “é um risco que a gente não consegue prevenir, mas tem que trabalhar para que não ocorra de novo.”"], ["Relacionamento", "Exigir um segundo conselheiro independente como pré-requisito de pauta — “sozinho ninguém faz verão”. Contratualizar o próprio estilo na entrada: “o meu jeitão é assim, se ele quer isso ou não”. E aprovar ou se manifestar sobre qualquer movimento no N-1."], ["Desencaixe", "Rodar a matriz das nove variáveis antes de aceitar ou de convidar. Autoavaliação: “o que é que eu quero disso?” E recusar por limitação técnica declarada."], ["Sucessório", "Meritocracia como critério único. Não passar dois negócios de uma vez. Laudo independente de avaliação patrimonial. Dar projeto de vida ao sucedido. Etapa intermediária — holding — antes do conselho."]]}, {"t": "h3", "h": "O custo humano do turnaround, dito sem verniz"}, {"t": "quote", "q": "Ajudei a virar o jogo de uma grande empresa aqui no Brasil, chamada Usiminas, 2017 e 2018. Foram demitidas quase 4 mil pessoas. Tinha que fechar outro forno em Ipatinga, fechar outro forno em Cubatão. Demitir muita gente foi um terror — foi a pior noite da minha vida participar desse negócio. Foi feito. Hoje os acionistas estão muito bem, obrigado. Salvamos a empresa. Custo social alto. Mas a empresa está salva.", "by": "CÉSAR SOUZA"}, {"t": "p", "h": "O prejuízo do trimestre de referência foi de R$ 1,045 bilhão. Ele não pediu absolvição nem se justificou — e é exatamente esse registro que vale guardar, porque a conversa sobre reestruturação raramente admite o custo com essa clareza numa sala de aula."}, {"t": "h3", "h": "Referências da sessão"}, {"t": "table", "head": ["<strong>Referência<\/strong>", "<strong>Nota<\/strong>"], "rows": [["<strong><em>Seja o líder que o momento exige<\/em><\/strong>", "Livro do próprio César Souza, distribuído por QR Code em sala."], ["<strong>Sandra Guerra<\/strong>", "Citada como mentora e como origem da tríade diligente / negligente / conivente. Uma das fundadoras do IBGC. ⚠ A transcrição corrompe o nome duas vezes, substituindo-o por marcas do próprio gravador."], ["<strong><em>A terceira margem do rio<\/em><\/strong>", "Framework central de inovação na aula. ⚠ Ele não credita Guimarães Rosa em voz alta — a atribuição aparece apenas no resumo automático."], ["<strong>Riscômetro<\/strong>", "Declaradamente autoral: “eu criei esse riscômetro”."], ["<strong>Estratégia em uma página<\/strong>", "Formato que ele usa com os conselhos em que atua."], ["<strong><em>Fortune<\/em><\/strong>", "“Apenas 9% das empresas conseguem executar suas estratégias — matéria de capa.” Sem ano declarado."], ["<strong>Exercício do obituário<\/strong>", "Trazido por um participante, não por ele. Instrumento de projeto de vida."], ["<strong>Advanced Management Program (Wharton)<\/strong>", "Programa em que deu aula em 1996."], ["<strong>Casos e empresas citados<\/strong>", "Gerdau (Jorge Gerdau Johannpeter e Gustavo Werneck) · Embraer · Usiminas · Magazine Luiza (Luiza e Frederico Trajano) · EcoRodovias · Solví e CRVR · aterro de Caieiras · Bento Pedroso · RE/MAX Brasil · Tenda e Cyrela como comparáveis · a indústria de papel-moeda diante do PIX."]]}], "notes": ["Em que momento de empresa eu me dou bem — startup, perenidade ou turnaround? Com que evidência?", "Onde eu discordo do limite que ele coloca sobre desenvolver pessoas — e com que argumento", "Qual é o meu projeto de vida, se eu tiver que responder como ele pediu ao sucessor"], "meta": "09h05  ·  110 minutos  ·  a sessão mais densa do encontro"}, {"num": "2.8", "head": "2.8  André Freire — “Para cada conselho, um conselheiro”", "blocks": [{"t": "stats", "items": [{"n": "98%", "l": "do negócio dele é familiar/consultivo"}, {"n": "15%", "l": "das vagas passam por headhunter"}, {"n": "~100", "l": "conselhos impactados por ano"}, {"n": "82%", "l": "dos conselheiros despreparados em IA"}]}, {"t": "box", "kind": "leitura", "title": "POR QUE ESTA É A SESSÃO MAIS OPERACIONAL DO ENCONTRO", "items": [{"h": "Os outros professores falaram do lugar de quem senta no conselho. André Freire fala do lugar de quem monta a cadeira e escolhe quem senta nela — é sócio-diretor de uma firma de executive search que impacta cerca de cem conselhos por ano. É a única aula em que você ouve como a decisão de contratação realmente acontece, e não como ela deveria acontecer."}]}, {"t": "h3", "h": "Ficha do professor"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória, conforme dita em aula<\/strong>"], "rows": [["Hoje", "Sócio-diretor da EXEC, consultoria nacional com 16 anos e cerca de 100 pessoas. Três frentes: seleção de executivos, gestão de capital humano e soluções para conselhos."], ["Antes", "Foi CEO de multinacional aos 34 anos — “na época, isso era difícil acontecer; foram circunstâncias, sorte, teve um monte de coisa envolvida”. Migrou para executive search há 13 anos. Engenheiro civil."], ["Conselhos", "“Eu participei de sete empresas familiares, sendo que algumas eu montei o conselho e outras eu fui convidado como independente.” Foi secretário do conselho de uma delas por um ano, “até eles entenderem como é que o bumbo toca”."], ["Terceiro setor", "Quatro anos no conselho da Make-A-Wish, dois deles como presidente."], ["Comunidades", "YPO — Young Presidents Organization, onde a entrada é até 45 anos. Dá aula em dois dos 39 cursos de formação de conselheiros existentes hoje no Brasil."], ["Escala da EXEC", "250 a 300 executivos contratados por ano, só de diretoria para cima. Cerca de 100 conselhos impactados por ano — “desde empresa pequenininha que fatura 10 milhões de reais por ano até o conselho da Petrobras, que foi o último que a gente montou”."], ["Idade", "53 anos."], ["", "<strong>DIVERGÊNCIAS ENTRE O DECK E A FALA<\/strong><br>Vale conferir antes de citar. O deck diz “conselheiro de 6 empresas”; em aula ele disse sete. O deck diz que presidiu o conselho da Make-A-Wish Brasil; em aula ele descreveu como “uma ONG americana”. O deck traz “+250 contratações/ano com uso de garantia inferior a 3%” e “+200 projetos de desenvolvimento de liderança/ano” — nenhum dos dois números foi dito em voz alta. E não foram mencionados em nenhum momento: Terex, Gilbarco, Odgers Berndtson, a coluna na Exame, a lista de “10 CEOs de Futuro” da Você S/A nem a pesquisa Wiz&amp;Watcher, cujo conteúdo sobre os 55+ ele apresentou sem nomear a fonte."]]}, {"t": "h3", "h": "O choque inicial: onde está o mercado de verdade"}, {"t": "p", "h": "Ele abre com um caso que desarma qualquer ilusão de prestígio. A EXEC montou o conselho da Petrobras."}, {"t": "quote", "q": "Um dia de trabalho, R$ 2.500. E aí a gente foi buscar, a gente tem que fazer uma lista de 15 nomes, manda para a Petrobras. Para ganhar R$ 2.500. Olha o risco que essas pessoas estão entrando.", "by": "ANDRÉ FREIRE"}, {"t": "p", "h": "E a divisão que ele observou entre os candidatos: “metade das pessoas que a gente falou: puta, eu vou de qualquer jeito, eu quero pôr esse carimbo no meu currículo, eu quero ser conselho da Petrobras, eu vou ser conselho de qualquer coisa. E metade de pessoas não são loucos.” Perguntado se aceitaria, respondeu: “Nem hoje. Nem nunca.”"}, {"t": "quote", "q": "Eu tenho o meu nome, eu sou um executivo. Hoje eu tenho uma empresa, sou sócio de uma empresa, mas a minha reputação vale muito. Se eu perder a minha reputação fazendo o que eu faço hoje, acabou. Eu não sou herdeiro de grandes fortunas.", "by": "ANDRÉ FREIRE"}, {"t": "box", "kind": "leitura", "title": "O MAPA REAL DO MERCADO", "items": [{"n": "01", "h": "98% do que a firma dele faz é empresa familiar e conselho consultivo. “Esse é o grande mercado, é o grande filé. É aí que vão estar as grandes oportunidades.”"}, {"n": "02", "h": "O conselho de administração é um circuito fechado. “É um mundinho muito fechado. De mais ou menos os mesmos nomes vão acabando circulando.” E sem eufemismo: “tem às vezes um pouquinho daquela panelinha — vocês vão ver alguns professores que dão aula e que basicamente giram nessas empresas.”"}, {"n": "03", "h": "Apenas 15% das vagas passam por headhunters. “85% das posições não estão com os headhunters, não estão com a gente. Estão dentro dessas comunidades, desses networks.” Ele provou ao vivo: naquela manhã, cinco vagas de conselho foram postadas na comunidade do YPO — três por colegas, duas por ele."}, {"n": "04", "h": "O tamanho do mercado familiar brasileiro: 90% das empresas são familiares, respondem por 65% do PIB e 75% dos empregos — e apenas um quarto se prepara para a sucessão."}, {"n": "05", "h": "E o boom da formação: de dois cursos de conselheiro há 10 ou 15 anos para 39 hoje. “Eu brinco um pouco: conselho vira um novo coaching.”"}]}, {"t": "h3", "h": "A mecânica interna das firmas de hunting"}, {"t": "p", "h": "Este é o trecho de maior alavancagem prática de todo o encontro, e não aparece em nenhum deck."}, {"t": "quote", "q": "Todas essas empresas de hunting fazem tanto conselho quanto funções executivas. Se o Walmart é meu cliente e você é executivo do Walmart, quando eu entrar no meu sistema o seu nome vai estar com um negócio vermelho ali, falando que você não pode mexer. Essa é a regra das consultorias. Só que eu posso pegar você e colocar numa posição de conselho de uma empresa do agro — não tem esse conflito.", "by": "ANDRÉ FREIRE"}, {"t": "quote", "q": "Então todas as empresas de hunting fizeram um sistema paralelo para conselho. Você vai estar nas duas listas: numa bloqueada e numa aberta. Só que você tem que avisar as empresas de hunting.", "by": "ANDRÉ FREIRE"}, {"t": "box", "kind": "atencao", "title": "A CONSEQUÊNCIA QUE NINGUÉM CONTA", "items": [{"h": "<strong>Se você é executivo de uma empresa que é cliente da firma de busca, você é invisível para as vagas de conselho até declarar explicitamente que tem interesse. <\/strong>“Você tem que chegar e falar assim: olha, eu tenho interesse em posições executivas e conselhos, ou só conselhos. Porque elas vão te pôr numa lista separada e não vai ter esse problema — principalmente quem está em empresa grande.”"}, {"h": "É uma ação de cinco minutos que remove um bloqueio estrutural. Vale fazer com cada firma relevante, por escrito."}]}, {"t": "h3", "h": "Como o cliente realmente chega — e como a cadeira é montada"}, {"t": "p", "h": "A demanda quase nunca chega como pedido de governança."}, {"t": "quote", "q": "O tema principal não era “quero montar um conselho”, e normalmente não é ainda. O tema era: eu tenho um problema de sucessão. O problema número um é sucessão. Briga familiar, normalmente.", "by": "ANDRÉ FREIRE"}, {"t": "p", "h": "O pedido concreto costuma ser outro: trazer um CEO de mercado para profissionalizar. E é aí que ele reposiciona a conversa com uma conta comercial que vale memorizar:"}, {"t": "quote", "q": "E se eu conseguir montar para você um conselho e colocar aqui cinco pessoas pelo mesmo custo que você teria se eu colocasse esse CEO? Essa é a conta que a gente faz, pessoal.", "by": "ANDRÉ FREIRE"}, {"t": "p", "h": "O argumento é reforçado por um dado que ele trata como consenso do setor: um CEO de mercado numa empresa familiar tem “50% de chance de dar certo e 50% de dar errado. É binário a coisa”. O conselho, nessa leitura, é o veículo que prepara o terreno — “muitas vezes, depois de um, dois anos, eu vou lá e ponho o CEO. Aí todo mundo está pronto, a governança já foi feita, as avaliações internas já foram feitas e a coisa caminha”."}, {"t": "h4", "h": "A lógica do quebra-cabeça — como ele desenha uma cadeira"}, {"t": "cap", "h": "Como uma cadeira de conselho é desenhada"}, {"t": "table", "head": ["<strong>Eixo<\/strong>", "<strong>O que ele procura<\/strong>"], "rows": [["<strong>Competência funcional<\/strong>", "“Uma pessoa que é mais comercial, uma pessoa que é mais financeira, uma pessoa que é mais pessoas.” E a ressalva importante: “não quer dizer que a pessoa de pessoas é uma pessoa de RH, não quer dizer que o financeiro é um CFO — mas são pessoas que têm essa competência.”"], ["<strong>Habilidade para o desafio futuro<\/strong>", "“Eu pergunto para a empresa: como é que você vê a tua empresa daqui a cinco anos? Ah, eu quero abrir o capital. Legal, eu vou ter alguém dentro do conselho que já participou de um IPO. Ah, eu quero internacionalizar, vou ter alguém que internacionalizou. Eu quero vender para um fundo, vou ter alguém que fez isso.”"], ["<strong>A pergunta de fechamento<\/strong>", "“Quando a gente monta do zero é o melhor, porque a gente monta o quebra-cabeça direitinho para ter certeza que não falta nada. Quando a gente põe uma pecinha lá, eu falo com todo o resto e pergunto: o que está faltando aqui?”"]]}, {"t": "src", "h": "Fonte: método descrito por André Freire em aula."}, {"t": "box", "kind": "leitura", "title": "LEITURA DE POSICIONAMENTO — A CADEIRA DE “PESSOAS” EXISTE", "items": [{"h": "Ele nomeia explicitamente uma competência funcional de gente entre as que compõem o quebra-cabeça, e diz que quem a ocupa não precisa ter sido diretor de RH. É a confirmação, do lado de quem contrata, do que os professores anteriores afirmaram do lado de quem senta: a cadeira existe. O que ela exige é evidência de competência em gente, não crachá de RH."}]}, {"t": "h3", "h": "O que elimina candidatos"}, {"t": "cap", "h": "Os quatro filtros de eliminação"}, {"t": "table", "head": ["<strong>Filtro<\/strong>", "<strong>Como ele descreveu<\/strong>"], "rows": [["<strong>1. Não ter experiência prévia em conselho<\/strong>", "O filtro número um, acima de currículo executivo. “Mas o cara foi presidente de empresa, foi isso, foi aquilo. Tem alguma experiência em conselho? Não, não tem nenhuma. Ah, eu prefiro o outro que não foi tudo isso, mas tem experiência em conselho.” A razão é o medo do cliente: “se eu tiver gente aqui, mesmo sendo muito boa, que não tem experiência em sentar numa cadeira de conselho, possivelmente a gente vai ter um problema.”"], ["<strong>2. Reputação e referências de mercado<\/strong>", "“Para esse tipo de posição, a gente vai fazer referência de mercado, a gente vai entender quem vocês são. E na dúvida, a gente não vai levar para o meu cliente. É a última instância — todo mundo tem que estar ilibado.”"], ["<strong>3. Contaminação por associação, mesmo sem culpa<\/strong>", "O exemplo que ele deu é duro: um interlocutor lhe indica repetidamente ex-colegas de uma construtora envolvida em escândalo. “Metade dos meus clientes não vão querer falar, porque passou por um problema. E eu sei que essa pessoa não estava metida com isso, eu sei que você vai me contar tudo isso, mas não vai adiantar. É isso, e é o que é hoje.”"], ["<strong>4. Não ter mudado o chip<\/strong>", "“Executivo é uma coisa, dono de empresa é outra coisa, conselheiro é uma terceira coisa totalmente diferente.” E o teste em entrevista: “se você cuspir a solução, não é isso que vai funcionar como conselheiro”."]]}, {"t": "h3", "h": "Frases que ficam"}, {"t": "table", "head": ["<strong>Tema<\/strong>", "<strong>Fala literal<\/strong>"], "rows": [["Comunidades", "<strong><em>“O mundo gira através de comunidades. As oportunidades que vocês vão ter na vida de vocês, tanto profissionais quanto pessoais, estão dentro de comunidades.”<\/em><\/strong>"], ["Aprender", "<em>“Parar de aprender hoje em dia, pessoal, a gente morre.”<\/em>"], ["Etarismo", "<em>“Existe ainda esse preconceito, o etarismo existe. Mesmo para a posição de C-Level, mesmo para CEO, ele existe.”<\/em>"], ["A primeira cadeira", "<strong><em>“Pegar a primeira cadeira de conselheiro é a mais difícil de todas. Conselheiro é que nem estágio.”<\/em><\/strong>"], ["Sobre certificação", "<em>“É raro alguém vir para mim e falar: eu preciso de certificado de alguma formação de conselheiros. É muito raro. O que vocês estão tendo aqui é um bom ter. Ajuda. Mas o primeiro requisito é experiência como conselheiro.”<\/em>"], ["Mudar o chip", "<em>“Executivo é uma coisa, dono de empresa é outra coisa, conselheiro é uma terceira coisa totalmente diferente. Então, tem que mudar o chip.”<\/em>"], ["O quê e o como", "<strong><em>“Tem o quê e o como. A gente não deve entrar no como dentro do conselho — por isso que tem executivos para tocar a empresa. Você vai entrar muito mais no quê.”<\/em><\/strong>"], ["A longevidade da profissão", "<em>“E o legal dessa profissão é que a idade, o cabelo branco, seja o que for, é melhor. A longevidade dessa profissão é muito boa. Aqui é o contrário: eu levo uma pessoa mais jovem, mais complicada.”<\/em>"], ["Vender-se", "<strong><em>“Conselho, você tem que se vender se você quer conselho. Porque ninguém vai simplesmente olhar pra você e falar: ah, legal, porque ele é um ótimo executivo, ele vai ser um ótimo conselheiro.”<\/em><\/strong>"], ["Declarar", "<em>“Você já declarou para outras pessoas que você quer ser conselheiro — clientes, fornecedores, sócios, amigos? Tem que falar o que vocês querem, porque senão as pessoas não vão saber.”<\/em>"], ["Sair", "<strong><em>“E sai o quanto antes. Quando você começa a ver que tem fumaça, melhor sair pra não ter confusão. Não tem dinheiro que paga a nossa tranquilidade.”<\/em><\/strong>"], ["O que é independência", "<strong><em>“Independente é quem tem total independência de mandar você à merda quando precisa mandar à merda. Se tiver algum ponto em que ele possa pensar duas vezes — será que eu mando esse cara à merda? — aí é um problema.”<\/em><\/strong>"], ["Sobre mulheres e preparo", "<em>“As mulheres nunca se sentem preparadas para nada. Elas sempre acham que estão abaixo de poder fazer o que elas deveriam.”<\/em>"], ["O escopo real", "<em>“O conselheiro não trabalha somente no dia da reunião.” E: “se vocês olharem tudo isso daqui, dá quase que um full-time job”.<\/em>"], ["IA como diferencial", "<strong><em>“Se eles falarem: poxa, o que eu deveria me desenvolver daqui para frente para me tornar um melhor conselheiro? Esse é o tema, esse é o tema principal, vem antes do resto.”<\/em><\/strong>"]]}, {"t": "h3", "h": "IA e governança digital — a oportunidade que ele aponta"}, {"t": "p", "h": "Ele apresentou dados de uma pesquisa própria da EXEC com 300 conselheiros e destacou um número:"}, {"t": "quote", "q": "82% dos conselheiros se sentem despreparados. Ou seja, essas são pessoas que estão em conselhos, estão lá, efetivamente. Olha que diferencial grande.", "by": "ANDRÉ FREIRE"}, {"t": "cap", "h": "Concentrações e lacunas técnicas nos conselhos brasileiros"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>O que a pesquisa e a fala dele mostram<\/strong>"], "rows": [["<strong>Onde há concentração<\/strong>", "As expertises mais presentes nos conselhos brasileiros: governança em primeiro lugar, gestão geral e CEO em segundo, finanças em terceiro."], ["<strong>Onde há lacuna<\/strong>", "Jurídico (54% declaram não ter), tecnologia e digital (37%) e riscos (18%). “Tecnologia digital e riscos estão no topo das pautas dos conselhos, mas também são as maiores lacunas técnicas. Se alguém aqui é do jurídico, ou de tecnologia ou digital, está aí a oportunidade.”"], ["<strong>A nova cadeira executiva<\/strong>", "“O Chief AI Officer, uma nova cadeira na liderança. Eu contratei um cara agora, um Chief AI Officer. Não quero um gerente — é uma cadeira relativamente nova, mas de número 1, cada vez mais.”"], ["<strong>Ética algorítmica vira compliance<\/strong>", "“Será que tem algum sistema que está pegando as nossas impressões? Isso pode sair da empresa ou ir para outras áreas que a gente não está enxergando. Será que o time de tecnologia vai ter acesso ao tipo de coisa que está sendo discutida? Então tem que ter uma governança boa aí.”"], ["<strong>O piso, não o teto<\/strong>", "“Aqui no mínimo um letramento — se a pessoa falar alguma coisa, eu escutei o que ela falou, eu sei rebater. Isso é o mínimo.”"]]}, {"t": "src", "h": "Fonte: pesquisa EXEC com 300 conselheiros, apresentada em aula."}, {"t": "box", "kind": "leitura", "title": "AS CINCO PERGUNTAS SOBRE IA — E O USO QUE ELE SUGERIU PARA ELAS", "items": [{"h": "Ele não as apresentou como pauta de conselho apenas. Apresentou como arma de entrevista: “perguntas poderosas para vocês trazerem em uma entrevista”."}, {"h": "1. Que decisões estratégicas estão sendo delegadas a algoritmos?   2. Quais vieses podem estar embutidos nos modelos usados?   3. A empresa tem política clara de uso responsável de IA?   4. Os dados que alimentam os modelos são éticos e seguros?   5. Estamos preparados para a regulação crescente de IA?"}, {"h": "<strong>E o efeito pretendido: <\/strong>“Se vocês fizerem essas perguntas, que de alguma forma mostram que vocês estão olhando esses dois lados da balança, vocês vão ser considerados possivelmente pessoas com maior conhecimento.”"}]}, {"t": "h3", "h": "Acesso — o que fazer, na ordem"}, {"t": "ul", "items": ["Declare. Aos headhunters, para sair da lista bloqueada; e ao ecossistema — clientes, fornecedores, ex-sócios, amigos. Ele contou o caso de um amigo, ex-presidente de uma grande farmacêutica: “por que ninguém me chama pra conselho?” — “mas você fala que você quer conselho?”", "Ponha “conselho” no LinkedIn. “Às vezes tem gente que tem experiência e não põe ali. Ah, não, mas eu já fui conselho fiscal, eu já fui no comitê de pessoas. Isso é conselho, gente, põe ali.”", "Some qualquer experiência de colegiado. “Você participa das reuniões de conselho da empresa como executivo? Põe no currículo. Eu brinco até: você foi síndico de prédio, põe no currículo.”", "Entre em comunidades — é onde estão os 85%.", "Comece pelo terceiro setor ou por empresas pequenas. A rotatividade em conselhos de ONG é muito maior, e conselhos de ONG costumam ter dez pessoas.", "Não espere sair do mundo executivo. “A grande maioria dos conselheiros está começando a buscar posições de conselho enquanto ainda são executivos.” O limite prático que ele mesmo pratica: até dois conselhos enquanto executivo."]}, {"t": "box", "kind": "atencao", "title": "CUIDADOS — A LISTA CURTA DELE", "items": [{"h": "Sempre alinhe os propósitos. Não aceite cadeira em negócio que conflite com os seus valores."}, {"h": "Sempre faça due diligence — e a informal funciona muito bem: “hoje em dia a gente consegue achar ex-conselheiros, ex-funcionários. O melhor são os ex.” Se a conversa avançar, peça todos os materiais, assine NDA, chame um advogado."}, {"h": "Só aceite se fizer sentido, mesmo."}, {"h": "Saia o quanto antes, caso não concorde. “Não tem dinheiro que paga a nossa tranquilidade.”"}]}, {"t": "h3", "h": "Pontos de atenção"}, {"t": "ul", "items": ["<strong>O escopo do mandato é a armadilha mais comum. <\/strong>“A empresa fala: eu vou pagar 20 mil reais para essa pessoa participar de uma reunião de conselho. Você fala: que legal, assino lá. Só que daí vem: você pode mentorar o meu filho? Você pode participar das reuniões operacionais uma vez por semana? Você pode ir comigo no cliente? Então escutem bem o que vai ser esse mandato.” A recomendação é precificar cada extra separadamente.", "<strong>Consultoria e cadeira não convivem. <\/strong>“Ele não pode ser consultor da empresa, receber uma remuneração e ser conselheiro.” Mentoria é menos grave, “porque aqui é mais gestão”. Ele mesmo abriu mão de receita: um cliente de recrutamento o convidou ao conselho e ele encerrou a conta — “eu vou estar em um conflito ali dentro”.", "<strong>Conflitos de interesse são velados e imprevisíveis. <\/strong>Ele colocou dois independentes num conselho familiar; eles se encontraram na primeira reunião e um pediu para sair — o outro era ex-namorado da esposa dele. “São conflitos que a gente não vê. Eu não perguntei.”", "<strong>ONG tem risco de pessoa física, não só de agenda. <\/strong>“A gente olhava muito toda a parte documental para não ter problema também na pessoa física. Você pega um negócio lá e de repente descobre que a ONG está lavando dinheiro — vocês imaginam a complicação.” E: “as ONGs são uma forma muito fácil de lavagem de dinheiro”. Some-se o escopo infinito não remunerado: “eles vão te puxar para fazer tudo”.", "<strong>Conselho de fachada. <\/strong>Um dos desafios que ele mais vê no consultivo é “ter conselho para fingir que tem governança”. O desfecho é sempre o mesmo: “quem é sério não fica num negócio como esse”, e o conselho dura cerca de dois anos — o suficiente para pôr no site.", "<strong>Mandatos longos. <\/strong>“Três a cinco anos, às vezes com um segundo mandato — então seis anos é o ideal.” Ele cita o oposto: “eu sou conselheiro da empresa há 20 anos”.", "<strong>O “isentão”. <\/strong>Entre as falhas que aparecem nas avaliações de conselho, ele descreve o conselheiro que recebe o relatório de 70 páginas na véspera e não reage — e o presidente-dono que “vai falar 80% do tempo, o resto vai falar 20%”."]}, {"t": "h3", "h": "Diversidade — a leitura de quem faz a busca"}, {"t": "p", "h": "Ele tratou o tema pelo lado da oferta e da demanda, com casos concretos."}, {"t": "ul", "items": ["<strong>Vivara: <\/strong>o conselho passou de quatro homens e uma mulher para três mulheres e dois homens.", "<strong>MPD: <\/strong>quatro homens, todos com mais de 60 anos, todos formados na mesma escola de engenharia. O reforço escolhido foi um fundador de 35 anos que havia quebrado quatro startups antes de acertar na quinta — e ficou dois anos e meio a três anos.", "<strong>Carrefour: <\/strong>três meses de busca para encontrar quatro candidatas no Brasil com o perfil pedido.", "<strong>E o gargalo que ele nomeia do lado da oferta: <\/strong>“as mulheres nunca se sentem preparadas para nada. Elas sempre acham que estão abaixo de poder fazer o que deveriam.” Na turma dele naquele dia: cinco mulheres “nesse grupo gigante”."]}, {"t": "p", "h": "Vale registrar também a mentoria reversa como prática que ele viu funcionar em conselhos que se renovaram por idade."}, {"t": "h3", "h": "Remuneração e forma de contratação"}, {"t": "cap", "h": "Remuneração e contratação, conforme relatado em aula"}, {"t": "table", "head": ["<strong>Item<\/strong>", "<strong>O que ele disse<\/strong>"], "rows": [["Piso simbólico", "O caso Petrobras: R$ 2.500 por dia de trabalho."], ["Ordem de grandeza no familiar", "Ele usa como referência de conversa o patamar de R$ 20 mil por reunião ao explicar a negociação de escopo."], ["Extras", "Devem ser precificados fora do honorário-base — mentoria, comitês, reuniões operacionais, abertura de portas comerciais."], ["Formas de contratação", "PJ, RPA ou previsão em contrato social."], ["Horário das reuniões", "“A grande maioria desses conselhos familiares, que é 80% do que vocês vão ver em vagas, são no final do dia” — o que torna compatível manter a carreira executiva."]]}, {"t": "src", "h": "Fonte: valores citados em aula; ele apresentou medianas e faixas que variam por porte e setor."}, {"t": "h3", "h": "Perguntas da turma"}, {"t": "table", "head": ["<strong>Pergunta<\/strong>", "<strong>Resposta<\/strong>"], "rows": [["Você aceitaria ser conselheiro da Petrobras?", "“Nem hoje. Nem nunca.” Pela exposição reputacional desproporcional ao honorário."], ["Como conciliar ser executiva e se formar conselheira?", "Não há conflito — a maioria começa ainda como executivo. O limite é dois conselhos, e 80% das vagas familiares têm reunião no fim do dia."], ["Prestar consultoria para a empresa em que sou conselheira compromete a independência?", "“Isso perde a independência. Você é uma conselheira externa, não mais independente. Se todo mundo estiver de acordo, tudo bem — mas às vezes não.” Mentoria é menos grave que consultoria de negócio."], ["Existe demanda por conselheiros mais jovens?", "Existe, e ele deu o caso MPD como prova — mas é exceção. A regra do mercado favorece experiência."], ["O consultor que quer virar conselheiro — como faz?", "Deixar claro o interesse e separar as receitas. Ele mesmo encerrou uma conta de recrutamento para poder assumir a cadeira."], ["Posso acumular conselho de família e conselho de administração na mesma empresa?", "Ele tratou o duplo papel como possível, mas exigindo clareza de mandato e de alçada — e alerta que é onde os conflitos aparecem primeiro."]]}, {"t": "h3", "h": "Como esta sessão fecha o encontro"}, {"t": "cap", "h": "Onde a visão do recrutador confirma e onde corrige as demais sessões"}, {"t": "table", "head": ["<strong>O que André Freire mostrou<\/strong>", "<strong>O que confirma ou corrige<\/strong>"], "rows": [["85% das vagas estão em comunidades, não em headhunters", "Corrige parcialmente Doern, que apontou o LinkedIn como o caminho mais curto. Os dois concordam no essencial: o canal é relacional, não documental."], ["Experiência prévia em conselho vence currículo executivo", "Reforça a recomendação de Doern e de Carlos Júlio de começar por comitês, conselhos consultivos e ONGs."], ["A cadeira de “pessoas” existe no quebra-cabeça", "Confirma, do lado de quem contrata, o que Carlos Sá e Carlos Júlio afirmaram do lado de quem senta."], ["Reputação é o ativo que não se recompõe", "É o mesmo argumento de César Souza no riscômetro reputacional, dito por quem faz a checagem de referências."], ["82% dos conselheiros se sentem despreparados para IA", "Fecha o arco aberto por Carlos Júlio no Dia 1: “ninguém discute transformação digital no conselho porque os 60 e mais não sabem o que é”. Agora com número."], ["Escopo do mandato precisa ser negociado na entrada", "Complementa a matriz de encaixe de César Souza: além de saber se você encaixa, saber o que exatamente foi contratado."]]}], "notes": ["Firmas de busca a quem preciso declarar interesse em conselho — e quando", "O que falta no meu LinkedIn e no meu currículo em termos de experiência de colegiado", "Que evidência eu tenho para ocupar a cadeira de “pessoas” num quebra-cabeça de conselho"], "meta": "11h16  ·  98 minutos  ·  a única sessão dada por quem recruta conselheiros"}, {"num": "3.1", "head": "3.1  O método — as cinco entregas do board", "blocks": [{"t": "cap", "h": "As cinco entregas do board em crise"}, {"t": "table", "head": ["<strong>#<\/strong>", "<strong>Etapa<\/strong>", "<strong>O que fazer<\/strong>", "<strong>Rótulo do enunciado<\/strong>"], "rows": [["1", "<strong>Identificação de riscos<\/strong>", "Delinear os principais riscos e ameaças que a empresa pode enfrentar. Não é preciso criar um plano de contingência para cada risco — depois de delineá-los, trabalhar com o board para identificar os impactos possíveis de cada um.", ""], ["2", "<strong>Mapeamento de recursos<\/strong>", "Levantar os recursos necessários para lidar com as situações de crise.", ""], ["3", "<strong>Plano de recuperação<\/strong>", "Plano de ação para a recuperação das operações, depois de entendido o cenário.", "<strong>JOB TO BE DONE<\/strong>"], ["4", "<strong>Comunicação<\/strong>", "Estabelecer procedimentos de comunicação com funcionários, clientes, fornecedores, imprensa e autoridades.", "<strong>POSICIONAMENTO INTERNO E EXTERNO<\/strong>"], ["5", "<strong>Continuidade<\/strong>", "Desenvolver planos de curto e longo prazo para a continuidade do negócio.", "<strong>FUTURO ALTERNATIVO<\/strong>"]]}, {"t": "src", "h": "Fonte: enunciado da Simulação Board, StartSe — Turma 15."}, {"t": "box", "kind": "atencao", "title": "A INSTRUÇÃO QUE MAIS GENTE IGNORA", "items": [{"h": "“Não é necessário criar um plano de contingência para cada risco que se estabelecer.” O enunciado pede impacto por risco, não solução por risco. Conselhos inexperientes gastam a reunião inteira propondo soluções para riscos que ainda não foram dimensionados — e saem sem ter priorizado nada."}]}, {"t": "box", "kind": "leitura", "title": "O QUE OS TRÊS CASOS TÊM EM COMUM", "items": [{"n": "01", "h": "Nenhum é um evento. Os três são padrões. Volkswagen: sete anos de estratégia sistemática. Uber: 215 queixas em três anos. Parmalat: rede de empresas de fachada escondendo prejuízos “há mais de uma década”. Em nenhum deles o conselho foi surpreendido por um raio — foi surpreendido pelo acúmulo."}, {"n": "02", "h": "Nos três, alguém de dentro sabia. Engenheiros na VW, o RH na Uber, auditores na Parmalat. A informação existia dentro da organização e não chegou à mesa do conselho — ou chegou e não foi tratada."}, {"n": "03", "h": "Nos três, o CEO caiu. Winterkorn renunciou em duas semanas e foi acusado de fraude quatro anos depois; Kalanick foi forçado a renunciar; os executivos da Parmalat foram presos. Mas a queda do CEO nunca encerrou o problema — apenas abriu a fase mais cara."}, {"n": "04", "h": "A conta chegou como número, e o número foi enorme. Mais de US$ 20 bilhões só nos EUA na VW; €4 bilhões inexistentes na Parmalat; US$ 10 milhões em acordos sigilosos na Uber, além do custo reputacional."}, {"n": "05", "h": "Em dois dos três, a falha é de cultura e de pessoas — não de contabilidade. Uber é integralmente um caso de RH, retaliação e canal de denúncia. Volkswagen é um caso de pressão por meta que tornou a fraude tecnicamente racional. Só a Parmalat é primariamente financeira — e ainda assim exigiu conluio humano por uma década."}]}], "notes": [], "meta": "O enunciado da simulação define exatamente o que se espera de um conselho em crise. Vale ler como framework permanente, não como exercício de aula: é a sequência que qualquer conselho percorre quando o chão se abre."}, {"num": "3.2", "head": "3.2  Case 1 — Volkswagen: o Dieselgate", "blocks": [{"t": "stats", "items": [{"n": "11 mi", "l": "veículos afetados"}, {"n": "40×", "l": "acima do limite legal de NOx"}, {"n": "7 anos", "l": "de prática sistemática"}, {"n": "US$ 20 bi+", "l": "em acordos só nos EUA"}]}, {"t": "h3", "h": "O caso"}, {"t": "p", "h": "Em setembro de 2015, a Agência de Proteção Ambiental dos Estados Unidos (EPA) e o Conselho de Recursos do Ar da Califórnia (CARB) revelaram que a Volkswagen havia instalado, de forma deliberada, um software de manipulação nos sistemas de gerenciamento de motor de seus veículos a diesel. Esse programa — o defeat device — identificava quando o carro estava sendo submetido a testes de emissões em laboratório."}, {"t": "p", "h": "Durante os testes oficiais, o dispositivo ajustava automaticamente o funcionamento do motor para reduzir a liberação de poluentes, especialmente óxidos de nitrogênio (NOx), a níveis que atendiam rigorosamente às normas ambientais. Em condições reais de direção, porém, os veículos operavam em outro modo: voltavam a emitir quantidades de poluentes até 40 vezes acima do limite legal estabelecido nos Estados Unidos."}, {"t": "p", "h": "A descoberta começou em 2014, quando pesquisadores da Universidade de West Virginia, em parceria com o Conselho Internacional de Transporte Limpo (ICCT), mediram emissões em estradas e encontraram discrepâncias significativas em relação aos resultados oficiais de laboratório. As evidências foram entregues às autoridades ambientais, que pressionaram a montadora. Após meses de investigação, em setembro de 2015, a própria Volkswagen admitiu ter instalado o software em cerca de 11 milhões de veículos no mundo, entre modelos Volkswagen, Audi e outras marcas do grupo."}, {"t": "box", "kind": "atencao", "title": "O QUE TORNA ESTE CASO UM CASO DE CONSELHO", "items": [{"h": "<strong>A fraude não se limitava a um lote isolado ou a um erro técnico pontual: representava uma estratégia sistemática e global, praticada ao longo de pelo menos sete anos de vendas. <\/strong>Dois anos antes da revelação, em 2013, o próprio governo norte-americano havia endurecido os padrões de emissão de NOx — reconhecendo que seriam difíceis de cumprir. A empresa optou por driblar a regra em vez de renegociá-la ou de revisar a estratégia de produto."}]}, {"t": "h3", "h": "A conta"}, {"t": "ul", "items": ["<strong>Saúde pública, não conformidade ambiental. <\/strong>A Volkswagen expôs milhões de pessoas a níveis excessivos de poluição atmosférica, contribuindo para aumento significativo das emissões de NOx em escala global. Esses gases estão diretamente associados a doenças respiratórias, cardiovasculares e mortes prematuras — o que transformou o caso em uma questão de saúde pública mundial, não apenas de legalidade ambiental.", "<strong>Dano irreversível. <\/strong>As autoridades alertaram que o impacto da fraude não poderia ser revertido, já que os efeitos da poluição se acumulam ao longo do tempo.", "<strong>Contaminação setorial. <\/strong>O episódio colocou em xeque a credibilidade dos processos de homologação de veículos, a integridade da indústria automotiva e os limites da competição empresarial em um cenário de crescente pressão por sustentabilidade e inovação tecnológica."]}, {"t": "h3", "h": "O que foi feito"}, {"t": "cap", "h": "Volkswagen — o desfecho"}, {"t": "table", "head": ["<strong>Frente<\/strong>", "<strong>Ação efetiva<\/strong>"], "rows": [["<strong>Regulatória<\/strong>", "Negociação de planos de retificação com EPA, CARB e Departamento de Justiça, admitindo que a fraude envolveu Volkswagen, Porsche, Audi, SEAT e Škoda."], ["<strong>Liderança<\/strong>", "Em setembro de 2015, o CEO Martin Winterkorn renunciou. Em pronunciamento, aceitou a responsabilidade pelas irregularidades, mas negou envolvimento pessoal. Matthias Müller, então presidente da Porsche, assumiu o grupo e anunciou reorganização."], ["<strong>Criminal<\/strong>", "Em 2019, Winterkorn foi acusado de fraude pela justiça alemã por vender carros sabendo que estavam fora da lei, e também por quebra de confiança, por não informar as autoridades sobre o que sabia. O FBI prendeu um executivo da Volkswagen por conspiração para fraudar os EUA."], ["<strong>Financeira<\/strong>", "Mais de US$ 20 bilhões em acordos legais apenas nos Estados Unidos, segundo estimativa da Forbes."], ["<strong>Consumidor<\/strong>", "Programa de compensação nos EUA: cartão de US$ 500 de crédito livre mais US$ 500 para uso em concessionária, para clientes com motor TDI."]]}, {"t": "src", "h": "Fonte: material de apoio da simulação."}, {"t": "box", "kind": "leitura", "title": "A LEITURA DE GOVERNANÇA", "items": [{"h": "A renúncia com negação de envolvimento pessoal é o padrão nos três casos — e é exatamente o cenário que Carlos Júlio descreveu no Dia 1: “na hora do pega pra capar, cada um quer se livrar do seu problema.” O que decidiu o destino jurídico de Winterkorn, quatro anos depois, não foi ter ordenado a fraude: foi ter sabido e não informado. Para um conselheiro, essa é a lição operacional — o dever de informar sobrevive ao dever de agir."}, {"h": "<strong>A pergunta que faltou na mesa: <\/strong>“Como estamos cumprindo o novo padrão de NOx de 2013, que o próprio regulador admitiu ser difícil?” É uma pergunta de conselho, não de engenharia. Uma meta declarada inatingível e atingida mesmo assim é uma anomalia — a mesma categoria de sinal que a rentabilidade fora da curva da Americanas."}]}, {"t": "h4", "h": "Minha resposta de conselho — Volkswagen"}, {"t": "table", "head": ["<strong>Passo<\/strong>", "<strong>O que o board precisa produzir<\/strong>", "<strong>Minha resposta<\/strong>"], "rows": [["<strong>1. Riscos<\/strong>", "Principais riscos e ameaças que a empresa pode enfrentar, com o impacto de cada um", ""], ["<strong>2. Recursos<\/strong>", "Recursos necessários para lidar com a crise — pessoas, caixa, assessoria, governança", ""], ["<strong>3. Job to be done<\/strong>", "Plano de ação para recuperar as operações", ""], ["<strong>4. Posicionamento<\/strong>", "Comunicação com funcionários, clientes, fornecedores, imprensa e autoridades", ""], ["<strong>5. Futuro alternativo<\/strong>", "Planos de curto e longo prazo para a continuidade do negócio", ""]]}], "notes": [], "meta": "Fraude regulatória sistemática  ·  2008–2015  ·  ~11 milhões de veículos"}, {"num": "3.3", "head": "3.3  Case 2 — Uber: o controverso CEO", "blocks": [{"t": "stats", "items": [{"n": "215", "l": "queixas de assédio sexual"}, {"n": "20", "l": "demissões após a investigação"}, {"n": "3 anos", "l": "de reclamações acumuladas"}, {"n": "US$ 10 mi", "l": "em acordos sigilosos"}]}, {"t": "h3", "h": "O caso"}, {"t": "p", "h": "Em 2017, a cultura interna da Uber, empresa avaliada em cerca de 70 bilhões de dólares, começou a ser exposta publicamente após um relato que ganhou enorme repercussão. A engenheira de software Susan Fowler, ex-funcionária da empresa, publicou um testemunho em seu blog descrevendo episódios de assédio sexual e problemas estruturais de gestão."}, {"t": "p", "h": "No relato, Susan afirmou que, ao denunciar um caso de assédio por parte de um colega ao departamento de Recursos Humanos, foi desencorajada a levar a denúncia adiante. Em vez de proteger a funcionária, o RH a aconselhou a mudar de setor ou permanecer na mesma área, esclarecendo que nada seria feito contra o assediador, considerado um funcionário de alto desempenho dentro da companhia. Esse posicionamento revelou uma lógica em que a performance de determinados profissionais se sobrepunha à integridade e à segurança dos demais colaboradores."}, {"t": "box", "kind": "atencao", "title": "O PONTO EXATO DA FALHA — E ELE É DE RH", "items": [{"h": "<strong>A área de Recursos Humanos não foi omissa por acidente: ela aplicou uma regra. <\/strong>A regra era que desempenho excepcional compra imunidade. Não estava escrita em lugar nenhum, mas foi executada com consistência suficiente para produzir 215 queixas. É o mesmo mecanismo que Leonardo Coelho descreveu na Americanas — “o cara de mau caráter e ótimas entregas” — com a diferença de que aqui o custo apareceu em gente, não em balanço."}]}, {"t": "p", "h": "A publicação viralizou e levou a uma investigação independente para apurar as condições internas da empresa. O relatório analisou 215 queixas de assédio sexual registradas nos três anos anteriores, além de relatos de discriminação, intimidação, práticas de retaliação contra denunciantes e falhas graves nos processos internos de governança e compliance."}, {"t": "p", "h": "As implicações do escândalo foram amplas. As denúncias mostraram que os episódios de assédio não eram casos isolados, mas parte de um padrão recorrente dentro da Uber, sustentado por uma cultura que tolerava abusos, negligenciava a proteção de funcionários e desencorajava denúncias. A repercussão pública associou rapidamente a imagem da Uber não apenas à inovação em mobilidade urbana, mas também a um ambiente corporativo tóxico e hostil, especialmente para mulheres."}, {"t": "p", "h": "O caso extrapolou os limites da empresa e trouxe à tona um debate global sobre assédio sexual e cultura organizacional no setor de tecnologia, evidenciando como empresas de rápido crescimento podiam negligenciar princípios éticos fundamentais. Tornou-se, assim, um símbolo de como o sucesso financeiro e a expansão agressiva podem ocultar falhas profundas no cuidado com as pessoas e na estrutura de governança corporativa."}, {"t": "h3", "h": "O que foi feito"}, {"t": "cap", "h": "Uber — o desfecho"}, {"t": "table", "head": ["<strong>Frente<\/strong>", "<strong>Ação efetiva<\/strong>"], "rows": [["<strong>Investigação<\/strong>", "A Uber abriu investigação interna, acusada de tolerar uma cultura machista e violenta."], ["<strong>Liderança<\/strong>", "O cofundador Travis Kalanick foi forçado a renunciar por encorajar práticas de gestão brutais. Em março, logo após a denúncia, o então presidente Jeff Jones deixou a companhia alegando valores incompatíveis: “As crenças e a abordagem de liderança que guiaram minha carreira são inconsistentes com o que vi e vivenciei na Uber, e eu não posso mais continuar como presidente do negócio.”"], ["<strong>Disciplinar<\/strong>", "20 trabalhadores demitidos após as 215 reclamações de comportamento inadequado e intimidação em todo o mundo. Na Índia, um dos líderes foi demitido após tentar desacreditar o depoimento de uma mulher estuprada por um motorista, em 2014."], ["<strong>Política interna<\/strong>", "Em 2018, a empresa deixou de exigir mediação em casos de agressão ou assédio sexual — mecanismo que antes usava para evitar que o caso fosse a tribunal."], ["<strong>Judicial<\/strong>", "No mesmo ano, um ex-engenheiro apresentou queixa em São Francisco após ter aumento negado por denunciar discriminação e assédio. Ele havia desistido de um acordo confidencial no qual a Uber pagou US$ 10 milhões a vários funcionários para evitar ação legal."]]}, {"t": "src", "h": "Fonte: material de apoio da simulação."}, {"t": "box", "kind": "leitura", "title": "POR QUE ESTE É O SEU CASO", "items": [{"h": "Dos três, este é o único em que a área de gente é, ao mesmo tempo, o mecanismo da falha e o instrumento da correção. Cada elemento da cadeia é um item de agenda de RH: canal de denúncia que não protege, avaliação de desempenho que blinda, retaliação não detectada, acordo sigiloso como política, mediação obrigatória como barreira de acesso à justiça."}, {"h": "<strong>E há um teste replicável: <\/strong>a Uber tinha 215 queixas registradas e nenhuma chegou ao conselho. A Americanas tinha zero denúncias e o conselho leu isso como saúde. Os dois extremos são o mesmo defeito — ninguém no conselho sabia ler o dado do canal de ética. É uma pauta que você pode reivindicar em qualquer mesa amanhã."}]}, {"t": "box", "kind": "leitura", "title": "A CONEXÃO COM A NR-1", "items": [{"h": "Carlos Júlio sinalizou no Dia 1 que os riscos psicossociais entram na pauta dos conselhos brasileiros com sanção financeira material. O caso Uber é a demonstração antecipada do que isso significa na prática: ambiente hostil documentado, retaliação sistêmica e canal de denúncia capturado — agora com moldura regulatória e multa no Brasil."}]}, {"t": "h4", "h": "Minha resposta de conselho — Uber"}, {"t": "table", "head": ["<strong>Passo<\/strong>", "<strong>O que o board precisa produzir<\/strong>", "<strong>Minha resposta<\/strong>"], "rows": [["<strong>1. Riscos<\/strong>", "Principais riscos e ameaças que a empresa pode enfrentar, com o impacto de cada um", ""], ["<strong>2. Recursos<\/strong>", "Recursos necessários para lidar com a crise — pessoas, caixa, assessoria, governança", ""], ["<strong>3. Job to be done<\/strong>", "Plano de ação para recuperar as operações", ""], ["<strong>4. Posicionamento<\/strong>", "Comunicação com funcionários, clientes, fornecedores, imprensa e autoridades", ""], ["<strong>5. Futuro alternativo<\/strong>", "Planos de curto e longo prazo para a continuidade do negócio", ""]]}], "notes": [], "meta": "Falha de cultura, retaliação e canal de denúncia  ·  2014–2018  ·  empresa avaliada em ~US$ 70 bilhões"}, {"num": "3.4", "head": "3.4  Case 3 — Parmalat: o escândalo contábil", "blocks": [{"t": "stats", "items": [{"n": "€4 bi", "l": "em conta que não existia"}, {"n": "~20", "l": "investigados, incluindo auditores"}, {"n": "10+ anos", "l": "de prejuízos escondidos"}, {"n": "1961", "l": "fundação — empresa familiar"}]}, {"t": "h3", "h": "O caso"}, {"t": "p", "h": "A Parmalat foi fundada em 1961, em Parma, na Itália, como uma empresa familiar do setor de laticínios. A partir da década de 1980 viveu um período de crescimento exponencial, transformando-se em uma multinacional de grande porte. No Brasil, iniciou suas operações no começo da década de 1970, justamente no momento em que acelerava seu processo de expansão global."}, {"t": "p", "h": "Entretanto, a partir de 1997 a companhia deixou de registrar lucros, entrando em um ciclo de dificuldades financeiras que culminou em uma grave crise em 2003, reconhecida mundialmente como um dos maiores escândalos corporativos da época. O episódio ganhou repercussão internacional devido às acusações de corrupção e fraudes contábeis que vieram à tona naquele período."}, {"t": "box", "kind": "atencao", "title": "O PONTO CENTRAL DA CRISE", "items": [{"h": "A incapacidade da Parmalat de garantir a liquidez de fundos supostamente aplicados em contas nas Ilhas Cayman, no valor aproximado de cinco milhões de euros. A revelação de que esses recursos não existiam como informado gerou perda imediata de credibilidade do grupo junto a seus acionistas e ao mercado financeiro global."}, {"h": "<strong>Verificação de ordem de grandeza: <\/strong>o texto do caso registra “cinco milhões de euros”; o material de desfecho e o registro histórico apontam quase €4 bilhões referentes a uma conta do Bank of America atribuída à unidade offshore Bonlat. A ordem de grandeza correta é de bilhões, não de milhões — vale corrigir antes de citar em mesa."}]}, {"t": "p", "h": "As investigações revelaram um sofisticado esquema de fraudes documentais, que incluía o controle da correspondência com auditores, a falsificação de recibos bancários e a manipulação de relatórios fiscais. Essas práticas eram usadas para transmitir ao mercado uma falsa sensação de liquidez, confiabilidade e lucratividade, mascarando a real situação financeira da companhia e impactando investidores tanto em nível nacional quanto internacional."}, {"t": "p", "h": "No Brasil, o escândalo também teve desdobramentos judiciais relevantes. Dois dos principais executivos italianos do grupo no país — que chegaram a ocupar cargos de presidente, diretor comercial, administrativo e financeiro, além de responsáveis pela coordenação das operações na América do Sul — foram condenados pela Justiça Federal a três anos e três meses de prisão por crimes contra o sistema financeiro."}, {"t": "p", "h": "Na Europa, juízes avaliaram que a responsabilidade dos executivos era agravada pelo alto nível hierárquico que ocupavam. Em suas declarações, ressaltaram que as funções exigiam conduta ilibada e que a alta remuneração exigida — e o uso desses cargos para a prática de delitos contra o sistema financeiro — tornava a reprovabilidade das condutas ainda mais grave."}, {"t": "h3", "h": "O que foi feito"}, {"t": "cap", "h": "Parmalat — o desfecho"}, {"t": "table", "head": ["<strong>Frente<\/strong>", "<strong>Ação efetiva<\/strong>"], "rows": [["<strong>Estopim<\/strong>", "O escândalo explodiu em 19 de dezembro de 2004, quando a Parmalat afirmou que um documento informando que o Bank of America tinha quase €4 bilhões de sua unidade no exterior, a Bonlat, foi considerado falso."], ["<strong>Método da fraude<\/strong>", "A Promotoria informou que um scanner foi usado na falsificação dos documentos bancários. Os auditores da Grant Thornton usaram esses documentos para certificar o balanço da Bonlat — e negam ter escondido perdas da Parmalat."], ["<strong>Investigação<\/strong>", "Cerca de 20 pessoas, incluindo atuais e antigos executivos da Parmalat e auditores, foram investigadas por fraude, contabilidade falsa e manipulação de mercado."], ["<strong>O que os investigadores encontraram<\/strong>", "Pessoas interrogadas falaram sobre uma complexa rede de companhias de fachada que escondiam prejuízos havia mais de uma década."], ["<strong>No Brasil<\/strong>
