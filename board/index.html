h3", "h": "Liderança na crise — as decisões dos primeiros dias"}, {"t": "ul", "items": ["Separar investigação de operação. “A gente não tem capacidade de fazer investigação, a gente não tem credibilidade. A primeira coisa que eu falo para as 40 mil pessoas: não se preocupem com investigação. A gente vai dar transparência para quem tiver que investigar. A nossa preocupação é cuidar do bloco operacional.”", "Garantir o salário antes de tudo. “O cara não tinha que abrir a loja pensando se ele ia receber o salário dele ou não. Ele ia receber integralmente. A gente garantiu que ia funcionar.”", "Voltar ao básico do negócio. “A gente entendeu rapidamente que o valor estava na loja física.” E corrigiu o sortimento: “eu vendia TV de 65 polegadas para uma empresa que atende 65%, 67% das pessoas do fim da classe D e classe C. Era para ser roubada ou para cair em obsolescência. As duas coisas.”", "Destravar fornecedores e seguradoras de crédito, com o aval de grandes fornecedores para viabilizar a primeira Páscoa — dois meses depois da chegada dele."]}, {"t": "box", "kind": "leitura", "title": "O CONSELHO QUE NÃO RENUNCIOU", "items": [{"h": "<em>“Foi fundamental que eles não pedissem demissão. Talvez fosse o caminho mais fácil: ‘eu não sei o que aconteceu, fui blindsided, vou sair daqui.’ Gente que tinha o seu patrimônio pessoal em risco. Ao ficar, eles deram a chance pra mim.”<\/em>"}, {"h": "E o desenho do conselho que veio depois: “um conselho extremamente técnico que ajuda muito. E aí vem o primeiro ponto que eu acho muito legal quando você monta um conselho: é diverso. Eu tenho o cara da estratégia, tenho a do mercado financeiro, tenho a de auditoria.”"}]}, {"t": "h3", "h": "O dilema fiduciário que ficou em aberto"}, {"t": "p", "h": "Perguntado se haveria ação contra bancos e auditoria, ele expôs o conflito sem resolvê-lo — e é exatamente por isso que serve como exercício de conselho:"}, {"t": "quote", "q": "Essa é uma companhia aberta, no Novo Mercado. A responsabilidade dos administradores, do conselho e de quem está lá é ir atrás de quem for. Vou ser honesto contigo: eu não gostaria de ir. Porque a gente tem cinco, seis bancos no Brasil. Você ir contra esses bancos, numa matéria controversa como essa, vai gerar uma crise de liquidez. Mas, se tiver que ir, a gente vai atrás.", "by": "LEONARDO COELHO"}, {"t": "punch", "h": "O que EU faria nessa mesa — e com que fundamento:"}, {"t": "h3", "h": "Números do caso"}, {"t": "table", "head": ["<strong>Indicador<\/strong>", "<strong>Número<\/strong>"], "rows": [["Início e escalada da fraude", "Ganhou tração a partir de 2011; “completamente fora de controle depois de 2020, 2021”"], ["Núcleo com conhecimento pleno", "8 pessoas — mais 30 a 35 operando, em TI, auditoria e principalmente no financeiro"], ["Denúncias no canal de ética em toda a década", "Nenhuma"], ["Valor contábil da fraude", "~R$ 25 bilhões"], ["Queda das ações no dia seguinte ao fato relevante", "77%"], ["Aquisições no período", "29 empresas em 8 anos"], ["Arquitetura de TI", "5 ERPs sob um mesmo CNPJ"], ["Inflação da receita digital", "1,3 a 1,5 vez, via GMV"], ["Custo da dívida detectado por analista", "Ordem de 200% do CDI"], ["Cronologia final", "27/12 reunião de transição · 02 a 05/01 revelação interna · 11/01 fato relevante · 12/01 bancos executam garantias · 19/01 pedido de recuperação judicial"], ["Pessoas", "De 40 mil para ~30 mil associados; 21 mil em lojas; turnover de +100% para ~35%"], ["Lojas", "1.734 na chegada; ~1.470 hoje; 200 fechadas em quatro anos"], ["Situação atual", "Pedido antecipado de saída da recuperação judicial; empresa adimplente; caixa líquido positivo; despesas de 38% para 27% da receita, com meta abaixo de 20%"]]}, {"t": "src", "h": "Fonte: entrevista com Leonardo Coelho. Valores conforme declarados em aula."}, {"t": "h3", "h": "Referências e conceitos da sessão"}, {"t": "table", "head": ["<strong>Termo<\/strong>", "<strong>Definição de trabalho<\/strong>"], "rows": [["<strong>Management Override of Internal Controls<\/strong>", "Categoria da literatura de auditoria: a alta direção contorna ou captura os próprios controles internos. É o enquadramento técnico do caso."], ["<strong>VPC<\/strong>", "Verba de propaganda cooperada — desconto concedido pelo fornecedor para uma campanha específica. Historicamente mal auditada no varejo brasileiro."], ["<strong>Risco sacado / forfeiting / vendor finance<\/strong>", "Três nomes para a mesma operação. Foram os sinônimos que a conselheira usou para fechar a escapatória de nomenclatura."], ["<strong>GMV<\/strong>", "Volume bruto de mercadoria que passa pela plataforma, incluindo o que é faturado por terceiros. Ambiguidade explorada para inflar receita."], ["<strong>Circularização<\/strong>", "Confirmação de saldos junto a terceiros. Feita com bancos; a proposta dele é estendê-la a fornecedores, para validar VPC."], ["<strong>Teste substantivo × auditoria por extração<\/strong>", "Amostragem manual versus leitura integral dos dados por algoritmo. A recusa da segunda foi o bloqueio decisivo."], ["<strong>Casos comparáveis citados<\/strong>", "Madoff (a espera de um fato novo salvador), Siemens (compliance, 2001), Lehman Brothers. E a analogia da aviação: a porta blindada de cabine adotada após 2001 resolveu um problema e criou outro, evidenciado no caso Germanwings — “melhorou em relação ao anterior, mas descobriu um problema”."], ["", "<strong>VERIFICAÇÃO DE FATO<\/strong><br>Três imprecisões de datas na fala, checadas: as Olimpíadas de Atenas foram em 2004 (ele disse 2000); o colapso do Lehman Brothers foi em setembro de 2008 (ele disse julho); o caso Germanwings foi em 2015 (ele situou em 2007-2008). Nada disso afeta a análise — mas registre, porque são detalhes que se repetem sem checagem."]]}, {"t": "h3", "h": "Como este caso conversa com o resto do Encontro 1"}, {"t": "cap", "h": "Pontes entre o caso Americanas e as demais sessões"}, {"t": "table", "head": ["<strong>O que Leonardo mostrou<\/strong>", "<strong>Onde isso reaparece<\/strong>"], "rows": [["Certificação de governança não impede fraude", "Carlos Sá, no Dia 2: “empresas que têm conselho de administração e comitê de auditoria também estão fortemente fadadas a ter fraudes contábeis. Porque o grande problema está nas pessoas.”"], ["A pergunta repetida por escrito é o que protege o conselheiro", "Doern, no Dia 2: “o único amigo que você tem é a ata”. Rosenthal: “fora da ata, é papo de bêbado.”"], ["Mesmo CEO por 20 anos como erro principal", "Carlos Sá: “qualquer profissional, se ficar muito tempo, perde a capacidade de contribuir.” Carlos Júlio: ciclo ideal de quatro anos."], ["Cultura de comando e controle sem contestação", "Carlos Sá: “aquele conselho onde você tem uma pessoa dominante e oito acompanhando é um péssimo conselho. Tem que ter o desentendimento, para que haja luz.”"], ["Incentivo que silencia em vez de alinhar", "Carlos Júlio: “não estamos pagando bônus com a empresa dando prejuízo.” É a mesma família de problema."]]}], "notes": ["Quais destes sinais eu já vi em alguma organização por onde passei", "A pergunta que eu passaria a fazer todo trimestre, por escrito", "DIA 2  ·  4 DE AGOSTO  ·  “O DIA DO CONSELHO”"], "meta": "18h59  ·  62 minutos  ·  entrevista com o CEO que conduziu a reestruturação"}, {"num": "2.3", "head": "2.3  Raul Rosenthal — “Para que servem os conselhos?”", "blocks": [{"t": "h3", "h": "Ficha do professor"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória<\/strong>"], "rows": [["Formação", "Ph.D. e M.Sc. pela University of Birmingham (Inglaterra); M.Sc. também pela COPPE/UFRJ. Engenheiro de produção."], ["Academia", "Ex-professor da FEA/USP e da Fundação Getulio Vargas–SP."], ["Executivo", "Presidente no Grupo Financeiro Bozano, Simonsen (leasing, financeira, seguradora, cartão de crédito); TVA e DirecTV; American Express na América Latina."], ["Conselhos hoje", "Banco Sofisa; Coimex Empreendimentos; NUMUS (BaaS); Oncoclínicas; FBAH — Federação Brasileira de Administradores Hospitalares."], ["Conselhos anteriores", "Copebrás–Anglo American, Eberle Mundial, JMacedo, SuperBac, Telemig/Telenorte Celular, Parmalat Alimentos, FastShop, Cia. Müller de Bebidas/51, Qualicorp, Sharp do Brasil, Avipal, Elegê, Eldorado Brasil Celulose. No exterior: Canbras/Bell Canadá, TeleTech International, HBO Latin América, DirecTV Latin América."], ["Associações", "Diretor do YPO — Young Presidents’ Organization (2001–2019); vice-presidente do Conselho Diretor da Junior Achievement Brasil; ex-presidente da ABTA. Duas vezes eleito executivo do ano pela revista Exame."]]}, {"t": "h3", "h": "A tese"}, {"t": "p", "h": "Rosenthal não deu uma aula de governança. Deu uma aula de transição de carreira disfarçada de aula de conselho — e foi deliberado. Sua premissa é que a maioria da turma está ali por um desconforto que ainda não sabe nomear."}, {"t": "quote", "q": "Vocês sabem que estão em alguma transição, sabem que estão procurando alguma coisa, mas não sabem o que vocês estão procurando e o porquê vocês estão procurando.", "by": "RAUL ROSENTHAL, AOS 12 MINUTOS"}, {"t": "p", "h": "O arcabouço conceitual vem de Raymond Cattell, na leitura popularizada por Arthur Brooks em From Strength to Strength — fonte creditada no deck. A inteligência fluida, definida no slide como “habilidade de racionalizar, flexibilizar soluções e resolver problemas”, atinge o ápice cerca de vinte anos após a formatura, por volta dos 43 aos 45 anos. A partir daí o valor profissional migra para a inteligência cristalizada: “habilidade de usar o estoque de conhecimento absorvido no passado”. O conselho é a arena natural da segunda."}, {"t": "quote", "q": "Não tentem chegar lá para resolver problema. Tentem usar isso.", "by": "RAUL ROSENTHAL, NO FECHAMENTO"}, {"t": "h3", "h": "Os dois tripés"}, {"t": "cap", "h": "Os dois tripés de Rosenthal"}, {"t": "table", "head": ["<strong>Propósito de vida — 3 pilares<\/strong>", "<strong>Transição de carreira — 3 pilares<\/strong>"], "rows": [["<strong>Formação <\/strong>pessoal e acadêmica", "<strong>Emocional <\/strong>— “primeiro você põe na tua cabeça: eu não quero mais, vou sair”"], ["<strong>Behavior <\/strong>— comportamento: “como é que eu me posto, como é que eu me relaciono? Porque quem gosta do chato? Ninguém.”", "<strong>Profissional <\/strong>— o repertório que sustenta o próximo papel"], ["<strong>Network <\/strong>— mapeado por clusters, não por volume", "<strong>Financeiro <\/strong>— a base sem a qual a coragem vira imprudência"]]}, {"t": "src", "h": "Fonte: deck do palestrante, com base em Raymond Cattell."}, {"t": "p", "h": "A janela de crise, segundo ele, dura em média cinco anos. E há uma ordem: “Quando a gente sai do lugar, primeiro pensar emocionalmente. Depois a gente sai fisicamente.”"}, {"t": "h3", "h": "Frases que ficam"}, {"t": "table", "head": ["<strong>Tema<\/strong>", "<strong>Fala literal<\/strong>"], "rows": [["Sobre o declínio", "<em>“O mundo não está perdido porque a minha produtividade está caindo e tem um cara de 35 anos fazendo graça lá no trabalho e namorando.”<\/em>"], ["A metáfora-título", "<em>“O trapezista, quando ele quer chegar do lado de lá, balança, balança, aí numa fração de segundo ele solta a mão desse trapézio, pega o outro trapézio. Só que, se ele não soltar esse trapézio, o que acontece? Ele retorna.”<\/em>"], ["O custo da coragem", "<em>“O fato de soltar e agarrar lá não significa que você vai chegar lá em cima. Você pode ficar balançando o resto do dia ali no meio, mas o processo tem que ser estruturado e ocorrer.”<\/em>"], ["Conhecimento × sabedoria", "<em>“Conhecimento é saber que o tomate é uma fruta. Sabedoria é saber que não se coloca tomate em salada de fruta.”<\/em>  (deck — sob o título ESTRATÉGICO × TÁTICO)"], ["A tradução de carreira", "<em>“Eu não vou ficar mais brigando se o tomate é uma fruta ou não é uma fruta. Eu vou brigar para ele não colocar na salada de frutas.”<\/em>"], ["Sobre dizer não", "<em>“Das coisas mais difíceis que tem é a gente dizer não. Mas dizer não consciente é muito importante.”<\/em>"], ["Sobre o melhor emprego", "<em>“Eu digo que é o melhor emprego que eu tive na vida. Sabe por quê? Eu aprendi o resto da vida o que eu não queria fazer.”<\/em>"], ["Sobre generalismo", "<em>“Ninguém sabe tudo de tudo. Só tem um que nada, anda e voa: é o pato. Ele não faz nada direito. A beleza do conselho é a diversidade das pessoas — é isso que vai somar.”<\/em>"], ["Sobre postura", "<em>“As posturas mudam também. Eu não dou mais ordem: eu recomendo, eu aconselho baseado na minha experiência.”<\/em>"], ["Sobre colegiado", "<em>“Se tiverem sete e você votar em três e os outros votarem em quatro, sua ideia não foi acatada — resultado final, sem problema nenhum.”<\/em>"], ["Sobre gente", "<em>“Capital humano: o mundo só anda com gente, não existe outra alternativa. Quanto melhor o time, melhor é o negócio.”<\/em>"], ["O trem", "<em>“O trem só anda na velocidade do vagão mais lento. Se tem alguém emperrando, troca.”<\/em>"], ["Sobre experiência", "<em>“Ele falou: ‘ah, eu tenho 15 anos de experiência’. E eu pensei comigo: ele tem um ano de experiência e 14 de repetição.”<\/em>"], ["Sobre avaliar gente", "<em>“‘Como é o fulano ou a fulana?’ ‘Ah, bonzinho.’ Quando diz bonzinho, não diz nada. É porque não tem nenhuma outra qualificação.”<\/em>"], ["Sobre reclamar", "<em>“Eu vou passar a vida inteira reclamando e vou reclamar dos outros, porque 99% das vezes a gente reclama dos outros e não analisa a gente.”<\/em>"], ["Sobre sonhar", "<em>“A minha sugestão é que vocês voltem a sonhar — o que eu quero — porque este processo mental é que vai construir.”<\/em>"], ["Sobre planejamento", "<em>“Qual é a probabilidade desse encontro no sábado não dar certo? É zero. Por quê? Porque você fez um planejamento estratégico de todos os detalhes do que ia acontecer no sábado.”<\/em>"], ["Sobre direção (Alice)", "<em>“‘Para onde você quer ir?’ ‘Para qualquer lugar.’ ‘Você quer ir para qualquer lugar? Qualquer caminho te leva lá.’ E some.”<\/em>"], ["Sobre humildade técnica", "<em>“Eu não tenho um conhecimento profundo em tecnologia, não tenho. Então eu tento compensar: vou a cursos, vou ler livros, para poder dialogar.”<\/em>"]]}, {"t": "h3", "h": "Pontos de atenção"}, {"t": "box", "kind": "atencao", "title": "DEVER FIDUCIÁRIO — A MESMA RESPONSABILIDADE DE UM ESTATUTÁRIO", "items": [{"h": "CVM, Ministério Público, CGU, esfera trabalhista e outras. Ele contou um caso próprio: presidente de conselho, uma transação relevante com o executivo-chefe que era também o maior acionista, e um demandante que não possuía uma única ação."}, {"h": "<em>“Foi parar na CVM, do Ministério Público. Deus do céu! Isso levou três anos para a gente resolver. Quando entra no Ministério Público, o processo pode ser criminal. Aí é uma guerra.”<\/em>"}]}, {"t": "box", "kind": "atencao", "title": "A RESPONSABILIDADE NÃO PRESCREVE NA PRÁTICA", "items": [{"h": "<em>“Eu fui do conselho de uma empresa; 20 anos depois eu tenho um bloqueio na minha conta. Bloqueio trabalhista.”<\/em>"}, {"h": "E a arbitrariedade do juízo, narrada com humor amargo — o juiz precisava arrecadar 100 unidades e havia arrecadado 250:"}, {"h": "<em>“Sabe por que eu vou devolver o dele? Porque normalmente eu começo por ordem alfabética: A, B, C. Dessa vez eu vou começar de Z para cima. É absolutamente arbitrário — ele tem o poder de decisão.”<\/em>"}, {"h": "Ele detalhou ainda o mecanismo da penhora eletrônica: aviso ao Banco Central após o expediente bancário, execução durante a noite, sobre o CPF."}]}, {"t": "box", "kind": "atencao", "title": "DUE DILIGENCE ANTES DO SIM — A REGRA DE OURO DA SESSÃO", "items": [{"h": "<em>“Não tenham vergonha de pedir toda a informação possível. Porque se ele não estiver disposto a dar, não é o tipo de empresa que eu quero trabalhar.”<\/em>"}, {"h": "<strong><em>“É melhor ficar amarelo hoje do que vermelho amanhã.”<\/em><\/strong>"}, {"h": "<em>“Vocês fazem isso quando compram um carro, quando compram um apartamento. O que é que não vão fazer aqui, com a vida de vocês?”<\/em>"}]}, {"t": "h4", "h": "Demais alertas da sessão"}, {"t": "ul", "items": ["<strong>Conselho consultivo não é escudo. <\/strong>“As pessoas falam ‘ah, é consultivo, não é conselho de administração formal’. Nem sempre. Se houver algum problema, as atas vão pegar tudo e você pode ser arrolado em processo.”", "<strong>Empresa fechada com debênture emitida assume compromissos de companhia aberta <\/strong>perante a CVM. “O fato de ela ser de um dono não a exime dos compromissos legais junto à CVM.”", "<strong>Golden share e controlador absoluto. <\/strong>“É charmoso ser conselheiro de determinadas empresas. Muito. [Mas] você jamais vai ganhar uma votação que não seja a favor do outro grupo.” O charme é a armadilha.", "<strong>Startups e advisory boards. <\/strong>Normalmente sem remuneração em dinheiro, com equity. “Os riscos aqui são pequenos, mas quem pôs dinheiro lá, dependendo da forma que pôs, pode vir para cima. Cuidado.” Ele cita ainda mecanismos de garantia — seguro D&amp;O entre eles.", "<strong>A ata, de novo. <\/strong>“Não saiam de uma reunião de conselho sem terem aprovado a ata. Guarda meia hora no fim da reunião, põe a ata na tela, todo mundo olha. Porque se vocês quiserem documentar algum desconforto, é a hora. Fora disso, é papo de bêbado.” Ele relatou ter se abstido de um voto naquela mesma manhã, com a justificativa registrada: “Todos os outros seis votaram a favor. Não tem problema, não tenho vergonha.”", "<strong>Não troque a causa da mudança. <\/strong>“Vem com os filhos, separa da mulher, nem sempre muda de trabalho, e aí fica no pior dos mundos, sem nada. Só não troquem o motivo dessa causa — porque se trocarem, vão entrar por um motivo errado e não vai ter solução.”", "<strong>Sucessão é obrigação do conselho. <\/strong>“Você nunca sabe: pode ter um infortúnio, um acidente, e não poder voltar amanhã.”", "<strong>Obsolescência estratégica. <\/strong>Kodak como caso-símbolo. E a virada geracional: “A nova geração não é de posse, é uma geração de acesso. Um dos grandes problemas hoje na Califórnia é o número de jovens que completam a idade adequada e não tiram licença para guiar.”"]}, {"t": "h3", "h": "Cibersegurança — a materialidade é setorial"}, {"t": "p", "h": "O framework apresentado no deck (fonte: MIT Sloan) tem cinco etapas. Mas a pergunta que ele devolveu à sala foi outra: qual é a função do conselho e quanto investir?"}, {"t": "cap", "h": "Framework de cibersegurança"}, {"t": "table", "head": ["<strong>Etapa<\/strong>", "<strong>Foco<\/strong>"], "rows": [["Identificação", "Ativos — o que precisa ser protegido"], ["Proteção", "Camadas"], ["Detecção", "Invasão"], ["Reação", "Plano"], ["Recuperação", "Business recovery"]]}, {"t": "src", "h": "Fonte: MIT Sloan, conforme deck do palestrante."}, {"t": "ul", "items": ["<strong>Banco: <\/strong>“Uma corrida em banco acaba qualquer banco em 24 horas.” Tentativas de invasão “ocorrem a dezenas de milhares ao dia”, e um teste de invasão pode ser “10 centavos, para testar”.", "<strong>Fábrica de bicicleta: <\/strong>“Esse tema não é tão relevante, porque o risco e as consequências são muito baixas.”", "<strong>O limite honesto: <\/strong>“Não existe dinheiro suficiente que te garanta 100% que não ocorrerá. Você pode fazer o que quiser; vagabundo e bandido sempre encontram uma tentativa de caminho.”"]}, {"t": "h3", "h": "ESG — a leitura mais cética do dia"}, {"t": "p", "h": "Rosenthal tratou ESG como variável de indústria, não como valor universal. Para uma fábrica de celulose, crucial — ele lembrou que há 15 ou 20 anos o odor da celulose chegava a São Paulo quando o vento soprava. Para um banco, muito menos. A motivação pode ser convicção, pressão regulatória ou pressão de investidor — e em tempos de crise, condições econômicas e inovação passam à frente."}, {"t": "table", "head": ["<strong>Pesquisa BCG citada em aula<\/strong><br>32% dos conselheiros não veem nenhum impacto financeiro em ESG e outros ~36% veem impacto marginal — cerca de 68% sem convicção econômica sobre o tema."], "rows": []}, {"t": "h3", "h": "Referências da sessão"}, {"t": "table", "head": ["<strong>Referência<\/strong>", "<strong>Detalhe<\/strong>", "<strong>Onde apareceu<\/strong>"], "rows": [["<strong><em>From Strength to Strength<\/em><\/strong>", "Arthur C. Brooks. Fonte da curva de produtividade e do pico aos ~43 anos.", "Creditado no deck (dois slides)"], ["<strong>Raymond Cattell<\/strong>", "Inteligência fluida × inteligência cristalizada.", "Creditado no rodapé de cinco slides"], ["<strong><em>Sonhar Acordado<\/em><\/strong>", "Fonte creditada no deck para a Teoria do Trapézio. Obra do próprio Rosenthal.", "Deck e fala"], ["<strong><em>Genesis<\/em><\/strong>", "Recomendado para entender IA. Ver verificação abaixo.", "Fala, aos 61 minutos"], ["<strong>BDO<\/strong>", "Top 3 temas estratégicos de conselho em 2023: Inovação, Capital Humano, Transparência. Top 3 riscos: Volatilidade Econômica, Geopolítica, Capital Humano.", "Deck"], ["<strong>MIT Sloan<\/strong>", "Framework de cibersegurança em cinco etapas.", "Deck"], ["<strong>Boston Consulting Group<\/strong>", "Pesquisa sobre percepção de impacto financeiro do ESG entre conselheiros.", "Deck e fala"], ["<strong>Talmud<\/strong>", "“Quando se faz o bem, Deus não anota o valor, anota o resultado.”", "Slide isolado, entre os blocos"], ["<strong><em>Alice no País das Maravilhas<\/em><\/strong>", "Lewis Carroll — o diálogo com o Gato de Cheshire. Autor não citado em aula.", "Fala, no fechamento"], ["", "<strong>VERIFICAÇÃO — AUTORIA DE GENESIS<\/strong><br>Rosenthal descreveu o livro como escrito por “um dos caras que fundou o Google, o número 2 da Microsoft na época do Bill Gates, e com todo o apoio do Henry Kissinger”.<br><strong>A autoria correta é Henry Kissinger, Eric Schmidt e Craig Mundie (2024). <\/strong>Schmidt foi CEO e depois chairman do Google, não fundador; Mundie foi Chief Research &amp; Strategy Officer da Microsoft, não “número 2”. O conteúdo da recomendação permanece válido — a atribuição, não."]]}, {"t": "h3", "h": "Casos e bastidores citados"}, {"t": "ul", "items": ["<strong>Parmalat — <\/strong>“Fomos nós que fizemos a primeira recuperação judicial no Brasil, que é o caso Parmalat. Nós fomos mandatados pelo governo italiano; foi uma delícia, foi um espetáculo.”", "<strong>Eldorado Celulose — <\/strong>“A briga dos irmãos Batista com o indonésio, que era o outro sócio; eu representava os outros sócios, não os irmãos Batista.”", "<strong>Petrobras — <\/strong>usada como exemplo de controlador com golden share e de risco reputacional apesar do prestígio do assento.", "<strong>Kodak — <\/strong>o caso da ruptura não enxergada.", "<strong>A palestra vazia no Rio — <\/strong>auditório de 4.400 lugares com uma pessoa na plateia, que era o próximo palestrante. “Hoje em dia eu fecho as portas, ninguém sai — pelo menos eu tenho um público cativo.”"]}], "notes": ["O que mais me atingiu", "O que eu faria diferente do que ele propôs", "Perguntas que quero fazer a ele"], "meta": "09h08  ·  78 minutos  ·  abertura do segundo dia"}, {"num": "2.4", "head": "2.4  Richard Doern — “Quais as principais regulamentações dos Conselhos?”", "blocks": [{"t": "h3", "h": "Ficha do professor"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória<\/strong>"], "rows": [["Formação", "Engenheiro de produção, com pós-graduações em marketing, controladoria e GRC (Governança, Riscos e Compliance)."], ["Experiência", "38 anos liderando processos de transformação organizacional em mais de 75 empresas, no Brasil e no exterior."], ["Turnaround", "Especialista em reestruturação; um dos precursores no país a atuar como interim CEO nas fases críticas de recuperação."], ["Conselhos", "21 anos como membro de Conselhos de Administração em 25 empresas — atualmente em 3, tendo presidido 10 (PCA). Coordenador e membro de comitês de ESG, Estratégia, Auditoria, Governança, Pessoas e Inovação."], ["Certificação", "Conselheiro de Administração e membro de Comitê de Auditoria certificados na categoria Plus pelo IBGC."], ["Docência", "Instrutor de cursos de governança corporativa e formação de conselheiros há 17 anos."]]}, {"t": "h3", "h": "A tese"}, {"t": "p", "h": "Doern fez a aula mais desconfortável do dia — e sabia disso. Depois de 25 anos em turnaround, chegou à governança por um número."}, {"t": "quote", "q": "De cada 10 empresas que me procuravam para fazer esse trabalho, 9 já não tinham mais chance de recuperação. Nove já tinham passado do que a gente chamou de turnaround point.", "by": "RICHARD DOERN"}, {"t": "p", "h": "Ele foi aos Estados Unidos atrás do antídoto — a Turnaround Management Association, que na época tinha 40 mil associados — e voltou com uma resposta de três palavras."}, {"t": "quote", "q": "E qual é o antídoto para isso? Aí eu ouvi três coisas: governança, governança e governança.", "by": "RICHARD DOERN"}, {"t": "p", "h": "Depois vieram treze países em visitas técnicas — Alemanha, Hong Kong, Singapura, Israel, entre outros. Na Alemanha, seis empresas familiares; a mais nova com 146 anos e 620 herdeiros. Em Hong Kong, uma família com 144 anos. A resposta foi uniforme: “Nós só estamos aqui hoje, uma família unida, por conta da governança corporativa e familiar.”"}, {"t": "h3", "h": "O choque de realidade sobre o mercado"}, {"t": "p", "h": "O segundo movimento da aula foi quebrar a expectativa da turma sobre onde estão as vagas. E ele não poupou a ironia:"}, {"t": "quote", "q": "E aí vocês vão dizer para mim o seguinte: “pô, Richard, agora que eu paguei o curso, você vem falar isso na primeira aula?” Pois é, essa é a realidade.", "by": "RICHARD DOERN"}, {"t": "stats", "items": [{"n": "~280", "l": "companhias com ações negociadas"}, {"n": "~560", "l": "assentos em todo o mercado"}, {"n": "~30 mil", "l": "empresas fechadas &gt; R$ 100 mi"}, {"n": "1,5", "l": "independentes por empresa fechada"}]}, {"t": "cap", "h": "Onde estão, de fato, as oportunidades de conselho no Brasil"}, {"t": "table", "head": ["", "<strong>Capital aberto<\/strong>", "<strong>Capital fechado<\/strong>"], "rows": [["<strong>Universo<\/strong>", "~400 companhias abertas, mas apenas ~280 com ações efetivamente negociadas em pregão", "~30 mil empresas com faturamento acima de R$ 100 milhões/ano"], ["<strong>Controle<\/strong>", "Disperso ou controlador definido", "90% de controle familiar"], ["<strong>Assentos<\/strong>", "~560 assentos no total", "Média de 1,5 conselheiro independente por empresa"], ["<strong>Acesso<\/strong>", "Restrito e relacional — “muito, muito relacionamento com acionistas dessas empresas”", "Principal mercado de oportunidade, sobretudo em conselhos consultivos em formação"], ["<strong>Distribuição B3<\/strong>", "Nível 1: 23 · Nível 2: 20 · Novo Mercado: 185 · o restante sem nível algum", "—"]]}, {"t": "src", "h": "Fonte: aula de Richard Doern, com base em pesquisa de mercado citada em sala."}, {"t": "p", "h": "A comparação internacional foi usada para mostrar o quanto o Brasil é um mercado raso: a Austrália, com 25% da população brasileira, tem 3.300 companhias abertas — onze vezes mais. Israel, do tamanho de Sergipe, tem 600. E na Austrália, empresa de capital fechado que fatura acima de 100 milhões de dólares australianos é obrigada a divulgar balanço auditado e a ter conselho."}, {"t": "box", "kind": "atencao", "title": "A CONSEQUÊNCIA PRÁTICA PARA A SUA CARREIRA", "items": [{"h": "Se o mercado real é o capital fechado familiar, governança familiar deixa de ser diferencial e vira pré-requisito. Doern foi explícito sobre como isso é testado:"}, {"h": "<em>“Se o headhunter chamar vocês para participar de uma entrevista de um conselho de empresa familiar, na segunda, terceira pergunta ele já vai saber se você é do ramo e conhece o assunto ou não.”<\/em>"}]}, {"t": "h3", "h": "O ambiente regulatório em três camadas"}, {"t": "p", "h": "A espinha dorsal do deck. Vale memorizar a lógica: o que obriga, o que se contrata e o que se recomenda."}, {"t": "cap", "h": "As três camadas do ambiente regulatório brasileiro"}, {"t": "table", "head": ["<strong>Camada<\/strong>", "<strong>Natureza da adesão<\/strong>", "<strong>O que inclui<\/strong>"], "rows": [["<strong>Hard Law<\/strong>", "<strong>Legislação — adesão obrigatória<\/strong>", "Código Civil · Lei das S.A. (Lei 6.404/76) · CVM · Sarbanes-Oxley"], ["<strong>Autorregulação<\/strong>", "<strong>Adesão voluntária com vínculo contratual<\/strong>", "Novo Mercado da B3 · Código ABRASCA · Fundos de Investimento (Resolução CVM 175)"], ["<strong>Soft Law<\/strong>", "<strong>Adesão voluntária<\/strong>", "Código das Melhores Práticas de Governança Corporativa do IBGC · OECD Principles of Corporate Governance"]]}, {"t": "src", "h": "Fonte: deck de Richard Doern."}, {"t": "p", "h": "Sobre o Código do IBGC, na 6ª edição, ele foi categórico: “Essa é a bíblia, bíblia do conselheiro.” O capítulo 3 é o do conselho de administração. Download gratuito em ibgc.org.br, na seção de publicações. Os cinco princípios: integridade, transparência, equidade, responsabilização e sustentabilidade."}, {"t": "h3", "h": "Frases que ficam"}, {"t": "table", "head": ["<strong>Tema<\/strong>", "<strong>Fala literal<\/strong>"], "rows": [["A imagem do turnaround", "<em>“Eu brincava com a minha equipe que era pegar a empresa e tirar da UTI e colocar no corredor. Do corredor pra frente já não era mais problema meu. Meu negócio era tirar o paciente da UTI.”<\/em>"], ["O diagnóstico da negação", "<em>“Sempre o problema está fora da empresa. Então é agora, é as eleições, a Copa do Mundo; ano que vem é crise geopolítica, Estreito de Ormuz, preço do petróleo, e assim vai.”<\/em>"], ["O otimismo estrutural", "<em>“O empresário é um cara muito otimista, sempre acha que amanhã tudo vai dar certo, tudo vai mudar.”<\/em>"], ["A função do conselho", "<em>“Um conselho está lá para proteger e valorizar a organização. Quando você tem conselheiros diligentes, a empresa não chega nessa situação.”<\/em>"], ["A lacuna de formação", "<em>“Nenhum de nós que estudou administração, economia, ciências contábeis, direito, teve isso na graduação. Nem quem fez pós-graduação — eu fiz três, não escutei governança nessas instituições de ensino.”<\/em>"], ["Sobre decidir", "<em>“Em um conselho não tem preto e branco. São 50 tons de cinza. Se tivesse preto e branco, a inteligência artificial tomava as decisões pela gente. O problema é que são 50 opções alternativas, cada uma com riscos e oportunidades.”<\/em>"], ["A regra de ouro", "<strong><em>“O único amigo que você tem é a ata. Único. E aí é bom que você tenha ela guardada em casa.”<\/em><\/strong>"], ["Sobre lealdade", "<em>“O administrador deve agir com diligência e lealdade, sob pena de responder pelos seus prejuízos. Não ao acionista que te colocou lá. Ao negócio.”<\/em>"], ["Sobre o consultivo", "<em>“Um conselho consultivo não toma decisões, não pode tomar. Não pode ter uma ata de reunião do conselho consultivo dizendo ‘o conselho deliberou’. Não pode. Está errado.”<\/em>"], ["Sobre o juiz", "<em>“Se houver isso, você está falando de um conselho de administração travestido de consultivo. E aí isso vai ser problema. O juiz não quer nem saber, pessoal.”<\/em>"], ["A hora da crise", "<em>“Na hora do pega pra capar, cada um quer se livrar do seu problema. Não quero assustar vocês, não é esse o objetivo, mas vocês têm que saber que isso existe.”<\/em>"], ["Sobre acumulação de cargos", "<em>“Então o fundador fala assim: ‘não, espera um pouco. Eu sou o fundador da empresa, eu sou o presidente do conselho, eu sou o CEO, eu sou Deus’.”<\/em>"], ["A dica que ele classificou como a mais importante", "<strong><em>“O caminho mais próximo para um conselho é o LinkedIn. Ninguém mais vai pedir para você currículo. Não vai. Os últimos seis convites que eu recebi foram via LinkedIn.”<\/em><\/strong>"], ["O erro de perfil", "<em>“Vai ter gente aqui que vai dizer: ‘ah, eu acho bobeira isso, o meu LinkedIn tá atualizado, só a minha foto é de 1965’. Pessoal, cuida. Hoje as empresas de headhunting têm robôs que entram no LinkedIn e vasculham tudo.”<\/em>"], ["O erro de posicionamento", "<em>“O que não podem colocar debaixo do nome ali: CEO, C-Level, Diretor Estatutário, Coach, Mentor, Pai de Santo, etc. Aí vai confundir o algoritmo.”<\/em>"], ["A escolha do jogo", "<em>“Conselho é uma coisa, consultoria é outra, advisor é outra, executivo é outra. Então você tem que saber o que você quer. Não dá pra jogar um jogo em que você joga no gol, é bom na defesa também, mas se precisar no meio do campo… Não dá. Isso o LinkedIn não entende.”<\/em>"], ["Sobre o preço pessoal", "<em>“Cada mês, mês e meio chegava uma caixa em casa. Ministério Público do Trabalho, o Ministério disso, o Ministério daquilo. Era chato, incomoda. Como a gente gosta de dormir bem à noite, você tem que pensar se vale a pena essas coisas.”<\/em>"], ["Ao fim da carga regulatória", "<em>“Estou vendo que todo mundo ficou meio desanimado. Vocês pensaram que era moleza?”<\/em>"]]}, {"t": "h3", "h": "Pontos de atenção"}, {"t": "box", "kind": "atencao", "title": "RESPONSABILIDADE PATRIMONIAL: ADMINISTRAÇÃO × CONSULTIVO", "items": [{"h": "Conselho de administração responde com bens próprios por fraude ou decisão errada — “você é um diretor como se fosse um diretor estatutário da empresa; mesma coisa”. Conselho consultivo, não."}, {"h": "<em>“Eu tenho muitos amigos que dizem: ‘você pode me indicar para o conselho que você quiser, desde que seja consultivo. Eu não vou agora, com 30, 35 anos de ter juntado todo um patrimônio, colocar tudo isso a risco.’”<\/em>"}]}, {"t": "box", "kind": "atencao", "title": "“NÃO SABIA” NÃO É DEFESA", "items": [{"h": "O caminho correto, segundo ele, é registrar o desconforto e pedir apoio técnico ANTES da decisão — chamar o diretor jurídico, contratar o escritório de advocacia."}, {"h": "<em>“Depois não vai falar para o juiz: ‘não, eu não sabia, eu não sou advogado, o professor falou para ler, mas eu não tive condições, não deu tempo’. Então, não tem isso.”<\/em>"}]}, {"t": "box", "kind": "atencao", "title": "DECISÕES SERÃO JULGADAS ANOS DEPOIS, COM O CRITÉRIO DE ENTÃO", "items": [{"h": "<em>“Muitas vezes você sai de um conselho e só depois de dois anos vão falar: ‘puxa, lembra daquela decisão? Que absurdo! Quem tomou essa decisão aqui?’ É, tinha um conselheiro aqui, um tal de Richard.”<\/em>"}, {"h": "A analogia do alpinista: “Era a melhor roupa que tinha no começo dos anos 1920. Hoje ninguém sobe o Everest com aquela roupa. Mas naquela época… e isso acontece muito nos conselhos.”"}]}, {"t": "h4", "h": "Demais alertas da sessão"}, {"t": "ul", "items": ["<strong>Todo conselheiro precisa conhecer as regras. <\/strong>“Você vai falar para os 11 jogadores de futebol: ‘olha, o pessoal da defesa não precisa entender de regras, só o pessoal do ataque’? Todo mundo tem que saber se pode botar a mão na bola.”", "<strong>Quem aciona primeiro é o minoritário. <\/strong>“É aquele acionista que não tem direito a estar no conselho, está longe da empresa, fica sabendo que tem um monte de rolo acontecendo lá, está sendo expropriado.” Depois vêm os advogados atrás dos conselheiros — “e vão mesmo”.", "<strong>Overboarding é risco real. <\/strong>“Imagina o cara que é conselheiro da Petrobras, conselheiro da Vale, conselheiro do Banco do Brasil e da Eletrobras. O cara está em quatro conselhos.” O limite que ele mesmo pratica: 3 a 4, conforme o porte.", "<strong>Puxe a capivara — da empresa e de quem já está no conselho. <\/strong>Passivo trabalhista “mais cedo ou mais tarde vai cair no seu colo”. E a pergunta que ele devolveu a um aluno: “Você faria parte do conselho de que fulano faz parte? Depende.”", "<strong>Setores hiper-regulados exigem preparo desproporcional. <\/strong>“Bancos: não é brincadeira a quantidade de detalhes que um conselheiro tem que conhecer. Ainda mais se você for participar do comitê de auditoria ou do conselho fiscal de um banco.”", "<strong>Empresa listada sem nível de governança é armadilha. <\/strong>O exemplo da Metisa, com a avó detendo 48% das ações e o conselho formado por ela, dois sobrinhos e o primo: “Você investiria? Provavelmente não. Porque é um conselho péssimo, que não tem independência.”"]}, {"t": "h3", "h": "A agenda de aperto da B3 que fracassou"}, {"t": "p", "h": "Em 2025, a B3 propôs 25 mudanças para elevar o padrão de governança das listadas. Doern participou da votação por dentro. Nenhuma foi aprovada pela maioria das empresas, sob alegação de aumento de custo e burocracia."}, {"t": "cap", "h": "As propostas da B3 e seu destino"}, {"t": "table", "head": ["<strong>Proposta<\/strong>", "<strong>O que previa<\/strong>", "<strong>Status<\/strong>"], "rows": [["Overboarding", "Limite de 4 conselhos simultâneos por conselheiro", "<strong>Rejeitada<\/strong>"], ["Prazo × independência", "Após 10 anos (flexibilizado para 12) o conselheiro deixa de ser considerado independente", "<strong>Rejeitada<\/strong>"], ["Mínimo de independentes", "Elevar de 20% para 30% do conselho", "<strong>Rejeitada<\/strong>"], ["COAUD estatutário", "Tornar o comitê de auditoria órgão estatutário", "<strong>Rejeitada<\/strong>"], ["", "<strong>O BASTIDOR QUE EXPLICA O RESULTADO<\/strong><br><em>“O presidente do conselho me falou: ‘ó, Richard, você que é o nosso especialista em governança, já vou avisar pra você: aqui ninguém vai querer aprovar nenhum desses assuntos. Então a gente não vai nem botar em pauta.’”<\/em><br>E o conselheiro que ele descreveu como “cara de pau”: “Olha, nos outros dois conselhos que eu estou, eu votei contra; agora aqui, se eu botar a favor vai ficar chato, então vou botar contra também.”<br>No conselho dele, 23 das 25 propostas foram aprovadas internamente — e ainda assim voltaram derrotadas da plenária do mercado."]]}, {"t": "h3", "h": "Números para guardar"}, {"t": "table", "head": ["<strong>Indicador<\/strong>", "<strong>Número<\/strong>", "<strong>Observação<\/strong>"], "rows": [["Companhias com ações negociadas", "~280", "De cerca de 400 registradas"], ["Assentos de conselheiro em capital aberto", "~560", "Todo o mercado brasileiro"], ["Empresas fechadas acima de R$ 100 mi/ano", "~30.000", "90% de controle familiar"], ["Conselheiros independentes por empresa fechada", "1,5", "Média, segundo pesquisa de uma Big Four"], ["Exigência do Novo Mercado", "2 ou 20%", "Mínimo de independentes — o que for maior"], ["Mandato legal máximo (art. 139)", "3 anos", "Mas 92% das S.A. abertas praticam 2 anos; a OCDE recomenda 2"], ["Remuneração do conselheiro fiscal", "≥ 10%", "Da média da remuneração dos diretores estatutários — é o piso legal"], ["Conselho de administração", "≥ 3 membros", "Art. 138; recomendação de melhor prática: 5 a 11"], ["Formulário de Referência", "400 a 800 págs.", "Entrega até o último dia útil do 6º mês após o exercício — 30 de junho"], ["Aderência ao “Pratique ou Explique”", "68%", "Era 54% na primeira medição; 56 recomendações no total"], ["Companhias abertas sem nenhuma mulher na administração", "10%", "Das ~280"], ["Conselhos que se avaliam", "85% / 75%", "Modus operandi do órgão / avaliação individual"]]}, {"t": "src", "h": "Fonte: aula de Richard Doern e deck do palestrante."}, {"t": "h3", "h": "Perguntas da turma — as que valem reler"}, {"t": "table", "head": ["<strong>Pergunta<\/strong>", "<strong>Resposta de Doern<\/strong>"], "rows": [["<strong>Se a S.A. fechada opta por instalar conselho, precisa seguir todos os requisitos da lei?<\/strong>", "Sim, sem flexibilidade. “Se você instalar o conselho de administração, tem que seguir. Todos os outros preceitos não têm flexibilidade — a coisa é para valer.” Nas Ltdas., quase ninguém instala; essas começam pelo conselho consultivo, como test drive e sounding board."], ["<strong>Num conselho consultivo, a ata protege ou incrimina?<\/strong>", "“Excelente pergunta.” O consultivo aconselha, não delibera — e não pode haver ata registrando deliberação, sob pena de ser tratado como conselho de administração disfarçado. A cadeia de risco: o minoritário aciona, os advogados vão atrás dos conselheiros, e na crise CEO e conselho se acusam mutuamente."], ["<strong>E o conselho de um clube de futebol?<\/strong>", "Não é conselho de administração, é conselho deliberativo — e deliberar é tomar decisões. O problema de escala é estrutural: a melhor prática é de 5 a 11 membros e um clube tem centenas. “Você imagina tomar decisões lá.”"], ["<strong>A listagem de administradores inclui toda a diretoria?<\/strong>", "“Só os estatutários. Porque têm a obrigação fiduciária.” O estatuto social é “a certidão de nascimento” da empresa e define quais cargos são estatutários."], ["<strong>Para quem está começando, o caminho é o conselho consultivo?<\/strong>", "O caminho mais curto não é o conselho — são os comitês. “Comitê de pessoas, comitê de estratégia, comitê de inovação: é uma forma de ele conhecer você.” ONGs e hospitais também são porta de entrada."]]}], "notes": ["O que preciso estudar com urgência a partir desta aula", "Onde a minha experiência já me dá vantagem aqui"], "meta": "11h05  ·  100 minutos"}, {"num": "2.5", "head": "2.5  Carlos Sá — “Como funcionam os conselhos fiscais e comitês de auditoria”", "blocks": [{"t": "h3", "h": "Ficha do professor"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória<\/strong>"], "rows": [["Papéis", "Conselheiro de Administração, coordenador de Comitês de Auditoria, Conselheiro Fiscal e Conselheiro Consultivo."], ["Setor financeiro", "Itaú, Banco do Brasil e Caixa Econômica Federal. Na Caixa, foi conselheiro de administração, coordenador do comitê de auditoria e depois coordenador do comitê de investigação."], ["Varejo e indústria", "Coordenador do Comitê de Auditoria das Lojas Marisa por quase 10 anos e da M. Dias Branco (antes da pandemia). Setores industrial e de serviços."], ["Consultoria", "Sócio-diretor na KPMG; executivo em multinacionais como Diretor Financeiro e Diretor de Riscos Corporativos."], ["Hoje", "Conselheiro Fiscal na CEMIG; Conselheiro Consultivo na AuditSafe e na Polifrigor/Agrofood."], ["Docência", "Professor em cursos para conselheiros de administração; foi professor no MBA da FAAP."]]}, {"t": "h3", "h": "A tese"}, {"t": "p", "h": "Carlos Sá abriu com a provocação mais afiada do dia — e depois virou a própria mesa."}, {"t": "quote", "q": "Empresas que têm conselho de administração e não têm comitê de auditoria são grandes candidatas a fraudes contábeis. Quem disse isso não fui eu, foi o Congresso norte-americano em 2002, quando criou a Sarbanes-Oxley.", "by": "CARLOS SÁ, PRIMEIRO MINUTO"}, {"t": "quote", "q": "Empresas que têm conselho de administração e comitê de auditoria também estão fortemente fadadas a ter fraudes contábeis. Agora sou eu que estou dizendo. E por que eu estou dizendo isso? Porque o grande problema para o sucesso ou o insucesso está nas pessoas.", "by": "CARLOS SÁ, DOIS MINUTOS DEPOIS"}, {"t": "p", "h": "O argumento central da sessão é que estrutura sem caráter é decorativa. E daí decorre a tese que mais interessa ao seu terreno profissional."}, {"t": "box", "kind": "leitura", "title": "O RH NO NÍVEL ESTRATÉGICO — A DEFESA MAIS EXPLÍCITA DO DIA", "items": [{"h": "<em>“E o teu RH? Existe um diretor executivo? Na maioria das empresas, não. Que é um absurdo. O diretor de recursos humanos, a diretora de recursos humanos, teria que estar lá no nível estratégico — e raramente está. Quem tem no nível estratégico tem a melhor estrutura possível. Quem não tem fica o tempo todo trocando, contratando, gastando dinheiro no meio do caminho.”<\/em>"}, {"h": "<strong>Registre: isto foi dito por um ex-sócio da KPMG especializado em risco, não por um profissional de RH. <\/strong>É argumento de terceiro — o mais útil que existe numa sala de conselho."}]}, {"t": "h3", "h": "Frases que ficam"}, {"t": "table", "head": ["<strong>Tema<\/strong>", "<strong>Fala literal<\/strong>"], "rows": [["A tese em uma linha", "<strong><em>“Não basta ter a governança; tem que ter a governança com as pessoas certas e bem preparadas.”<\/em><\/strong>"], ["Competência sem ética", "<em>“A imprensa está rica em informações para mostrar que muita gente tecnicamente muito boa, mas eticamente irresponsável, criou problemas para grandes instituições.”<\/em>"], ["Definição de risco", "<em>“Risco é tudo aquilo que pode me impedir de atingir determinado objetivo.”<\/em>"], ["Gestão de risco em 20 palavras", "<em>“É olhar para frente, se perguntar o que pode dar errado, se preparar antes. E se der errado, você já está pronto. A tua concorrência não. Simples assim.”<\/em>"], ["Sobre preparação", "<em>“Não faz mais sentido um conselheiro de administração, um membro de comitê assessor, um membro de conselho fiscal, ir para uma reunião sem ter se preparado profundamente.”<\/em>"], ["Sobre caráter", "<em>“Ninguém muda o seu perfil ético aos 45, 50 anos de idade. Você sempre foi daquele jeito. Quem colocou o cara lá não se preocupou em saber, lá no passado, quantas vezes ele já tinha aprontado — porque apronta.”<\/em>"], ["Sobre contratação", "<em>“A parte mais difícil ele já contratou, que é a postura ética. Porque desenvolver qualquer pessoa em idiomas, em técnicas, é questão de treinamento.”<\/em>"], ["Sobre cultura", "<em>“Não existe nada mais relevante e importante numa empresa do que a sua cultura. E refazer isso leva anos.”<\/em>"], ["Sobre um mau líder", "<em>“Não adianta ter um cara muito bom, ou uma mulher muito boa, conduzindo o seu negócio, entregando tudo tecnicamente, se há um desvio de caráter — essa pessoa vai destruir o negócio.”<\/em>"], ["Dados e IA", "<em>“A IA precisa de um bom banco de dados. Senão é aquela história: se entrar porcaria, vai sair porcaria. Simples assim.”<\/em>"], ["A regra de sobrevivência", "<strong><em>“Não abram mão de jeito nenhum do CPF de vocês. Em nenhum momento. A sua lealdade é para com a instituição — você não tem que dar satisfação a quem te colocou lá, a quem te convocou, a quem te escolheu.”<\/em><\/strong>"], ["O ônus da prova", "<em>“A primeira coisa que qualquer juiz faz, quando há um problema sério dentro de uma empresa, é pegar todos os CPFs de todos que participam da governança e intimar todo mundo. É aquela história do ninguém tem que provar que você foi culpado: você tem que provar que você não foi.”<\/em>"], ["A dica que ele priorizou sobre a bibliografia", "<strong><em>“Se eu posso dar alguma dica para vocês, melhor do que livro é exatamente isso: não abram mão da independência de vocês.”<\/em><\/strong>"], ["O preço que pagou", "<em>“Mesmo que isso te custe trabalho. Eu posso dizer para vocês que eu já perdi três, e perderia novamente, porque outros vieram logo depois.”<\/em>"], ["Contra o comitê de gabinete", "<em>“Que trabalho está fazendo o comitê se ele está sentado numa sala tomando um café e se reunindo uma vez por mês sem receber essas pessoas? Não faz sentido.”<\/em>"], ["Contra a análise remota", "<em>“Como eu vou tomar decisões olhando a demonstração financeira se eu não conheço o produto, não conheço as máquinas, não conheço o gestor? Não faz sentido, gente.”<\/em>"], ["Ir a campo", "<em>“Se eu quero um ambiente de controle eficaz, eu tenho que olhar no olho o gestor do centro de distribuição e entender como é que ele tem controle na balança, na entrada, na saída.”<\/em>"], ["Empresa familiar", "<em>“A primeira coisa que eu faço quando me convidam para uma empresa familiar é dar um banho de governança corporativa nos donos.”<\/em>"], ["Sobre o custo do conselho fiscal", "<em>“E só é implementado quando o minoritário exige. O majoritário acha que é custo. Burrice!”<\/em>"], ["Sobre o minoritário", "<em>“E o minoritário é sempre o chato, desculpe o termo, que vai ali ficar perturbando todo mundo.”<\/em>"], ["Dinâmica de conselho", "<em>“Aquele conselho onde você tem uma pessoa dominante e oito pessoas acompanhando é um péssimo conselho de administração. Tem que ter o debate, tem que ter o desentendimento, tem que ter a discordância, para que haja luz.”<\/em>"], ["Sobre desvio", "<em>“Automaticamente o comitê todo pediu demissão. Você não quer se envolver com esse tipo de coisa. Desvios existem, mas você não pode compactuar.”<\/em>"], ["Empresa familiar, a distinção fina", "<em>“Não tem desonestidade quando todos estão de acordo. Agora, quando um faz escondido dos outros três, aí a casa cai.”<\/em>"], ["A síntese final", "<strong><em>“Olhar para o problema antes. Agir antes.”<\/em><\/strong>"]]}, {"t": "h3", "h": "Comitê de Auditoria × Conselho Fiscal"}, {"t": "cap", "h": "Comitê de Auditoria e Conselho Fiscal — o quadro comparativo"}, {"t": "table", "head": ["", "<strong>Comitê de Auditoria<\/strong>", "<strong>Conselho Fiscal<\/strong>"], "rows": [["<strong>Origem<\/strong>", "Sarbanes-Oxley (EUA, 2002), como resposta a fraudes contábeis", "Art. 161 da Lei 6.404/76 — elemento específico da governança brasileira"], ["<strong>Indicado por<\/strong>", "Conselheiros de Administração", "Acionistas"], ["<strong>Reporta a<\/strong>", "Conselho de Administração", "Assembleia de Acionistas — é independente do CA"], ["<strong>Composição<\/strong>", "3 membros independentes e multidisciplinares, ao menos 1 especialista com experiência profunda (contabilidade, direito, TI). Mandato 2+2", "3 membros: 2 indicados pelo majoritário, 1 pelo minoritário. A presidência é do majoritário"], ["<strong>Natureza<\/strong>", "Assessora e supervisiona; não delibera", "Fiscaliza os atos da administração — o que inclui o próprio Conselho de Administração"], ["<strong>Instalação<\/strong>", "Criado pelo CA, com regimento próprio", "Previsto em estatuto; instalado a pedido de acionistas. Obrigatório em sociedades de economia mista"], ["<strong>Recursos<\/strong>", "Tem verba para contratar especialistas externos", "Prestação de contas por pareceres à assembleia"], ["<strong>Contato<\/strong>", "Reuniões mensais com CEO e diretores-chave; visitas de campo", "Trabalha apartado, mais próximo da gestão do que do CA. Uma reunião conjunta por ano para o balanço"]]}, {"t": "src", "h": "Fonte: aula de Carlos Sá e deck do palestrante."}, {"t": "p", "h": "Ele recomenda algo além do previsto: reuniões conjuntas trimestrais entre conselho fiscal e comitê de auditoria — prática que aplica na CEMIG. E adverte contra o pior cenário político: “A pior coisa que existe dentro da governança corporativa é o presidente do conselho ficar com animosidade com o cara do conselho fiscal.”"}, {"t": "h3", "h": "Até onde vai o conselho fiscal na estratégia?"}, {"t": "quote", "q": "Quando você é nomeado conselheiro fiscal, você vai fiscalizar a administração. O que é a administração? É o conselho de administração mais a gestão. Portanto, é seu direito questionar a estratégia, sim.", "by": "CARLOS SÁ"}, {"t": "p", "h": "Mas com técnica — e aqui está a distinção que vale copiar para qualquer conversa difícil de conselho:"}, {"t": "quote", "q": "Você não diz, como conselheiro fiscal, “concordo ou discordo”. Você mostra. Se você identificar incoerências, problemas futuros, você deve mencioná-los — mas não pode afirmar que está falando do futuro.", "by": "CARLOS SÁ, SOBRE O CASO NATURA/AVON"}, {"t": "p", "h": "O exemplo dado foi concreto: se o plano prevê captar dinheiro caro para crescer num negócio com margem EBITDA inferior ao custo de juros, “é totalmente incoerente, e aí você tem a prerrogativa de dizer: ó, essa estratégia está furada”. E o diagnóstico do caso Natura/Avon: “foram duas culturas que não se fecharam”."}, {"t": "box", "kind": "leitura", "title": "A HUMILDADE QUE ELE ACOPLOU AO DIREITO DE QUESTIONAR", "items": [{"h": "<em>“Às vezes o cara está vendo uma coisa que você não enxergou. Tem coisas que muitas vezes a gente não alcança o pensamento estratégico daquela operação e enxerga só o óbvio.”<\/em>"}]}, {"t": "h3", "h": "COSO e ERM — a espinha dorsal técnica"}, {"t": "cap", "h": "COSO e ERM — o essencial para o conselheiro"}, {"t": "table", "head": ["<strong>Elemento<\/strong>", "<strong>Conteúdo<\/strong>"], "rows": [["<strong>O que é COSO<\/strong>", "Committee of Sponsoring Organizations of the Treadway Commission. O “cubo” original estabeleceu 5 componentes de controle interno: ambiente de controle, avaliação de riscos, atividades de controle, informação e comunicação, monitoramento."], ["<strong>A evolução para ERM<\/strong>", "O framework ganhou o objetivo estratégico — passando de 3 para 4 objetivos (estratégico, operacional, relatórios, conformidade) — e detalhou a avaliação de riscos. Isso permitiu a virada de postura: de reativo para proativo, com foco em cenários futuros. Hoje, 20 princípios."], ["<strong>Novidade de março de 2026<\/strong>", "12 princípios dirigidos a conselhos de administração, para que exijam e compreendam a aplicação do framework — promovendo o debate e a discordância construtiva."], ["<strong>A regra dos 10<\/strong>", "Entrevistando executivos você chega a mais de 100 riscos. O trabalho é reduzir a 40 ou 50, e depois aos 10 maiores riscos estratégicos. “Você vai entregar 90% do seu plano estratégico.”"], ["<strong>Cadência<\/strong>", "O mapa de risco estratégico é objeto de revisão mensal do comitê de auditoria, com escalonamento dos pontos críticos ao conselho — não peça anual."], ["<strong>Controles<\/strong>", "Controles preventivos e sistêmicos jamais engessam. Controles detectivos — auditoria checando depois — é que ficam caros. O objetivo do ERM é tirar burocracia, não adicioná-la."], ["<strong>Risco como oportunidade<\/strong>", "O exercício de análise de risco frequentemente revela oportunidades de negócio que ninguém tinha percebido."], ["", "<strong>VERIFICAÇÃO — DATAS DO COSO<\/strong><br>Ele situou a criação do COSO no “final dos anos 90”. O COSO foi fundado em 1985 e publicou o Internal Control — Integrated Framework em 1992. A transcrição também registra “março de 1926” para os novos princípios; ele mesmo corrige adiante para “março desse ano” — leia-se março de 2026."]]}, {"t": "h3", "h": "Pontos de atenção"}, {"t": "box", "kind": "atencao", "title": "O MAPA DE RISCO NÃO É PEÇA ANUAL", "items": [{"h": "<em>“É comum um conselheiro dizer que olha o mapa de risco estratégico uma vez por ano. Totalmente absurdo. O comitê de auditoria tem que olhar para o mapa de risco estratégico todos os meses.”<\/em>"}]}, {"t": "box", "kind": "atencao", "title": "LONGEVIDADE NO CARGO DESTRÓI CONTRIBUIÇÃO", "items": [{"h": "<em>“Qualquer profissional, seja ele executivo, seja ele em conselho, se ficar muito tempo, perde a capacidade de contribuir com inovações para o negócio.”<\/em>"}, {"h": "Ele olha com desconfiança para conselheiros com mais de 10 anos e presidentes com 8 ou 9: “Se o vento está a favor, ele foi bom. Se o vento está ruim, ele é… E a empresa não é a mesma hoje de oito anos atrás.”"}]}, {"t": "box", "kind": "atencao", "title": "EMPRESA FAMILIAR: CONFIANÇA SUBSTITUINDO PROCESSO", "items": [{"h": "<em>“É comum você ver: ‘mas esse cara estava comigo há 30 anos, está me roubando!’ E estava roubando há muito tempo.”<\/em>"}, {"h": "A raiz do problema: “nessas empresas as características são o fundador, a família, confiar em pessoas. Confiar em pessoas é importante — mas mais importante são processos bem escritos com controles bem identificados.”"}, {"h": "E o desfecho pessoal: ele apontou que o irmão-CEO se aproveitava do cargo e tirava dinheiro indevidamente. “E eu fui convidado a me retirar. Tudo bem. Mas eu fiz o meu trabalho e mostrei que estava errado.”"}]}, {"t": "h4", "h": "Demais alertas da sessão"}, {"t": "ul", "items": ["<strong>Estratégia obsoleta é risco material. <\/strong>Plano de crescimento via alavancagem desenhado há oito anos, mantido sob Selic no topo. “Fico espantado quando vejo que tem mais de 300 empresas em recuperação judicial. Essas já chegaram no topo. As outras ainda não pediram, mas daqui a pouco vão pedir. Não mudaram a estratégia.”", "<strong>Reforma tributária: janeiro de 2027 é a linha de chegada, não a de largada. <\/strong>Com split payment, “o teu cliente paga a sua nota fiscal e você só recebe 70% dela, porque 30% já foi para o outro lado — aí o teu fluxo de caixa vai enxugar”. E o veredito: “Quem chegar em janeiro despreparado vai perder muito dinheiro, se não perder stakeholders.”", "<strong>Risco macro. <\/strong>Dívida em 81% do PIB, 10 pontos percentuais acima do ano anterior. “Se continuar nesse patamar, daqui a pouco o nosso PIB não cobre mais a dívida e o calote é possível — passa a ser possível.” Sua régua de investimento: margem acima de 10%, sempre.", "<strong>Auditoria externa atrasada. <\/strong>Distinga se a falha é da contabilidade do cliente ou do auditor. “Cabe ao presidente do conselho fiscal chamar o sócio da auditoria e dizer: eu não aceito. É seu direito — ele está sendo pago, e muito bem pago, para isso.” E o contraexemplo: “eu já vi o conselho de administração sentar o malho no auditor e o problema era na contabilidade.”", "<strong>Denúncia à CVM é dever, não opção. <\/strong>Quando o conselho fiscal aponta algo incoerente, cutuca a administração e nada é feito, sendo relevante: “ele pode fazer uma denúncia à CVM. E deve.”", "<strong>Vazamento de dados via IA. <\/strong>“Se você tiver a sensibilidade e o controle para não deixar os dados da empresa fluírem por dentro da inteligência artificial.”", "<strong>Pente-fino em conselheiros. <\/strong>Obrigatório nas estatais por força da Lei 13.303; nas privadas de capital aberto “deveria ser feito como boa prática de governança. Nem sempre é feito.”", "<strong>Negligência com regras incentiva fraude. <\/strong>“Se as organizações são negligentes em garantir que as pessoas respeitem a regra do jogo, eu estou incentivando que determinados grupos acabem fraudando a organização.” E onde elas acontecem: “normalmente as fraudes, as perdas, acontecem lá nas operações”."]}, {"t": "h3", "h": "Os casos que ele viveu"}, {"t": "table", "head": ["<strong>Caso<\/strong>", "<strong>O que ensina<\/strong>"], "rows": [["<strong>Caixa Econômica Federal<\/strong>", "Um CEO com preparo técnico excepcional destruiu uma cultura de respeito. “Imagina você atuando com um CEO que se diz o tempo todo irmão do presidente da República.” Meses depois, o mesmo executivo ligou para a casa dele chorando: um funcionário com mais de 30 anos de casa desviava informações. “Na prática, você tem que ter estômago para trabalhar tudo isso.”"], ["<strong>Banco do Brasil<\/strong>", "Como conselheiro fiscal, teve de provar que uma operação problemática não passava pela alçada do órgão. O aprendizado: a documentação de alçadas é o que separa você do processo."], ["<strong>Embraer<\/strong>", "A dificuldade de implantar gestão de risco quando a empresa está atolada em problemas urgentes — a agenda do curto prazo expulsa a do médio."], ["<strong>Comitê × lobista<\/strong>", "Identificado um desembolso para lobista, o comitê inteiro pediu demissão em bloco."], ["<strong>Lojas Marisa<\/strong>", "Quase 10 anos coordenando o comitê de auditoria; levou o CEO da família ao Cubo (hub de inovação do Itaú) — exemplo de comitê que empurra agenda, não só fiscaliza."]]}, {"t": "h3", "h": "Referências da sessão"}, {"t": "table", "head": ["<strong>Obra / fonte<\/strong>", "<strong>Referência completa<\/strong>", "<strong>Como ele usou<\/strong>"], "rows": [["<strong><em>A Lógica do Cisne Negro<\/em><\/strong>", "TALEB, Nassim Nicholas. O impacto do altamente improvável. Trad. Marcelo Schild. Rio de Janeiro: Best Business, 2015.", "“Nassim Taleb é considerado talvez o papa do gerenciamento de risco corporativo.” Ensina a olhar para frente e se preparar para o inesperado."], ["<strong><em>O Andar do Bêbado<\/em><\/strong>", "MLODINOW, Leonard. Como o acaso determina nossas vidas. Trad. Diego Alfaro. Rio de Janeiro: Jorge Zahar.", "A importância de estatísticos nas grandes empresas para entender cenários e probabilidades."], ["<strong><em>Rápido e Devagar<\/em><\/strong>", "KAHNEMAN, Daniel. Duas formas de pensar. Trad. Cássio de Arantes Leite. Rio de Janeiro: Objetiva, 2012.", "Equilibrar decisão intuitiva e reflexiva — essencial para conselheiros em decisões de alto impacto."], ["<strong>Alexander Wagner<\/strong>", "Economista, Universidade de Zurique. Vídeo/TED sobre honestidade nos negócios.", "“Ele mostra que as empresas que se preocupam em contratar a pessoa certa economizam uma fortuna.”"], ["<strong>COSO / COSO ERM<\/strong>", "Committee of Sponsoring Organizations of the Treadway Commission.", "Framework central da aula; os 12 princípios de março/2026 para conselhos."], ["<strong>Global Risks Report<\/strong>", "Fórum Econômico Mundial — publicado em janeiro, gratuito.", "“Se você pegar esse material agora, no início de agosto, vai ver que 90% do que está dito ali aconteceu e está acontecendo.”"], ["<strong>Top Risks<\/strong>", "Eurasia Group / Ian Bremmer — publicado em janeiro, gratuito.", "Mesma função: plotar riscos globais no mapa corporativo."], ["<strong>Pesquisa KPMG 2026<\/strong>", "Agenda dos Conselhos de Administração para 2026.", "Oito pontos: gestão de riscos, IA, governança de dados, segurança cibernética, sustentabilidade e a relação conselho–alta liderança."], ["<strong>Lei 13.303/2016<\/strong>", "Lei das Estatais.", "Base do pente-fino obrigatório em conselheiros de empresas de governo."], ["<strong>Art. 161, Lei 6.404/76<\/strong>", "Base legal do conselho fiscal.", "Citado no deck como fundamento do órgão."], ["", "<strong>VERIFICAÇÃO — DANIEL KAHNEMAN<\/strong><br>Ele afirmou que Kahneman “morreu ano passado”. O falecimento foi em 27 de março de 2024, não em 2025. Detalhe pequeno, mas do tipo que um conselheiro atento nota."]]}, {"t": "box", "kind": "leitura", "title": "UM ESCLARECIMENTO ÚTIL QUE VEIO DA SALA", "items": [{"h": "Um colega professor, presente na sessão, acrescentou a definição mais limpa da hierarquia: “O Conselho Fiscal não é ligado ao Conselho de Administração, ele é ligado à Assembleia dos Acionistas. Ele é independente.” E descreveu a rotina que vale copiar: o conselho fiscal se reúne com a auditoria externa antes da reunião que aprova as contas do trimestre, e a pergunta padrão é “alguma coisa que eu tenho que me preocupar?”. Quando vem o alerta, ele passa a ser alerta do conselheiro de administração."}]}, {"t": "h3", "h": "Benefícios de instalar comitê de auditoria e conselho fiscal"}, {"t": "ul", "items": ["Dar maior confiabilidade às demonstrações financeiras e segurança de que elas espelham a realidade.", "Aprimorar os controles internos e a gestão de riscos.", "Fortalecer uma postura preventiva e ativa do Conselho de Administração, fornecendo informações que levem à correção de rumos ou à manutenção da disciplina estratégica.", "Maior comprometimento da alta administração com uma cultura ética e transparente."]}], "notes": ["O que quero levar para a minha prática de conselho", "Onde discordo ou tenho leitura diferente"], "meta": "14h12  ·  102 minutos"}, {"num": "2.6", "head": "2.6  Carlos Júlio — Repertório filosófico e comportamental do conselheiro", "blocks": [{"t": "box", "kind": "leitura", "title": "NOTA DE FIDELIDADE", "items": [{"h": "O nome do falante não é pronunciado em nenhum momento da gravação. A identificação como Carlos Júlio é inferencial e sólida: ele diz “eu tenho 68 anos”, refere-se à autoria do material do programa (“nós escrevemos três simulações”), anuncia aulas futuras próprias, e a turma o chama de “professor”. A gravação começa e termina no meio — o início pega o fim de um sorteio de livros e o corte final vem logo após o briefing do exercício, sem a discussão dos grupos."}]}, {"t": "h3", "h": "A tese"}, {"t": "p", "h": "É um fechamento improvisado, não uma aula estruturada — e vale exatamente por isso: ele explica por que colocou filosofia, psicologia e comportamento humano num programa de conselheiros. O argumento não é de erudição, é de utilidade."}, {"t": "quote", "q": "Nós como conselheiros, esse tipo de repertório — filosofia, a coisa de comportamento humano, psicologia, esse tipo de olhares, a tecnologia obviamente também — tudo isso aí faz com que a gente enriqueça.", "by": "O CURADOR, FECHANDO O DIA 2"}, {"t": "p", "h": "E o adversário é nomeado com precisão: o conselho que escorrega para o operacional."}, {"t": "quote", "q": "Você vai perceber que a maioria das reuniões de conselhos novos — é duro sair do operacional para o estratégico. Porque as pessoas vêm do operacional, elas dominam o operacional. O que elas querem fazer? Reuniões operacionais. Mas você não está lá fazendo reunião operacional.", "by": "O CURADOR"}, {"t": "box", "kind": "leitura", "title": "O COROLÁRIO PRÁTICO — E É O QUE TORNA A TESE ACIONÁVEL", "items": [{"h": "<em>“Então quando você tem repertório, você fala: pessoal, isso é importante, mas vamos deixar o diretor operacional, o industrial, ir atrás dessa história — e ele traz a solução para a gente. Vamos falar agora dos novos produtos, vamos falar agora dos novos mercados. Percebe? É isso.”<\/em>"}, {"h": "<strong>Repertório, nesta leitura, não é cultura geral: <\/strong>é a autoridade que permite a você cortar a pauta operacional sem parecer arrogante. Quem não tem outro assunto para propor não consegue tirar a mesa do assunto errado."}]}, {"t": "h3", "h": "O filtro de decisão: posso, devo, quero"}, {"t": "p", "h": "O framework mais simples e mais reaproveitável da sessão."}, {"t": "quote", "q": "Filosoficamente, quando você vai tomar uma decisão, talvez você deveria fazer uma análise: posso, devo, quero.", "by": "O CURADOR"}, {"t": "ul", "items": ["<strong>A ordem não é fixa. <\/strong>“Tem muito a ver também com o teu momento de vida.” Ele diz que hoje começa pelo quero — e menciona também a combinação perversa “quer, pode e não deve”.", "<strong>O “quero” tem função de triagem: <\/strong>“Se eu não quero, eu não vou gastar mais o meu tempo com experiências.”", "<strong>A janela do “posso” fecha. <\/strong>“Agora eu posso fazer isso… só não posso. E depois é que ele viu que nunca conseguiu fazer, por quê? Porque agora não dá mais.”"]}, {"t": "p", "h": "Ele contrapõe esse filtro ao instrumental técnico de decisão que havia sido tratado mais cedo — “binômio informação e capacidade de decisão, depois ter o tempo como aliado da boa decisão; essas coisas são parâmetros mais técnicos”. Os dois convivem: o técnico dimensiona, o filosófico escolhe."}, {"t": "h3", "h": "Os setênios e a curva da vida"}, {"t": "p", "h": "Ele parte do livro que Rosenthal havia citado pela manhã — a estatística do pico de desempenho e da queda — e o amplia para a antroposofia, que declara como sua própria formação: “eu fiz escola Waldorf, escola antroposófica”."}, {"t": "cap", "h": "A curva da vida em setênios, segundo a leitura do curador"}, {"t": "table", "head": ["<strong>Elemento<\/strong>", "<strong>O que ele disse<\/strong>"], "rows": [["<strong>A curva original<\/strong>", "Atribuída a Rudolf Steiner: a vida como uma parábola de boca para baixo. No tempo dele, “você morria com 56 anos”, portanto o topo da parábola ficava em 28. “Lá no final você vira criança.”"], ["<strong>A revisão contemporânea<\/strong>", "Feita por uma médica antroposófica de 90 anos radicada no Brasil — provavelmente Gudrun Burkhard: “o que era 28, ela passou para 40. Agora é 40, 80.”"], ["<strong>A divisão em setênios<\/strong>", "Ciclos de sete anos — 12 setênios. A transcrição registra “setembro” de forma sistemática, mas ele mesmo confirma a leitura ao dizer “eu quando estava no meu sétimo setênio, que seriam 49 anos”."], ["<strong>A recomendação<\/strong>", "“Quando você lê o teu setênio, você fala: nossa, sou eu.”"]]}, {"t": "src", "h": "Fonte: fala do curador; a atribuição a Gudrun Burkhard é leitura provável — o nome não é pronunciado com clareza na gravação."}, {"t": "h3", "h": "Die with Zero — e a antecipação de herança"}, {"t": "p", "h": "A recomendação de leitura mais enfática da sessão. O autor não é nomeado — é Bill Perkins —, mas a tese é reproduzida com precisão."}, {"t": "quote", "q": "A tese dele é o seguinte: todo o dinheiro que você morrer com ele são experiências que você deixou de ter, ou deixou de viver.", "by": "O CURADOR, SOBRE DIE WITH ZERO"}, {"t": "p", "h": "E o capítulo que ele destaca é o de dinheiro e filhos, com a conclusão que já virou prática pessoal:"}, {"t": "quote", "q": "O que você vai deixar para os seus filhos é porque não é teu, é deles. Se é deles, dá agora. Você não quer dar agora porque está com medo de ficar sem? Então é teu, não é deles. Ou seja: comecei a dar em vivo.", "by": "O CURADOR"}, {"t": "ul", "items": ["<strong>A advertência de leitura: <\/strong>“Você começa a ler o livro, você fala: que besteira… E aí você vai lendo.”", "<strong>O contraexemplo histórico: <\/strong>Jorge Guinle Filho, que “errou só em 20 anos… mas mesmo assim ele morreu almoçando todos os dias no Copacabana Palace”.", "<strong>A conexão com sucessão: <\/strong>“Quando eu morrer, ele vai estar com 65. Aí eu vou dar meu patrimônio para ele — e ele vai dizer que não precisa.” É exatamente o problema que César Souza dissecaria no dia seguinte."]}, {"t": "h3", "h": "Brené Brown, vergonha e vulnerabilidade"}, {"t": "p", "h": "O bloco comportamental da sessão, e o mais denso para quem trabalha com pessoas."}, {"t": "cap", "h": "Vergonha e vulnerabilidade aplicadas ao conselho"}, {"t": "table", "head": ["<strong>Conceito<\/strong>", "<strong>Como ele apresentou<\/strong>"], "rows": [["<strong>Vulnerabilidade<\/strong>", "“O que é a vulnerabilidade, abro aspas? É o risco emocional que você assume.” Porque “nós não nos apresentamos como somos”."], ["<strong>A insuficiência<\/strong>", "“Eu não sou magro o suficiente, eu não sou rico o suficiente, eu não sou inteligente o suficiente.”"], ["<strong>Culpa tem gênero<\/strong>", "“A culpa para o homem e para a mulher são duas coisas diferentes.” Homens: “geralmente a culpa e a vergonha é a gente decepcionar as nossas mulheres.” Mulheres: “a vergonha, para mim, é não dar conta.”"], ["<strong>A dupla jornada, descrita item por item<\/strong>", "“Acorda cedo, acorda as crianças, lanchinho, troca, manda escovar o dente, manda para a escola. Trabalha oito, dez horas, volta, ainda passa no mercado. Chega em casa, ajuda a fazer tarefa, dá banho, manda escovar dente, põe pra dormir.” E o veredito dele: “que é cruel, meu amigo”."], ["<strong>Consumo como camuflagem<\/strong>", "“Eu compro um carro que eu não posso manter, mas eu vou aparecer lá na tua frente — que no primeiro IPVA e renovação de seguro já não sei o que eu faço.”"], ["<strong>Autovigilância de linguagem<\/strong>", "“Eu falo agregado porque existe uma fala que pode dar uma conotação machista… é machista falar que é só mulher.”"]]}, {"t": "p", "h": "E o encadeamento que justifica o desvio pela psicologia: “por que eu vou contando tudo isso? Quando você começa a entender esses movimentos todos, você entende consumo, você entende consumidor.” Daí ele salta para disrupção — o caso da semaglutida atravessando alimentos, cerveja, aviação e cirurgia bariátrica."}, {"t": "h3", "h": "O teste do “nosso maior patrimônio são as pessoas”"}, {"t": "p", "h": "Este é o trecho mais diretamente aproveitável do encontro inteiro para a sua prática. Ele descreve o que faz quando um presidente diz a frase de sempre."}, {"t": "box", "kind": "leitura", "title": "AS QUATRO PERGUNTAS QUE ELE DEVOLVE", "items": [{"n": "01", "h": "Você faz reunião de diretoria uma vez por semana? Quem é que participa?"}, {"n": "02", "h": "O diretor ou a diretora de RH está nessa reunião?"}, {"n": "03", "h": "Ele ou ela tem direito de fala? Tem lugar de fala? É ouvido, é ouvida? Traz propostas, é estimulada?"}, {"n": "04", "h": "Qual é a escala de bônus por função? “O RH tem um target de seis bônus por ano e o cara do marketing tem doze.”"}]}, {"t": "quote", "q": "Será que realmente isso é um credo ou isso é uma teoria? Porque é bacana, porque é politicamente correto você falar desse jeito.", "by": "O CURADOR"}, {"t": "quote", "q": "As pessoas fazem o que a gente faz, elas não fazem o que a gente diz. E o conselho tem que ser dirigente nesse olhar.", "by": "O CURADOR"}, {"t": "box", "kind": "atencao", "title": "O PRINCÍPIO DE REMUNERAÇÃO — VALE COPIAR", "items": [{"h": "Um aluno questionou: a diferença de bônus entre funções não poderia refletir escassez da vaga na região ou preparo da pessoa? A resposta é uma regra de desenho de pacote:"}, {"h": "<em>“Isso é conceitual. Para mim, o que diferencia a escassez, o histórico de desempenho, o tempo de casa e tudo mais é o salário. O bônus é tantos salários. Então se um ganha 50 e outro ganha 75, ali já está. Se você comprar a Towers Watson, a Mercer, o Hay Group, eles vão te dar os mesmos princípios também.”<\/em>"}, {"h": "<strong>Ou seja: <\/strong>escassez e preparo se pagam no salário-base; o múltiplo de bônus deve ser igual entre funções, porque o múltiplo é que sinaliza a importância relativa da função. Um RH com múltiplo menor que o marketing é uma declaração pública de prioridade — e ele extrai a consequência: “ele pode ter metade do desempenho dela e vai ganhar igual a ela. Está certo isso? Gente, não tem jeito.”"}]}, {"t": "h3", "h": "Demais pontos de atenção"}, {"t": "ul", "items": ["<strong>Disrupção nunca nasce de dentro. <\/strong>“As grandes opções não nascem no teu negócio… ela vem de fora. Por quê? Porque pensa fora da caixinha.” E: “Você não consegue fazer a disrupção da Nestlé.” O Uber “não é o dono de um ponto de táxi”.", "<strong>Uma canetinha zera uma profissão. <\/strong>“Uma canetinha disrupta uma profissão. Acaba, zera uma profissão.” O exemplo: cirurgia bariátrica diante dos agonistas de GLP-1.", "<strong>O risco que não está no mapa. <\/strong>Como conselheiro de uma empresa de “arroz, feijão, biscoito, massas”, ele pergunta: “Está lá no mapa de risco?” Queda de 3% em volume de carboidratos no supermercado, economia de combustível em companhia aérea por passageiros mais leves, consumo de cerveja em queda — nenhum desses aparece num mapa de risco convencional.", "<strong>Relação social como método. <\/strong>“Eu faço pelo menos uma vez ao ano: convido meus colegas de conselho para um jantar na minha casa. Porque eu acredito demais na relação social.” Um dia e meio por reunião não constrói confiança suficiente para o dissenso.", "<strong>Apoie-se no conselho fiscal em vez de descer ao razão. <\/strong>“Eu não vou no razão, eu não vou descer na conta. Mas o conselho fiscal vai querer olhar a conta. Por que eu não vou perguntar para ele?” E a correção doutrinária: “o conselho fiscal não trabalha para o conselho de administração — mas eu disse isso a vocês ontem. Eu me apoio nos caras.”"]}, {"t": "h3", "h": "Referências da sessão"}, {"t": "table", "head": ["<strong>Referência<\/strong>", "<strong>Nota<\/strong>"], "rows": [["<strong><em>Die with Zero / Morrer Sem Nada<\/em><\/strong>", "Bill Perkins. O autor não é nomeado em aula; descrito como “um financeiro, jovem ainda, uns 40 e poucos anos”. Recomendação explícita de leitura."], ["<strong>Rudolf Steiner / antroposofia<\/strong>", "Nomeado corretamente. Base da curva da vida e dos setênios. Formação declarada do falante."], ["<strong>Gudrun Burkhard<\/strong>", "Leitura provável — a transcrição registra “a Gudrat”. Médica antroposófica, 90 anos, radicada no Brasil; autora da revisão da curva."], ["<strong>Brené Brown<\/strong>", "Nomeada corretamente. “Pós-doc da University of Houston”, “a doutora vulnerabilidade”. Pesquisa sobre vergonha."], ["<strong>Paul Schoemaker (Wharton)<\/strong>", "Leitura provável — “o post-maker da Wharton”. Citado como o melhor autor de decision making process."], ["<strong>Towers Watson, Mercer, Hay Group<\/strong>", "Autoridade externa invocada para o princípio salário-versus-múltiplo-de-bônus."], ["<strong>Jorge Guinle Filho<\/strong>", "Exemplo histórico de “morrer sem nada” — com erro de cálculo de vinte anos."], ["<strong>Semaglutida, Mounjaro, Zepbound<\/strong>", "Usados como caso-mestre de disrupção transetorial. ⚠ Ele conflaciona os princípios ativos: semaglutida é de Ozempic/Wegovy; Mounjaro e Zepbound são tirzepatida."], ["", "<strong>O QUE ESTA SESSÃO NÃO TEM, APESAR DO TÍTULO<\/strong><br>Não há estoicismo, ética aristotélica, nem qualquer filósofo clássico. “Filosofia” aqui é usada em sentido prático — filosofia de vida, filosofia financeira —, não como história da filosofia. A única escola nomeada é a antroposofia. Vale saber antes de citar a sessão como referência filosófica."]]}], "notes": ["Meu “posso, devo, quero” hoje — e em que ordem", "As quatro perguntas do teste de RH aplicadas à organização que eu conheço melhor", "DIA 3  ·  5 DE AGOSTO  ·  “O DIA DO CONSELHEIRO”", "A abertura foi feita por Natália, do time de produtos da StartSe, enquadrando o dia: “ontem vocês viram o conselho; hoje a gente vê o conselheiro.” O curador chegaria à tarde."], "meta": "16h18  ·  27 minutos  ·  fechamento do Dia 2, conduzido pelo curador"}, {"num": "2.7", "head": "2.7  César Souza — “Quais os riscos de um membro de Conselho? Como mitigá-los?”", "blocks": [{"t": "stats", "items": [{"n": "17", "l": "conselhos montados desde 2015"}, {"n": "34", "l": "processos sucessórios"}, {"n": "47", "l": "mentorias C-level"}, {"n": "1988", "l": "primeiro conselho"}]}, {"t": "h3", "h": "Ficha do professor"}, {"t": "table", "head": ["<strong>Dimensão<\/strong>", "<strong>Trajetória, conforme dita em aula<\/strong>"], "rows": [["Origem", "Baiano; em São Paulo desde 2000 — “25 anos”. Sua empresa é a Empreenda."], ["Estados Unidos", "Onze anos morando lá. Em 1996 deu aula em Wharton, no Advanced Management Program. Conduzia um seminário mensal para executivos americanos: Doing Business in Latin America."], ["Conselhos", "Primeiro conselho em 1988, em Portugal (Bento Pedroso). Hoje: EcoRodovias, Solví Ambiental, CESBE, BENNER Tech Solutions, GJP Agro, BooN Health Systems, Smartie Environmental, ShareCare."], ["Solví", "Vinte anos de casa. Entrou em 2006 com R$ 600 milhões de receita; fechou 2025 com R$ 5,2 bilhões, meta de R$ 10 bilhões em 2030. Hoje está no comitê de pessoas — “já ajudei a formar duas gerações de líderes”."], ["Números de prática", "17 conselhos montados desde 2015 · 34 processos sucessórios (o caso da aula é o 35º) · 47 mentorias de C-level."], ["Chão de fábrica", "“Trabalhei na indústria de construção, sempre vivi em canteiro de obra. Trabalhei com concessionárias de saneamento, com empresa de resíduos sólidos. No Magazine Luiza eu ia para dentro das lojas.”"], ["Agenda", "“No ano passado eu fiz 49 viagens. 98 voos, sem contar conexão. Normalmente de terça a quinta eu estou em um avião.”"], ["Livro", "Seja o líder que o momento exige — distribuído por QR Code em sala."]]}, {"t": "h3", "h": "O formato: dois terços da aula são um caso vivo"}, {"t": "p", "h": "Vale registrar o método, porque é incomum. Cerca de 65% da sessão é um caso real em andamento — narrado em quatro partes, interrompido por um debate aberto de mais de trinta minutos em que ele pergunta à turma o que faria no lugar dele. O bloco de riscos, que dá título ao deck, ocupa cinco minutos, sob pressão de tempo declarada: “só tenho quatro minutos a mais, prestem bem atenção nisso aqui”."}, {"t": "quote", "q": "Eu não vim aqui ensinar nada, eu quero aprender também. O que é que vocês fariam no meu lugar? O que é que vocês acham que eu devo fazer nesse almoço?", "by": "CÉSAR SOUZA, INVERTENDO O FORMATO"}, {"t": "h3", "h": "O caso: o fundador de 82 anos e o filho de 51"}, {"t": "cap", "h": "O caso vivo apresentado em aula"}, {"t": "table", "head": ["<strong>Elemento<\/strong>", "<strong>Fato<\/strong>"], "rows": [["A empresa", "Grupo no Espírito Santo, cerca de R$ 2 bilhões de faturamento, quatro fábricas, fundada há ~60 anos. O fundador tem 82 anos; a esposa é cofundadora."], ["O convite", "Indicação de outro fundador. Ele condicionou o aceite a conhecer a empresa: um dia inteiro na sede e, depois, visita às unidades."], ["O sucessor", "Filho de 51 anos, já na presidência."], ["O sinal", "Alm
